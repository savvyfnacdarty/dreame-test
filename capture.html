<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Photos du dossier</title>
<style>
:root{--red:#d6231a;--orange:#f08a00;--ink:#222;--grey:#777;--line:#ddd}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#f3f3f3;color:var(--ink);-webkit-text-size-adjust:100%}
header{background:var(--red);color:#fff;padding:14px 16px}
header h1{margin:0;font-size:18px}
header div{font-size:14px;opacity:.9;margin-top:2px;word-break:break-word}
main{padding:14px 14px 90px;max-width:560px;margin:0 auto}
.card{background:#fff;border-radius:10px;padding:14px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
h2{font-size:15px;margin:0 0 8px}
#chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--orange);background:#fff;color:var(--ink);border-radius:20px;padding:9px 14px;font-size:15px;font-family:inherit}
.chip.on{background:var(--orange);color:#fff;font-weight:bold}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--orange);color:#fff;border:0;border-radius:12px;padding:20px 12px;font-size:20px;font-weight:bold;font-family:inherit;margin-top:6px}
.big.sec{background:#666;font-size:16px;padding:14px 12px}
.sel{font-size:14px;color:var(--grey);margin:4px 0 8px}
.sel b{color:var(--ink)}
#list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.th{position:relative;border-radius:8px;overflow:hidden;background:#000;aspect-ratio:1}
.th img{width:100%;height:100%;object-fit:cover;display:block;opacity:.55}
.th.ok img{opacity:1}
.th .b{position:absolute;left:0;right:0;bottom:0;font-size:11px;padding:3px 4px;background:rgba(0,0,0,.65);color:#fff;text-align:center}
.th.ok .b{background:rgba(26,127,55,.9)}
.th.er .b{background:rgba(214,35,26,.95)}
.msg{padding:14px;border-radius:8px;font-size:15px;line-height:1.4}
.msg.err{background:#fdecea;color:#8a1a12;border:1px solid #f5c2bd}
.lock{font-size:12px;color:var(--grey);text-align:center;margin-top:10px}
#fin{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:none}
#fin button{width:100%;background:#1a7f37;color:#fff;border:0;border-radius:10px;padding:14px;font-size:17px;font-weight:bold;font-family:inherit}
</style>
</head>
<body>
<header><h1>&#128247; Photos du dossier</h1><div id="sub">Connexion sécurisée…</div></header>
<main>
  <div id="err" class="msg err" style="display:none"></div>
  <div id="app" style="display:none">
    <div class="card">
      <h2>1. Que photographiez-vous ?</h2>
      <div id="chips"></div>
    </div>
    <div class="card">
      <h2>2. Prenez la photo</h2>
      <div class="sel">Rubrique : <b id="selName"></b></div>
      <label class="big">&#128247; Prendre une photo<input id="cam" type="file" accept="image/*" capture="environment" hidden></label>
      <label class="big sec">&#128444; Choisir dans la galerie<input id="gal" type="file" accept="image/*" multiple hidden></label>
    </div>
    <div class="card" id="sent" style="display:none">
      <h2>Photos envoyées au PC <span id="cnt"></span></h2>
      <div id="list"></div>
    </div>
    <div class="lock">&#128274; Photos chiffrées de bout en bout : seul le PC de la fiche peut les lire.</div>
  </div>
</main>
<div id="fin"><button type="button" id="finBtn">Terminé</button></div>

<script src="auth-config.js"></script>
<script src="lib/relay-crypto.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function fail(t) { $("err").textContent = t; $("err").style.display = "block"; $("app").style.display = "none"; $("fin").style.display = "none"; $("sub").textContent = ""; }

  /* clé et identifiant de session : dans la partie # du QR (jamais envoyée au serveur) ; mémorisés pour un rechargement */
  var h = new URLSearchParams(location.hash.replace(/^#/, "")), sid = h.get("s"), key = h.get("k");
  try {
    if (sid && key) { sessionStorage.setItem("rlCap", JSON.stringify({ s: sid, k: key })); }
    else { var o = JSON.parse(sessionStorage.getItem("rlCap") || "null"); if (o) { sid = o.s; key = o.k; } }
  } catch (e) {}
  if (sid && key && location.hash) { try { history.replaceState(null, "", location.pathname); } catch (e) {} }
  if (!sid || !key) return fail("QR code incomplet. Rescannez le QR code affiché sur la fiche du PC.");
  if (!window.RelayCrypto || !RelayCrypto.ok()) return fail("Ce navigateur ne permet pas le chiffrement. Ouvrez le lien dans Safari ou Chrome.");
  if (!window.firebase || !firebase.firestore) return fail("Connexion impossible (réseau). Vérifiez Internet puis rechargez la page.");

  firebase.initializeApp(window.FIREBASE_CONFIG);   /* Firestore seul : aucune authentification du hub n'est chargée ici */
  var db = firebase.firestore();
  try { db.settings({ experimentalAutoDetectLongPolling: true, merge: true }); } catch (e) {}
  var ref = db.collection("relay").doc(sid), expTs = null, expMs = 0, sec = "", sent = 0;

  ref.get().then(function (snap) {
    if (!snap.exists) throw { app: "Session introuvable ou terminée. Rescannez le QR code affiché sur le PC." };
    var x = snap.data(); expTs = x.exp; expMs = expTs.toMillis();
    if (expMs < Date.now()) throw { app: "Cette session a expiré. Générez un nouveau QR code sur le PC." };
    return RelayCrypto.dec(key, sid + ":m", x.iv, x.m).catch(function () { throw { app: "QR code invalide (clé incorrecte). Rescannez-le." }; });
  }).then(function (man) {
    $("sub").textContent = man.dossier ? "Dossier : " + man.dossier : (man.titre || "");
    var list = man.sections || [];
    if (!list.length) list = ["Photo"];
    var box = $("chips");
    list.forEach(function (s, i) {
      var b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = s;
      b.onclick = function () { pick(s, b); };
      box.appendChild(b); if (i === 0) pick(s, b);
    });
    $("app").style.display = "block"; $("fin").style.display = "block";
  }).catch(function (e) {
    if (e && e.app) return fail(e.app);
    fail(e && e.code === "permission-denied" ? "Accès refusé par le serveur (règles Firebase non publiées)." : "Connexion impossible. Vérifiez Internet puis rechargez la page.");
  });

  function pick(s, b) {
    sec = s; $("selName").textContent = s;
    document.querySelectorAll(".chip").forEach(function (c) { c.classList.toggle("on", c === b); });
  }

  /* ---- image : redimensionnée (1280 px ; 2200 px pour l'étiquette) puis envoyée chiffrée ---- */
  function readImg(file) {
    return new Promise(function (res, rej) {
      var u = URL.createObjectURL(file), im = new Image();
      im.onload = function () { res({ im: im, url: u }); };
      im.onerror = function () { URL.revokeObjectURL(u); rej(new Error("img")); };
      im.src = u;
    });
  }
  function shrink(im, max, q) {
    var s = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement("canvas");
    c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s);
    c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", q);
  }
  function send(th, dataUrl, section) {
    th.className = "th"; th.querySelector(".b").textContent = "Envoi…";
    return RelayCrypto.enc(key, sid + ":p", { sec: section, cap: section, img: dataUrl }).then(function (p) {
      if (p.d.length > 800000) throw { app: "big" };
      return ref.collection("photos").add({ iv: p.iv, d: p.d, exp: expTs });
    }).then(function () {
      th.className = "th ok"; th.querySelector(".b").textContent = "Envoyée ✔"; sent++; $("cnt").textContent = "(" + sent + ")";
    }).catch(function (e) {
      th.className = "th er";
      var b = th.querySelector(".b");
      b.textContent = (e && e.app === "big") ? "Trop lourde" : (e && e.code === "permission-denied" ? "Refusée (session finie ?)" : "Échec — toucher pour réessayer");
      th.onclick = function () { th.onclick = null; send(th, dataUrl, section); };
    });
  }
  function take(files) {
    Array.prototype.forEach.call(files, function (f) {
      if (!f.type || f.type.indexOf("image") !== 0) return;
      var section = sec;
      readImg(f).then(function (o) {
        var lab = section === "Étiquette N° de série", q, d;
        if (lab) { /* étiquette : on garde le maximum de détails (texte et codes-barres à lire) */
          var sz = 2200; q = .85; d = shrink(o.im, sz, q);
          while (d.length > 580000 && (q > .5 || sz > 1500)) { if (q > .5) q -= .07; else { sz -= 250; q = .75; } d = shrink(o.im, sz, q); }
        } else {
          q = .72; d = shrink(o.im, 1280, q);
          while (d.length > 520000 && q > .4) { q -= .1; d = shrink(o.im, q < .5 ? 1000 : 1280, q); }
        }
        URL.revokeObjectURL(o.url);
        var th = document.createElement("div"); th.className = "th";
        th.innerHTML = '<img alt=""><div class="b"></div>'; th.querySelector("img").src = d;
        $("sent").style.display = "block"; $("list").insertBefore(th, $("list").firstChild);
        return send(th, d, section);
      }).catch(function () { alert("Image illisible, réessayez."); });
    });
  }
  ["cam", "gal"].forEach(function (id) { $(id).addEventListener("change", function () { take(this.files); this.value = ""; }); });
  $("finBtn").onclick = function () {
    try { sessionStorage.removeItem("rlCap"); } catch (e) {}
    document.body.innerHTML = '<div style="padding:40px 20px;text-align:center;font:18px system-ui"><div style="font-size:48px">&#9989;</div>' + sent + ' photo(s) envoyée(s).<br>Vous pouvez fermer cette page.</div>';
  };
})();
</script>
<script src="confidentialite.js"></script>
</body>
</html>
