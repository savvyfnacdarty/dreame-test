{"m": ["E40 Ultra", "L10 Ultra"], "c": "Consommables & entretien", "q": "Le robot fait un bruit étrange pendant le nettoyage.", "a": "1. Un bruit étrange se fait entendre pendant le nettoyage si la brosse est emmêlée. Retirez la brosse, dégagez les corps étrangers et réinstallez la brosse.\n2. Redémarrez votre robot après avoir installé la brosse pour vérifier si le bruit disparaît.\n3. Si le bruit étrange persiste, vérifiez à nouveau la brosse ou contactez le service client.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Consommables & entretien", "q": "Le robot ne continue pas à nettoyer après avoir été rechargé.", "a": "1. Votre robot peut être en mode DND (Do Not Disturb), dans lequel il ne reprendra pas le nettoyage.\n2. Si vous replacez votre robot sur la station d'accueil ou si vous le rechargez manuellement, il ne reprendra pas le nettoyage.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Consommables & entretien", "q": "Le robot ne reprend pas le nettoyage.", "a": "1. Le robot est peut-être mis en mode Ne pas déranger (DND), ce qui l'empêche de reprendre le nettoyage.\n2. Le robot ne reprend pas le nettoyage lorsqu'il est rechargé ou placé sur la base manuellement.", "en": ""},
{"m": ["E40 Ultra"], "c": "Consommables & entretien", "q": "Le robot émet un signal sonore à haute fréquence dans les 5 premières secondes de la tâche de nettoyage.", "a": "1. Retirez la planche à laver de la station de base et rincez-la à l'eau.\n2. Appuyez et maintenez le bouton Quitter pendant 3 secondes pour pomper l'eau propre du réservoir d'eau propre vers le plateau de la station de base.\n3. Nettoyez la station de base avec la brosse de nettoyage fournie.\n4. Appuyez et maintenez le bouton Quitter pendant 3 secondes pour pomper l'eau usée du plateau vers le réservoir d'eau sale. \n5. Essuyez le plateau de la station de base avec un chiffon doux.\n6. Remettez la planche à laver et le robot sur la station de base.", "en": ""},
{"m": ["E40 Ultra"], "c": "Consommables & entretien", "q": "Le séchage du bac à poussière et du sac à poussière prend du temps.", "a": "Vérifiez si le module de distribution automatique de solution contient suffisamment de produit de nettoyage. Assurez-vous que le module est bien enfoncé et correctement installé.", "en": ""},
{"m": ["E40 Ultra"], "c": "Consommables & entretien", "q": "Les brosses latérales ne s’étendent pas vers l’extérieur ni ne tournent.", "a": "Le robot peut franchir des obstacles d’une hauteur maximale de 2,2 cm pour une seule marche. Si le robot se bloque fréquemment, mesurez la hauteur de votre seuil. Si celle-ci dépasse sa capacité maximale, définissez le seuil comme infranchissable ou marquez la zone comme interdite.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Consommables & entretien", "q": "Les trajectoires de nettoyage sont désordonnées.", "a": "Cartographie pour la première fois\nLors de la cartographie, les chemins seront tellement désordonnés que votre robot pourra apprendre l'environnement autant que possible. Une fois la carte enregistrée, les chemins de nettoyage seront plus clairs. \nAprès l'enregistrement des cartes\nSi les trajectoires de nettoyage de votre robot sont désordonnées, veuillez vérifier les points suivants :\n1. Avant le nettoyage : Rangez les objets éparpillés sur le sol, tels que les multiprises, les jouets, les pantoufles, etc., afin d'éviter les collisions fréquentes et les trajectoires de nettoyage chaotiques. \n2. Pendant le nettoyage : Si les roues sont couvertes de saletés ou d'huile, ou si elles sont coincées par des objets étrangers, nettoyez-les pour que le robot se déplace normalement.\n3. Pendant le nettoyage : Si le robot entre en collision avec des objets à plusieurs reprises pendant le nettoyage, il nettoie brièvement le long des bords et des murs, puis reprend un schéma de nettoyage en forme de S.\n4. Récurrence : Si les trajectoires de nettoyage sont toujours désordonnées, mettez à jour le micrologiciel à la dernière version, réinitialisez les cartes et cartographiez à nouveau votre maison.\n5. Pour le robot doté de la fonction d'évitement des obstacles, vous pouvez essuyer la lentille du capteur.", "en": ""},
{"m": ["E40 Ultra"], "c": "Consommables & entretien", "q": "L’application signale une erreur : Impossible de détecter le réservoir de solution de nettoyage.", "a": "Afin de garantir un pompage efficace de l’eau, le réservoir d’eau propre de la station d’accueil est conçu pour être hermétique. Lorsque l’on soulève le réservoir d’eau propre rapidement, une pression négative peut se former à la sortie d’eau, provoquant l’écoulement de quelques gouttes d’eau à l’intérieur de la station d’accueil, ce qui est normal. De plus, ces gouttes d’eau s’écouleront par le trop-plein sous le réservoir d’eau propre vers la planche à laver. Il n’y a donc pas lieu de s’inquiéter.", "en": ""},
{"m": ["E40 Ultra"], "c": "Consommables & entretien", "q": "Mauvaises performances de nettoyage.", "a": "Lorsque le bac à poussière est complètement bouché et ne peut pas être retiré, veuillez suivre les étapes suivantes pour le nettoyer : \n1. Ouvrez le capot du robot. \n2. Ouvrez le couvercle du bac à poussière. \n3. Retirez le filtre HEPA et utilisez un petit outil approprié pour nettoyer les débris qui bloquent l’intérieur du bac à poussière. \n4. Une fois les débris retirés, la plaque de capot de sortie de poussière située au fond du bac à poussière se remettra en place automatiquement. Une fois qu’elle est complètement enclenchée, fermez le couvercle du bac à poussière. Vous pourrez alors retirer le bac. \nComment éviter que cela ne se reproduise ? \nSi votre maison est très poussiéreuse ou si vous avez des animaux de compagnie, vous pouvez activer le mode « Vidage automatique à haute fréquence » dans l’application, sous « Paramètres de la station d’accueil → Paramètres de vidage automatique ». Ce mode est adapté aux environnements très poussiéreux ou contenant des poils d’animaux. Pendant le nettoyage, le robot retournera plusieurs fois à la station d’accueil pour vider la poussière, ce qui évitera le blocage du bac à poussière et le problème de ne pas pouvoir le retirer.", "en": ""},
{"m": ["E40 Ultra"], "c": "Consommables & entretien", "q": "Niveau d'eau anormal dans la planche de nettoyage.", "a": "Pour une commutation fluide de la serpillière, assurez-vous qu’elle est correctement installée, avec le côté serpillière face à la trappe.\nLa serpillière étant fixée magnétiquement, appuyez doucement sur la trappe lors de la fermeture pour éviter qu’elle ne se détache et ne tombe.", "en": ""},
{"m": ["E40 Ultra"], "c": "Consommables & entretien", "q": "Niveau d'eau anormal/excès d'eau résiduelle dans la planche de nettoyage.", "a": "Activez d'abord la fonction de détection des taches tenaces dans l'application. Le robot détectera automatiquement les taches tenaces en temps réel et effectuera un nettoyage ciblé sur ces zones.", "en": ""},
{"m": ["E40 Ultra"], "c": "Consommables & entretien", "q": "Niveau d’eau anormal dans la planche à laver, excès d’eau résiduelle, fuite de la station d’accueil ou impossible de pomper l’eau usagée.", "a": "L’application affiche « Solution de nettoyage non installée ». Veuillez vérifier les points suivants : \n1. Ouvrez le capot de la station d’accueil. \n2. Retirez le réservoir de solution de nettoyage et utilisez un chiffon sec pour essuyer les contacts des électrodes à l’arrière du récipient de solution. \n3. Réinstallez le réservoir de solution de nettoyage dans son compartiment et appuyez fermement dessus. \n4. Remettez le capot en place sur la station d’accueil en appuyant sur ses deux côtés pour vous assurer qu’il est bien installé. \n5. Ouvrez l’application et lancez un lavage de la serpillière pour vérifier si le problème a résolu. \nSi l’erreur « Solution de nettoyage non installée » persiste après avoir suivi ces étapes, veuillez contacter le service après-vente local pour obtenir de l’aide.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Consommables & entretien", "q": "Placez le robot sur la zone spécifique et commencez à nettoyer.", "a": "1. cartographie : Lors de la première cartographie ou d'une nouvelle cartographie, ne déplacez PAS votre robot au cas où la cartographie échouerait.\n2. Couverture de la carte : Si la zone à nettoyer n'est pas cartographiée, le robot ne peut pas nettoyer cette zone même si vous y placez votre robot.\n3. Nettoyage normal : Si la zone à nettoyer est cartographiée, vous pouvez placer votre robot dans cette zone et commencer le nettoyage.", "en": ""},
{"m": ["E40 Ultra"], "c": "Consommables & entretien", "q": "Pourquoi y a-t-il un espace entre le robot et le mur lors du nettoyage des bords ?", "a": "Veuillez nous excuser pour la gêne occasionnée. Si le robot affiche un message d'erreur de positionnement et que la station n'a pas été déplacée, vous pouvez replacer le robot sur la station ; la carte sera automatiquement restaurée. Si la récupération de la carte échoue, vous pouvez relancer le nettoyage. Une fois le nettoyage terminé et le robot rechargé automatiquement, la carte sera enregistrée. \n Si la station a été déplacée ou que l'environnement a considérablement changé, le robot peut ne pas se positionner correctement. De plus, des roues motrices glissantes dues à un sol mouillé ou à un blocage du robot peuvent également entraîner un problème de positionnement. Veuillez vérifier en fonction de votre situation.\n Pour une meilleure expérience, nous vous recommandons de ne pas suivre le robot de trop près pendant son fonctionnement. Lors du passage de la serpillière sur les sols humides ou le carrelage, réglez le débit d'eau au minimum. Avant le démarrage du robot, rangez les objets éparpillés, les fils électriques, etc., et activez les murs virtuels/zones interdites pour réduire les risques de blocage. \n Si vous avez enregistré plusieurs cartes, assurez-vous que l'application bascule sur la carte correspondante lorsque le robot entre dans la zone concernée ; sinon, un problème de positionnement pourrait survenir.", "en": ""},
{"m": ["E40 Ultra"], "c": "Consommables & entretien", "q": "Présence de légère mousse blanche sur la planche de nettoyage.", "a": "Vérifiez si le filtre de la planche de nettoyage est correctement installé et si des débris le bloquent. Si c’est le cas, retirez-les rapidement.\nEnsuite, assurez-vous que la bague d’étanchéité du réservoir d’eau usagée est bien en place.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Consommables & entretien", "q": "Que dois-je faire lorsque la base ne parvient pas à pomper les eaux usées dans le réservoir d'eau usée ou que le niveau d'eau dans la planche à laver est anormal ?", "a": "1. Sortez le réservoir d'eau usée pour vérifier si la bague d'étanchéité est déformée ou mal installée, si c'est le cas, réinstallez la bague d'étanchéité manuellement. Si le  réservoir d'eau usée est cassé, veuillez contacter le service clientèle.\n2. Assurez-vous que le  réservoir d'eau usée est normal. Fermez ensuite le couvercle du réservoir, remettez le en place et  l'enfoncez pour vous assurer que le réservoir est bien installé au fond.\n3. Appuyez sur les clips des deux côtés de la planche à laver pour la sortir. Versez l'eau usée, et vérifiez si le filtre est bouché, si oui, nettoyez-le.\n4. Essuyez l'eau restée dans la base avec un chiffon sec, installez la planche à laver et fixez les clips des deux côtés.\n5. Nettoyez d'abord la planche à laver. Si l'erreur persiste, contactez le service client.", "en": ""},
{"m": ["E40 Ultra"], "c": "Consommables & entretien", "q": "Que faire si la navigation est anormale, que le robot entre dans des zones interdites ou franchit des murs virtuels, tombe dans les escaliers, entre en collision avec des murs, ou est incapable de définir un nettoyage programmé ou par zone ?", "a": "Notre robot MOVA puise l’eau dans la boîte d’eau située à l’arrière de l’appareil. Chaque fois que le robot retourne à la station d’accueil pour laver la serpillière et remplir la boîte d’eau, une petite quantité d’eau peut rester à l’entrée d’eau. De plus, lorsque le robot fonctionne et heurte des bosses ou des obstacles, quelques gouttes d’eau propre peuvent parfois s’écouler sur le sol, ce qui est normal. \nEn cas d’écoulement continu de gouttes d’eau, veuillez vérifier les points suivants : \n1. Suivez les instructions de démontage figurant sur l’étiquette située au bas du robot pour retirer le module de rouleau. \n2. Vérifiez si le filtre métallique à l’intérieur du compartiment du rouleau est obstrué par des débris. \n3. Nettoyez les débris autour du filtre et à l’intérieur du compartiment du rouleau. \n4. Réinstallez le module de rouleau. \nDe plus, essayez de réduire légèrement le niveau d’eau de lavage du sol et relancez un nettoyage pour voir si les gouttes persistent. Si le problème persiste, veuillez contacter le service après-vente MOVA pour obtenir de l’aide.", "en": ""},
{"m": ["E40 Ultra"], "c": "Consommables & entretien", "q": "Que faire si le robot passe la serpillère sur un tapis ou l'enroule ?", "a": "• Bruits forts pendant le fonctionnement : \n1. Vérifiez le réglage de la puissance d’aspiration dans l’application. Saquez qu’une puissance d’aspiration plus élevée entraînera un bruit de fonctionnement plus fort. \n2. En mode Tapis Boost, le bruit augmente lorsque le robot augmente automatiquement sa puissance d’aspiration dès qu’il détecte un tapis. \n• Bruits inhabituels pendant le fonctionnement :\n1. Retirez la brosse latérale et le couvercle de la brosse principale, puis redémarrez le robot. \nSi le bruit de fonctionnement revient normal :\n① Réinstallez d’abord la brosse latérale et démarrez le robot. Si un bruit inhabituel persiste pendant le fonctionnement, vérifiez si la brosse latérale est déformée. \n② Si le robot fonctionne correctement après avoir réinstallé la brosse latérale : pour les robots neufs, un léger bruit peut être perçu initialement. Il est dû au frottement entre le ruban en caoutchouc du couvercle de la brosse principale et le sol. Veuillez utiliser le robot plusieurs fois pour qu’il s’adapte. \n③ Si un bruit inhabituel apparaît après avoir réinstallé la brosse principale : retirez la brosse principale et vérifiez si ses deux extrémités sont emmêlées. Assurez-vous que le couvercle est bien clipsé lors de la réinstallation. \nVérifiez si la serpillière à rouleau est emmêlé avec des cheveux. Si c’est le cas, nettoyez-la conformément aux instructions du Manuel d’utilisation, puis réinstallez-la et vérifiez si le bruit a disparu.\nSi le bruit persiste :\n① Après avoir éteint le robot, appuyez sur les deux côtés des roues principales et faites-les glisser pour vérifier leur rotation et leur rebond lorsqu'elles sont relâchées. Nettoyez les débris si nécessaire.\n② Faites tourner la roue omnidirectionnelle pour vous assurer qu’elle tourne sans résistance. Nettoyez-la si vous constatez une résistance. \n③ Si le filtre a été lavé, assurez-vous qu’il est complètement sec avant réutilisation. Un filtre humide peut provoquer des bruits inhabituels pendant le fonctionnement.", "en": ""},
{"m": ["E40 Ultra"], "c": "Consommables & entretien", "q": "Que faire si les performances de nettoyage du robot baissent ou si des débris s’échappent pendant la collecte de la poussière ?", "a": "Le robot peut perdre la connexion avec la station d’accueil si le signal Wi-Fi de celle-ci est faible. Veuillez déplacer la station d’accueil vers une zone où le signal est plus fort avant de lancer la tâche de nettoyage. Vous pouvez consulter l’application pour trouver l’emplacement optimal : Paramètres > Plus de fonctions > Gestion Wi-Fi > Carte Wi-Fi.", "en": ""},
{"m": ["E40 Ultra"], "c": "Consommables & entretien", "q": "Que faire si l’application affiche « Niveau d’eau anormal dans la planche de nettoyage » ou s’il y a une accumulation d’eau usée ?", "a": "L'aspirateur robot utilise la pression négative pour remplir son réservoir d'eau propre depuis la station. Par conséquent, lorsque vous soulevez le réservoir d'eau propre de la station pendant son fonctionnement, une faible quantité d'eau peut déborder en raison de la pression négative. Cette fuite est minime et peut être essuyée avec un mouchoir en papier ou un chiffon, sans impact sur le fonctionnement.", "en": ""},
{"m": ["E40 Ultra"], "c": "Consommables & entretien", "q": "Quelles sont les causes d'une baisse des performances de nettoyage ou d'une fuite de poussière ?", "a": "Raisons possibles : \n 1. Le robot s'éteint automatiquement lorsque le niveau de batterie descend en dessous de 10 %. \n 2. Si le robot reste inactif pendant plus de 12 heures sans aucune opération et qu'il n'est pas en charge sur la station, il s'éteint automatiquement. \n Solutions : \n 1. Nous vous recommandons de placer le robot sur sa station pour le garder chargé. \n 2. Si le robot s'éteint alors qu'il se trouve sur la station, vérifiez que la station est sous tension ou que le robot y est correctement connecté pour maintenir la charge.", "en": ""},
{"m": ["E40 Ultra"], "c": "Consommables & entretien", "q": "Qu’est-ce que le Nettoyage en profondeur initial ?", "a": "1. Les taches tenaces sur le sol nécessitent plusieurs passages. Utilisez la fonction de Nettoyage de pièces sélectionnées pour un nettoyage en profondeur ciblant des zones spécifiques, afin d’améliorer la qualité du nettoyage. De plus, le robot est équipé d’une fonction de reconnaissance des taches tenaces. En activant cette fonction dans l’application, il adoptera une stratégie de nettoyage ciblée pour les petites zones présentant des taches sombres et tenaces, assurant ainsi une propreté accrue. \n2. Vous pouvez sélectionner « Nettoyage en profondeur » dans « CleanGenius ». Le robot ajustera alors l’espacement de son nettoyage en forme de S pour obtenir de meilleurs résultats. \n3. En mode Nettoyage personnalisé, vous pouvez sélectionner « Serpillière × 2 » ou « Serpillière × 3 ». Le robot nettoiera en suivant un motif croisé, ce qui améliorera considérablement les performances de lavage du sol. \n4. Vous pouvez sélectionner le mode « Intensif » ou « En profondeur » sous « Lavage du sol » pour obtenir de meilleurs résultats de nettoyage. \n5. Pour les taches séchées ou très adhésives collées au sol, il est recommandé de procéder à un nettoyage manuel ou d’essayer un lavage du sol en suivant les étapes 2, 3 et 4.", "en": ""},
{"m": ["E40 Ultra"], "c": "Consommables & entretien", "q": "Un message s'affiche lorsque le robot nettoie la serpillière, signalant que le réservoir d'eau propre est insuffisant.", "a": "1. Vérifiez si le filtre à déchets et le tuyau d'égout au niveau du siphon de sol se bouchent, nettoyez-les et vidangez-les.\n 2. Vérifiez si le couvercle du réservoir d'eau est bien scellé et installé en place.\n 3.Appuyez sur les clips des deux côtés de la planche à laver pour la sortir. Versez l'eau usée, et vérifiez si le filtre est bouché, si oui, nettoyez-le.\n 4. Essuyez les pièces métalliques élastiques du capteur de débordement à l'intérieur de la planche à laver avec un chiffon sec.\n 5.Nettoyez d'abord la planche à laver. Si l'erreur persiste, contactez le service client.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Consommables & entretien", "q": "Une odeur désagréable se produit sur la serpillière.", "a": "Une odeur désagréable de la serpillière :\n1. Causes : Votre maison est humide, ou la serpillière n'est pas sèche et devient moisie.\n2. Utilisation quotidienne : Veuillez laver la serpillière avec du nettoyant afin de réduire la possibilité de moisissure.\n3. Stockage : Retirez la serpillière et séchez-la dans un environnement bien ventilé.\n4. Saleté accumulée sur la planche à laver : Retirez et nettoyez la planche à laver. Sinon, une odeur se dégagera lors du séchage de la serpillière.\nRemarque : pour le robot doté de la fonction de séchage de la serpillière, vous pouvez appuyer sur Paramètres d'Autonettoyage > Démarrer le séchage pour sécher à nouveau la serpillière.", "en": ""},
{"m": ["L10 Pro"], "c": "Consommables & entretien", "q": "*Le robot aspirateur sélectionne-t-il actuellement l'ordre de nettoyage de la pièce ?", "a": "R : Il y a un réglage manuel ; actuellement, il ne prend en charge que le nettoyage séquentiel en session unique, ce qui vous permet de sélectionner des zones et de choisir l'ordre de nettoyage de la pièce pour accomplir la tâche.", "en": ""},
{"m": ["L10 Pro"], "c": "Consommables & entretien", "q": "*Le robot se déplace-t-il parfois dans une autre pièce avant d'avoir fini de nettoyer ?", "a": "R : Après que l'hôte ait créé la carte pour la première fois, elle nettoiera par pièce. Si cela arrive, veuillez vérifier le statut de la partition. S'il y a une partition incorrecte, vous pouvez rapidement ajuster la partition de la pièce dans l'application.", "en": ""},
{"m": ["L10 Pro"], "c": "Consommables & entretien", "q": "*Le robot signale-t-il que son chemin est bloqué pendant le nettoyage ?", "a": "R : Veuillez confirmer si le nettoyage de sélection est effectué. Si elle est sélectionnée, retirez les obstacles sur le chemin vers la zone désignée. Lors du nettoyage, si le passage de la machine est bloqué par des obstacles ou si la porte de la pièce est remarquée, veuillez retirer l'obstacle ou ouvrir la porte pour vous assurer que la machine nettoie correctement.", "en": ""},
{"m": ["L10 Pro"], "c": "Consommables & entretien", "q": "*Pourquoi l'efficacité de nettoyage du robot aspirateur est-elle si faible ?", "a": "R : Vous pouvez essayer après avoir éteint et redémarré Il est recommandé d'ouvrir toutes les portes de votre maison avant le premier nettoyage et cartographie, et d'organiser vos affaires pour garantir un bon déplacement du robot. Par exemple, si une porte de pièce est fermée lors de la création d'une carte, ouvrez la porte lors du prochain nettoyage. Une fois le robot entré, la carte se met à jour automatiquement. Les personnes ou les animaux de compagnie ne doivent pas suivre l'opérateur aléatoire, car cela affecterait la cartographie machine et l'évitement des obstacles. Pour assurer la couverture de nettoyage, la machine principale balaie tous les coins ; si l'environnement est complexe, cela augmente les mouvements de virage et de bord, ce qui peut réduire l'efficacité du nettoyage.", "en": ""},
{"m": ["L10 Pro"], "c": "Consommables & entretien", "q": "*Pourquoi le PP A ne peut-il pas charger ou charger lentement lorsqu'il contrôle la machine de nettoyage ?", "a": "R : L'aspirateur commence à nettoyer depuis la station de charge, chargeant une grande quantité de données. Veuillez vérifier si votre réseau domestique fonctionne correctement. Quittez l'application et réessayez.", "en": ""},
{"m": ["L10 Pro"], "c": "Consommables & entretien", "q": "*Que dois-je faire si la machine commence à nettoyer et que la carte dans l'AP disparaît (déplacement échoué) ?", "a": "R :  Déplacer la console vers des zones non nettoyées auparavant peut entraîner des échecs de repositionnement. Veuillez essayer de la déplacer vers des zones déjà nettoyées.", "en": ""},
{"m": ["L10 Pro"], "c": "Consommables & entretien", "q": "*Que dois-je faire si le robot signale être piégé pendant le nettoyage ?", "a": "R : 1. Lorsque le robot aspirateur rencontre des espaces étroits (comme des coins ou des espaces étroits) ou des chaises en forme de U, il peut rester coincé entre les objets. Si le robot mesure moins de 37 cm, il est plus difficile de sortir du piège et doit l'aider à le déplacer pour continuer le nettoyage. 2. Pendant le nettoyage, l'unité principale peut rester coincée dans des chaussons, des sacs plastiques et d'autres débris à la maison. Après avoir réglé le problème de blocage, essayez de placer l'unité principale dans la zone nettoyée à proximité et continuez le nettoyage. Il est recommandé d'utiliser des zones restreintes logicielles ou des murs virtuels pour isoler les zones où le balayage est susceptible de se coincer, ou de ranger le sol avant le nettoyage pour éviter que l'unité principale ne reste coincée pendant le nettoyage et pour rétablir le nettoyage normal de l'aspirateur.", "en": ""},
{"m": ["L10 Pro"], "c": "Consommables & entretien", "q": "*Que dois-je faire si le réservoir tombe ou signale à plusieurs reprises que le réservoir a été installé pendant le lavage ?", "a": "R :  Si le réservoir commence à fonctionner avant d'être correctement installé, cela provoquera la chute du réservoir. Veuillez prêter attention à la méthode d'installation correcte du radiateur. Lorsque vous installez les clips des deux côtés du réservoir, vous devriez entendre un bruit de « clic ».", "en": ""},
{"m": ["L10 Pro"], "c": "Consommables & entretien", "q": "*Que faire si le chemin de nettoyage du robot est perturbé ?", "a": "R : Trajectoire d'évitement des obstacles : Veuillez confirmer si le robot bouge ou déplace des objets devant la machine pendant le nettoyage ; le robot fera un cercle pour éviter les obstacles. Passage d'obstacles par marche : veuillez vérifier si la marche est un passage de barrière. Si elle est verticale ou si le milieu de la porte coulissante est suspendu, cela peut facilement coincer la roue balaieuse, entraînant une trajectoire désordonnée. Il est recommandé de construire une rampe ou d'installer un mur virtuel pour le nettoyage et le glissement De travers ou superposé : Veuillez vérifier si la carte du robot aspirateur ne correspond pas à la disposition de votre maison, montrant des signes de décalage ou de zones plus grandes. Vous pouvez la réinitialiser dans la fonction carte, et la carte sera recréée lors du prochain nettoyage.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Consommables & entretien", "q": "1. Qu'est-ce qu'un robot tout-en-un aspirateur et serpillière ?", "a": "R : Le robot intégré de balayage et de serpillière est un robot intelligent et planifié qui peut effectuer de manière autonome simultanément les tâches de balayage et de serpillière dans la disposition de la maison. Après le nettoyage, il retourne à la station de recharge pour se recharger, réduisant considérablement la charge sur les sols de la maison.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Consommables & entretien", "q": "2. Quelles sont les caractéristiques du robot intégré de balayage et de serpillière ?", "a": "R : Le robot intégré de balayage et de serpillière est équipé de divers capteurs de mouvement de haute précision et doté d'algorithmes de positionnement visuel et de navigation pour enregistrer avec précision les trajectoires de déplacement et générer des cartes de nettoyage. Il peut aussi s'adapter à des environnements domestiques complexes, avec des capacités exceptionnelles de franchissement d'obstacles et d'évasion, se rechargeant automatiquement après le travail, vous gardant ainsi la tranquillité d'esprit jusqu'à la dernière étape. Pour le nettoyage, il utilise une méthode de balai avant et de serpillière arrière, avec une aspiration puissante combinée à un système de serpillière électrique pour un nettoyage plus approfondi. Vous pouvez consulter la carte de nettoyage à tout moment via l'application Mijia, programmer un nettoyage programmé, changer de mode de nettoyage et suivre la propreté de toute votre maison.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Consommables & entretien", "q": "Combien de temps dure un robot combo aspirateur-serpillière ?", "a": "R : Aux réglages standards, il peut fonctionner plus de 150 minutes. Sur la base d'une utilisation de 80 % de la surface utilisable, on estime qu'environ 250㎡ de surface de bâtiment peuvent être nettoyés. Sous différentes températures, surfaces propres et autres facteurs, les données ci-dessus ne sont qu'à titre de référence.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Consommables & entretien", "q": "Combien de temps faut-il à un robot pour charger complètement un robot aspirateur et serpillière ?", "a": "R : Il faut environ 6 à 8 heures pour charger de 0 à 100 %.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Consommables & entretien", "q": "Comment charger un robot qui combine balayage et serpillière ?", "a": "R : Appuyez et maintenez le bouton d'alimentation, attendez que l'indicateur d'alimentation reste allumé, puis appuyez l'unité principale contre la station de charge pour charger. Remarque : Si la batterie est faible, l'appareil peut ne pas pouvoir s'allumer. Veuillez placer l'unité principale directement contre la station de charge.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Consommables & entretien", "q": "Comment commencer à nettoyer avec un robot balayeur et serpillière ?", "a": "R : Appuyez brièvement sur le bouton d'alimentation pour commencer le nettoyage. Appuyez sur n'importe quelle touche pour mettre en pause pendant le nettoyage. Note : Si la batterie est trop basse, le nettoyage ne peut pas commencer. Veuillez le charger avant de commencer le nettoyage. Si le temps de nettoyage est inférieur à 10 minutes, le nettoyage sera effectué deux fois par défaut.", "en": ""},
{"m": ["L10 Pro"], "c": "Consommables & entretien", "q": "Comment devriez-vous gérer les surfaces bloquées sur le corps de la machine lors du nettoyage ?", "a": "R : Lors du nettoyage de l'unité principale, si elle rencontre des meubles à la même hauteur que le corps de la machine, la surface de la machine peut s'y coincer. Veuillez installer le mur virtuel dans la zone restreinte du PP pour bloquer les meubles qui pourraient facilement bloquer la machine et empêcher l'hôte de rentrer à nouveau.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Consommables & entretien", "q": "Comment entretenez-vous les roues universelles dans un robot balayeur et à passer la serpillière ?", "a": "A： 1. Retournez la machine et tirez la roue universelle vers le haut. 2. Nettoyer les cheveux et la saleté du corps de roue et de l'essieu. 3. Réinstallez la carrosserie de roue et resserrez-la. Note : Vous pouvez rincer avec de l'eau du robinet, laisser sécher et réinstaller.", "en": ""},
{"m": ["L10 Pro"], "c": "Consommables & entretien", "q": "Comment faire passer la serpillière au robot sans moquette ?", "a": "R : Vous pouvez contrôler l'application pour définir une zone interdite de serpillière pour la moquette dans la fonction carte. Pendant le lavage, elle évitera la zone restreinte et évitera la moquette.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Consommables & entretien", "q": "Comment faut-il gérer les emmêlements entre la brosse latérale et la brosse principale lors du nettoyage ?", "a": "R : Lors du nettoyage de l'unité principale, les brosses latérales et les brosses à rouleaux peuvent s'emmêler avec les câbles d'alimentation, les câbles de charge, etc. La brosse principale à double extrémité est détachable et facile à nettoyer. Il est également recommandé de nettoyer et inspecter régulièrement la brosse principale et d'effectuer un entretien quotidien. Après avoir réglé la faille d'enchevêtrement, essayez de placer l'unité principale dans la zone nettoyée à proximité et continuez le nettoyage. Essayez de ranger votre maison avant de nettoyer pour éviter que l'unité principale ne s'emmêle pendant le nettoyage.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Consommables & entretien", "q": "Comment le robot aspirateur et serpillière balaye-t-il toute la maison ?", "a": "R : Après le premier départ, l'unité principale utilisera la même méthode que le 4Après avoir étendu le bord d'une zone de 5 à 4,5 m, balayez en forme d'arc jusqu'à ce que toutes les zones soient entièrement couvertes. Après le début, l'animateur nettoie les pièces dans l'ordre, commençant par le nettoyage des bords, puis le balayage de la proue, en terminant le nettoyage de la pièce de façon ordonnée et efficace, avec une couverture complète sans omissions. Après le nettoyage, l'animateur retourne automatiquement à la poubelle pour charger.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Consommables & entretien", "q": "Comment le robot aspirateur et serpillière entretient-il son chiffon ?", "a": "A： Retirez le chiffon de serpillière du module de serpillière. Lavez le linge de serpillière et aérez-le. Conseil : Il est recommandé de nettoyer après chaque utilisation. Veillez à retirer le chiffon pour le nettoyage afin d'éviter que les reflux d'égouts ne bloquent la sortie ; Si la serpillière est trop sale, cela affectera l'effet de la serpillière. Veuillez la laver avant l'utilisation ; Il est recommandé de remplacer la serpillière tous les 3 à 6 mois pour assurer un nettoyage efficace.", "en": ""},
{"m": ["L10 Pro"], "c": "Consommables & entretien", "q": "Comment le robot aspirateur et serpillière intégrés doit-il être essuyé et entretenu quotidiennement ?", "a": "R : Utilisez un chiffon sec et doux pour essuyer et nettoyer tous les capteurs de l'unité principale, y compris : 1. Quatre capteurs de falaise au bas de l'unité principale. 2. Capteur de décélération infrarouge à l'avant de l'unité principale. 3. L'électrode de charge au bas de l'unité principale. 4. Détecteur de suivi de mouvement en bas de l'unité principale.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Consommables & entretien", "q": "Comment le robot intégré de balayage et de serpillière entretient-il la poubelle et le filtre ?", "a": "R : (1) Soulevez le couvercle supérieur de l'unité principale et appuyez sur le clip de la boîte à poussière pour retirer la boîte vers le haut ; (2) Ouvrir le couvercle de la flèche de la poubelle et vider les déchets ; (3) Verser de l'eau propre dans la poubelle, fermer le couvercle, secouer la poubelle à gauche et à droite, verser l'eau sale, et répéter cette étape plusieurs fois ; Conseil : Veuillez laver à l'eau propre ; n'ajoutez aucune lessive. N'utilisez pas de pinceaux ni de doigts pour nettoyer le filtre. (4) Veuillez retirer le filtre comme indiqué sur le schéma, secouer vigoureusement les gouttelettes d'eau et aérer le filtre jusqu'à ce qu'il soit complètement sec avant de le réinstaller. Conseil : Veuillez vous assurer de faire sécher à l'air libre avant l'utilisation (au moins 24 heures).", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Consommables & entretien", "q": "Comment le robot intégré de balayage et de serpillière entretient-il le pinceau de bord ?", "a": "A： 1. Retournez la machine, tirez le pinceau de bord vers le haut comme indiqué dans le schéma, et nettoyez-le. 2. Installer le pinceau de bord. Conseil : Il est recommandé de nettoyer une fois par mois et de remplacer les brosses latérales tous les 3 à 6 mois pour garantir un nettoyage efficace.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Consommables & entretien", "q": "Comment le robot intégré de balayage et de serpillière maintient-il la brosse principale ?", "a": "A： 1. Placez l'unité principale vers le bas, appuyez sur le clip pour retirer le couvercle principal du pinceau. 2. Retirez la brosse principale vers le haut et nettoyez le roulement de la brosse principale. 3. Retirez les extrémités de la brosse principale et nettoyez les cheveux emmêlés. 4. Utilisez l'outil de nettoyage de la brosse principale assortie pour couper les cheveux emmêlés sur la brosse principale. 5. Réinstaller la brosse principale et serrer le couvercle de la brosse principale pour fixer le loquet. Conseil : Il est recommandé de nettoyer chaque semaine et de remplacer la brosse principale tous les 6 à 12 mois pour garantir un nettoyage efficace.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Consommables & entretien", "q": "Comment le robot intégré de balayage et de serpillière se connecte-t-il à l'application Mijia ?", "a": "R : Ce produit est intégré à Mijia, peut être contrôlé via l'application Mijia et s'interconnecte avec d'autres produits. Scannez le code QR pour télécharger et installer l'application Mijia. Les utilisateurs qui ont déjà installé l'application accèderont directement à la page de connexion de l'appareil. Ou cherchez « Mijia » dans l'App Store pour télécharger et installer l'application Mijia. Ouvrez la page d'accueil de l'application Mijia, appuyez sur « + » en haut à droite, et suivez les instructions de l'application pour ajouter des appareils. Remarque : En raison des mises à jour et mises à jour de l'application Mijia, les opérations réelles peuvent différer légèrement des descriptions ci-dessus. Veuillez suivre les directives actuelles de l'application.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Consommables & entretien", "q": "Comment mettre à jour le firmware du robot aspirateur et serpillière intégré ?", "a": "R : Vous pouvez utiliser l'application Mijia pour mettre à jour le firmware de l'unité principale. Avant de faire une mise à jour, veuillez vous assurer que l'unité principale est sur la station de charge et que la batterie est supérieure à 15 %. Lors des mises à jour du firmware, les trois boutons clignotent en mode flash.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Consommables & entretien", "q": "Comment restaurer le robot aspirateur et serpillière intégrés aux paramètres d'usine ?", "a": "R : Si le système ne peut toujours pas être utilisé après un redémarrage, veuillez utiliser l'outil pour maintenir la touche reset jusqu'à ce que la voix affiche « Démarrer la réinitialisation d'usine ». L'unité principale reviendra alors aux paramètres d'usine. 4. *Problèmes d'évitement des obstacles au laser New Line", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Consommables & entretien", "q": "Comment retirer le réservoir d'eau du robot aspirateur et serpillière ?", "a": "R : Après que l'unité principale ait fini de travailler et soit revenue à la station de chargement, appuyez sur les loquets des deux côtés vers l'intérieur avec votre main et traînez-la en arrière pour retirer le réservoir d'eau.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Consommables & entretien", "q": "Comment réinitialiser le WiFi sur un robot aspirateur et serpillière Dreame ?", "a": "R : Si le routeur change de configuration, oublie les mots de passe, ou pour d'autres raisons le téléphone ne peut pas se connecter à l'unité principale, ouvrez le couvercle pour révéler le voyant indicateur Wi-Fi, puis maintenez le bouton de nettoyage local et le bouton de recharge jusqu'à ce que la voix indique « Attendre la configuration réseau ». Attendez que le voyant indicateur Wi-Fi clignote lentement à nouveau, indiquant un réinitialisation réussie.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Consommables & entretien", "q": "Comment un robot balayeur et serpillier peut-il sauvegarder une carte complète ?", "a": "R : Cliquez sur Démarrer le nettoyage dans l'application ou la console Mi Home. La carte apprendra automatiquement l'environnement domestique pendant le nettoyage et créera une carte complète. (Lors du nettoyage, veuillez ouvrir la porte de la zone à nettoyer pour garantir l'intégrité de la carte.) ）", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Consommables & entretien", "q": "Comment utiliser l'augmentation de la pression de la moquette dans un robot balayeur et serpillière ?", "a": "R : Utilisez l'application Mijia, appuyez sur Paramètres - Fonction d'expérimentation, et activez la fonction « Boost de tapis ». La pressurisation de la moquette peut être activée ; la machine augmente automatiquement la succion lors de la détection de la moquette, améliorant ainsi les performances de nettoyage. Note : La pressurisation de la moquette peut être mal identifiée et parfois insensible.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Consommables & entretien", "q": "Comment utiliser la fonction de carte avancée du robot balayeur et serpillière ?", "a": "R : Utilisez l'application Mijia et appuyez sur Démarrer le nettoyage. La carte apprendra automatiquement l'environnement domestique pendant le nettoyage et créera une carte complète. Vous pouvez également utiliser des zones automatiques, la partition manuelle, le nettoyage des zones, le nettoyage des zones sélectionnées et les murs virtuels.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Consommables & entretien", "q": "Comment utiliser le robot intégré de balayage et de serpillière pour le nettoyage localisé ?", "a": "R : Pendant que l'hôte est en mode veille, appuyez rapidement sur le bouton « Local Clean » le plus à gauche. Ce mode est utilisé pour nettoyer une zone carrée centrée sur l'unité principale avec des côtés mesurant 1,5 mètre. Après nettoyage, l'unité principale revient automatiquement à la position de départ et cesse de fonctionner.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Consommables & entretien", "q": "Comment utiliser un robot aspirateur et serpillière pour un nettoyage programmé ?", "a": "R : Vous pouvez définir des heures de nettoyage programmées dans l'application. L'unité principale commence automatiquement le nettoyage à l'heure indiquée et revient automatiquement à la station de charge pour recharger après le nettoyage.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Consommables & entretien", "q": "Comment utilisez-vous la fonction de serpillière du robot intégré de balayage et de serpillière ?", "a": "A： Installez la serpillière : mouillez le chiffon à serpillière, essorez-le jusqu'à ce qu'aucune goutte d'eau ne coule, insérez-le tout le long de la fente du réservoir d'eau, puis collez-le fermement. Remplissage du réservoir : Ouvrez le bouchon du réservoir, remplissez-le d'eau du robinet, puis remettez le bouchon. Installez le module : Poussez-le le long du plan de repérage d'alignement au sol à l'arrière de l'unité principale. Une fois installé, il fera un bruit de « clic ». Commencez à passer la serpillière : appuyez brièvement sur le bouton d'alimentation pour commencer à passer la serpillière. Note : N'utilisez pas la fonction de serpillière lorsque personne n'est à la maison ; Ne pas utiliser dans des environnements moquetés ; Utilisez des agents nettoyants avec soin pour éviter les filtres du radiateur bouchés ; Lorsque vous rechargez ou ne l'utilisez pas, retirez le module de serpillière, videz toute l'eau restante du réservoir et lavez le chiffon pour éviter la moisissure ou les odeurs.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Consommables & entretien", "q": "Comment utilisez-vous le mode Ne pas déranger dans un robot balayeur et serpillière ?", "a": "R : Le mode Ne pas déranger est activé par défaut en usine, disponible de 22h00 à 08h00. Vous pouvez désactiver le mode Ne pas déranger ou changer la plage horaire Ne pas déranger via le client mobile. Pendant la période Ne pas déranger, l'unité principale ne continuera pas automatiquement à scanner ni à annoncer les messages vocaux, et le voyant d'alimentation s'éteindra.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Consommables & entretien", "q": "Le chemin de nettoyage de l'hôte va-t-il sans cesse ?", "a": "R : L'unité principale nettoie le long du trajet prévu, en se dirigeant vers les zones non nettoyées. Visuellement, il y aura quelques allers-retours répétés, mais en réalité, ce n'est pas un nettoyage répété.", "en": ""},
{"m": ["L10 Pro"], "c": "Consommables & entretien", "q": "Le robot a-t-il oublié un endroit pendant le nettoyage ?", "a": "R : Si l'espace de nettoyage est trop petit, la machine peut ne pas pouvoir accéder à cet espace étroit. Veuillez confirmer qu'il n'y a ni mouvement ni déplacement des objets devant la machine, pendant le nettoyage. Les obstacles seront contournés pour éviter les obstacles, ce qui peut entraîner un petit nombre d'endroits oubliés pendant la tâche de nettoyage.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Consommables & entretien", "q": "Le robot aspirateur et serpillière intégrés peut-il se connecter directement au chargeur ? Y a-t-il une protection contre la surcharge ?", "a": "R : Le robot intégré de balayage et de serpillière assure la protection contre la surcharge ; lorsque la batterie est complètement chargée, elle passe automatiquement à un faible courant pour la charge.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Consommables & entretien", "q": "Le robot balayeur et serpillière dispose-t-il d'une protection contre la surcharge des moteurs ?", "a": "R : Tous les moteurs de la machine disposent d'une protection contre la surcharge, y compris le ventilateur d'aspiration à poussière, le moteur de la brosse principale, le moteur de la brosse latérale et le moteur de la roue principale. Si des objets étrangers entrent ou se bloquent sévèrement, provoquant une surcharge, la protection s'active automatiquement.", "en": ""},

{"m": ["L10 Pro"], "c": "Consommables & entretien", "q": "Les robots tournent-ils en rond pendant le nettoyage ?", "a": "R : Veuillez vous assurer que le firmware du robot est à jour et à mettre à jour rapidement pour garantir la meilleure expérience de nettoyage. Veuillez vérifier s'il y a des obstacles dans la zone circulaire ; après que le robot ait évité les obstacles, le phénomène de cercle peut se produire.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Consommables & entretien", "q": "Pourquoi l'unité principale consomme-t-elle plus d'énergie lors du nettoyage ?", "a": "R :  Après que l'unité principale est complètement chargée et laissée sans surveillance pendant longtemps, la batterie peut chuter rapidement dans les premières minutes avant le nettoyage. C'est normal, mais la batterie revient à la normale après quelques minutes. En mode fort, l'alimentation de l'unité principale se décharge rapidement.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Consommables & entretien", "q": "Pourquoi le nettoyage programmé ne fonctionne-t-il pas ?", "a": "R : Cela peut être dû à une alimentation insuffisante ; la batterie restante ne commencera le nettoyage programmé que lorsque la batterie restante dépasse 15 %.", "en": ""},
{"m": ["L10 Pro"], "c": "Consommables & entretien", "q": "Pourquoi les gens regardent-ils en arrière pendant le nettoyage ?", "a": "R : Le robot aspirateur intègre une fonctionnalité linéaire d'évitement des obstacles en 3D par laser, avec une portée de reconnaissance orientée directement devant. Lorsque d'autres objets sur le côté tombent dans l'angle mort, le robot regarde en arrière pour vérifier une meilleure évitement des obstacles, ce qui est un phénomène courant.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Consommables & entretien", "q": "Qu'est-ce qui cause une capacité de nettoyage réduite ou des fuites de poussière ?", "a": "La poubelle est pleine ; veuillez la nettoyer ; Le filtre est bouché ; veuillez le nettoyer ; Le pinceau principal est emmêlé avec des objets étrangers ; veuillez le nettoyer.", "en": ""},
{"m": ["L10 Pro"], "c": "Consommables & entretien", "q": "Que faire si vous avez des taches d'eau en passant la serpillière ?", "a": "R : Pendant le lavage de la serpillière, vous pouvez ajuster la quantité d'eau en fonction du degré de saleté sur le sol. Veuillez confirmer le niveau d'eau pendant le passage ; si vous êtes réglé au maximum, des taches d'eau peuvent persister.", "en": ""},
{"m": ["L10 Pro"], "c": "Consommables & entretien", "q": "Que faire si vous ne pouvez pas nettoyer ou si les taches tenaces ne sont pas éliminées ?", "a": "R : Les robots conviennent au nettoyage quotidien du foyer. Si les taches tenaces ne peuvent pas être enlevées pendant le lavage de la serpillière, une assistance manuelle est nécessaire. Vous pouvez augmenter le volume du réservoir avant de passer la serpillière Il est recommandé de nettoyer la serpillière environ toutes les heures pour de meilleurs résultats de nettoyage. Le magasin officiel de Dreame vend des liquides nettoyants spécialisés qui peuvent être utilisés ensemble pendant le nettoyage. Ils sont riches en tensioactifs et aident à nettoyer les sols plus en profondeur.", "en": ""},
{"m": ["L10 Pro"], "c": "Consommables & entretien", "q": "Que faut-il faire si le câble d'alimentation de la station de charge s'emmêle pendant le nettoyage de l'unité principale ?", "a": "R : Avant de nettoyer, attachez le câble d'alimentation excédentaire de la station de charge avec des colliers à câbles. Ne le posez pas au sol pour éviter que l'aspirateur ne s'emmêle.", "en": ""},
{"m": ["L10 Pro"], "c": "Consommables & entretien", "q": "Que faut-il faire si le robot émet des bruits étranges pendant le nettoyage ?", "a": "R : Vérifiez si la brosse à rouleaux est prise par des objets étrangers ou fait du bruit. Nettoyez rapidement la brosse à rouleaux pour éviter les dommages. 2. Lorsque l'unité principale travaille sur des sols carrelés lisses ou en bois, le grattoir du bas peut produire un léger bruit en frottant contre le sol. Lorsque l'unité principale traverse les joints carrelés et de sol, elle entre en contact et nettoie les joints du sol, ce qui peut produire un léger bruit de « clic-clic ». Les sons ci-dessus n'affectent pas le fonctionnement normal de la machine.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Consommables & entretien", "q": "Que faut-il faire si le réservoir d'eau ne coule pas ou si le volume d'eau est faible lors du lavage ?", "a": "R : Veuillez vérifier s'il y a de l'eau dans le réservoir ; Veuillez suivre les instructions pour installer correctement la serpillière ; Veuillez laver rapidement le linge de serpillière. Avant de passer la serpillière, mouillez un chiffon pour assurer l'expérience de nettoyage avant que le réservoir d'eau ne soit retiré.", "en": ""},
{"m": ["L10 Pro"], "c": "Consommables & entretien", "q": "Que se passe-t-il si les obstacles ne peuvent pas être évités lors du nettoyage ?", "a": "R : 1. Il est recommandé d'utiliser un chiffon propre et doux pour essuyer le capteur d'évitement d'obstacles au centre de la plaque de collision de la machine. Après avoir essuyé, démarrez la machine et réessayez ; Si votre machine est connectée en réseau et en ligne, ouvrez l'interface de l'application et cliquez sur « ... » en haut à droite« Entrez, vérifiez la liste pour voir si la fonction d'évitement des obstacles est désactivée. Si oui, ouvrez-la et démarrez la machine pour essayer ; Le robot prend en charge les mises à jour OTA en ligne. Dreametech optimisera progressivement ses performances d'évitement des obstacles. Il est recommandé de vérifier régulièrement la version du firmware et de la mettre à jour rapidement. 5. Problèmes d'usage courant", "en": ""},

{"m": ["L10 Pro", "Z10 Pro"], "c": "Consommables & entretien", "q": "Quelles fonctions ont le bouton (allumage/allumage/nettoyage) du robot balayeur et serpillier ? Comment l'utiliser ?", "a": "R : Comme indiqué dans le tableau ci-dessous Conseil : L'unité principale ne peut pas être éteinte pendant la recharge ; Appuyez sur n'importe quel bouton pour mettre en pause pendant le nettoyage, la recharge ou un nettoyage partiel.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Consommables & entretien", "q": "À quoi faut-il prêter attention avant de nettoyer ?", "a": "R : Veuillez essayer de charger complètement l'unité principale avant de commencer le nettoyage depuis la station de charge. Avant de nettoyer, veuillez ranger vos meubles et ranger à l'avance les objets fragiles et les débris du sol.", "en": ""},
{"m": ["L10 Ultra"], "c": "Consommables & entretien", "q": "Entretien et maintenance du réservoir d'eau propre et du réservoir d'eau usée.", "a": "Nettoyer le réservoir d'eau usée :\n1. Ouvrez le couvercle de la base d'auto-lavage ou de la station de base et sortez le réservoir d'eau sale.\n2. Ouvrez le couvercle du réservoir d'eau sale et déversez les eaux usées. S'il reste des saletés au fond du réservoir, vous pouvez utiliser un outil auxiliaire pour les nettoyer.\n3. Vérifiez si la bague d'étanchéité du réservoir d'eau sale est desserrée ou mal installée, si c'est le cas, réinstallez-la manuellement.\n4. Remettez le réservoir d'eau sale sur la base ou la station de base après l'avoir nettoyé.\n\nNettoyer le réservoir d'eau prore:\n1. Ouvrez le couvercle de la base d'auto-lavage ou de la station de base et sortez le réservoir d'eau propre.\n2. Remettez le réservoir neuf dans la base ou la station de base après l'avoir nettoyé.", "en": ""},
{"m": ["L10s Ultra"], "c": "Consommables & entretien", "q": "Comment effectuer l'entretien courant de la base ?", "a": "Réservoir d'eau usée : retirez-le, ouvrez le couvercle et videz l'eau sale ; rincez à l'eau claire et nettoyez la paroi interne avec la brosse fournie (le flotteur est une pièce mobile, ne forcez pas). Contacts de charge : nettoyez-les ainsi que la zone de signal avec un chiffon doux et sec. Orifices de vidage automatique : nettoyez ceux du robot et de la base avec un chiffon doux et sec. Orifice d'ajout de nettoyant : essuyez-le au chiffon doux et sec s'il est sale. Serpillière : retirez-la et lavez-la.", "en": "How to do the routine maintenance for the Base Station?"},
{"m": ["L10s Ultra", "P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Consommables & entretien", "q": "La serpillière dégage une odeur désagréable", "a": "1. Vérifiez l'absence d'eau stagnante et de saleté dans le bac de lavage et que la serpillière est propre : a) sol encore sale au début : réglez l'auto-lavage sur 10 m² au départ, puis 20/30 m² après quelques usages ; b) ajoutez régulièrement un nettoyant dédié ; c) après des salissures sales ou 2 à 4 semaines d'usage, retirez et lavez la serpillière à la main ; d) au besoin, lancez le lavage immédiat de la serpillière en cours de travail. 2. Vérifiez que l'eau du réservoir d'eau propre n'est pas restée trop longtemps : renouvelez-la. 3. Vérifiez la propreté du bac de lavage.", "en": "An unpleasant odor occurs to the mop pad"},
{"m": ["L10s Ultra", "P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Consommables & entretien", "q": "Pourquoi la serpillière se détache-t-elle facilement ?", "a": "Vérifiez que la serpillière est bien fixée sur son plateau avant usage ; si elle ne tient plus ou est déformée après plusieurs usages, remplacez-la. À la sortie de la base, le plateau peut se coincer : utilisez le bouton « Départ » de la base et le bouton « Base » du robot pour gérer les entrées/sorties. En franchissant tapis, seuils ou petites marches, le plateau peut se coincer et tomber : définissez une zone de lavage interdite pour empêcher le robot d'y entrer avec la serpillière, et rangez les câbles au sol avant le nettoyage.", "en": "Why does the mop fall off easily?"},
{"m": ["L10s Ultra"], "c": "Consommables & entretien", "q": "Pourquoi le réservoir d'eau usée et le bac de lavage sentent-ils mauvais ?", "a": "1. Sol sale : videz et rincez le réservoir d'eau usée après chaque usage. 2. Nettoyez régulièrement le bac de lavage (toutes les 2 à 3 utilisations de la fonction lavage). Le L10s Ultra dispose d'un auto-nettoyage de la base : a) appuyez brièvement sur « Départ » pour sortir le robot ; b) retirez manuellement le plateau de lavage ; c) maintenez « Départ » 3 s pour lancer l'auto-nettoyage (la pompe d'eau propre évacue l'eau) ; d) nettoyez la base à la brosse.", "en": "Why do the used water tank and washboard have a bad smell?"},
{"m": ["L10s Ultra", "P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Consommables & entretien", "q": "Pourquoi reste-t-il des traces au sol après le lavage ?", "a": "Une fois le lavage terminé, l'eau au sol s'évapore et quelques traces sont normales. Leur visibilité dépend beaucoup du revêtement et de l'éclairage. Programmez des nettoyages réguliers et remplacez la serpillière à temps : le sol deviendra plus propre et les traces moins visibles. Un nettoyant dédié rend le carrelage plus propre et brillant.", "en": "Why are there marks on the ground after mopping?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Consommables & entretien", "q": "Comment vérifier si le petit réservoir du robot délivre bien de l'eau ?", "a": "Retirez la serpillière (gardez le tampon), faites sortir le robot de la base et, après cinq minutes, regardez le sol (choisissez bien le mode aspiration + lavage) : la présence de petites gouttes d'eau indique que le petit réservoir délivre l'eau normalement.", "en": "How to detect whether the small water tank of robot does not produce water?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Consommables & entretien", "q": "La serpillière est encore humide après séchage", "a": "Le robot revient à la base laver la serpillière en fin de tâche, puis lance le séchage. L'efficacité du séchage dépend de l'humidité ambiante : en région ou saison humide, le séchage peut être moins bon. Vous pouvez régler librement la durée de séchage dans l'application.", "en": "The mop pad is still wet after drying"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Consommables & entretien", "q": "La serpillière ne nettoie pas correctement", "a": "1. Sol encore sale au début : utilisez le réglage petite surface / relavage ou activez le relavage automatique ; après quelques usages, passez à la grande surface. 2. Sol sale : lancez le lavage immédiat de la serpillière dans l'application en cours de travail. 3. Après des salissures très sales ou 2 à 4 semaines d'usage, retirez et lavez la serpillière à la main. 4. Un nettoyant dédié améliore aussi le résultat.", "en": "The mop is not cleaned properly"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Consommables & entretien", "q": "Le filtre du bac à poussière peut-il être lavé à l'eau ?", "a": "Oui, mais il doit être parfaitement sec avant d'être remis dans le bac. Laissez-le sécher au moins 24 heures après lavage pour garantir le bon fonctionnement.", "en": "Can the robot dust box filter be washed with water?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Consommables & entretien", "q": "Le réservoir d'eau usée et le bac de lavage de la base sentent mauvais", "a": "1. Sol sale : après chaque usage, videz et rincez rapidement le réservoir d'eau usée. 2. Nettoyez régulièrement le bac de lavage : il est conseillé de le nettoyer toutes les 2 à 3 utilisations de la fonction lavage.", "en": "The sewage tank and wash tray of base station have peculiar smell"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Consommables & entretien", "q": "Pourquoi beaucoup de traces d'eau restent-elles au sol après le lavage ?", "a": "Comme lors d'un lavage manuel, même bien essorée, la serpillière laisse un peu d'humidité qui doit s'évaporer, d'autant plus selon la capacité d'absorption du sol. Recommandations : 1. Sur carrelage ou par temps humide, programmez des nettoyages réguliers, réduisez le débit d'eau ou remplacez la serpillière à temps ; un nettoyant dédié rend le carrelage plus propre et brillant. 2. Mettez le micrologiciel à jour via l'application (page de l'appareil → « … » → Réglages → Mise à jour du micrologiciel).", "en": "Why is there a lot of water stains on the floor after mopping?"},
