{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Message vocal : capteur laser anormal / LDS anormal", "a": "1. Vérifiez que le module LDS n'est pas bloqué par un corps étranger et qu'il tourne (bougez-le doucement pour tester). 2. Vérifiez que le capot du LDS peut se déplacer légèrement dans les quatre directions. 3. Vérifiez que les orifices d'émission et de réception du laser ne sont pas obstrués par un corps étranger.", "en": "Voice prompt: Laser sensor abnormal / LDS abnormal"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Pas d'eau lors du lavage de la serpillière", "a": "1. Un nettoyant/désinfectant d'une autre marque a-t-il été ajouté ? Il peut boucher la conduite interne ou la pompe d'eau propre. 2. Vérifiez l'absence de corps étranger dans le bouchon d'étanchéité et la conduite du réservoir d'eau propre. 3. Retirez le robot, maintenez le bouton « sortie » de la base 3 s pour voir si l'eau coule ; si oui, rincez le fond de la base et appuyez brièvement sur « retour ». 4. Si la base ne délivre pas d'eau, dans l'application « … » → réglages avancés → appuyez 10 fois sous le numéro de version du plug-in pour lancer l'auto-réparation de la base. 5. Débranchez la base 30 s puis rebranchez et réessayez.", "en": "No water comes out when washing mop pad"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Pourquoi de l'eau goutte-t-elle à l'arrière du robot ?", "a": "Le robot possède un petit réservoir interne, rempli à chaque retour à la base ; un peu d'eau reste à l'orifice de remplissage et tombe ensuite au sol lorsque le robot circule.", "en": "Why does the back of the robot drip?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Pourquoi est-ce bruyant quand la serpillière se déploie vers l'extérieur ?", "a": "Pour mieux nettoyer les bords, le robot utilise un bras robotisé bionique qui déploie l'angle de la serpillière. En plus de sa rotation normale, ce mouvement de déploiement, avec l'augmentation du courant, accroît le bruit — c'est normal.", "en": "Why is it so noisy when the mop swings out?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Pourquoi l'application indique-t-elle le robot hors ligne ?", "a": "Causes : 1. Robot éteint : l'application ne peut pas s'y connecter. 2. Le passage en ligne/hors ligne dépend de la force du signal réseau à l'endroit du robot ; un signal faible ou instable le met hors ligne. 3. Votre Wi-Fi n'a pas de connexion Internet. Solutions : 1. Vérifiez que le robot n'est pas éteint ; le cas échéant, rallumez-le et reconfigurez le réseau. 2. Une mise hors ligne en cours de travail n'empêche pas le robot d'achever sa tâche ; il se reconnecte quand le signal revient.", "en": "Why does the App indicate that the robot is offline?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Pourquoi l'aspiration des poussières est-elle bruyante ?", "a": "La base utilise une aspiration à double orifice combinant soufflage et aspiration, ce qui ne laisse aucun résidu dans le bac. Le double conduit de grand diamètre réduit le bruit, augmente l'aspiration et collecte la poussière en 10 secondes, plus proprement et plus vite.", "en": "Why is the dust collection so noisy?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Pourquoi l'auto-nettoyage de la base est-il médiocre ?", "a": "1. Vérifiez que le rouleau du bac de lavage tourne normalement et n'est pas entouré de corps étrangers (démontable pour nettoyage). 2. Lancez un nettoyage manuel du châssis de la base : Application → page de l'appareil → « … » → Réglages de la base → Nettoyage manuel du châssis. 3. Vérifiez le bon sens de montage du bac et des bras de lavage ; pour remplacer un bras, suivez la vidéo.", "en": "Why is the self-cleaning effect of the machine not good?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Pourquoi l'eau usée de l'auto-nettoyage coule-t-elle dans le bac de lavage sans être entièrement aspirée ?", "a": "Le pompage de l'eau usée fonctionne par pompe à air, comme une grosse paille : il reste toujours un peu de résidu au fond. En mode auto-nettoyage, essuyez normalement avec une serpillière et installez le plateau de lavage. En mode lavage de serpillière, le séchage éliminera aussi ces traces d'eau.", "en": "Why does self-cleaning sewage flow into the cleaning tray and cannot be sucked clean?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Pourquoi la base fuit-elle ?", "a": "Un niveau d'eau anormal dans le bac de lavage est lié à l'étanchéité du réservoir d'eau usée. Vérifiez : 1. Retirez le bac de lavage, vérifiez que l'évacuation d'eau usée n'est pas bouchée et nettoyez-la, essuyez le capteur de débordement du bac. 2. Ouvrez le couvercle du réservoir d'eau usée, vérifiez que son joint n'est ni desserré ni déformé, remettez-le en place et essuyez. 3. Après avoir vidé l'eau usée, vérifiez que le clip du réservoir est bien enclenché. 4. Une fois le réservoir dans la base, appuyez légèrement pour assurer sa bonne mise en place.", "en": "Why does the base station leak water?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Pourquoi la roue motrice laisse-t-elle échapper de l'huile ?", "a": "Les roues motrices sont dotées d'un système de lubrification et peuvent contenir un lubrifiant susceptible de déborder légèrement. Essuyez-le : cela n'affecte pas le fonctionnement. En cas de doute, recontactez le SAV.", "en": "Why does the drive wheel leak oil?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Pourquoi le bac de lavage fait-il un bruit étrange lors du lavage de la serpillière ?", "a": "La base utilise un double bras racleur actif ; la structure du bac de lavage n'est pas entièrement en contact avec le fond, laissant un espace de mouvement aux racleurs pour un lavage plus propre. Par ailleurs, si des corps étrangers entourent le rouleau du bac, démontez-le pour le nettoyer.", "en": "Why does the cleaning tray make a strange noise when washing mops?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Pourquoi le nettoyage n'est-il pas complet ?", "a": "Le robot propose le mode CleanGenius et le nettoyage personnalisé pour divers cas : 1. Sol encore sale au début : le robot nettoie des zones inaccessibles manuellement, d'où beaucoup de poussière au premier passage. Utilisez le réglage petite surface / un lavage au départ, puis grande surface après quelques usages. 2. Utilisez le mode « ultime » de CleanGenius : passages plus denses et plus lents dans toute la maison pour un résultat plus propre ; la poussière diminue avec le temps. 3. Vous pouvez aussi ajuster les paramètres du robot (aspiration, fréquence).", "en": "Why is it not cleaned thoroughly?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Pourquoi le robot accoste une seconde fois à la base avant de commencer le nettoyage ?", "a": "Avant de démarrer, le robot vérifie que les électrodes de charge, le port d'accostage et le port de remplissage automatique s'alignent correctement, pour garantir un bon remplissage. En cas de léger écart, il recule et refait un accostage — c'est normal, l'usage reste sûr.", "en": "Why does the robot dock to the base station a second time before starting cleaning?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Pourquoi le robot accoste-t-il deux fois au retour à la charge ou au lavage de serpillière ?", "a": "1. Le robot doit aligner précisément les électrodes de charge, le port d'accostage et le port de remplissage automatique ; il corrige sa trajectoire selon le signal de la base et, en cas d'accostage imparfait, recule et refait un accostage — c'est normal. Placez la base sur un sol horizontal et sans eau à proximité pour éviter le patinage. 2. Mettez le micrologiciel à jour (page de l'appareil → « … » → Réglages → Mise à jour du micrologiciel) et activez la « Mise à jour automatique » pour améliorer l'expérience de recharge.", "en": "Why does the robot dock to the base station a second time when returning to charge or wash mop pad?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Pourquoi le robot annonce « chemin bloqué » alors qu'il n'y a pas d'obstacle ?", "a": "Vérifiez l'absence de cartes superposées ou déformées dans l'application ; le cas échéant, restaurez une carte carrée normale ou refaites la carte et observez. Mettez aussi le micrologiciel à jour (page de l'appareil → « … » → Réglages → Mise à jour du micrologiciel) et activez la « Mise à jour automatique ».", "en": "Why does the robot broadcast 'path blocked' when it reaches the position without obstacles?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Pourquoi le robot raye-t-il le sol ?", "a": "Le robot utilise une serpillière en matériau composite, une brosse latérale en nylon et des roues motrices en caoutchouc souple : ces matériaux ne rayent pas le sol. Vérifiez qu'aucun objet dur n'a été aspiré sous le robot : un objet coupant sous l'appareil peut endommager le sol.", "en": "Why do robots scratch the ground?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Pourquoi le réservoir d'eau est-il difficile à ouvrir ?", "a": "Le clip d'un réservoir neuf peut être serré à la première utilisation. Ouvrez-le avec un peu plus de force ; il se détendra après quelques usages.", "en": "Why is it difficult to open the water tank?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Pourquoi le sol est-il encore sale après un second passage ?", "a": "En mode CleanGenius, le robot détecte automatiquement si la serpillière et la zone correspondante sont propres. Si le logement est grand ou lors du premier usage, utilisez la fonction « aspiration puis lavage » en mode personnalisé. Utilisez le mode « ultime » de CleanGenius pour un nettoyage en profondeur. S'il reste des salissures, créez un nettoyage personnalisé sur les zones les plus sales (2 à 3 passages).", "en": "Why is the ground still dirty after secondary cleaning?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Pourquoi le sol n'est-il pas propre / l'aspiration des cheveux ou des poussières est-elle médiocre ?", "a": "Avant usage, associez d'abord le robot au réseau, puis mettez le micrologiciel à jour (Application → « … » → Réglages → Mise à jour du micrologiciel) pour optimiser le nettoyage. Le robot propose un mode intelligent piloté et un nettoyage personnalisé : au début, le sol peut être sale et le robot ramène beaucoup de poussière au premier passage en nettoyant des zones inaccessibles manuellement. Utilisez le réglage petite surface / un lavage au départ, puis grande surface après quelques usages.", "en": "Why is the ground cleaned by robots not clean? / poor hair inhalation"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Pourquoi reste-t-il de l'eau dans le bac de lavage ?", "a": "Si la base n'est pas posée à l'horizontale, de l'eau peut y stagner : replacez-la sur un sol plat et observez. Si elle est bien à plat, vérifiez que le filtre du bac de lavage n'est pas obstrué par un corps étranger et nettoyez-le. Un peu d'eau résiduelle dans le creux triangulaire est normal ; le séchage par la serpillière en éliminera une partie (un essuyage manuel suffit).", "en": "Why is there residual water in the cleaning tray?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Pourquoi une serpillière est-elle haute et l'autre basse ?", "a": "Vérifiez l'absence de corps étranger coincé dans le plateau de serpillière, puis redémarrez le robot et réessayez. NB : nettoyez régulièrement la serpillière (démontez-la pour ôter les cheveux emmêlés). Pour un grand logement, l'usage du mode « aspiration puis lavage » donne un résultat plus propre.", "en": "Why is one of the mop pads high but another is low?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Pourquoi y a-t-il de l'eau au fond du réservoir et à la jonction avec le joint de la base ?", "a": "En raison de la conception étanche du réservoir d'eau propre, un effet de dépression laisse un peu d'eau au relevage. La base est étanche et cette eau résiduelle est recyclée vers le bac de lavage par des conduites internes. Cela n'affecte pas le fonctionnement.", "en": "Why is there water residue at the bottom of the water tank and the sealing ring interface?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Que faire en cas de fuite de poussière au niveau de l'orifice d'aspiration ?", "a": "Vérifiez en priorité si le sac ou le bac à poussière est plein, et l'absence de corps étranger obstruant les orifices d'aspiration. Si le sac/bac est plein, remplacez le sac ou utilisez l'aspiration immédiate. Après un temps d'usage, si la saleté du bac n'est plus aspirée, nettoyez-le manuellement (et séchez-le complètement).", "en": "What if there is dust leakage at the dust collection port?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Que faire si des morceaux de papier restent dans le conduit lors de l'aspiration des poussières ?", "a": "S'il y a trop de morceaux de papier dans le bac, ils peuvent être retenus par l'électricité statique et laisser une très petite quantité dans le conduit d'air, sans incidence sur le fonctionnement. Ils seront collectés à la prochaine aspiration avec les autres déchets. Vous pouvez aussi régler l'aspiration en fréquence élevée pour éviter tout résidu.", "en": "paper remains in the dust collection duct during dust collection"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Que faire si le capot du robot est chaud ?", "a": "L'appareil utilise une puce de plateforme très puissante qui chauffe plus facilement que les générations précédentes, mais sans aucun problème de sécurité. L'usage est parfaitement sûr.", "en": "What if the robot's cover feels hot?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "S20 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Que faire si le robot annonce que le bac à poussière n'est pas installé ?", "a": "1. Vérifiez que le filtre est bien installé sur le bac. 2. Vérifiez la présence de l'aimant du filtre (sa position varie selon les modèles). 3. Si l'aimant est absent, un filtre neuf peut vous être fourni. S'il est présent, redémarrez le robot ; si le message persiste après redémarrage, l'appareil doit être renvoyé pour test.", "en": "How to troubleshoot if the robot broadcast dust box is not installed?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Que faire si le robot ne parvient pas à se repositionner ?", "a": "Après un échec de positionnement, si la base n'a pas bougé, replacez rapidement le robot sur la base : la carte se restaure automatiquement. Si la restauration échoue, relancez un nettoyage ; la carte sera sauvegardée après recharge automatique. Si la base a été déplacée ou l'environnement fortement modifié, l'échec de positionnement est probable. Un sol mouillé faisant patiner les roues, ou un robot coincé, peuvent aussi causer un échec. Conseils : ne suivez pas le robot de près pendant le travail, utilisez le débit d'eau minimal sur sol humide ou carrelage.", "en": "What if the Dreame robot fail to relocate itself?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Que faire si le robot ne parvient pas à vider sa poussière (aspiration de la base) ?", "a": "1. Base sous tension : le couvercle du compartiment à poussière doit être fermé et le sac correctement installé. 2. Vérifiez si le sac est plein : remplacez-le et relancez l'aspiration. 3. Vérifiez que les orifices d'aspiration du robot, de la base et du bac ne sont pas obstrués : nettoyez-les. 4. Vérifiez que l'aspiration n'est pas désactivée dans l'application ; en mode « Ne pas déranger », l'aspiration n'est pas exécutée : désactivez ou modifiez cette plage horaire. 5. Vérifiez que la fenêtre des électrodes de charge n'est pas sale, ce qui bloquerait la transmission du signal.", "en": "What if the robot fails to collect dust?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Que faire si le réservoir d'eau propre est lâche après clipsage ?", "a": "Appuyez manuellement sur le couvercle de fermeture du réservoir d'eau propre pour garantir sa bonne mise en place.", "en": "What if the clean water tank is loose after being buckled?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Que faire si le seuil n'est toujours pas franchi après essai ?", "a": "Si la hauteur du seuil dépasse environ 22 mm, le robot ne peut pas le franchir normalement : préparez une rampe d'accès pour l'aider.", "en": "What if the threshold still fails to cross the obstacle after use?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Un peu d'eau reste dans la base de lavage / le réservoir neuf", "a": "Pour garantir la qualité, nous testons l'étanchéité du réservoir avec de l'eau. Si le délai avant réception est court, un léger résidu n'a pas eu le temps de s'évaporer. L'usage reste parfaitement sûr.", "en": "small amount of water left in the newly bought cleaning dock/water tank"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "Cartographie rapide lente / collisions désordonnées / recul brusque / alerte sol plat, robot incliné ou coincé", "a": "Terminez la tâche et renvoyez le robot à la base pour assurer une charge correcte, attendez 10 minutes, puis relancez le travail (cartographie rapide ou nettoyage) en laissant le robot partir de lui-même de la base (ne le déplacez pas et gardez le sol dégagé devant la base). Si cela échoue, réessayez. Faites toujours démarrer le robot depuis la base : il se repositionne en sortant, ce qui évite les trajets anormaux.", "en": "Quick map building is slow / crashes / retreats / tilts / trapped"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "Comment expliquer que le robot ne franchit pas un obstacle de 2 cm / ne monte pas la pente ?", "a": "La hauteur de franchissement est de 2 cm, supérieure à celle de la plupart des produits du marché. La réussite dépend de la longueur et de la pente de la rampe ; une pente forte déclenche facilement l'évitement par laser linéaire. Mesurez la hauteur du seuil : si elle est ≤ 2 cm, créez un seuil dans l'application (Édition de la carte → Seuil → Ajouter) pour aider au franchissement ; vous pouvez aussi glisser un tapis fin au niveau du seuil.", "en": "How to explain inability to cross an obstacle within 2cm / climb a hill?"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "Comment expliquer un nettoyage insuffisant ?", "a": "Le robot propose un mode intelligent piloté et un nettoyage personnalisé : 1. Sol encore sale au début : le robot nettoie des zones inaccessibles manuellement, d'où beaucoup de poussière au premier passage. Utilisez le réglage petite surface / un lavage au départ, puis grande surface après quelques usages. 2. Utilisez le mode « ultime » du mode intelligent piloté : passages plus denses et plus lents dans toute la maison pour un résultat plus propre ; la poussière diminue avec le temps.", "en": "How to explain the lack of cleaning?"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "Comment résoudre un échec de positionnement ?", "a": "Après un échec de positionnement, si la base n'a pas bougé, replacez rapidement le robot sur la base : la carte se restaure automatiquement. Si la restauration échoue, relancez un nettoyage ; la carte sera sauvegardée après recharge automatique. Si la base a été déplacée ou l'environnement fortement modifié, l'échec est probable. Un sol mouillé faisant patiner les roues, ou un robot coincé, peuvent aussi causer un échec. Ne suivez pas le robot de près pendant le travail.", "en": "How to solve positioning failure?"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "Comment éviter les rayures au sol ?", "a": "Utilisez le mode « aspiration puis lavage » pour retirer d'abord les saletés avant de laver. En présence d'objets pointus, retirez-les au préalable pour qu'aucun élément coupant sous le robot ne raye le sol pendant le nettoyage.", "en": "How to avoid ground scratches / Explanation of ground scratches"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "Des débris ressemblant à des cheveux au déballage", "a": "La plupart des pièces sont en plastique injecté, emballées dans un sachet PE placé dans un carton. Poussières ou fibres du carton peuvent se déposer par électricité statique sur le sachet PE ou la machine. Toutes nos excuses pour la gêne.", "en": "When I opened the box, I found crumbs like hair"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "Des morceaux de papier restent dans le conduit lors de l'aspiration des poussières", "a": "S'il y a trop de morceaux de papier dans le bac, ils peuvent être retenus par l'électricité statique et laisser une très petite quantité dans le conduit, sans incidence sur le fonctionnement. Ils seront collectés à la prochaine aspiration. Vous pouvez aussi régler l'aspiration en fréquence élevée pour éviter tout résidu.", "en": "Paper remains in the dust collection air duct"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "Dépannage : pas d'eau lors du lavage de la serpillière", "a": "Le problème est-il apparu dès le déballage ou après un temps d'usage ? S'il est apparu après usage, un nettoyant/désinfectant d'une autre marque a-t-il été ajouté ? Cela peut boucher les conduites internes et la pompe d'eau propre. Vérifiez en suivant la vidéo d'aide.", "en": "no water coming out of the mop when washing it"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "Eau résiduelle au fond du réservoir / à la jonction avec le joint de la base", "a": "En raison de la conception étanche du réservoir d'eau propre, un effet de dépression laisse un peu d'eau au relevage. La base est étanche et cette eau résiduelle est recyclée vers le bac de lavage par des conduites internes. Cela n'affecte pas le fonctionnement.", "en": "water residue at the bottom of the water tank / sealing ring interface"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "En surveillance vidéo/appel vocal, l'application se ferme ou indique « voix occupée » : que faire ?", "a": "Cela survient généralement lors d'un appel vocal parce que la commande précédente ne s'est pas terminée. 1. Robot hors de la base (pas en charge), maintenez le bouton d'alimentation central 3 s pour éteindre puis rallumer. 2. Après une brève déconnexion, une fois le réseau rétabli, rouvrez l'application et réessayez l'appel vocal.", "en": "APP crashes or prompts Voice is occupied during video/voice call"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "Fausse alerte : « Vérifiez le réservoir d'eau usée » / « non installé » / « plein »", "a": "Vérifiez d'abord que le réservoir d'eau usée est bien installé. Si tout est normal : 1. S'il est plein, videz-le. 2. Vérifiez que le flotteur flotte normalement et que l'aimant du réservoir est présent ; en cas d'anomalie, un réservoir neuf doit vous être fourni. 3. Relancez la tâche via le bouton de l'application. 4. Débranchez la base, patientez une minute, rebranchez et vérifiez que le voyant est allumé, puis réessayez. Si le problème persiste, renvoyez l'appareil.", "en": "False alarm [Please check the sewage tank]/[not installed] or [full]"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "L'application indique l'appareil hors ligne : que faire ?", "a": "Causes : 1. Robot éteint : l'application ne peut pas s'y connecter. 2. Le passage en ligne/hors ligne dépend de la force du signal à l'endroit du robot ; un signal faible ou instable le met hors ligne. 3. Wi-Fi sans connexion Internet. Solutions : vérifiez que le robot n'est pas éteint (le cas échéant, rallumez et reconfigurez le réseau) ; une mise hors ligne en cours de travail n'empêche pas le robot d'achever sa tâche.", "en": "The APP shows that the device is offline"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "L'auto-nettoyage de la base délivre l'eau par intermittence et en faible quantité : pourquoi ?", "a": "Vérifiez que le réservoir d'eau propre contient assez d'eau : un niveau insuffisant provoque une arrivée d'eau intermittente pendant l'auto-nettoyage.", "en": "self-cleaning water output is intermittent and small"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "L'eau usée de l'auto-nettoyage coule dans le bac de lavage sans être entièrement aspirée", "a": "Le pompage de l'eau usée fonctionne par pompe à air, comme une grosse paille : il reste toujours un peu de résidu au fond. En mode auto-nettoyage, essuyez normalement avec une serpillière et installez le plateau de lavage. En mode lavage de serpillière, le séchage éliminera aussi ces traces d'eau.", "en": "self-cleaning sewage flowing into the cleaning tray and unable to be sucked clean"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "La roue motrice laisse échapper de l'huile", "a": "Les roues motrices intègrent un système de lubrification ; un peu de lubrifiant peut déborder. Essuyez-le : cela n'affecte pas le fonctionnement. En cas de doute, recontactez le SAV.", "en": "Driving wheel oil leakage tips"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "La serpillière est installée mais le robot indique qu'elle est détachée", "a": "Si la serpillière est correctement installée mais signalée absente, mettez le micrologiciel à jour vers la dernière version ; si cela ne suffit pas, redémarrez le robot. Si le problème persiste après redémarrage, renvoyez l'appareil.", "en": "mop installed but prompts it fell off"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "Le bruit de séchage est fort", "a": "Le séchage produit environ 44 décibels, comparable au bruit feutré d'une climatisation, ce qui est déjà faible. S'il gêne votre repos, placez le robot hors de la chambre.", "en": "Drying noise is loud"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "Le pompage de l'eau est trop bruyant", "a": "Lorsque l'eau usée est aspirée à fond, l'air entre dans le conduit et comprime l'eau, créant un gargouillis, comme lorsqu'on aspire la dernière gorgée à la paille. Si le sol est peu sale, réduisez la fréquence de relavage et placez le robot dans une pièce peu fréquentée.", "en": "Pumping sound is too loud"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "Le robot a oublié de scanner une zone : que faire ?", "a": "1. Le robot n'entre pas dans les espaces trop étroits (moins de 40 cm) ; en deçà, cela dépend de l'environnement. 2. Pour les robots à capteur ultrason, un tapis détecté à l'entrée en mode lavage avec évitement l'empêche d'entrer : retirez le tapis (voir l'interrupteur de détection de tapis). 3. La superposition de cartes peut fausser le positionnement : refaites la carte (ou restaurez-la). 4. Des obstacles à l'entrée (chaussons, câbles…) sont évités : dégagez le sol au préalable.", "en": "The robot missed scanning a certain area"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "Le robot annonce que le plateau de lavage n'est pas installé : que faire ?", "a": "1. Vérifiez la présence de l'aimant du plateau de lavage : absent, le robot annonce le plateau non installé. 2. Si l'aimant est présent, coupez l'alimentation de la base 5 s et réessayez. 3. Si le problème persiste, renvoyez l'appareil.", "en": "prompts cleaning disk is not installed"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "Le robot est bruyant et émet des bruits anormaux", "a": "Bruit élevé : 1. Vérifiez si l'aspiration est réglée sur puissance forte (plus l'aspiration est forte, plus le bruit augmente). 2. Le renfort moquette augmente l'aspiration sur les tapis, d'où plus de bruit. 3. Au relavage, le ventilateur se met en marche et le bruit augmente. Bruit anormal : retirez la brosse latérale, le capot de brosse et la brosse rouleau sous l'appareil, puis démarrez et observez ; si le bruit redevient normal, réinstallez d'abord la brosse latérale et vérifiez qu'elle n'est pas déformée.", "en": "The working sound is loud and there are strange noises"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "Le robot raye-t-il le sol ?", "a": "Le robot utilise une serpillière en microfibre, une brosse latérale en nylon et des roues motrices en caoutchouc souple : ces matériaux ne rayent pas le sol. Vérifiez qu'aucun objet dur n'a été aspiré sous le robot : un objet coupant sous l'appareil peut endommager le sol.", "en": "The robot will scratch the floor"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "Le robot trouve la base et amorce l'accostage mais se coince devant ou patine", "a": "1. Vérifiez le dégagement autour de la base (5 cm de chaque côté, 1,5 m devant). 2. Si une rampe d'extension est installée, vérifiez qu'elle est bien posée ; la base doit être à l'horizontale, sinon repositionnez-la. 3. Essuyez les traces d'eau à l'avant des roues motrices et de la base pour éviter le patinage. 4. Nettoyez toute saleté ou corps étranger sur les roues motrices, la roue multidirectionnelle et la rampe de la base.", "en": "Found the base station, docking action but stuck in front or slipping"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "Le réservoir d'eau est sale au déballage", "a": "Pour garantir l'étanchéité, nous testons le réservoir avec de l'eau en production, ce qui peut laisser des traces. Nous vous prions de nous excuser pour la gêne.", "en": "When I opened the box, I found the water tank was dirty"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "Message vocal : capteur laser anormal / LDS anormal", "a": "1. Vérifiez que le module LDS n'est pas bloqué par un corps étranger et qu'il tourne (bougez-le doucement). 2. Vérifiez que le capot du LDS peut se déplacer légèrement dans les quatre directions. 3. Vérifiez que les orifices d'émission et de réception du laser ne sont pas obstrués.", "en": "Voice prompt: Laser sensor abnormality / LDS abnormality"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "Paroles de réassurance lorsque l'aspiration des poussières est bruyante", "a": "La base utilise une aspiration à double orifice combinant soufflage et aspiration, ce qui ne laisse aucun résidu dans le bac. Le double conduit de grand diamètre réduit le bruit, augmente l'aspiration et collecte la poussière en 10 secondes, plus proprement et plus vite.", "en": "Explanation of soothing words when dust collection is noisy"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "Pourquoi de l'eau goutte-t-elle à l'arrière du robot ?", "a": "Le robot possède un petit réservoir interne, rempli à chaque retour à la base ; un peu d'eau reste à l'orifice de remplissage et tombe ensuite au sol lorsque le robot circule.", "en": "Why is water dripping from the rear of the robot?"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "Pourquoi l'évitement d'obstacles est-il médiocre ?", "a": "Le robot utilise un triple évitement d'obstacles : 1. Il détecte l'obstacle et ralentit avant la collision ; mais certains objets foncés, réfléchissants, fins (pieds de table/chaise) ou bas peuvent ne pas être détectés — c'est normal (ajoutez au besoin un mur virtuel ou une zone interdite : Application → Édition de la carte → Zone interdite / mur virtuel). 2. Vérifiez que « Reconnaissance IA » est activée et essuyez régulièrement l'objectif IA (ni traces ni poussière). 3. Face à des obstacles souples (rideaux) ou une porte entrouverte, le robot ralentit et touche légèrement.", "en": "reason for the poor obstacle avoidance of the robot"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "Pourquoi le robot accoste-t-il une seconde fois avant de commencer le nettoyage ?", "a": "Avant de démarrer, le robot vérifie que les électrodes de charge, le port d'accostage et le port de remplissage automatique s'alignent correctement, pour garantir un bon remplissage. En cas de léger écart, il recule et refait un accostage — c'est normal, l'usage reste sûr.", "en": "Why does the robot dock on the base a second time before starting cleaning?"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "Pourquoi le robot annonce « chemin bloqué » alors qu'il n'y a pas d'obstacle ?", "a": "Vérifiez l'absence de cartes superposées ou déformées dans l'application ; le cas échéant, restaurez une carte carrée normale ou refaites la carte et observez. Mettez aussi le micrologiciel à jour (page de l'appareil → « … » → Réglages → Mise à jour du micrologiciel) et activez la « Mise à jour automatique ».", "en": "robot reports path blocked after reaching location with no obstacles"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "Que faire en cas de fuite de poussière au niveau de l'orifice d'aspiration ?", "a": "Vérifiez en priorité si le sac ou le bac à poussière est plein, et l'absence de corps étranger obstruant les orifices. Si le sac/bac est plein, remplacez le sac ou utilisez l'aspiration immédiate. Après un temps d'usage, si la saleté du bac n'est plus aspirée, nettoyez-le manuellement (et séchez-le complètement).", "en": "What should I do if dust leaks from the dust collection area?"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "Que faire si le capot du robot est chaud ?", "a": "L'appareil utilise une puce de plateforme très puissante qui chauffe plus facilement que les générations précédentes, mais sans aucun problème de sécurité. L'usage est parfaitement sûr.", "en": "robot cover feels hot to the touch"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "Que faire si le robot ne parvient pas à vider sa poussière ?", "a": "1. Base sous tension : le couvercle du compartiment à poussière doit être fermé et le sac installé. 2. Vérifiez si le sac est plein : remplacez-le et relancez l'aspiration. 3. Vérifiez que les orifices d'aspiration du robot, de la base et du bac ne sont pas obstrués. 4. Vérifiez que l'aspiration n'est pas désactivée dans l'application ; en mode « Ne pas déranger », l'aspiration n'est pas exécutée durant la plage définie.", "en": "What should I do if the robot fails to collect dust?"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "Que faire si le réservoir d'eau propre est lâche après clipsage ?", "a": "Appuyez manuellement sur le couvercle de fermeture du réservoir d'eau propre pour garantir sa bonne mise en place.", "en": "What if the solution tank becomes loose after being fastened?"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "Que faire si le réservoir d'eau usée ne se vide pas ou si un niveau d'eau anormal est signalé dans le bac de lavage ?", "a": "Ce problème est lié à l'étanchéité du réservoir d'eau usée. Vérifiez : 1. Retirez le bac de lavage, vérifiez que l'évacuation d'eau usée n'est pas bouchée et nettoyez-la, essuyez le capteur de débordement. 2. Ouvrez le couvercle du réservoir d'eau usée, vérifiez que son joint n'est ni desserré ni déformé, remettez-le en place et essuyez. 3. Après avoir vidé l'eau usée, vérifiez que le clip est bien enclenché. 4. Une fois le réservoir dans la base, appuyez légèrement pour assurer sa mise en place.", "en": "sewage tank fails to pump water or abnormal water level in cleaning pan"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "Que faire si le seuil n'est toujours pas franchi après usage du seuil virtuel ?", "a": "Si la hauteur du seuil dépasse environ 2 cm, le seuil virtuel ne permet pas le franchissement : préparez une rampe d'accès pour aider au passage.", "en": "still fail to clear the obstacle after using the virtual rail/threshold"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "Un peu d'eau reste dans la base de lavage / le réservoir neuf", "a": "Pour garantir la qualité, nous testons l'étanchéité du réservoir avec de l'eau en production. Si le délai avant réception est court, un léger résidu n'a pas eu le temps de s'évaporer. L'usage reste parfaitement sûr.", "en": "A small amount of water remains in the newly purchased cleaning dock/water tank"},
{"m": ["S20 Ultra"], "c": "Dépannage", "q": "Un « bang » se produit après le pompage de l'eau : est-ce normal ?", "a": "Oui : le pompage comprime l'air du réservoir d'eau usée et aspire l'eau par différence de pression ; le « bang » final correspond au relâchement de cette pression. Sans inquiétude.", "en": "There is a bang sound after the water is pumped out"},
{"m": ["Tous modèles"], "c": "Dépannage", "q": "Le robot ne parvient pas à retourner à sa station de charge.", "a": "Si la recharge échoue, veuillez suivre les étapes ci-dessous pour dépanner : Veuillez vérifier si la prise de la station de recharge est desserrée et que la station n'est pas allumée ; assurez-vous que la station de recharge est allumée ; Placez la machine à 2 mètres devant la station de recharge et appuyez sur le bouton de recharge. Si la recharge ne fonctionne pas correctement, il peut s'agir d'une défaillance matérielle de la base de charge ou de l'unité principale, et demandez une réparation. Veuillez vous assurer que la base de recharge est placée comme nécessaire, sans obstacles à 0,5 mètre à gauche ou à droite et à 1,5 mètre devant. Vous pouvez vous référer au schéma de placement de la base de recharge dans le manuel ; Veuillez vous assurer que le protecteur de caméra a été retiré avant utilisation, car cela pourrait affecter la position de l'unité principale. Veuillez vérifier si la caméra est sale. Gardez la caméra propre, car la saleté peut affecter la position de l'hôte. Veuillez vérifier si le capteur de débit optique situé en bas de l'unité principale est sale. Gardez le capteur de débit optique propre, car la saleté sur ce capteur peut affecter la position de l'unité principale. Veuillez vous assurer que le nettoyage se fait dans un environnement bien éclairé, car les conditions d'obscurité peuvent affecter la position de l'appareil ; Veuillez vérifier si les roues motrices de l'unité principale glissent pendant le fonctionnement. Si trop de taches d'eau sur le sol pendant le lavage de la serpillière, cela peut glisser et affecter la position de l'unité principale ; Si les problèmes ci-dessus sont résolus, veuillez essayer de redémarrer l'unité principale puis de nettoyer à nouveau ; Si le problème persiste après le redémarrage de l'unité principale, veuillez essayer de réinitialiser l'unité principale puis de le nettoyer à nouveau ; S'il y a encore des problèmes après la réinitialisation de l'hôte, veuillez renvoyer l'hôte au siège pour analyse.", "en": ""},
{"m": ["X50 Ultra"], "c": "Dépannage", "q": "Après plusieurs tentatives infructueuses sur un seuil bas, la patte mécanique s'active pour franchir l'obstacle", "a": "Pour améliorer l'efficacité du franchissement, le robot tente d'abord de passer directement les seuils bas identifiés. Après plusieurs tentatives infructueuses, il bascule sur le franchissement par patte mécanique, qui sera ensuite utilisé pour ce seuil. La répétition des tentatives ne se produit qu'au premier passage.", "en": "After repeatedly trying to cross the low threshold, the mechanical foot was activated"},
{"m": ["X50 Ultra"], "c": "Dépannage", "q": "Bruit anormal du moteur de roue motrice pendant la cartographie rapide", "a": "Ce bruit est un bruit de roulement normal, produit par le frottement du pneu sur le sol. Il n'affecte pas le fonctionnement des roues.", "en": "During rapid mapping, abnormal noise when the driving wheel motor travels"},
{"m": ["X50 Ultra"], "c": "Dépannage", "q": "Bruit mécanique audible quand la patte mécanique se lève puis se rétracte au franchissement", "a": "Le robot franchit les obstacles au moyen d'une patte mécanique, conception très avancée. Il est normal qu'elle produise des bruits mécaniques audibles en se levant et se rétractant : le déplacement relatif entre articulations et pièces crée frottements et chocs. Ces composants ont subi des tests rigoureux ; ce bruit n'affecte ni le fonctionnement ni la durée de vie.", "en": "Noticeable sound of mechanical movement when lifting/retracting mechanical foot"},
{"m": ["X50 Ultra"], "c": "Dépannage", "q": "Des cheveux se coincent dans l'orifice d'aspiration des poussières et le conduit se bouche", "a": "Le robot aspire les poussières par une double circulation d'air (soufflage + aspiration). En présence de beaucoup de poussière mélangée, l'orifice ou le conduit peuvent retenir électrostatiquement une très petite quantité de résidus, sans incidence sur le fonctionnement. Nettoyez régulièrement l'orifice d'aspiration selon l'usage.", "en": "Hair gets stuck in the dust collection port, pipeline is blocked"},
{"m": ["X50 Ultra"], "c": "Dépannage", "q": "Dysfonctionnement du capteur LDS du robot", "a": "Vérifiez que le micrologiciel est à jour et que rien n'obstrue le capteur LDS et qu'il n'est pas déformé. Nettoyez le radar et le capot du robot. Redémarrez le robot ; si le problème persiste, contactez le service après-vente.", "en": "Robot LDS sensor malfunction"},
{"m": ["X50 Ultra"], "c": "Dépannage", "q": "Franchissement à tort : sur sol plat (obstacles mobiles), sur sol en creux, sur des chaussures", "a": "1. Des facteurs d'interférence (obstacles en mouvement) peuvent provoquer une identification erronée du seuil. 2. Vérifiez que les seuils réglés dans l'application sont exacts (seuil bien ajouté, pas de fausse manipulation). Tout obstacle atteignant la hauteur de seuil déclenche le franchissement.", "en": "Wrong obstacle crossing on flat/sunken ground, on shoes"},
{"m": ["X50 Ultra"], "c": "Dépannage", "q": "La base fait beaucoup de bruit lors de l'aspiration des poussières", "a": "La base utilise une aspiration à double orifice combinant soufflage et aspiration. Grâce à un double conduit de grand diamètre, elle collecte la poussière en 10 secondes avec une forte puissance. Vous pouvez régler la fréquence d'aspiration dans l'application et choisir le mode « confort ».", "en": "The base station has a loud sound of dust collection"},
{"m": ["X50 Ultra"], "c": "Dépannage", "q": "La marche est plus haute d'un côté : la patte mécanique s'active même côté 4 mm", "a": "Pour garantir le taux de réussite du franchissement, le robot retient la hauteur de seuil du côté le plus haut afin de choisir la méthode de franchissement.", "en": "One side meets mechanical foot condition, the other does not but still uses it"},
{"m": ["X50 Ultra"], "c": "Dépannage", "q": "La marche ne fait que ±10 mm mais la patte mécanique s'active quand même", "a": "La reconnaissance comporte une légère marge d'erreur ; pour améliorer le franchissement des seuils, nous avons assoupli les critères afin de garantir le taux de réussite.", "en": "The user's steps may only be plus or minus 10mm but the mechanical foot is still activated"},
{"m": ["X50 Ultra"], "c": "Dépannage", "q": "La patte mécanique n'arrive pas à franchir l'obstacle ou reste bloquée une fois relevée", "a": "Toutes nos excuses pour la gêne. La patte mécanique peut ne pas se soutenir ou rester bloquée si, lors du franchissement, la hauteur ou la forme du seuil dépasse ses spécifications ; côté logiciel, un conflit de programme ou une erreur de données peut aussi la bloquer. Prévention : vérifiez régulièrement l'absence de corps étrangers ou de dommages sur les éléments mécaniques et gardez le logiciel à jour. En cas de blocage : 1. Si la patte est coincée sur un seuil et ne se rétracte pas, déplacez manuellement le robot sur sol plat : il se réinitialise alors automatiquement. 2. En cas de problème logiciel bloquant après relevage, redémarrez en maintenant le bouton d'alimentation (recommencez si un seul redémarrage ne suffit pas).", "en": "The mechanical foot is unable to overcome obstacles or gets stuck after being supported"},
{"m": ["X50 Ultra"], "c": "Dépannage", "q": "La roue multidirectionnelle se détache", "a": "Vérifiez qu'un seuil ou un corps étranger ne bloque pas la roue multidirectionnelle. Réinstallez-la et observez la suite.", "en": "Universal wheel falls off"},
{"m": ["X50 Ultra"], "c": "Dépannage", "q": "Le bruit de contact au sol lors du franchissement est fort : risque pour le parquet ?", "a": "1. Un traitement anti-vibration a été appliqué au ressort de la roue multidirectionnelle pour réduire le bruit de contact ; le niveau sonore reste comparable à celui d'un robot classique. 2. L'amortissement du ressort de la roue multidirectionnelle réduit la force d'impact et protège efficacement le sol.", "en": "The sound of crossing obstacles and hitting the ground is loud"},
{"m": ["X50 Ultra"], "c": "Dépannage", "q": "Le bruit semble un peu fort (son aigu du ventilateur)", "a": "Le robot utilise une base tout-en-un à auto-nettoyage à forte puissance. Le moteur de la serpillière tourne aussi à grande vitesse lors de l'essorage, ce qui produit un bruit de fonctionnement normal. Par ailleurs, si des corps étrangers entourent le plateau de serpillière, nettoyez-le rapidement.", "en": "It sounds a bit loud (high-frequency sound from the fan)"},
{"m": ["X50 Ultra"], "c": "Dépannage", "q": "Le capot du robot est rayé", "a": "1. Vérifiez que la fonction de montée/descente automatique du radar est activée. 2. En mode « Couverture sûre », le robot abaisse le radar à 98–135 mm du sol pour passer sous les meubles : vérifiez que le dessous de vos meubles respecte cette hauteur. 3. Si le dessous du meuble est entre 89 et 98 mm, le mode « Couverture maximale » permet d'y entrer ; mais des saillies ou aspérités sous le meuble peuvent rayer le dessus du robot. Assurez-vous que le dessous du meuble est plat avant d'activer ce mode. (LDS abaissé : hauteur max 89,5 mm, hauteur robot 88 mm ; LDS relevé : hauteur max 112 mm.)", "en": "The cover of the robot is scratched"},
{"m": ["X50 Ultra"], "c": "Dépannage", "q": "Le franchissement raye-t-il le châssis ?", "a": "Un franchissement normal ne raye pas le châssis. Le robot est conçu pour franchir les obstacles tout en protégeant le châssis, réalisé dans un matériau résistant à l'usure ; le mouvement de la machine et la conception des pièces évitent les rayures. Toutefois, un objet dur très pointu ou irrégulier peut occasionner des dommages — cas rare dans un environnement domestique normal.", "en": "Will obstacle crossing scratch the chassis"},
{"m": ["X50 Ultra"], "c": "Dépannage", "q": "Le lavage de la serpillière est bruyant", "a": "Lors de l'aspiration de l'eau usée, de l'air pénètre dans le conduit et comprime l'eau, créant un gargouillis — comme quand on aspire la dernière gorgée d'une boisson à la paille. Si le sol est peu sale, réduisez la fréquence de relavage et placez la base dans une pièce peu fréquentée.", "en": "The sound of washing the cloth is loud"},
{"m": ["X50 Ultra"], "c": "Dépannage", "q": "Le robot chauffe", "a": "Le robot utilise une puce très puissante qui génère une légère chaleur, sans aucun problème de sécurité.", "en": "Robot overheating"},
{"m": ["X50 Ultra"], "c": "Dépannage", "q": "Le robot franchit mal les obstacles", "a": "Le robot présente une légère marge d'erreur lors de la reconnaissance des marches. Pour améliorer le franchissement des seuils de votre logement, nous avons assoupli les critères, afin surtout que le robot franchisse vos marches en une seule tentative.", "en": "Robot has poor obstacle crossing performance"},
{"m": ["X50 Ultra"], "c": "Dépannage", "q": "Le robot garde une certaine distance avec le seuil avant de le franchir : y a-t-il un risque d'oubli de zone ?", "a": "Après avoir nettoyé toute la zone devant le seuil, le robot procède au franchissement, sans oublier de zone.", "en": "Before crossing the obstacle, there will be a certain distance from the threshold"},
{"m": ["X50 Ultra"], "c": "Dépannage", "q": "Le robot heurte le seuil avant de le franchir", "a": "1. Il tente d'abord un franchissement normal ; s'il constate qu'il ne peut pas passer, il utilise la patte mécanique. 2. Vérifiez la position du seuil.", "en": "Before crossing the obstacle, it will hit the threshold"},
{"m": ["X50 Ultra"], "c": "Dépannage", "q": "Le robot reste bloqué", "a": "Lors du nettoyage des zones basses (sous canapés, lits…), ne vous asseyez pas sur le meuble : son dessous s'abaisserait et pourrait piéger le robot.", "en": "The Robot is trapped"},
{"m": ["X50 Ultra"], "c": "Dépannage", "q": "Mauvaise identification des seuils noirs (seuil haut jugé franchissable, seuil bas jugé infranchissable)", "a": "Mauvaise identification des seuils noirs : 1. Seuil haut (> 6 cm) pris à tort pour franchissable. 2. Seuil bas (< 4,2 cm) pris à tort pour infranchissable. La couleur noire fausse la détection ; ajustez au besoin les seuils dans l'application.", "en": "Black threshold misidentification"},
{"m": ["X60 Ultra"], "c": "Dépannage", "q": "En détectant une salissure liquide, la serpillière accélère et des gouttes éclaboussent le sol", "a": "Toutes nos excuses. Quelques gouttes au sol sont normales. Pour mieux nettoyer, le robot passe en rotation rapide lorsqu'il détecte une salissure liquide ; la force centrifuge de la serpillière expulse alors la faible quantité d'eau qu'elle contient.", "en": "Upon detecting a liquid stain, the mop increased its speed, water droplets splashing"},
{"m": ["X60 Ultra"], "c": "Dépannage", "q": "En sortant de la base, un côté du robot se soulève (probabilité : 0,28 %)", "a": "1. Vérifiez qu'aucun corps étranger n'est coincé dans les roues motrices ou les roulettes. 2. Si tout est dégagé, redémarrez le robot et réutilisez-le.", "en": "When exiting the base station, one side of the machine is tilted up"},
{"m": ["X60 Ultra"], "c": "Dépannage", "q": "Franchissement impossible quand l'écart entre marches est ≤ 45 mm / rassurer un client dont le robot ne franchit pas une pente", "a": "Notre robot franchit les obstacles grâce à des pattes mécaniques et passe généralement les marches simples de moins de 45 mm. S'il ne passe pas, vérifiez si la marche est noire ou de couleur foncée. Sinon, vous pouvez faciliter le franchissement via l'application : [Édition de la carte – Seuil – Ajouter un seuil franchissable] et [Réglages – Réglages de franchissement – Franchissement synchronisé des deux pattes].", "en": "steps distance <=45mm impossible to overcome an obstacle / cannot climb a slope"},
{"m": ["X60 Ultra"], "c": "Dépannage", "q": "Gouttes d'eau pendant le fonctionnement du robot", "a": "Toutes nos excuses. Deux causes habituelles, sans gravité : 1. Résidu de test d'usine : chaque appareil subit un test du circuit d'eau avant expédition ; un peu d'eau de test peut rester dans les conduits et goutter lors des premières utilisations sous l'effet des mouvements, puis disparaître. 2. Réhumidification normale de la serpillière : le robot réhumidifie automatiquement la serpillière pendant le lavage ; quelques gouttes peuvent occasionnellement être entraînées lors de la rotation ou des virages, mais le robot les essuie généralement en repassant en zigzag. Utilisez-le normalement 1 à 2 fois et observez. Si les gouttes persistent ou sont abondantes, contactez le SAV.", "en": "Water dripping during host operation"},
{"m": ["X60 Ultra"], "c": "Dépannage", "q": "Impossible de charger", "a": "Assurez-vous d'avoir retiré l'autocollant de protection des électrodes de charge.", "en": "Cannot charge"},
{"m": ["X60 Ultra"], "c": "Dépannage", "q": "Impossible de franchir des seuils de 42 à 80 mm", "a": "Notre robot franchit les obstacles grâce à des pattes mécaniques, ce qui en fait l'un des plus performants du marché. Sa capacité à franchir un seuil dépend toutefois de la longueur, de la largeur et de la pente de la rampe. Une pente trop raide peut faire reculer le robot pour éviter l'obstacle. Si votre seuil mesure environ 45 mm (marche simple) ou 45 à 88 mm (marche double), le franchissement peut échouer. Dans ce cas, nous recommandons l'achat d'une rampe d'accès pour faciliter le passage.", "en": "42mm-80mm steps cannot be crossed"},
{"m": ["X60 Ultra"], "c": "Dépannage", "q": "La patte mécanique s'emmêle dans un corps étranger", "a": "Toutes nos excuses pour la gêne. Le robot dispose de pattes mécaniques côté roues motrices. Lorsqu'il détecte un seuil supérieur à 20 mm (mais inférieur à 45 mm), il relève les pattes pour franchir l'obstacle. Si les pattes ne se rétractent pas à temps, une alerte d'enroulement peut apparaître. Éteignez et redémarrez l'appareil, replacez-le sur la base et redémarrez de nouveau, puis observez.", "en": "Mechanical foot entangles foreign object"},
{"m": ["X60 Ultra"], "c": "Dépannage", "q": "La serpillière déborde de la zone balayée", "a": "Inutile de vous inquiéter des oublis : lors du nettoyage des bords, la serpillière s'étend vers l'extérieur pour couvrir les angles ; lors du nettoyage en zigzag, elle repasse sur les zones précédemment manquées.", "en": "The rag was placed outside the sweeping area"},
{"m": ["X60 Ultra"], "c": "Dépannage", "q": "Le bruit de contact avec le sol au franchissement est fort : risque pour le parquet ?", "a": "Rassurez-vous, le robot n'abîme pas le sol au franchissement. La base comporte des patins amortisseurs en contact avec les petits axes, ce qui réduit la force d'impact, le bruit et les vibrations.", "en": "The sound of hitting the ground when it crossed the obstacle was loud"},
{"m": ["X60 Ultra"], "c": "Dépannage", "q": "Le châssis se soulève anormalement", "a": "Vérifiez d'abord qu'aucun corps étranger n'est enroulé autour du châssis et retirez-le le cas échéant. Sinon, placez le robot dans une zone dégagée et redémarrez-le. Si le problème persiste, contactez le service client afin de le remonter au bureau d'études (R&D).", "en": "Abnormal chassis lifting"},
{"m": ["X60 Ultra"], "c": "Dépannage", "q": "Le robot émet des bruits anormaux", "a": "Si le robot émet des bruits anormaux en fonctionnement : 1. Retirez la brosse latérale, le capot de la brosse rouleau et la brosse rouleau (ou la serpillière) sous l'appareil, puis mettez-le en marche et observez. Si le bruit redevient normal : a) installez d'abord la brosse latérale et démarrez ; en cas de bruit, vérifiez qu'elle n'est pas déformée ; b) si le bruit apparaît après avoir remis la brosse rouleau, démontez le capot et la brosse, vérifiez que les embouts latéraux ne sont pas entourés de cheveux et nettoyez-les, contrôlez l'absence de corps étranger dans la rainure, puis remontez le capot en clipsant bien les deux côtés ; c) sur tapis d'éveil ou moquette souple, le robot s'enfonce légèrement et la brosse descend plus profondément : elle peut frotter la surface et générer du bruit, ce qui est normal. Si le bruit persiste après démontage : 1. robot éteint, appuyez des deux côtés de la roue motrice et faites-la coulisser pour vérifier qu'elle tourne et revient bien en place, puis nettoyez-la ; 2. faites tourner les roulettes pour vérifier qu'elles tournent librement, sinon nettoyez-les ; 3. si vous avez lavé le filtre du bac à poussière, séchez-le complètement avant réutilisation, car un filtre humide peut provoquer des bruits anormaux.", "en": "Mainly playing different sounds / abnormal noise"},
{"m": ["X60 Ultra"], "c": "Dépannage", "q": "Les contacts de charge noircissent ou jaunissent", "a": "Noircissement : pour garantir une bonne conductivité, les électrodes de charge sont argentées en surface. L'argent réagit avec les traces de sulfure d'hydrogène (H₂S) présentes dans l'air (pollution, caoutchouc, déjections animales…) et forme du sulfure d'argent (Ag₂S), de couleur gris-noir. C'est normal et sans incidence sur le fonctionnement. Jaunissement : de même, à une certaine température, il se forme de l'oxyde d'argent (Ag₂O), de couleur brun-noir. L'arc électrique et la chaleur pendant la charge favorisent cette réaction. C'est également normal et sans conséquence.", "en": "Charging contacts turn black/yellow"},
{"m": ["X60 Ultra"], "c": "Dépannage", "q": "Nettoyage insuffisant", "a": "Le robot propose un mode de nettoyage intelligent piloté et un nettoyage personnalisé pour répondre à divers besoins : 1. Lors des premières utilisations, le sol peut être très sale et le robot nettoie des zones inaccessibles manuellement, d'où beaucoup de poussière au premier passage. Dans [Mode personnalisé – Réglages d'auto-nettoyage], choisissez le nettoyage de petites zones pour un passage, puis passez aux grandes zones après quelques utilisations. 2. Utilisez le mode « ultime » du nettoyage intelligent piloté : passage plus dense et plus lent dans toute la maison. La poussière diminue avec le temps. 3. Vous pouvez aussi utiliser le mode « aspiration puis lavage » et ajuster la puissance d'aspiration et la fréquence de nettoyage.", "en": "Not clean"},
{"m": ["X60 Ultra"], "c": "Dépannage", "q": "Rayures sur le capot supérieur du robot", "a": "En mode « Couverture maximale », le robot abaisse automatiquement sa hauteur pour nettoyer sous les meubles bas (lits, canapés). Or certains environnements présentent des éléments saillants au sol ou au plafond (clous mal enfoncés, goulottes de câbles cachées). Avant d'activer cette fonction, vérifiez rapidement l'absence de saillies évidentes au sol ou au plafond, ou marquez temporairement ces zones comme « interdites ».", "en": "Scratches on the top cover of the main unit"},
{"m": ["X60 Ultra"], "c": "Dépannage", "q": "Zones oubliées lors du scan", "a": "Toutes nos excuses. En cas de zones oubliées, vérifiez : 1. Le robot n'entre pas dans les espaces trop étroits : il passe au-delà de 38 cm ; en deçà, cela dépend de votre environnement. 2. Pour les robots à détection de moquette par ultrasons, en mode lavage avec évitement des tapis activé, le robot peut ne pas entrer dans une pièce s'il détecte un tapis à l'entrée : retirez le tapis et réessayez. 3. La superposition de cartes peut fausser le positionnement : refaites la cartographie. 4. Des obstacles à l'entrée (chaussons, câbles…) sont évités : dégagez le sol au préalable. 5. Seuil trop haut : le robot franchit 4,5 cm en simple couche et 8,8 cm en double couche ; au-delà, il ne passe pas. 6. Autour d'un obstacle, le robot nettoie en le contournant ; quelques oublis à proximité immédiate sont normaux. 7. Nettoyez régulièrement l'objectif binoculaire : sale, il peut interpréter la zone devant lui comme un obstacle et l'éviter.", "en": "Missed scan"},
{"m": ["Z10 Pro"], "c": "Dépannage", "q": "Comment utilisez-vous la poubelle à poussière ?", "a": "R : Placez le bac à poussière contre le mur sur un sol plat, en veillant à ce qu'il y ait au moins 0,5 mètre de place de chaque côté du bac, puis connectez la prise à la prise électrique. Pour une meilleure expérience client mobile, placez la poubelle dans la couverture Wi-Fi. Remarque : Ne placez pas le bac à poussière en plein soleil ni ne couvrez la zone d'identification du bac avec un objet, car cela pourrait empêcher l'unité principale de revenir automatiquement dans le bac.", "en": ""},
{"m": ["Z10 Pro"], "c": "Dépannage", "q": "Le bac à poussière consomme-t-il de l'électricité en permanence ?", "a": "R : Lorsque l'unité principale est constamment dans la poubelle, celle-ci alimente l'unité principale. En mode veille, la consommation d'énergie est extrêmement faible, et à ce moment-là, la batterie entre en veille pour maintenir des performances optimales.", "en": ""},
{"m": ["Z10 Pro"], "c": "Dépannage", "q": "Les aspirateurs ont des fonctions anti-peluches, alors pourquoi s'emmêlent-ils encore ?", "a": "R : L'aspirateur robot possède une rangée de peignes dentés à l'intérieur de la chambre de la brosse à rouleau. Ces peignes peuvent grandement réduire l'emmêlement des cheveux, mais dans les cas avec plus de poils, des emmêlements peuvent toujours survenir. Veuillez nettoyer manuellement.", "en": ""},
{"m": ["Z10 Pro"], "c": "Dépannage", "q": "Que faire si les taches tenaces ne peuvent pas être enlevées pendant le lavage ?", "a": "R : Les taches tenaces ne peuvent pas être enlevées lors du lavage de l'unité principale ; une assistance manuelle est nécessaire.", "en": ""},
{"m": ["Z10 Pro"], "c": "Dépannage", "q": "Que faut-il faire si le sol devient de plus en plus sale à mesure que vous le passez ?", "a": "R : Si le sol est très sale, veuillez nettoyer régulièrement le chiffon lors du passage à la serpillière.", "en": ""},
{"m": ["Z10 Pro"], "c": "Dépannage", "q": "À quelle hauteur l'hôte peut franchir les obstacles ?", "a": "R : L'unité principale peut traverser des obstacles pouvant atteindre 20 mm de haut.", "en": ""},
{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra"], "c": "Info produit", "q": "Le robot dispose-t-il d'une protection contre la surcharge des moteurs ?", "a": "Oui. Tous les moteurs embarqués sont protégés contre la surcharge (module d'aspiration, brosse principale, brosse latérale, roue motrice). La protection s'active en cas d'obstruction sévère par des débris ou corps étrangers.", "en": "Does it have a motor overload protection?"},
{"m": ["D10 Plus", "D10s"], "c": "Info produit", "q": "Le robot peut-il fonctionner dans un environnement peu éclairé ?", "a": "Oui.", "en": "Can it operate in the low-light environment?"},
{"m": ["D10 Plus"], "c": "Info produit", "q": "Le robot peut-il nettoyer les espaces étroits ?", "a": "La largeur minimale de passage est de 38 cm. Les espaces plus étroits ne peuvent pas être nettoyés.", "en": "Can it clean narrow spaces?"},
{"m": ["D10 Plus", "D10s", "L10s Ultra"], "c": "Info produit", "q": "Pourquoi le robot utilise-t-il une seule brosse latérale plutôt que deux ?", "a": "Le robot utilise une brosse latérale unique + la brosse principale. La brosse latérale nettoie les déchets près des murs et bords de meubles. Une double brosse a tendance à disperser les déchets au nettoyage et à s'emmêler davantage sur les tapis.", "en": "Why does it use a single-sided brush instead of a double-sided brush?"},
{"m": ["D10 Plus", "D10s", "L10s Ultra"], "c": "Info produit", "q": "Puis-je nettoyer des tapis avec le robot ?", "a": "Le robot peut nettoyer certains tapis à poils courts ou moyens. Les tapis trop longs risquent d'être aspirés dans le bac, et la brosse latérale et les roues motrices de se coincer. Définissez aussi une « zone interdite de balayage » pour éviter de mouiller le tapis.", "en": "Can I use it to clean carpets?"},
{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra"], "c": "Info produit", "q": "Qu'est-ce que la navigation laser LDS ?", "a": "La navigation laser LDS mesure la position relative des limites et du robot en émettant un laser invisible et en recevant la lumière réfléchie. Elle en déduit la position du robot sur la carte et construit une carte de nettoyage complète. Le robot est équipé d'un lidar professionnel qui scanne jusqu'à 2 080 points par seconde, avec une portée de 8 m et une précision de 10 mm.", "en": "What is LDS laser navigation?"},
{"m": ["D10 Plus"], "c": "Info produit", "q": "Que signifie le voyant d'état de la base à vidage automatique ?", "a": "Blanc : base branchée. Blanc pulsé : robot en charge. Orange clignotant : sac à poussière plein / non installé / erreur.", "en": "What is the meaning of the status indicator in the Auto-Empty Base?"},
{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra"], "c": "Info produit", "q": "Quel est l'avantage de la navigation laser LDS ?", "a": "La navigation laser LDS crée la carte plus vite et localise plus précisément que le vSLAM, et prend en charge davantage d'options de gestion de carte.", "en": "What is the advantage of the LDS laser navigation?"},
{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra"], "c": "Info produit", "q": "Quelle batterie utilise le robot ?", "a": "Une batterie lithium-polymère haute performance de 5 200 mAh.", "en": "What battery does it use?"},
{"m": ["D10 Plus", "D10s"], "c": "Info produit", "q": "Quelle est la hauteur maximale d'obstacle franchissable ?", "a": "Le robot franchit des obstacles jusqu'à 20 mm de haut (moins avec le réservoir d'eau installé). La hauteur maximale diminue aussi sur sol glissant.", "en": "What is the max height of obstacles it can cross?"},
{"m": ["D10 Plus", "D10s", "L10s Ultra"], "c": "Info produit", "q": "À quoi servent les boutons du robot et comment les utiliser ?", "a": "Reportez-vous à la notice du produit, qui détaille la fonction de chaque bouton (marche/nettoyage, base, nettoyage local, etc.).", "en": "What are those buttons on the robot vacuum for?"},
{"m": ["D10s Pro"], "c": "Info produit", "q": "Le robot peut-il fonctionner dans un environnement peu éclairé ?", "a": "Oui, le capteur laser LDS n'est pas affecté par la lumière. En revanche, l'évitement d'obstacles est dégradé : privilégiez un éclairage suffisant.", "en": "Can the robot operate in the low-light environment?"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Info produit", "q": "Le robot peut-il fonctionner dans un environnement peu éclairé ?", "a": "Oui : le capteur laser LDS n'est pas affecté par la lumière.", "en": "Can the host operate in a dimly lit environment?"},
{"m": ["E40 Ultra"], "c": "Info produit", "q": "Est-il normal que le robot dégoutte parfois de l’eau pendant le lavage du sol ?", "a": "Le robot détermine la hauteur de la zone à nettoyer pour décider s’il peut y entrer. Il peut entrer et nettoyer les zones dont la hauteur est d’au moins 10 cm. \n1. Vérifiez la hauteur des zones à faible hauteur chez vous. Si elle est inférieure à 10 cm, le robot ne peut pas y entrer pour nettoyer. \n2. Lorsque la zone de nettoyage est d’au moins 10 cm, vérifiez sur la carte si le robot a correctement identifié la zone à faible hauteur. Si le robot n’a pas marqué la zone à faible hauteur sur la carte, ajoutez-la dans la section d’édition de cartes, puis relancez la tâche pour réessayer. \n3. Lorsque la zone de nettoyage est d’au moins 10 cm et que le robot n’y entre toujours pas pour nettoyer, accédez à la page des paramètres. Sélectionnez « Couverture extrême » sous « Levage automatique du LDS » et définissez la fréquence de nettoyage pour la zone de nettoyage. En mode Lavage du sol quotidien, le robot entre dans les zones à faible hauteur pour les nettoyer une fois tous les 7 jours.", "en": ""},
{"m": ["E40 Ultra"], "c": "Info produit", "q": "Pourquoi l'évitement des obstacles est-il peu performant ?", "a": "Notre robot prend uniquement en charge les réseaux Wi-Fi 2,4 G et non les réseaux Wi-Fi 5 G. Vous pouvez effectuer les vérifications simples suivantes : \n 1. Lors de la configuration du réseau, placez le robot dans une zone bénéficiant d'un signal Wi-Fi puissant. \n 2. Avant de configurer le réseau, assurez-vous que la localisation est activée sur votre téléphone et que l'application est autorisée à utiliser les services de localisation. \n 3. Lors de la connexion au point d'accès du robot, attendez l'invite vocale avant de revenir à l'application pour obtenir le résultat de la configuration réseau.\n 4. Nous vous recommandons de définir le nom et le mot de passe du Wi-Fi domestique uniquement avec des lettres ou des chiffres anglais. \n 5. L'échec de la connexion peut également être lié au modèle de téléphone. Essayez d'utiliser un autre téléphone pour vous connecter. \n Si aucune des méthodes ci-dessus ne fonctionne, vous pouvez utiliser un autre téléphone pour créer un point d'accès et configurer le réseau.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Info produit", "q": "3. Qu'est-ce que la technologie LDS/navigation laser ?", "a": "R : La technologie de navigation laser LDS mesure la position relative de la frontière et du corps de la machine en émettant un laser invisible et en recevant la lumière réfléchie. Sur cette base, la position de la machine sur la carte est déterminée lors du dessin d'une carte de frontière complète. Le robot de balayage et de serpillière est équipé de capteurs LiDAR professionnels, capables de scanner à 2080 points par seconde, avec une distance de balayage allant jusqu'à 8 mètres et une précision de balayage de 10 millimètres, permettant une cartographie et une navigation rapides et précises.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Info produit", "q": "L'hôte peut-il opérer dans des environnements faiblement éclairés ?", "a": "Il peut courir. Les capteurs laser LDS ne sont pas affectés par la lumière.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Info produit", "q": "Qu'est-ce qui peut provoquer une défaillance de la distribution réseau, et comment cela doit-il être géré ?", "a": "R :  La configuration hôte ne prend en charge que les réseaux Wi-Fi 2,4G et ne prend pas en charge. 1. Veuillez vous assurer que l'unité principale et le téléphone sont proches du routeur, et assurer un bon signal Wi-Fi. 2. Lors de la connexion au point d'accès libéré par l'hôte, après avoir entendu l'annonce vocale de l'hôte, retournez dans l'application et attendez le résultat de configuration réseau. 3. Avant de configurer le réseau, assurez-vous que les autorisations de localisation de l'application sont activées ; le défaut d'activation des autorisations entraînera une échouement de la configuration réseau. 4. Si la configuration réseau échoue toujours, essayez de redémarrer l'hôte et le routeur. Si le problème n'est pas résolu, veuillez contacter rapidement Dreame After-Sales.", "en": ""},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Info produit", "q": "Comment expliquer les marques de contrainte, lignes de collage et lignes de bridage sur le robot ?", "a": "Il s'agit d'une texture naturelle formée par le moulage par injection à haute température du matériau. L'usage est parfaitement sûr.", "en": "How to explain the robot with stress marks, bonding lines, and clamping lines?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Info produit", "q": "Comment savoir s'il y a de l'eau chaude ?", "a": "Lancez l'auto-nettoyage de la base : elle utilise de l'eau chaude durant ce cycle. Vous pouvez le vérifier avec une brosse (ne touchez pas avec les mains pour éviter les brûlures).", "en": "How do users perceive whether there is hot water?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "S20 Ultra", "X40 Ultra"], "c": "Info produit", "q": "L'activation de la vidéo porte-t-elle atteinte à ma vie privée ?", "a": "Nos produits garantissent la sécurité au niveau du système et du réseau : au niveau firmware — port de débogage fermé par défaut, protection anti-flash (seul un firmware avec la même clé peut être installé), démarrage sécurisé avec vérification du système de fichiers, bouton de débogage désactivé au démarrage. Au niveau réseau — contrôle anti-injection empêchant la transmission de commandes d'attaque, et authentification d'identité pour la connexion au serveur.", "en": "Will turning on a video infringe on my privacy?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Info produit", "q": "L'historique des conversations collecte-t-il mon audio d'origine ?", "a": "Votre audio est protégé de trois façons : 1. L'historique n'enregistre que les propos adressés au robot après réveil ; Dreame ne conserve que le texte transcrit, chiffré, et aucun fichier audio n'est stocké sur ses serveurs. 2. Dreame n'analyse que le texte désensibilisé, pas l'audio d'origine. 3. Dreame n'accède à l'historique de votre compte pour analyse qu'avec votre autorisation, afin de résoudre un problème précis.", "en": "Will the conversation record collect my original audio?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Info produit", "q": "La fonction vocale écoute-t-elle mes conversations et porte-t-elle atteinte à ma vie privée ?", "a": "Tant que le robot n'est pas réveillé, il n'enregistre aucun de vos propos. Après réveil, seuls vos mots sont transcrits en texte et stockés chiffrés dans votre historique de conversations.", "en": "Will the voice function eavesdrop on my talk?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Info produit", "q": "Le robot peut-il fonctionner dans l'obscurité ?", "a": "Oui : les capteurs laser LDS et laser linéaire ne sont pas affectés par la lumière. La reconnaissance visuelle IA peut être réduite dans le noir, mais le robot dispose d'un éclairage d'appoint activable dans l'application (Gestion du robot → Éclairage d'appoint).", "en": "Can the robot run in a dark environment?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Info produit", "q": "Le robot peut-il fonctionner sans réseau ?", "a": "Oui, le robot fonctionne normalement sans réseau : vous pouvez le piloter par les boutons ou par commandes vocales (il reconnaît une partie des commandes vocales même hors ligne).", "en": "Can the robot be operated without networking?"},

{"m": ["S20 Ultra"], "c": "Info produit", "q": "La fonction vocale écoute-t-elle mes conversations ?", "a": "Tant que le robot n'est pas réveillé, il n'enregistre aucun de vos propos. Après réveil, seuls vos mots sont transcrits en texte et stockés chiffrés dans votre historique ; aucun fichier audio n'est conservé sur les serveurs.", "en": "Will the voice function eavesdrop on my conversation?"},
{"m": ["S20 Ultra"], "c": "Info produit", "q": "Le robot peut-il fonctionner dans un environnement peu éclairé ?", "a": "Oui : les capteurs laser LDS et laser linéaire ne sont pas affectés par la lumière. La reconnaissance visuelle IA peut être réduite dans le noir, mais le robot dispose d'un éclairage d'appoint activable dans l'application (Gestion du robot → Éclairage d'appoint).", "en": "Can the console operate in a low-light environment?"},

{"m": ["X50 Ultra"], "c": "Info produit", "q": "Quelle hauteur le LDS atteint-il une fois abaissé ?", "a": "98 à 120 mm.", "en": "What height can LDS reach after descending?"},
{"m": ["Z10 Pro"], "c": "Info produit", "q": "Qu'est-ce qui cause les défaillances du repositionnement de l'hôte ?", "a": "R :  Déplacer l'hôte vers des zones qui n'ont pas été nettoyées auparavant provoquera des échecs de repositionnement. Veuillez essayer de le déplacer vers des zones déjà nettoyées. Lorsque l'hôte est repositionné, quelqu'un se tient à côté. Essayez de ne pas vous tenir à côté de l'unité principale, et assurez-vous que la caméra capture parfaitement les points caractéristiques en haut de la pièce. Lors du repositionnement de l'unité principale, l'éclairage est tamisé ; veuillez vous assurer d'un éclairage suffisant avant de le repositionner.", "en": ""},
{"m": ["D10 Plus", "L10s Ultra"], "c": "Fonctions & réglages", "q": "Comment connecter le robot à l'application Dreamehome ou Mi Home ?", "a": "1. Scannez le QR code pour télécharger l'application Dreamehome ou Mi Home. 2. Ajout de l'appareil : dans l'application, appuyez sur « + » en haut à droite, scannez le QR code et sélectionnez le modèle, puis suivez les instructions pour la connexion Wi-Fi. 3. Réinitialisation Wi-Fi : maintenez simultanément les deux boutons jusqu'à l'annonce « en attente de configuration réseau » ; quand le voyant Wi-Fi clignote lentement, la connexion est réussie.", "en": "How to connect robot with Dreamehome or Mi Home App?"},
{"m": ["D10 Plus", "D10s", "D10s Pro"], "c": "Fonctions & réglages", "q": "Comment démarrer un nettoyage ?", "a": "Appuyez sur le bouton d'alimentation pour lancer le nettoyage. Appuyez sur n'importe quel bouton pendant le nettoyage pour le mettre en pause. NB : le robot ne fonctionne pas si la batterie est trop faible, chargez-le avant. Si le nettoyage dure moins de 10 minutes, le robot le refait deux fois par défaut.", "en": "How to start cleaning?"},
{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra"], "c": "Fonctions & réglages", "q": "Comment empêcher le robot de nettoyer le tapis ?", "a": "Définissez une zone interdite autour du tapis dans l'application : le robot l'évitera pendant le nettoyage.", "en": "How to prevent the robot vacuum from cleaning the carpet?"},
{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra"], "c": "Fonctions & réglages", "q": "Comment enregistrer une carte ?", "a": "Robot en charge sur la base, lancez l'application Dreamehome et démarrez un nettoyage : le robot apprend son environnement et construit une carte complète après quelques tâches. Ouvrez toutes les portes des pièces pendant le nettoyage pour une carte cohérente et complète.", "en": "How to save a map?"},
{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra"], "c": "Fonctions & réglages", "q": "Comment le robot nettoie-t-il toute la maison ?", "a": "Au premier démarrage, le robot longe d'abord les bords d'une zone de 4,5 × 4,5 m, puis nettoie l'intérieur en zigzag jusqu'à couvrir la zone, avant de passer aux autres pièces selon le même principe. Une fois la carte générée, il nettoie pièce par pièce (bords d'abord, puis zigzag), ce qui évite les oublis, puis retourne automatiquement à la base.", "en": "How does it clean up the entire house?"},
{"m": ["D10 Plus", "D10s", "D10s Pro"], "c": "Fonctions & réglages", "q": "Comment mettre à jour le micrologiciel ?", "a": "Via l'application Mi Home ou Dreamehome (robot sur la base, batterie > 15 %). Les deux boutons du robot clignotent rapidement pendant toute la procédure.", "en": "How should I upgrade the firmware?"},
{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra"], "c": "Fonctions & réglages", "q": "Comment programmer un nettoyage ?", "a": "Réglez le nettoyage programmé dans l'application : le robot démarre automatiquement à l'heure définie et retourne à la base une fois terminé.", "en": "How to use the scheduled clean-up feature?"},
{"m": ["D10 Plus", "D10s", "D10s Pro"], "c": "Fonctions & réglages", "q": "Comment restaurer les réglages d'usine ?", "a": "Si le robot ne fonctionne toujours pas normalement après un redémarrage, maintenez le bouton de réinitialisation avec un outil jusqu'à l'annonce « début de restauration des réglages d'usine ».", "en": "How to restore to factory settings?"},
{"m": ["D10 Plus", "D10s", "L10s Ultra"], "c": "Fonctions & réglages", "q": "Comment régler l'humidité de la serpillière ?", "a": "Lancez l'appareil via l'application Dreamehome et réglez l'humidité de la serpillière dans le mode de nettoyage.", "en": "How to adjust the humidity of the mop pod?"},
{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra"], "c": "Fonctions & réglages", "q": "Comment réinitialiser le Wi-Fi du robot ?", "a": "Ouvrez le capot supérieur et repérez le voyant Wi-Fi. Maintenez les boutons « Nettoyage local » et « Base » jusqu'à l'annonce « en attente de configuration réseau ». Quand le voyant Wi-Fi recommence à clignoter lentement, la réinitialisation a réussi.", "en": "How to reset Wi-Fi with Dreame robot?"},
{"m": ["D10 Plus", "L10s Ultra"], "c": "Fonctions & réglages", "q": "Comment utiliser la base à vidage automatique ?", "a": "Placez la base sur un sol plat contre un mur et branchez-la. Posez le robot dessus pour le charger : il s'allume et se charge automatiquement. Chargez-le complètement avant la première utilisation. NB : ne bloquez pas la zone de signal ; pour éviter les traces d'eau sur parquet ou tapis, posez la base sur du carrelage ou du marbre.", "en": "How to use the Auto-Empty Base?"},
{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra"], "c": "Fonctions & réglages", "q": "Comment utiliser la fonction Nettoyage local (Spot Clean) ?", "a": "Robot en pause ou en veille, maintenez le bouton 3 secondes pour lancer le mode Nettoyage local : il nettoie une zone carrée de 1,5 × 1,5 m autour de lui, puis revient à sa position d'origine et s'éteint. NB : activer ce mode met fin à la tâche de nettoyage en cours.", "en": "How to use the Spot Clean function?"},
{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra"], "c": "Fonctions & réglages", "q": "Comment utiliser la fonction de carte avancée ?", "a": "Lancez l'application, démarrez un nettoyage : le robot apprend son environnement et construit une carte complète, où vous pouvez accéder au découpage automatique en zones, à l'édition de zones, au nettoyage par zone, au nettoyage désigné, au mur virtuel et à d'autres fonctions.", "en": "How to use the Advanced Map function?"},
