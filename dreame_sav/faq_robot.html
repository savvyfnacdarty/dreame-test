{"m": ["S20 Ultra"], "c": "Consommables & entretien", "q": "Odeur désagréable dans le réservoir d'eau usée et la base", "a": "1. Sol sale : après chaque usage, videz et rincez rapidement le réservoir d'eau usée. 2. Nettoyez régulièrement le bac de lavage (toutes les 2 à 3 utilisations de la fonction lavage).", "en": "peculiar smell in the robot's sewage tank and base"},
{"m": ["S20 Ultra"], "c": "Consommables & entretien", "q": "Pourquoi l'électrode du capteur de débordement du bac de lavage est-elle rouillée ?", "a": "Il s'agit d'une oxydation d'anode, et non d'une rouille classique : cette tache s'enlève normalement en l'essuyant avec un chiffon.", "en": "Why are the cleaning pan overflow sensor electrodes rusty?"},
{"m": ["S20 Ultra"], "c": "Consommables & entretien", "q": "Pourquoi le robot lave-t-il d'abord sans eau, ou de plus en plus sec ? (pas d'eau les 5 premières minutes)", "a": "Au départ de la base, la serpillière est assez humide. Après un premier lavage de 5 minutes, elle atteint un état stable, puis le robot réhumidifie pour maintenir l'équilibre d'eau global.", "en": "Why doesn't water come out when the robot starts mopping?"},
{"m": ["S20 Ultra"], "c": "Consommables & entretien", "q": "Pourquoi les performances de nettoyage baissent-elles ou y a-t-il des fuites de poussière ?", "a": "1. Bac à poussière plein ou filtre colmaté : nettoyez le bac et le filtre à temps, et activez l'aspiration automatique. 2. Brosse principale entourée de corps étrangers : nettoyez-la. 3. Orifice d'aspiration obstrué : dégagez-le.", "en": "reasons why cleaning ability is reduced or dust leakage occurs"},
{"m": ["S20 Ultra"], "c": "Consommables & entretien", "q": "Quelle quantité de nettoyant est ajoutée à chaque fois ?", "a": "Le nettoyant est dosé automatiquement, environ 1 à 2 ml à chaque fois.", "en": "How much cleaning fluid should be added at one time?"},
{"m": ["S20 Ultra"], "c": "Consommables & entretien", "q": "Reste-t-il des traces ou de grandes taches d'eau après le lavage du sol ?", "a": "Après le lavage, l'eau au sol s'évapore et quelques traces subsistent ; leur visibilité dépend beaucoup du revêtement et de l'éclairage. Au début, le sol peut être sale et le robot ramène beaucoup de poussière au premier passage. Utilisez le mode « aspiration puis lavage » ou le lavage petite surface ; après quelques usages, le sol devient plus propre et les traces moins visibles. Un nettoyant dédié rend le carrelage plus propre et brillant.", "en": "Are there water marks and marks after mopping the floor (large water stains)?"},
{"m": ["S20 Ultra"], "c": "Consommables & entretien", "q": "Résidus de particules sur la plaque d'extension / le bac se remplit vite au premier usage", "a": "Le robot dispose de l'aspiration automatique des poussières. Si votre logement est grand ou lors du premier usage (le robot ramène plus de poussière en nettoyant des zones inaccessibles manuellement), lancez une aspiration manuelle ou réglez la fréquence sur « quotidien ». Programmez aussi un nettoyage automatique quotidien : la poussière diminuera et le sol deviendra plus propre.", "en": "Extension board garbage residual particles / dust box easy to fill first time"},
{"m": ["X50 Ultra"], "c": "Consommables & entretien", "q": "Comment installer la double brosse rouleau anti-emmêlement", "a": "Des repères d'installation figurent sur le capot de la brosse. Un « clic » confirme la bonne mise en place. Une installation incorrecte peut empêcher la brosse de tourner.", "en": "How to install anti winding double roller brush"},
{"m": ["X50 Ultra"], "c": "Consommables & entretien", "q": "Cycle de remplacement de l'anti-tartre et conseils", "a": "Le cycle de remplacement de l'anti-tartre est de 18 à 36 mois selon l'usage.", "en": "Replacement cycle and suggestions for scale inhibitors"},
{"m": ["X50 Ultra"], "c": "Consommables & entretien", "q": "L'usage d'un nettoyant d'une autre marque peut provoquer une panne fonctionnelle", "a": "Pour garantir le bon fonctionnement et les performances de l'appareil, il est déconseillé d'utiliser un nettoyant d'une autre marque. Un nettoyant non compatible peut faire dysfonctionner le système de dosage automatique, voire boucher les conduites d'eau, et dégrader l'expérience.", "en": "Using Cleansing Fluid from other brands may result in functional failure"},
{"m": ["X50 Ultra"], "c": "Consommables & entretien", "q": "La brosse rouleau est bloquée par un corps étranger", "a": "La brosse principale a une structure conique qui tourne et entraîne poussières et débris vers l'intérieur. Toutefois, de gros objets durs (gros déchets, câbles…) peuvent la bloquer. Contrôlez et nettoyez régulièrement la brosse rouleau, surtout en présence de nombreux cheveux : l'embout d'extrémité peut être retiré pour ôter les cheveux emmêlés. Vérifiez régulièrement l'absence de corps étrangers.", "en": "The roller brush is stuck by foreign objects"},
{"m": ["X50 Ultra"], "c": "Consommables & entretien", "q": "La double brosse rouleau anti-emmêlement retient des cheveux", "a": "En cas de faible quantité de cheveux emmêlés, nettoyez le bac à poussière ou remplacez son filtre à temps. Suivez les consignes d'entretien pour une maintenance régulière.", "en": "Anti entanglement dual roller brush wraps hair"},
{"m": ["X50 Ultra"], "c": "Consommables & entretien", "q": "La serpillière se détache et ne se relève pas", "a": "1. Il est normal que le plateau de serpillière ne puisse pas être installé robot éteint : une fois le robot allumé, le manchon du plateau se déploie automatiquement et vous pouvez le remettre. 2. Assurez-vous que la serpillière est bien fixée avant le travail ; si elle ne tient plus ou est déformée après plusieurs usages, remplacez-la. 3. En franchissant tapis, seuils ou petites marches, le plateau peut se coincer et se détacher : définissez une zone de lavage dédiée pour éviter que le robot n'y entre avec la serpillière, et rangez les câbles au sol avant le nettoyage. 4. Dans « Réglages de nettoyage » de l'application, choisissez le mode « aspiration puis lavage » ; certains modèles gèrent le montage/démontage automatique de la serpillière. En cas d'anomalie, redémarrez le robot.", "en": "The mop falls off and does not lift"},
{"m": ["X50 Ultra"], "c": "Consommables & entretien", "q": "Le filtre du plateau de lavage est difficile à installer", "a": "Pour le retirer, tirez-le fermement en diagonale vers le haut. Pour l'installer, appuyez fermement jusqu'à entendre un « clic » confirmant la mise en place.", "en": "It is difficult to install the cleaning disk filter"},
{"m": ["X50 Ultra"], "c": "Consommables & entretien", "q": "Le filtre est sale et difficile à nettoyer", "a": "Contrôlez et entretenez régulièrement le filtre du plateau de lavage. De la poussière et de la saleté peuvent s'accumuler sous ce filtre : déclenchez « auto-nettoyage de la base » dans l'application et nettoyez le dessous avec la brosse fournie.", "en": "The filter is dirty and difficult to clean"},
{"m": ["X50 Ultra"], "c": "Consommables & entretien", "q": "Le robot ne lave pas bien le sol / le débit d'eau au lavage est faible", "a": "Le robot propose un mode intelligent piloté et un nettoyage personnalisé adaptés à divers cas : 1. Sol encore sale au début : dans « Mode personnalisé – Réglages d'auto-nettoyage », choisissez le relavage petite surface, puis passez à la grande surface après quelques usages. 2. Utilisez le mode « ultime » du mode intelligent piloté : passages plus denses et plus lents dans toute la maison pour un résultat plus propre ; la poussière diminue avec le temps. 3. Vous pouvez aussi personnaliser le mode « aspiration puis lavage » et ajuster la puissance d'aspiration et la fréquence de lavage.", "en": "What should I do if robot can't mop the floor clean? / water used is small"},
{"m": ["X50 Ultra"], "c": "Consommables & entretien", "q": "Les taches tenaces (sauce soja…) ne partent pas : ajuster le débit d'eau", "a": "Plusieurs cas de lavage insuffisant : 1. Sol encore sale au début : utilisez le réglage petite surface / relavage, ou activez le relavage automatique ; après quelques usages, passez au réglage grande surface. 2. Sol très sale : lancez le « lavage immédiat de la serpillière » dans l'application en cours de travail. 3. Après avoir nettoyé des salissures très sales, ou après 2 à 4 semaines d'usage, retirez et lavez la serpillière à la main. 4. Utilisez un nettoyant Dreame dédié pour améliorer le résultat.", "en": "Soy sauce stains cannot be wiped clean, adjust the water volume"},
{"m": ["X50 Ultra"], "c": "Consommables & entretien", "q": "Résidus de déchets dans le bac à poussière", "a": "Nettoyez régulièrement le bac à poussière. Le bac et le filtre sont lavables à l'eau, mais doivent sécher plus de 24 heures. Un nettoyage manuel régulier est recommandé.", "en": "Residual garbage in the dustbin"},
{"m": ["X60 Ultra"], "c": "Consommables & entretien", "q": "Cheveux coincés dans le bac à poussière", "a": "Même problème que sur la génération précédente : retirez les cheveux et nettoyez le bac.", "en": "Dust box stuck with hair"},
{"m": ["X60 Ultra"], "c": "Consommables & entretien", "q": "Cheveux enroulés autour de la roue multidirectionnelle", "a": "Même problème que sur la génération précédente : retirez les cheveux enroulés autour de la roue.", "en": "Hair tangled in the universal wheel"},
{"m": ["X60 Ultra"], "c": "Consommables & entretien", "q": "Cheveux enroulés autour de la serpillière", "a": "Toutes nos excuses pour la gêne. Le plateau de serpillière flottant s'adapte au sol en augmentant la pression. En raison de la structure flottante centrale, un risque d'enroulement de cheveux existe si le sol en comporte beaucoup. Activez le mode « aspiration puis lavage » pour réduire l'enroulement. Vous pouvez aussi retirer manuellement la serpillière pour la nettoyer.", "en": "Mop wrapped with hair"},
{"m": ["X60 Ultra"], "c": "Consommables & entretien", "q": "Le filtre du manuel n'a pas la même forme que le filtre réel", "a": "Seul l'article réel fait foi ; cela n'affecte pas le fonctionnement. Le produit est amélioré en continu en cours de production.", "en": "The filter in the instruction manual is different in shape from the actual filter"},
{"m": ["X60 Ultra"], "c": "Consommables & entretien", "q": "Le plot de positionnement est blanc ou usé", "a": "Le plateau de serpillière est en plastique et l'aimant du dessous peut attirer de la rouille présente chez vous : nettoyez d'abord le plateau. La rotation et le frottement à grande vitesse peuvent user légèrement les plots de positionnement, sans incidence sur le fonctionnement.", "en": "The positioning post is white"},
{"m": ["X60 Ultra"], "c": "Consommables & entretien", "q": "Les taches tenaces (sauce soja…) sont difficiles à nettoyer : ajuster le débit d'eau", "a": "Plusieurs raisons peuvent expliquer un lavage insuffisant : 1. Si le sol est encore très sale au début, utilisez le réglage petite zone / un lavage, ou activez le relavage automatique ; après quelques passages, repassez en grande zone / un lavage. 2. Sur sol très sale, lancez la fonction « Lavage immédiat de la serpillière » dans l'application pendant le nettoyage. 3. Après avoir nettoyé des salissures très sales, ou après 2 à 4 semaines d'usage, retirez et lavez la serpillière à la main. 4. Un nettoyant dédié améliore aussi le résultat.", "en": "Soy sauce stains are hard to clean; adjust the amount of water"},
{"m": ["X60 Ultra"], "c": "Consommables & entretien", "q": "Traces d'eau laissées par la serpillière", "a": "Comme lors d'un lavage manuel, même bien essorée, la serpillière laisse un peu d'humidité qui doit s'évaporer. La visibilité des traces dépend beaucoup du revêtement de sol et de l'éclairage. Recommandations : 1. Mettez le micrologiciel à jour (page de l'appareil dans l'application → « … » en haut à droite → Réglages → Mise à jour du micrologiciel → activer « Mise à jour automatique »). 2. Vérifiez l'absence de corps étranger, cheveux ou obstruction sur le plateau de lavage. 3. Lors des premières utilisations, le robot nettoie des zones difficiles d'accès et ramène beaucoup de poussière : privilégiez le mode « aspiration puis lavage » avec un faible débit d'eau ; l'effet s'améliore après quelques passages. 4. Sur carrelage ou par temps humide, programmez un nettoyage régulier ou changez la serpillière plus souvent ; un produit dédié rend le sol plus propre et brillant. 5. Si le débit vous paraît trop élevé, réglez-le au minimum (32 niveaux de débit disponibles).", "en": "Mop water stains"},
{"m": ["X60 Ultra"], "c": "Consommables & entretien", "q": "Traces de saleté sur la plaque d'extension de la base", "a": "Toutes nos excuses. Le robot utilise une roue omnidirectionnelle arrière. S'il traverse une zone sale en revenant à la base, cette roue peut accumuler poussière, traces d'eau et saleté. Nettoyez régulièrement la roue omnidirectionnelle et la plaque d'extension de la base.", "en": "The base station extension board has traces of dirt"},
{"m": ["X60 Ultra"], "c": "Consommables & entretien", "q": "Échec d'installation du support de serpillière", "a": "1. Vérifiez l'absence de corps étranger sur le plateau de lavage. 2. En fixant la serpillière sur son support, assurez-vous que l'anneau central du support est bien dégagé et non recouvert par la serpillière.", "en": "Mop tray installation failed"},
{"m": ["Z10 Pro"], "c": "Consommables & entretien", "q": "Comment gérer le blocage de l'unité principale pendant le nettoyage ?", "a": "R : Lors du nettoyage, l'unité principale peut rester coincée dans des chaussons, des sacs plastiques et d'autres débris à la maison. Après avoir réglé le problème de blocage, essayez de placer l'unité principale dans la zone nettoyée à proximité pour continuer le nettoyage. Essayez de ranger votre maison avant de nettoyer pour éviter que l'unité principale ne reste coincée pendant le ménage.", "en": ""},
{"m": ["Z10 Pro"], "c": "Consommables & entretien", "q": "Comment gérer les surfaces bloquées sur l'unité principale pendant le nettoyage ?", "a": "R : Lors du nettoyage de l'unité principale, si elle rencontre des meubles à la même hauteur que le corps de la machine, la surface de la machine peut s'y coincer. Veuillez acheter un mur virtuel à bande magnétique pour empêcher la machine de rentrer dans la machine. Si vous n'avez pas acheté de mur virtuel à bande magnétique, utilisez des obstacles pour bloquer le bas du meuble afin d'empêcher l'hôte d'y entrer à nouveau.", "en": ""},
{"m": ["Z10 Pro"], "c": "Consommables & entretien", "q": "Comment le robot de balayage et de serpillière ainsi que la poubelle doivent-ils être nettoyés et entretenus quotidiennement ?", "a": "R : Utilisez un chiffon sec et doux pour essuyer et nettoyer tous les capteurs de l'unité principale, y compris : 1. Six capteurs de falaise au bas de l'unité principale. 2. Capteur d'évitement d'obstacles à l'avant de l'unité principale 3. Nettoyer le capteur de bord du capteur laser LDS", "en": ""},
{"m": ["Z10 Pro"], "c": "Consommables & entretien", "q": "L'hôte va-t-il aller dans une autre pièce avant que le nettoyage ne soit terminé ?", "a": "R : Après que l'hôte ait créé la carte pour la première fois, elle nettoiera par pièce. Si cela arrive, veuillez vérifier le statut de la partition. S'il y a une partition incorrecte, vous pouvez rapidement ajuster la partition de la pièce dans l'application.", "en": ""},
{"m": ["Z10 Pro"], "c": "Consommables & entretien", "q": "L'hôte va-t-il réduire l'efficacité du nettoyage dans des environnements complexes ?", "a": "R : Pour garantir la couverture du nettoyage, la machine principale balaie tous les coins. Dans des environnements complexes, les mouvements de virage et de bord sont augmentés, ce qui peut réduire l'efficacité du nettoyage.", "en": ""},
{"m": ["Z10 Pro"], "c": "Consommables & entretien", "q": "L'unité principale est-elle bruyante pendant le nettoyage ?", "a": "R : Vérifiez si la brosse à rouleaux est prise par des objets étrangers ou fait du bruit. Nettoyez rapidement la brosse à rouleaux pour éviter les dommages. Pour garantir une efficacité de nettoyage, l'unité principale utilise un ventilateur à succion plus forte, ce qui permet une meilleure extraction de la poussière et un bruit légèrement plus fort. Vous pouvez utiliser un mode silencieux avec un volume plus faible pendant le nettoyage.", "en": ""},
{"m": ["Z10 Pro"], "c": "Consommables & entretien", "q": "L'unité principale fait-elle des bruits étranges pendant le nettoyage ?", "a": "R : Lorsque l'unité principale travaille sur des sols carrelés lisses ou en bois, le grattoir du bas peut produire un léger bruit en frottant contre le sol. Lorsque l'unité principale traverse les joints carrelés et de sol, elle entre en contact et nettoie les joints du sol, ce qui peut produire un léger bruit de « clic-clic ». Les sons ci-dessus n'affectent pas le fonctionnement normal de la machine.", "en": ""},
{"m": ["Z10 Pro"], "c": "Consommables & entretien", "q": "Pourquoi l'unité principale rencontre-t-elle des obstacles pendant le nettoyage sans ralentir ni entrer en collision ?", "a": "R : L'unité principale est équipée d'un capteur laser LDS capable de détecter les obstacles et de décélérer à l'avance. Cependant, pour certaines jambes de table et de chaise plus sombres et plus petites, ainsi que certains obstacles plus bas, les collisions peuvent passer inaperçues, ce qui est normal.", "en": ""},
{"m": ["Z10 Pro"], "c": "Consommables & entretien", "q": "Pourquoi le boost de tapis du robot balayant et serpilleur est-il instable ?", "a": "R : Lors de la rencontre de tapis à poils courts, il y a un risque que la reconnaissance ne soit pas efficace, ce qui provoque une instabilité dans la fonction de pressurisation du tapis. La fonction de pressurisation des aspirateurs robotiques est actuellement une fonctionnalité expérimentale et est en optimisation continue.", "en": ""},
{"m": ["Z10 Pro"], "c": "Consommables & entretien", "q": "Pourquoi les obstacles d'évitement du robot balayeur et serpillier heurtent-ils encore des pieds noirs ou très réfléchissants ?", "a": "R : Objets noirs : Le laser linéaire des aspirateurs robots est infrarouge. Les objets noirs absorbent la lumière, et certains objets noirs peuvent être impactés, ce qui est normal. Objets hautement réfléchissants : Le laser linéaire des aspirateurs robots est infrarouge. Lorsque la lumière frappe un objet, elle peut provoquer une réflexion. Pour certains objets très réfléchissants, des collisions peuvent survenir, ce qui est normal.", "en": ""},
{"m": ["Z10 Pro"], "c": "Consommables & entretien", "q": "Pourquoi les robots de balayage et de serpillière regardent-ils en arrière pendant le nettoyage ?", "a": "R : Le robot aspirateur intègre une fonctionnalité linéaire de contournement des obstacles en 3D par laser. Sa portée de reconnaissance est directement devant. Lorsque d'autres objets sur le côté tombent dans les angles morts de l'évitement des obstacles, le robot regarde en arrière pour vérifier une meilleure évitement des obstacles, ce qui est un phénomène normal.", "en": ""},
{"m": ["Z10 Pro"], "c": "Consommables & entretien", "q": "Qu'est-ce qui provoque la collision de l'unité principale contre le mur lors du nettoyage le long du bord ?", "a": "R : L'unité principale est équipée de capteurs côté mur, donc lors du nettoyage sur les bords, elle maintient une certaine distance par rapport au mur, ce qui est normal.", "en": ""},
{"m": ["Z10 Pro"], "c": "Consommables & entretien", "q": "Que faire lorsque le robot intégré de balayage et de serpillière passe la serpillière sur le sol ?", "a": "R : Vous pouvez contrôler l'application pour définir une zone interdite de serpillière pour la moquette dans la fonction carte. Pendant le lavage, elle évitera la zone restreinte et évitera la moquette. Pourquoi la carte de l'aspirateur robot et de la serpillière est-elle différente d'avant, montrant de la confusion, de l'inclinaison et des cartes qui se chevauchent ? R : 1. Chaos cartographique (biaisé/chevauchement, etc.) 1. Confirmer que la carte a été sauvegardée avec succès (la page de zone affiche une icône de partition et la fonction de zone fonctionne normalement). 2. Éteindre l'interrupteur d'alimentation, redémarrer la machine, puis placer manuellement la machine pour la charger et essayer de restaurer la carte. Si la récupération échoue, l'emplacement de la poubelle sera modifié et la carte recréée Recommandations d'utilisation : 1. Les bacs à poussière doivent être correctement placés contre le mur (assurez-vous que 0,5 m des côtés gauche et droit du bac, et que 1,5 m devant les bacs soient exempts d'obstacles). 2. Pendant le fonctionnement du robot aspirateur, ne pas bouger et ne pas assister manuellement le robot aspirateur 3. Si l'environnement domestique présente une lumière directe forte ou des reflets miroirs, cela peut perturber le dessin Lumière directe forte : Il est recommandé de tirer les rideaux ou de reporter le dessin à un autre moment Reflet du miroir : Il est recommandé de couvrir les 15 cm inférieurs 4. Vous pouvez la réinitialiser dans la fonction carte ; la carte sera recréée lors du prochain nettoyage. 5. Vérifier régulièrement les côtés du composant de navigation pour détecter de la saleté et essuyer avec un chiffon ou un mouchoir propre.", "en": ""},
{"m": ["Z10 Pro"], "c": "Consommables & entretien", "q": "Que faire si la carte avec un robot balayeur et serpillière n'a pas les bonnes zones ?", "a": "R : Le robot aspirateur peut diviser et fusionner les cartes dans les paramètres de l'application, et ajuster manuellement les zones déraisonnables. J'ai hâte de découvrir le Z10 Pro", "en": ""},
{"m": ["Z10 Pro"], "c": "Consommables & entretien", "q": "Que faire si le robot aspirateur et serpillière intégrés reste coincé ?", "a": "R : Le robot aspirateur peut rester coincé entre des objets dans certains petits espaces. Si le robot est plus petit que 37 cm, il sera plus difficile de sortir du piège, il faut donc aider le robot à continuer de nettoyer.", "en": ""},
{"m": ["Z10 Pro"], "c": "Consommables & entretien", "q": "Que faire si le robot balayeur et serpillière ne peut parfois pas éviter les obstacles ?", "a": "R : 1. Il est recommandé d'utiliser un chiffon propre et doux pour essuyer le capteur d'évitement d'obstacles au centre de la plaque de collision de la machine. Après avoir essuyé, démarrez la machine et réessayez ; Si votre machine est connectée en réseau et en ligne, ouvrez l'interface de l'application et cliquez sur « ... » en haut à droite« Entrez, vérifiez la liste pour voir si la fonction d'évitement des obstacles est désactivée. Si oui, ouvrez-la et démarrez la machine pour essayer ; Vérifiez si les objets au sol sont trop petits ; pour s'assurer que le sol est propre, des obstacles trop petits peuvent parfois être évités ; Le robot prend en charge les mises à jour OTA en ligne. Dreametech optimisera progressivement ses performances d'évitement des obstacles. Il est recommandé de vérifier régulièrement la version du firmware et de la mettre à jour rapidement.", "en": ""},
{"m": ["Z10 Pro"], "c": "Consommables & entretien", "q": "Que faire si le réservoir d'eau tombe pendant le lavage ?", "a": "R :  Si le réservoir commence à fonctionner avant d'être correctement installé, cela provoquera la chute du réservoir. Veuillez prêter attention à la méthode d'installation correcte du radiateur. Lorsque vous installez les clips des deux côtés du réservoir, vous devriez entendre un bruit de « clic ».", "en": ""},
{"m": ["Z10 Pro"], "c": "Consommables & entretien", "q": "Que faut-il faire si le câble d'alimentation du bac à poussière s'emmêle pendant le nettoyage de l'unité principale ?", "a": "R : Avant de nettoyer, attachez le câble d'alimentation excédentaire du bac à poussière avec des colliers de serrage ; ne le posez pas au sol.", "en": ""},
{"m": ["Z10 Pro"], "c": "Consommables & entretien", "q": "Quelles sont les fonctions du laser linéaire du robot intégré de balayage et de serpillière ? Comment l'utiliser ?", "a": "R : Le laser linéaire du robot aspirateur peut reconnaître les scènes et obstacles domestiques, permettant une évitement précis des obstacles et réduisant considérablement des problèmes tels que les emmêlements, les coincements et les poussées. Vous pouvez profiter de cette fonctionnalité en activant l'interrupteur d'évitement d'obstacles dans les paramètres de l'application.", "en": ""},
{"m": ["Z10 Pro"], "c": "Consommables & entretien", "q": "Y a-t-il un problème où certaines zones étroites ne sont pas accessibles pendant le nettoyage ?", "a": "R :  L'espacement minimum pour l'unité principale est de 3,8cm ; les zones plus petites que cette distance peuvent ne pas être possibles à franchir.", "en": ""},
{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra"], "c": "Caractéristiques", "q": "Qu'est-ce que le robot L10s Ultra ?", "a": "Le L10s Ultra est un robot entièrement automatisé qui nettoie les sols et se nettoie lui-même. Ce robot tout-en-un combine aspiration, vidage automatique de la poussière, lavage et séchage de la serpillière, ajout d'eau et de détergent, et navigation IA avancée, pour un nettoyage domestique complet et sans intervention.", "en": "What is the Dreame L10s Ultra Robot?"},
{"m": ["D10 Plus", "D10s", "D10s Pro"], "c": "Caractéristiques", "q": "Quelles sont les caractéristiques du robot ?", "a": "Équipé de plusieurs capteurs de mouvement de haute précision, le robot dispose aussi d'algorithmes de positionnement et de navigation visuels pour enregistrer précisément ses déplacements et construire des cartes. Très adaptable aux environnements complexes, il détecte et franchit les obstacles et retourne se charger automatiquement. Il aspire avec une brosse avant et lave avec un tampon humide arrière. Aspiration puissante et réservoir d'eau intelligent pour un meilleur résultat. La carte de nettoyage est consultable à tout moment dans l'application Dreamehome pour programmer les horaires, changer de mode et nettoyer facilement tout l'espace.", "en": "What does Dreame feature?"},
{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra"], "c": "Caractéristiques", "q": "Quelles sont les dimensions du L10s Ultra ?", "a": "Robot : 350 × 350 × 97 mm. Base à vidage automatique : 423 × 340 × 568 mm. Emballage : 487 × 400 × 640 mm.", "en": "What is the size of Dreame L10s Ultra?"},
{"m": ["L10s Ultra"], "c": "Caractéristiques", "q": "Quel est l'avantage du capteur visuel IA ?", "a": "L'IA avancée combine caméra RVB et navigation lidar pour apprendre rapidement votre logement, adapter les stratégies de nettoyage et générer automatiquement des trajets selon le type d'obstacle, de sol et de pièce. La cartographie rapide génère une carte 3D de votre logement.", "en": "What is the advantage of the AI Visual Sensor?"},
{"m": ["L10s Ultra"], "c": "Caractéristiques", "q": "Quelles sont les caractéristiques du L10s Ultra ?", "a": "Base entièrement automatisée : vidage du bac à poussière, lavage et séchage de la serpillière, ajout d'eau et de nettoyant, etc. Cartographie, évitement d'obstacles et navigation avancés par double laser, caméra RVB et IA. Aspiration jusqu'à 5 300 Pa avec ajustement automatique et brosse caoutchouc optimisée pour les tapis. Lavage avec pression active et double serpillière rotative à 180 tr/min. Puissance d'aspiration, humidité de la serpillière et plans de nettoyage personnalisables dans l'application. Compatible commande vocale Alexa et Google Assistant.", "en": "What are the feature of Dreame L10s Ultra?"},

{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra"], "c": "Batterie & charge", "q": "Comment charger le robot ?", "a": "Maintenez le bouton du robot 3 secondes pour l'allumer. Placez-le sur la base, l'ensemble serpillière orienté vers le plateau de lavage. Une annonce vocale confirme la connexion et le début de la charge. Une fois chargé, les voyants du robot et de la base restent allumés 10 minutes puis s'atténuent.", "en": "How to charge the robot?"},
{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra"], "c": "Batterie & charge", "q": "Comment entretenir la batterie du robot ?", "a": "Le robot contient une batterie lithium-ion haute performance. Gardez-la bien chargée pour un usage quotidien afin de préserver ses performances. En cas de non-usage prolongé, éteignez le robot et rangez-le ; pour éviter tout dommage par décharge profonde, rechargez-le au moins une fois tous les trois mois.", "en": "How to maintain the battery?"},
{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra"], "c": "Batterie & charge", "q": "Comment le robot retourne-t-il se charger à la base ?", "a": "Après le nettoyage, le robot retourne automatiquement se charger. En pause, appuyez sur le bouton « Base » pour l'y renvoyer. En charge, le bouton d'alimentation clignote : blanc si batterie > 15 %, orange si < 15 %. NB : s'il ne trouve pas la base, il revient à son point de départ ; replacez-le alors manuellement sur la base.", "en": "How does it return to the Base for charging?"},
{"m": ["D10 Plus", "D10s", "D10s Pro"], "c": "Batterie & charge", "q": "Faut-il charger le robot 16 heures pour les trois premières tâches ?", "a": "Non, une charge normale suffit.", "en": "Do I need to charge for 16 hours for the first three tasks?"},
{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra"], "c": "Batterie & charge", "q": "Le robot consomme-t-il de l'électricité une fois sur la base ?", "a": "Sur la base, le robot est alimenté par celle-ci, tandis que sa batterie interne passe en veille à consommation minimale pour rester en parfait état.", "en": "Does it consume any power when connected with the Base?"},

{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra"], "c": "Batterie & charge", "q": "Pourquoi la batterie chute-t-elle vite en début de nettoyage ?", "a": "Après une charge complète suivie d'un long stockage, il est normal que la batterie chute rapidement les premières minutes ; la consommation se stabilise ensuite. Elle chute aussi plus vite en mode Turbo.", "en": "Why does the battery decrease rapidly during cleaning?"},
{"m": ["D10 Plus", "D10s"], "c": "Batterie & charge", "q": "Pourquoi le robot accoste-t-il de façon répétée après le retour à la charge ?", "a": "Vérifiez si les électrodes de charge de la base et du robot sont poussiéreuses : nettoyez la poussière avant utilisation.", "en": "Why does it keep connecting to the base after returning to charge?"},
{"m": ["D10 Plus", "D10s"], "c": "Batterie & charge", "q": "Pourquoi le robot ne retourne-t-il pas à la base ?", "a": "1. Vérifiez qu'il n'y a pas trop d'obstacles autour de la base : dégagez 0,5 m de chaque côté et 1,5 m devant. 2. Si le robot ne part pas de la base, il peut ne pas la retrouver en fin de tâche : faites-le toujours démarrer depuis la base. 3. Déplacer le robot vers une zone non nettoyée provoque un échec de repositionnement : relancez la tâche.", "en": "Why does it fail to return to the Base?"},

{"m": ["D10 Plus", "D10s", "L10s Ultra", "P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Batterie & charge", "q": "Pourquoi le robot s'éteint-il tout seul ?", "a": "Causes : 1. Extinction automatique sous 10 % de batterie. 2. Extinction après plus de 12 h de veille hors de la base. Solution : 1. Laissez le robot sur la base pour le maintenir en charge. 2. S'il s'éteint sur la base, vérifiez qu'elle est bien alimentée et que le contact de charge est stable.", "en": "Why does the robot turn off automatically?"},

{"m": ["D10s Plus", "D10s Pro", "D9 Plus"], "c": "Batterie & charge", "q": "La recharge du robot échoue", "a": "1. Trop d'obstacles autour du dock/base : dégagez-les ou placez le dock dans une zone dégagée. 2. Robot trop éloigné du dock : rapprochez-le. 3. Faites toujours partir le robot de la base pour que sa position soit exacte sur la carte. 4. Vérifiez que la base est alimentée. 5. Vérifiez l'absence de carte déformée ou superposée dans l'application ; le cas échéant, recréez la carte.", "en": "The robot fails to recharge"},
{"m": ["D10s Plus", "D10s Pro", "D9 Plus"], "c": "Batterie & charge", "q": "Le robot ne se charge pas", "a": "1. Dock/base non alimenté : vérifiez que les deux extrémités du cordon sont branchées. 2. Mauvais contact entre les électrodes du dock/base et du robot : coupez l'alimentation et nettoyez les contacts, ou ajustez leur position.", "en": "The robot cannot charge"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Batterie & charge", "q": "La recharge du robot échoue systématiquement", "a": "1. Trop d'obstacles près du dock/base : dégagez-les ou placez le dock/base dans une zone dégagée. 2. Robot trop éloigné du dock : rapprochez-le puis relancez la recharge. 3. Faites toujours partir le robot de la base pour que la carte localise bien la position de charge. 4. Vérifiez que le dock est alimenté. 5. Vérifiez l'absence de carte déformée ou superposée dans l'application ; le cas échéant, créez une nouvelle carte.", "en": "The robot recharge always fails"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Batterie & charge", "q": "Le robot ne se charge pas", "a": "1. Base non alimentée : vérifiez que les deux extrémités du cordon de la base sont bien branchées. 2. Mauvais contact entre les lamelles de la base et les électrodes du robot : coupez d'abord l'alimentation, puis nettoyez les contacts ou ajustez la position d'accostage.", "en": "The robot cannot be charged"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Batterie & charge", "q": "Les roues encrassées (huile, poussière…) font patiner le robot à la recharge", "a": "Le robot peut patiner : vérifiez l'absence d'eau stagnante ou de traces d'huile devant la base et, le cas échéant, séchez avant de réessayer. Il est aussi conseillé de déplacer la base à un autre endroit puis de relancer la recharge.", "en": "The wheels are stained with oil, dust, causing the recharging to slip"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Batterie & charge", "q": "Pourquoi le robot consomme-t-il vite sa batterie en nettoyage ?", "a": "Après une charge complète suivie d'une longue période d'inactivité, la batterie peut chuter rapidement les premières minutes de nettoyage — c'est normal, la consommation se stabilise ensuite. En mode puissant, la batterie se consomme plus vite.", "en": "What causes the main unit to consume power quickly during cleaning?"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Batterie & charge", "q": "Qu'est-ce qui provoque des accostages répétés à la base pendant la recharge ?", "a": "Vérifiez si les électrodes de charge de la base et du robot sont poussiéreuses : la poussière provoque des accostages répétés. Essuyez-les avant usage.", "en": "What causes repeated docking to the base station during recharging?"},
{"m": ["E20", "E20 Plus"], "c": "Batterie & charge", "q": "Anomalie de batterie du robot", "a": "1. Vérifiez le bon contact pendant la charge. 2. Vérifiez le temps de charge (environ 3 heures). 3. Connectez l'application et vérifiez le niveau de batterie avant un test de nettoyage pour détecter une décharge rapide. 4. Chargez 2 à 3 heures puis observez la consommation. 5. Si rien n'y fait, contactez le SAV pour contrôle.", "en": "Robot battery abnormality"},
{"m": ["E20", "E20 Plus"], "c": "Batterie & charge", "q": "Anomalie de charge du robot", "a": "1. Vérifiez le bon contact de l'adaptateur et de la prise à l'arrière de la base. 2. Vérifiez l'absence de saleté entre les lamelles métalliques de la base et celles du robot. 3. Avez-vous placé le robot manuellement sans l'aligner ? 4. Vérifiez que les ressorts de la base sont à hauteur régulière et rebondissent bien. 5. Une base trop à l'écart ou avec un espace insuffisant fait échouer la recharge automatique. 6. Si rien n'y fait, contactez le SAV.", "en": "Robot charging abnormality"},
{"m": ["E20", "E20 Plus"], "c": "Batterie & charge", "q": "La puissance de nettoyage du robot est insuffisante", "a": "1. Une fois le robot connecté, vérifiez sa consommation pendant le nettoyage dans l'application. 2. Au début d'une tâche, vérifiez que la batterie est suffisante : chargez complètement (environ 3 heures). 3. En cas de non-usage prolongé, retirez la batterie et stockez-la dans un endroit sec.", "en": "Robot's cleaning power is insufficient"},
{"m": ["E40 Ultra"], "c": "Batterie & charge", "q": "Impossible d’allumer le robot, aucune réponse lorsque l’on appuie sur l’interrupteur, la batterie ne se charge pas, le voyant de charge reste éteint ou le temps de charge est anormalement long.", "a": "Les brosses latérales ne s’étendent pas ni ne tournent. Cela peut être dû aux raisons suivantes. Veuillez vérifier les points suivants : \n1. Accédez à la page des paramètres de l’application, activez la fonction « SideReach piloté par l’IA » et réglez la fréquence sur « Élevée ». Une fois les réglages terminés, essayez de relancer une tâche de nettoyage et observez si les brosses latérales s’étendent. \n2. Retirez le robot et vérifiez si la brosse latérale est emmêlée avec des débris. Des corps étrangers peuvent faire échouer les fonctions d’extension et de rotation de la brosse latérale. Veuillez les nettoyer dès que possible. \nSi le problème persiste, veuillez contacter le service après-vente local pour obtenir de l’aide.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Batterie & charge", "q": "Le robot ne parvient pas à se recharger.", "a": "1. Il y a peut-être trop d'obstacles autour de la station/la base. Dégagez les obstacles ou placez la station/la base dans une zone ouverte.\n2. Votre robot est peut-être trop éloigné de la station d'accueil. Placez votre robot plus près de la station d'accueil.\n3. Pendant le nettoyage, assurez-vous que votre robot se met en route à partir de la base/de la station pour que l'emplacement de la base/de la station soit précis sur la carte.\n4. Assurez-vous que la base ou la station de base est sous tension.\n5. Vérifiez si les cartes enregistrées dans l'application sont déformées ou se chevauchent, si c'est le cas, veuillez reconstruire les cartes.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Batterie & charge", "q": "Le robot ne peut pas se charger.", "a": "1. La station d'accueil/la base n'est PAS sous tension. Assurez-vous que les deux extrémités du cordon d'alimentation de votre station d'accueil/base sont branchées.\n2. Les contacts de charge de la station d'accueil/base sont en mauvais contact avec ceux de votre robot. Mettez le robot hors tension et nettoyez les contacts de charge, ou ajustez leur position.", "en": ""},
{"m": ["E40 Ultra"], "c": "Batterie & charge", "q": "Que faire si le robot se charge de façon anormale ?", "a": "Nous vous recommandons de vérifier les situations suivantes : \n 1. L'application ne peut pas se connecter au robot s'il est éteint. \n 2. L'état en ligne et hors ligne du robot dépend de la puissance du signal réseau à l'endroit où il se trouve. Si le signal réseau est faible ou instable, le robot peut se déconnecter. \n 3. Le Wi-Fi domestique est peut-être déconnecté. \n Vous pouvez essayer les solutions suivantes : \n 1. Vérifiez que le robot est éteint. Si c'est le cas, maintenez le bouton d'alimentation enfoncé pour l'allumer, puis reconfigurez le réseau. \n 2. Si le robot se déconnecte pendant le nettoyage, il poursuivra la tâche en cours sans interruption. Une fois qu'un meilleur signal réseau est disponible, le robot se reconnectera automatiquement. \n 3. Vous pouvez réinitialiser les réseaux ou en ajouter pour le robot, et sélectionner un routeur plus proche du robot pour une meilleure configuration réseau. \n 4. Vérifiez que le Wi-Fi domestique fonctionne correctement. En cas de problème, résolvez les problèmes du réseau domestique et reconfigurez-le. \n 5. Vérifiez si l'option « Favoriser la 5G » est sélectionnée dans les paramètres réseau du robot. Si oui, veuillez désactiver ce paramètre.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Batterie & charge", "q": "Comment recharger le robot avec un aspirateur et une serpillière ?", "a": "A： Après le nettoyage, l'unité principale revient automatiquement à la station de charge pour la charger. En pause, une pression courte recommence à charger. Le bouton d'alimentation clignote comme un souffle pendant la charge de l'unité principale. La batterie ≤ 15 % de clignote orange, la batterie > 15 % de clignote blanche. Conseil : Si l'unité principale ne trouve pas la station de charge, elle reviendra automatiquement à la position de démarrage du nettoyage. Veuillez replacer manuellement l'unité principale dans la station de charge pour la charger.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Batterie & charge", "q": "Comment un robot avec un aspirateur et une serpillière maintient-il sa batterie ?", "a": "R :  Le robot intégré de balayage et de serpillière dispose d'un pack batterie lithium-ion rechargeable haute performance intégré. Pour maintenir les performances de la batterie, veuillez garder l'unité principale chargée pour une utilisation quotidienne. Conseil : Si vous ne l'utilisez pas longtemps, éteignez-le et stockez-le. Rechargez-le au moins une fois tous les trois mois pour éviter des dégâts de batterie dus à une surcharge.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Batterie & charge", "q": "Faut-il recharger pendant 16 heures après les trois premières utilisations ?", "a": "R : Les batteries lithium sont chargées sur place, n'ont aucun effet mémoire et sont prêtes à être utilisées immédiatement après une charge complète sans attendre 16 heures.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Batterie & charge", "q": "Pourquoi la batterie est-elle faible pendant le nettoyage mais ne reprend pas le nettoyage ?", "a": "Veuillez vous assurer que l'unité principale n'est pas en mode Ne pas déranger ; les scans ne reprendront pas pendant la période Ne pas déranger ; Recharger manuellement ou remettre l'unité principale dans la station de charge ne continuera pas le scan. 8. Problèmes matériels courants", "en": ""},
{"m": ["L10 Pro"], "c": "Batterie & charge", "q": "Qu'est-ce qui cause l'amarrage répétée à la station de charge lors de la recharge ?", "a": "R : Si vous remarquez des problèmes, vérifiez si la station de charge et la base de charge de l'unité principale sont tachées de poussière. Si de la poussière s'accumule, des connexions répétées peuvent survenir. Veuillez essuyer avant utilisation.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Batterie & charge", "q": "Que dois-je faire si je ne peux pas recharger ?", "a": "R : La station de charge n'est pas alimentée. Veuillez vérifier que les deux extrémités du câble d'alimentation de la station de charge sont correctement branchées. Si le contact est mauvais, veuillez nettoyer les ressorts de la station de charge et les contacts de charge de l'unité principale.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Batterie & charge", "q": "Quelle batterie utilise le robot combo aspirateur-serpillière ?", "a": "R : Le robot intégré de balayage et de serpillière utilise un pack batterie lithium haute performance de 5200 mAh.", "en": ""},
{"m": ["L10 Pro"], "c": "Batterie & charge", "q": "Quelle est la courte autonomie du robot ?", "a": "R : Lorsque le robot est complètement chargé, la puissance d'aspiration de l'aspirateur est réglée à une autonomie typique : Bloc silencieux : environ 17minutes Vitesse standard : environ 150 minutes Bloc fort : Environ 120 minutes Super mode : environ 80 minutes", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Batterie & charge", "q": "Quelle fonction a le bouton (recharge) du robot intégré de balayage et de serpillière ? Comment l'utiliser ?", "a": "R : Comme indiqué dans le tableau ci-dessous Conseil : Appuyez sur n'importe quelle clé pour mettre en pause pendant le nettoyage, la recharge ou un nettoyage partiel.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Batterie & charge", "q": "Quelle pourrait être la cause de la défaillance de la recharge ?", "a": "R : 1. Il y a trop d'obstacles près de la base de recharge. Veuillez placer la base de recharge dans une zone dégagée, en veillant à ne pas avoir d'obstacles à moins de 0,5 mètre de chaque côté et à 1,5 mètre devant. 2. Si l'unité principale ne démarre pas depuis la station de recharge avant le nettoyage, et qu'aucune station de recharge n'est trouvée pendant le nettoyage, veuillez essayer de nettoyer l'unité principale en partant de la station de recharge. 3. Lors du nettoyage, l'unité principale a été déplacée ; lors d'un nettoyage supplémentaire, l'unité principale n'a pas réussi à se repositionner et une nouvelle tâche a été lancée. 4. Veuillez vérifier si la station de recharge comporte un film sur la station de recharge ; s'il y en a un, retirez-le avant de retester.", "en": ""},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Batterie & charge", "q": "Que faire si le robot se charge anormalement ?", "a": "1. Vérifiez d'abord que la base est bien alimentée (cordon branché aux deux extrémités). 2. Vérifiez que les électrodes de charge de la base et du robot ne sont pas poussiéreuses : essuyez-les avant usage. 3. Vérifiez le bon accostage : placez manuellement le robot devant la base pour déclencher un retour et un accostage précis.", "en": "What if the robot charges abnormally?"},

{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Batterie & charge", "q": "Recharge anormale", "a": "Vérifiez : 1. Dégagement suffisant autour de la base (5 cm de chaque côté, 1,5 m devant). 2. Si une rampe d'extension est installée, vérifiez qu'elle est bien posée ; la base doit être à l'horizontale, sinon repositionnez-la. 3. Essuyez les traces d'eau à l'avant des roues motrices et de la base pour éviter le patinage. 4. Nettoyez toute saleté ou corps étranger sur les roues motrices, la roue multidirectionnelle et la rampe de la base.", "en": "Abnormal recharge"},

{"m": ["S20 Ultra"], "c": "Batterie & charge", "q": "Échec de recharge / base introuvable", "a": "1. Vérifiez que la prise n'est pas desserrée et que la base est alimentée. 2. Placez le robot à 1–2 m devant la base et appuyez brièvement sur « recharge » ; s'il ne se recharge pas, renvoyez-le pour test. S'il se recharge, vérifiez : a) base contre un mur, ~5 cm de dégagement de chaque côté, 1,5 m sans obstacle devant ; b) éloignée des interférences (routeur, TV…) ; c) pas de reflets en face (miroirs, fenêtres). 3. Vérifiez que le robot part de la base et que le capteur laser LDS tourne normalement.", "en": "Recharge failed / cannot find the charging base"},

const MODELS = ["D9 Plus", "D10 Plus", "D10s", "D10s Plus", "D10s Pro", "D20", "D20 Plus", "D20 Pro", "D20 Pro Plus", "E20", "E20 Plus", "E40 Ultra", "L10 Pro", "L10 Ultra", "L10s Ultra", "P10 Ultra", "P10 Pro Ultra", "S20 Ultra", "X40 Ultra", "X50 Ultra", "X60 Ultra", "Z10 Pro", "Kit raccordement d'eau", "Tous modèles"];
const CATS = ['Dépannage','Info produit','Fonctions & réglages','Consommables & entretien','Caractéristiques','Batterie & charge','Divers'];

let fModel = null, fCat = null, query = '';

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

function buildChips(el, items, get, set){
  el.innerHTML = '';
  const all = document.createElement('button');
  all.className = 'chip'; all.textContent = 'Tous';
  all.onclick = () => { set(null); render(); };
  el.appendChild(all);
  items.forEach(v => {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = v; b.dataset.v = v;
    b.onclick = () => { set(get() === v ? null : v); render(); };
    el.appendChild(b);
  });
}

function syncChips(el, cur){
  [...el.children].forEach((b,i) => {
    b.classList.toggle('on', i === 0 ? cur === null : b.dataset.v === cur);
  });
}

function highlight(text, terms){
  let out = esc(text);
  terms.forEach(t => {
    if (t.length < 2) return;
    const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
    out = out.replace(re, '<mark>$1</mark>');
  });
  return out.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}

function render(){
  syncChips($('#fm'), fModel);
  syncChips($('#fc'), fCat);
  $('#clr').style.display = query ? 'block' : 'none';

  const terms = norm(query).split(/\s+/).filter(Boolean);
  const hits = FAQ.filter(it => {
    if (fModel && !it.m.includes(fModel)) return false;
    if (fCat && it.c !== fCat) return false;
    if (!terms.length) return true;
    const hay = norm(it.q + ' ' + it.a + ' ' + (it.en||'') + ' ' + it.m.join(' '));
    return terms.every(t => hay.includes(t));
  });

  $('#cnt').innerHTML = '<b>' + hits.length + '</b> question' + (hits.length > 1 ? 's' : '') +
    (fModel ? ' · ' + esc(fModel) : '') + (fCat ? ' · ' + esc(fCat) : '');

  const list = $('#list');
  if (!hits.length){
    list.innerHTML = '<div class="empty"><svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="M20 20l-3.5-3.5"/></svg><b>Aucun résultat</b>Essayez un autre terme ou retirez un filtre.</div>';
    return;
  }

  const raw = terms.length ? query.trim().split(/\s+/) : [];
  let html = '';
  CATS.forEach(cat => {
    const grp = hits.filter(h => h.c === cat);
    if (!grp.length) return;
    html += '<div class="group"><div class="gtitle">' + esc(cat) + ' · ' + grp.length + '</div>';
    grp.forEach(it => {
      const open = terms.length && hits.length <= 6 ? ' open' : '';
      html += '<details class="qa"' + open + '><summary>' +
        (fModel ? '' : '<span class="badge">' + esc(it.m.length > 2 ? 'Multi' : it.m[0]) + '</span>') +
        '<span>' + highlight(it.q, raw) + '</span></summary>' +
        '<div class="body"><div class="ans">' + highlight(it.a, raw) + '</div>' +
        '<div class="models">' + it.m.map(m => '<span>' + esc(m) + '</span>').join('') + '</div></div></details>';
    });
    html += '</div>';
  });
  list.innerHTML = html;
}

buildChips($('#fm'), MODELS, () => fModel, v => fModel = v);
buildChips($('#fc'), CATS, () => fCat, v => fCat = v);
$('#q').addEventListener('input', e => { query = e.target.value; render(); });
$('#clr').onclick = () => { query = ''; $('#q').value = ''; $('#q').focus(); render(); };
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('#q')){ e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape'){ $('#clr').onclick(); }
});
render();
</script>
