{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra"], "c": "Fonctions & réglages", "q": "Comment utiliser la fonction de lavage ?", "a": "Aspirez le sol au moins trois fois avant le premier lavage pour un meilleur résultat. 1. Humidifiez la serpillière et essorez-la, puis fixez-la fermement dans le logement du réservoir. 2. Ouvrez le bouchon du réservoir, remplissez d'eau et refermez (sans détergent ni désinfectant). 3. Alignez le module de lavage selon la flèche et glissez-le à l'arrière du robot jusqu'au clic. Démarrez par le bouton ou l'application. NB : le lavage est déconseillé sur les tapis.", "en": "How to use the Mopping Function?"},
{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra"], "c": "Fonctions & réglages", "q": "Comment utiliser le mode « Ne pas déranger » ?", "a": "Le mode « Ne pas déranger » est activé par défaut de 22 h à 8 h. Vous pouvez le désactiver ou le modifier dans l'application. Pendant cette plage, le robot ne nettoie pas et n'émet pas d'annonces vocales, et le voyant d'alimentation est éteint.", "en": "How to use the Do-Not-Disturb mode?"},
{"m": ["D10 Plus", "D10s", "L10s Ultra"], "c": "Fonctions & réglages", "q": "Faut-il mettre à jour le micrologiciel à chaque nouvelle version ?", "a": "Chaque mise à jour apporte des optimisations. Mettez à jour à temps pour garantir la meilleure expérience de nettoyage.", "en": "Do I need to update the firmware whenever there is a new version?"},
{"m": ["D10 Plus", "D10s"], "c": "Fonctions & réglages", "q": "L'efficacité de nettoyage baisse-t-elle dans un environnement complexe ?", "a": "Le robot nettoie tous les coins pour une couverture complète. Dans un environnement complexe, il effectue davantage de virages et longe les bords, ce qui réduit son efficacité.", "en": "Will the cleaning efficacy drop when cleaning a complicated environment?"},
{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi l'application Dreamehome ne charge-t-elle pas les données de nettoyage ?", "a": "Vérifiez la connexion réseau, redémarrez l'application et réessayez.", "en": "Why does Dreamehome App fail to load the cleaning data?"},
{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi la mise à jour du micrologiciel échoue-t-elle ?", "a": "Vérifiez la connexion réseau et effectuez la mise à jour avec un réseau stable. Assurez-vous que la batterie dépasse 15 % avant la mise à jour.", "en": "Why does the robot fail to upgrade the firmware?"},
{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi le nettoyage programmé ne se déclenche-t-il pas ?", "a": "C'est probablement dû à une batterie faible : le nettoyage programmé ne fonctionne que si la batterie dépasse 15 %.", "en": "Why does the robot fail to do schedule clean?"},
{"m": ["D10 Plus", "D10s", "L10s Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi le renfort moquette est-il instable ?", "a": "Cette fonction est encore en version bêta. L'utiliser sur un tapis à poils courts peut provoquer un échec de la fonction.", "en": "Why is the Carpet Boost function unstable?"},
{"m": ["D10 Plus", "D10s", "D10s Pro"], "c": "Fonctions & réglages", "q": "Pourquoi le robot commence-t-il une nouvelle zone avant de finir la précédente ?", "a": "Après la première cartographie, le robot nettoie pièce par pièce. Si ce problème survient, vérifiez le découpage des zones dans l'application et corrigez les éventuelles erreurs.", "en": "Why does it start to clean the next zone before finishing the current one?"},
{"m": ["D10 Plus", "D10s", "L10s Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi le robot ne parvient-il pas à se repositionner ?", "a": "Après un échec de positionnement, si la base n'a pas bougé, replacez rapidement le robot sur la base : la carte se restaure automatiquement. Si la restauration échoue, relancez un nettoyage ; la carte sera sauvegardée après recharge automatique. Si la base a été déplacée ou l'environnement fortement modifié, l'échec est probable. Un sol mouillé faisant patiner les roues, ou un robot coincé, peuvent aussi causer un échec.", "en": "Why does it fail to relocate itself?"},
{"m": ["D10 Plus", "D10s", "D10s Pro"], "c": "Fonctions & réglages", "q": "Pourquoi le robot ne parvient-il pas à se repositionner ?", "a": "Déplacer le robot vers une zone non nettoyée provoque un échec de repositionnement : placez-le dans une zone déjà nettoyée. Une personne debout à côté du robot peut aussi faire échouer le repositionnement : ne restez pas à côté et laissez la caméra voir tous les points de repère de la pièce. Un éclairage faible peut également gêner : assurez un éclairage suffisant.", "en": "Why does it fail to reposition itself?"},
{"m": ["D10 Plus", "D10s", "L10s Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi le robot ne reprend-il pas le nettoyage après recharge ?", "a": "Vérifiez que le robot n'est pas en mode « Ne pas déranger ». Si vous lui commandez de rentrer ou si vous le replacez manuellement sur la base, il ne reprend pas non plus le nettoyage.", "en": "Why does robot fail to resume cleaning after recharging?"},
{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi le robot semble-t-il repasser sur son trajet ?", "a": "Le robot suit le trajet le plus efficace pour nettoyer votre logement. Cela peut sembler répétitif lorsqu'il se déplace d'une zone nettoyée vers une zone non nettoyée, mais il ne refait pas le travail.", "en": "Why does robot repeat its cleaning path?"},
{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra", "P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Que faire en cas d'échec de configuration du réseau Wi-Fi ?", "a": "Le robot Dreame ne prend en charge que le Wi-Fi 2,4 GHz, pas le 5 GHz. Vérifiez : 1. Lors de l'association, placez l'appareil dans une zone à bon signal Wi-Fi. 2. Activez la localisation du téléphone avant la configuration et autorisez l'application à l'utiliser. 3. En vous connectant au point d'accès émis par le robot, attendez l'annonce vocale puis revenez dans l'application pour le résultat. 4. Utilisez un nom et un mot de passe Wi-Fi en lettres/chiffres, sans caractères spéciaux. 5. L'échec peut dépendre du modèle de téléphone : essayez avec un autre appareil. Si le problème persiste, contactez le SAV.", "en": "How to deal with the Wi-Fi network configuration failure?"},
{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra"], "c": "Fonctions & réglages", "q": "Que faire si la carte est déformée, inclinée ou superposée ?", "a": "Vérifiez que la carte est bien enregistrée (les pièces découpées apparaissent et le nettoyage de zone fonctionne). Éteignez et redémarrez le robot, replacez-le manuellement sur la base et tentez de restaurer la carte ; en cas d'échec, changez la base de place et refaites la cartographie. Conseils : 1. base contre un mur, au moins 0,5 m d'espace libre sur les côtés et 1 m sans obstacle devant ; 2. ne déplacez pas le robot manuellement pendant le travail ; 3. évitez une lumière trop forte ou des surfaces très réfléchissantes.", "en": "What if the map is distorted, inclined, or overlapped?"},
{"m": ["D10 Plus", "D10s", "L10s Ultra"], "c": "Fonctions & réglages", "q": "Que faire si la carte est incorrecte ?", "a": "Vous pouvez ajuster la carte manuellement via l'application.", "en": "What should I do if the map configuration is not correct?"},
{"m": ["D10 Plus", "D10s", "D10s Pro"], "c": "Fonctions & réglages", "q": "À quoi faut-il faire attention avant un nettoyage ?", "a": "Assurez-vous que le robot est complètement chargé. Rangez l'espace, mettez de côté les objets fragiles et les objets au sol avant le nettoyage.", "en": "What should I pay attention to before cleaning?"},
{"m": ["D10s", "D10s Pro"], "c": "Fonctions & réglages", "q": "Comment connecter le robot à l'application Dreamehome ?", "a": "1. Scannez le QR code du robot, ou recherchez « Dreamehome » dans le magasin d'applications pour l'installer. 2. Ajout : dans l'application, appuyez sur « + » en haut à droite, scannez le QR code et suivez les instructions pour la connexion Wi-Fi. 3. Réinitialisation Wi-Fi : maintenez simultanément les deux boutons jusqu'à l'annonce « en attente de configuration réseau » ; quand le voyant Wi-Fi clignote lentement, la réinitialisation est réussie. NB : si la connexion échoue, réinitialisez le Wi-Fi et réajoutez l'appareil.", "en": "How to connect robot with Dreamehome App?"},
{"m": ["D10s Plus"], "c": "Fonctions & réglages", "q": "Comment configurer un nettoyage personnalisé ?", "a": "1. Sur la page d'accueil du plug-in, allez dans Réglages de nettoyage → Nettoyage personnalisé → Réglages. 2. Réglage manuel : pour chaque zone, personnalisez l'aspiration, l'humidité de la serpillière, le nombre de passages, etc. 3. Recommandation intelligente : appuyez sur « Recommandation intelligente » pour générer des modes personnalisés selon les types de pièces. 4. Enregistrement : appuyez sur « √ » en haut à droite pour sauvegarder.", "en": "How to set a customized cleaning?"},
{"m": ["D10s Plus", "D10s Pro"], "c": "Fonctions & réglages", "q": "Comment mettre à jour le micrologiciel ?", "a": "1. Robot en charge et allumé. 2. Réseau Wi-Fi stable. 3. Mettez à jour via Réglages → Mise à jour du micrologiciel. 4. Pendant la mise à jour, les voyants du robot clignotent. 5. La mise à jour n'a lieu que si la batterie dépasse 15 %.", "en": "I want to update the firmware"},
{"m": ["D10s Plus", "D10s Pro"], "c": "Fonctions & réglages", "q": "Comment partager mon robot avec d'autres personnes ?", "a": "1. Le robot doit être connecté au Wi-Fi. 2. La personne à qui partager doit avoir un compte dans l'application Dreamehome. 3. Sur la page Mes appareils, cliquez sur « ··· » et sélectionnez « Partage d'appareil ». 4. Saisissez l'identifiant Dreame / numéro / e-mail d'inscription de la personne : une fois qu'elle accepte, elle peut aussi piloter le robot.", "en": "I want to share my robot with others"},
{"m": ["D10s Plus", "D10s Pro", "D9 Plus"], "c": "Fonctions & réglages", "q": "Comment programmer un nettoyage ?", "a": "1. Sur la page d'accueil du plug-in, appuyez sur Réglages (en haut à droite) → Nettoyage programmé → Ajouter. 2. Réglez à l'avance : zone de nettoyage, heure de début, répétition. 3. Appuyez sur « √ » en haut à droite pour sauvegarder : le nettoyage est programmé.", "en": "I want to schedule a cleaning"},
{"m": ["D10s Plus", "D10s Pro"], "c": "Fonctions & réglages", "q": "Comment réinitialiser le système ou tous les réglages ?", "a": "1. Si un bouton dysfonctionne ou que vous ne pouvez pas éteindre le robot, ouvrez le capot supérieur et appuyez sur le bouton Reset : le robot redémarre automatiquement. 2. NB : la réinitialisation efface tous les nettoyages programmés et modes, et supprime les connexions Wi-Fi.", "en": "I want to reset the system or all settings"},
{"m": ["D10s Plus", "D10s Pro"], "c": "Fonctions & réglages", "q": "Comment utiliser Amazon Alexa ?", "a": "Prérequis : 1. Une enceinte Echo ou un Echo Show connecté à votre Wi-Fi. 2. Un robot ajouté dans l'application Dreamehome. 3. L'application Alexa à jour. Ajout : ouvrez l'application Alexa → Plus → Skills et jeux → recherchez la skill Dreamehome de votre appareil → « Activer ». Suivez les instructions pour vous connecter à Dreamehome, puis demandez à Alexa : « Découvre mes appareils ».", "en": "I want to work with Amazon Alexa"},
{"m": ["D10s Plus", "D10s Pro"], "c": "Fonctions & réglages", "q": "Comment utiliser Google Assistant ?", "a": "Prérequis : 1. Une enceinte/un écran Google ou Nest connecté à votre Wi-Fi. 2. Un robot ajouté dans l'application Dreamehome. 3. L'application Google Home à jour. Connexion : ouvrez Google Home → « + » en haut à gauche → Configurer un appareil → Compatible avec Google → recherchez Dreamehome et sélectionnez Associer. Suivez les étapes pour vous connecter à votre compte Dreamehome.", "en": "I want to work with Google Assistant"},
{"m": ["D10s Plus", "D10s Pro"], "c": "Fonctions & réglages", "q": "Faut-il ranger les tapis pendant le lavage ?", "a": "1. Zone interdite : avant un lavage, définissez l'emplacement du tapis comme zone interdite dans la gestion de la carte, et le robot l'évitera. 2. Rangement : si le tapis est à l'entrée d'une pièce que vous voulez faire nettoyer, retirez-le au préalable.", "en": "Do I need to put away carpets when mopping?"},
{"m": ["D10s Plus", "D10s Pro"], "c": "Fonctions & réglages", "q": "La carte est incomplète ou des zones manquent", "a": "Causes : 1. Objets à l'entrée d'une pièce ou porte pas totalement ouverte : le robot juge le passage impossible et évite la zone. 2. Une personne ou un animal circulant autour du robot pendant le scan peut fausser les résultats et rendre la carte incomplète.", "en": "The house map is incomplete or some areas are missing"},
{"m": ["D10s Plus", "D10s Pro"], "c": "Fonctions & réglages", "q": "La carte est perdue ou superposée", "a": "1. Si le robot démarre après avoir été déplacé, il tente un auto-positionnement ; en cas d'échec, il recrée la carte et l'actuelle est écrasée. 2. Un blocage ou un patinage peut superposer des zones : refaites ou restaurez la carte.", "en": "The maps are lost or overlapping"},
{"m": ["D10s Plus", "D10s Pro"], "c": "Fonctions & réglages", "q": "La carte n'est pas enregistrée / mise à jour", "a": "1. Pendant la cartographie, le robot apprend l'environnement et revient au dock ; la carte n'est enregistrée qu'après l'annonce vocale de fin. 2. Si le robot est ramené au dock pendant la cartographie ou si celle-ci est interrompue, la carte n'est ni enregistrée ni mise à jour.", "en": "The maps are not saved/updated"},
{"m": ["D10s Plus", "D10s Pro"], "c": "Fonctions & réglages", "q": "La reprise du nettoyage ne s'effectue pas", "a": "1. Vérifiez que la fonction de reprise est activée. 2. Elle ne peut pas être activée en mode « Ne pas déranger ». 3. Vérifiez qu'aucune alerte de panne n'apparaît dans l'application pendant la charge (le cas échéant, la reprise ne s'active pas). 4. Vérifiez que le robot n'a pas été redémarré ou réinitialisé après activation de la reprise.", "en": "Resume cleaning is not performed"},
{"m": ["D10s Plus", "D10s Pro", "D9 Plus"], "c": "Fonctions & réglages", "q": "Le robot ne démarre pas le nettoyage programmé à l'heure prévue", "a": "C'est probablement dû à une batterie faible : le nettoyage programmé ne démarre que si la batterie dépasse 15 %.", "en": "The robot does not clean automatically at the scheduled time"},
{"m": ["D10s Plus", "D10s Pro", "D9 Plus"], "c": "Fonctions & réglages", "q": "Le robot ne peut pas mettre à jour le micrologiciel", "a": "Causes : 1. Batterie faible : impossible sous 15 %. 2. Signal Wi-Fi faible ou hors de portée : placez le robot et le dock/base dans une bonne zone Wi-Fi.", "en": "The robot cannot update the firmware"},
{"m": ["D10s Plus", "D10s Pro"], "c": "Fonctions & réglages", "q": "Le robot ne reprend pas le nettoyage", "a": "1. Le robot est peut-être en mode « Ne pas déranger », ce qui empêche la reprise. 2. Il ne reprend pas non plus s'il a été rechargé manuellement ou placé sur la base à la main.", "en": "The robot does not resume cleaning"},
{"m": ["D10s Plus", "D10s Pro"], "c": "Fonctions & réglages", "q": "Le robot ne reprend pas le nettoyage après recharge", "a": "1. Le robot est peut-être en mode « Ne pas déranger » : il ne reprend alors pas le nettoyage. 2. Un retour manuel au dock ou une recharge manuelle empêchent aussi la reprise.", "en": "The robot does not continue cleaning after recharging"},
{"m": ["D10s Plus", "D10s Pro"], "c": "Fonctions & réglages", "q": "Le robot nettoie plusieurs fois la même zone", "a": "1. Si le nettoyage dure moins de 10 minutes, le robot le refait (sauf en nettoyage de pièce sélectionnée). 2. Une superposition de zones peut fausser le positionnement et provoquer des oublis : refaites ou restaurez la carte.", "en": "The robot cleans an area repeatedly"},
{"m": ["D10s Plus", "D10s Pro"], "c": "Fonctions & réglages", "q": "Les trajets de nettoyage sont désordonnés", "a": "Première cartographie : les trajets sont volontairement désordonnés pour que le robot apprenne au mieux l'environnement ; une fois la carte enregistrée, ils deviennent plus nets. Après enregistrement : en cas de trajets confus, 1. avant le nettoyage, rangez les objets épars au sol (multiprises, jouets, chaussons) pour éviter les collisions répétées ; 2. si les roues sont encrassées d'huile ou de saleté, ou bloquées par un corps étranger, nettoyez-les.", "en": "The cleaning paths are disordered"},
{"m": ["D10s Plus", "D10s Pro"], "c": "Fonctions & réglages", "q": "Placer le robot dans une zone précise et lancer le nettoyage", "a": "1. Cartographie : lors de la première carte ou d'une refonte, ne déplacez PAS le robot pour ne pas faire échouer la carte. 2. Couverture : si la zone à nettoyer n'est pas cartographiée, le robot ne peut pas la nettoyer même en l'y plaçant. 3. Nettoyage normal : si la zone est cartographiée, placez le robot dedans et lancez le nettoyage.", "en": "Place the robot to the specific area and start cleaning"},
{"m": ["D10s Pro"], "c": "Fonctions & réglages", "q": "Comment nettoyer un logement à plusieurs étages ?", "a": "Déplacez le robot à l'étage à nettoyer et sélectionnez la carte correspondante. S'il s'agit du premier nettoyage de cet étage, créez d'abord une carte : Gestion de la carte → Créer → Enregistrer (page d'accueil du plug-in). NB : pour les modèles à auto-nettoyage, amenez la base de lavage au même étage que le robot, sinon désactivez la fonction d'auto-nettoyage.", "en": "How to clean a multi-floor house?"},
{"m": ["D10s Pro", "D9 Plus"], "c": "Fonctions & réglages", "q": "La serpillière est trop humide ou il y a trop d'eau dans le réservoir", "a": "Si l'environnement est humide ou si les traces d'eau sèchent difficilement au sol, réglez le débit du réservoir sur « faible » via Réglages du débit d'eau → Faible.", "en": "The mop pad is too wet, or too much water in the fresh tank"},
{"m": ["D10s Pro"], "c": "Fonctions & réglages", "q": "Pourquoi le robot ne reprend-il pas le nettoyage après recharge ?", "a": "Vérifiez que le robot n'est pas en mode « Ne pas déranger ». Si vous lui commandez de rentrer ou si vous le replacez manuellement sur la base, il ne reprend pas non plus le nettoyage.", "en": "Why does it fail to resume cleaning after recharging?"},
{"m": ["D10s Pro"], "c": "Fonctions & réglages", "q": "À quoi sert le bouton Base / Nettoyage local et comment l'utiliser ?", "a": "Base / Nettoyage local : appuyez pour renvoyer le robot à la base ; maintenez 3 secondes pour lancer le mode Nettoyage local. Voyant d'état : blanc fixe = nettoyage en cours ou terminé ; orange clignotant = erreur ; blanc pulsé = charge en cours (batterie non faible). NB : appuyez sur n'importe quel bouton pendant le nettoyage, la recharge ou le nettoyage local.", "en": "What's the use of the Dock/Spot Clean button?"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Fonctions & réglages", "q": "Comment nettoyer un duplex ou un logement à deux étages ?", "a": "Déplacez le robot à l'étage concerné et sélectionnez manuellement la carte de cet étage pour le nettoyage. (S'il s'agit du premier nettoyage de cette zone, créez une nouvelle carte : page d'accueil de l'appareil → Gestion de la carte → Créer une carte → Enregistrer.)", "en": "How to clean a duplex or two-story apartment"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Fonctions & réglages", "q": "Comment programmer un nettoyage ?", "a": "1. Sur la page d'accueil du plug-in du robot, cliquez sur « Réglages » → « Nettoyage programmé » → « Ajouter ». 2. Réglez selon vos besoins : zone de nettoyage, heure de déclenchement, jours de répétition. 3. Cliquez sur « Enregistrer » en haut à droite pour valider.", "en": "I'd like to make an appointment for cleaning"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Fonctions & réglages", "q": "Comment réinitialiser le système ou restaurer les réglages d'usine ?", "a": "1. Si les boutons ne répondent pas ou que l'appareil ne s'éteint pas, ouvrez le capot supérieur et appuyez sur le bouton de réinitialisation (Reset) : le robot redémarre automatiquement. 2. Attention : la réinitialisation efface les nettoyages programmés, les réglages de mode et la configuration Wi-Fi.", "en": "I need to reset the system or restore the factory Settings"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Fonctions & réglages", "q": "Comment utiliser le renfort moquette ?", "a": "Activez « Renfort moquette » dans l'application : dès que le robot détecte un tapis, il augmente automatiquement l'aspiration pour un meilleur nettoyage. NB : la reconnaissance peut varier selon le type de tapis ; en cas d'échec, ajoutez le tapis manuellement dans l'application.", "en": "How to use carpet pressurization?"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Fonctions & réglages", "q": "Déplacer le robot directement dans une pièce ou zone à nettoyer", "a": "1. En cours de cartographie (première carte ou refonte), déplacer le robot peut faire échouer la carte : ne le touchez pas pendant la cartographie. 2. Si la carte ne couvre pas la zone cible, le nettoyage est impossible même en plaçant le robot sur place. 3. Si la carte couvre la zone, placez le robot dans cette zone et lancez le nettoyage.", "en": "Move the robot directly to a certain room or area for cleaning"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Fonctions & réglages", "q": "Faut-il replier le tapis pendant le nettoyage ?", "a": "1. Reconnaissance intelligente : le robot identifie les tapis (ajout manuel possible dans l'application) et augmente l'aspiration en atteignant la zone de tapis (réglable dans l'application). 2. Zone interdite : avant un lavage, définissez l'emplacement du tapis comme zone interdite dans la gestion de la carte pour que le robot l'évite.", "en": "Does the carpet need to be folded up when cleaning?"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Fonctions & réglages", "q": "La carte du robot est perdue ou superposée", "a": "1. Après déplacement du robot, si le repositionnement échoue au démarrage, la carte est reconstruite, d'où sa perte. 2. Un patinage ou un blocage peut provoquer une superposition de carte : refaites ou restaurez la carte.", "en": "The robot map is lost or overlapped"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Fonctions & réglages", "q": "La carte n'a pas été enregistrée / mise à jour", "a": "1. Lors de la création d'une carte, le robot termine seul le scan ; après retour à la base, une annonce vocale indique la carte terminée, et c'est seulement alors qu'elle peut être enregistrée. 2. Si vous ramenez manuellement le robot à la base ou forcez l'arrêt de la cartographie avant la fin, la carte n'est ni enregistrée ni mise à jour.", "en": "The map has not been saved/updated"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Fonctions & réglages", "q": "La cartographie du robot est incomplète ou une zone est omise", "a": "Causes possibles : 1. Objets à l'entrée d'une pièce ou porte pas totalement ouverte : le lidar juge le passage impossible et renonce à entrer. 2. Une personne ou un animal circulant autour du robot pendant le scan peut fausser les résultats et rendre la carte incomplète.", "en": "The robot's mapping is incomplete or a certain area is omitted"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Fonctions & réglages", "q": "La mise à jour du micrologiciel a échoué", "a": "La mise à jour est impossible ou échoue si : 1. Batterie faible : elle doit être ≥ 15 %. 2. Signal Wi-Fi faible ou absent, provoquant un dépassement de délai de téléchargement : placez le robot et la base dans une zone à bon signal Wi-Fi.", "en": "The firmware upgrade of the robot failed"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Fonctions & réglages", "q": "La reprise du nettoyage au point d'arrêt ne fonctionne plus", "a": "1. Vérifiez que l'option de reprise est activée. 2. La reprise ne fonctionne qu'en mode automatique, pas pendant la plage « Ne pas déranger ». 3. Vérifiez qu'aucune alerte de panne n'est déclenchée pendant la charge (le cas échéant, la reprise ne se déclenche pas). 4. Vérifiez que le robot n'a pas été redémarré ou réinitialisé après le déclenchement de la reprise.", "en": "The resume scan from the breakpoint doesn't work anymore"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Fonctions & réglages", "q": "La serpillière du robot est trop humide / trop d'eau", "a": "Trop d'eau : si le climat local est humide ou si le revêtement de sol sèche difficilement, réglez le débit du réservoir sur « faible » depuis la page d'accueil du plug-in du robot.", "en": "The robot mop is too wet or has too much water"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Fonctions & réglages", "q": "Le robot n'a pas repris le nettoyage après recharge", "a": "1. Le robot est peut-être en mode « Ne pas déranger » : dans ce mode, il ne reprend pas le nettoyage. 2. Une recharge manuelle ou un retour manuel du robot sur le dock empêche aussi la reprise du nettoyage.", "en": "The robot did not continue cleaning after recharging"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Fonctions & réglages", "q": "Le robot ne démarre pas à l'heure programmée", "a": "Ce problème vient généralement d'une batterie insuffisante : le nettoyage programmé ne se lance que si la batterie dépasse 15 %.", "en": "The robot doesn't work at the appointed time"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Fonctions & réglages", "q": "Le robot nettoie plusieurs fois la même zone", "a": "1. Si le nettoyage dure moins de 10 minutes, un second passage est effectué (sauf en nettoyage de zone). 2. Une carte dupliquée peut fausser le positionnement et entraîner des passages répétés : refaites ou restaurez la carte.", "en": "The robot repeatedly cleans a certain area"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Fonctions & réglages", "q": "Le trajet de nettoyage du robot est désordonné", "a": "Première cartographie : le robot explore le terrain intérieur et suit des trajets plus sinueux pour couvrir davantage de zones ; une fois la carte enregistrée, les trajets suivants redeviennent normaux. Usage quotidien : en cas de trajet confus, avant le nettoyage rangez les objets épars au sol (planches, jouets, chaussons) pour éviter les collisions répétées ; pendant le nettoyage, vérifiez l'absence de corps étranger coincé, de poussière accumulée ou de graisse sur les roues.", "en": "The robot's cleaning route is in a mess"},
{"m": ["E20", "E20 Plus"], "c": "Fonctions & réglages", "q": "Anomalie de configuration réseau du robot", "a": "1. Vérifiez que le robot n'est pas trop éloigné du routeur et du téléphone. 2. Vérifiez que l'autorisation réseau de l'application est activée. 3. Vérifiez qu'il s'agit d'un réseau 2,4 GHz. 4. Vérifiez que le mot de passe et le nom du Wi-Fi sont correctement saisis. 5. Utilisez un autre téléphone en point d'accès pour vérifier si le routeur est en cause. 6. Si rien n'y fait, contactez le SAV.", "en": "Robot distribution network abnormality"},
{"m": ["E20", "E20 Plus"], "c": "Fonctions & réglages", "q": "Conseils pour les tâches de nettoyage du robot", "a": "1. À la première utilisation, commencez par le mode aspiration. 2. Si le sol est très poussiéreux et qu'un lavage est nécessaire, effectuez d'abord un nettoyage global. 3. Avant la tâche, rangez décorations, câbles, rideaux et chaussettes au sol.", "en": "Suggestions for robot cleaning tasks"},
{"m": ["E20", "E20 Plus"], "c": "Fonctions & réglages", "q": "Impossible de trouver le robot dans l'application", "a": "1. Reportez-vous à la notice pour vérifier que l'appareil est en mode de configuration réseau. 2. Vérifiez que les voyants indiquent bien ce mode. 3. Redémarrez le robot et relancez le mode de configuration réseau.", "en": "Unable to find robot in APP"},
{"m": ["E20", "E20 Plus"], "c": "Fonctions & réglages", "q": "La carte affichée dans l'application est anormale ou déformée", "a": "1. Un robot souvent en mode « sauvetage » perturbe la cartographie : rangez les obstacles gênants. 2. Sous un lit ou un canapé, un drap ou une housse pendante peut masquer le LDS et déformer la carte. 3. Le déplacement de personnes pendant le travail peut fausser le positionnement et déformer la carte. 4. Vérifiez que le signal réseau est normal.", "en": "APP map display abnormal and skewed"},
{"m": ["E20", "E20 Plus"], "c": "Fonctions & réglages", "q": "La carte de l'application montre des zones non scannées", "a": "1. Vérifiez que le robot n'est pas empêché d'atteindre la zone par des obstacles. 2. Vérifiez qu'un changement de disposition des objets n'a pas rendu le nettoyage incomplet. 3. Vérifiez que des modifications des murs virtuels n'ont pas laissé des zones non nettoyées. 4. Vérifiez le niveau de batterie pour écarter des oublis dus à une batterie insuffisante.", "en": "APP map display missing scan abnormality"},
{"m": ["E20", "E20 Plus"], "c": "Fonctions & réglages", "q": "La réponse des boutons de l'application est lente", "a": "1. Vérifiez que le réseau fonctionne : déconnectez le téléphone du Wi-Fi domestique et passez en 4G/5G, puis réessayez. 2. Fermez les applications en arrière-plan et réessayez. 3. Redémarrez le robot et réessayez. 4. Actualisez la liste des appareils et rouvrez l'interface. 5. Désinstallez et réinstallez l'application.", "en": "APP button response is slow"},
{"m": ["E20", "E20 Plus"], "c": "Fonctions & réglages", "q": "Réponse lente de l'application ou du téléphone", "a": "1. Vérifiez qu'aucun objet autour du LDS ne gêne le scan : nettoyez et réessayez. 2. Vérifiez que le Wi-Fi domestique fonctionne bien (latence aux heures de pointe pouvant ralentir l'application). 3. Redémarrez le robot et relancez un nettoyage global.", "en": "Slow response of apps or mobile devices"},
{"m": ["E20", "E20 Plus"], "c": "Fonctions & réglages", "q": "Trajet de nettoyage confus (passages répétés sur certaines zones)", "a": "1. Ne perturbez pas le robot pendant un nettoyage normal et ne le déplacez pas. 2. Rangez le logement avant le nettoyage pour un fonctionnement plus fluide.", "en": "Robot cleaning path confusion"},
{"m": ["E20", "E20 Plus"], "c": "Fonctions & réglages", "q": "Échec de la mise à jour logicielle", "a": "1. Vérifiez que le réseau domestique fonctionne. 2. Pour la mise à jour du micrologiciel, le robot doit être sur la base.", "en": "software update failed"},
{"m": ["E40 Ultra"], "c": "Fonctions & réglages", "q": "Cartes superposées ou désordonnées.", "a": "Pour une utilisation plus pratique de la fonctionnalité de cartes multiples, notre robot aspirateur ne nécessite pas de déplacer la station à plusieurs reprises pour la création de nouvelles cartes. Pour créer une deuxième ou une troisième carte, il n'est pas nécessaire de déplacer la station. La nouvelle carte sera enregistrée lorsque le robot retourne au point de départ, ce qui est très pratique !", "en": ""},
{"m": ["E40 Ultra"], "c": "Fonctions & réglages", "q": "Cartographie incomplète (applicable aux aspirateurs robots LDS).", "a": "État du voyant du robot : \n Trois voyants blancs fixes : \n Bouton de nettoyage localisé : \n Blanc fixe : tâche terminée/en pause ou en mode veille. \n Lorsque le robot est en mode allumé, correctement mis en marche, tâche terminée/en mode veille (aucune tâche à venir), en pause (avec des tâches en attente) ou tâche terminée (chargement terminé sur la station de charge) : les trois voyants Nettoyage localisé, Nettoyage et Retour à la station sont blancs fixes. \n Lorsque le robot est allumé et que le bouton d'alimentation est relâché : les trois voyants Nettoyage localisé, Nettoyage et Retour à la station clignotent lentement en blanc. \n Pendant le nettoyage (hors nettoyage localisé) : le voyant Nettoyage est blanc fixe, tandis que les voyants Nettoyage localisé et Retour à la station sont éteints. \n Pendant le nettoyage localisé : le voyant Nettoyage localisé est blanc fixe, tandis que les voyants Nettoyage et Retour à la station sont éteints. \n Hors de la station de charge, en pause/en veille en raison d'une batterie faible : les trois voyants Nettoyage localisé, Nettoyage localisé et Retour à la station sont orange fixes. \n En charge (tâche terminée, batterie suffisante) : le voyant Retour à la station clignote lentement en blanc, tandis que les voyants Nettoyage localisé et Nettoyage sont éteints. \n En charge (batterie faible) : le voyant Retour à la station clignote lentement en orange, tandis que les voyants Nettoyage localisé et Nettoyage sont éteints. \n Tâche terminée (sur la station de charge, en charge) : le voyant Nettoyage clignote en blanc, tandis que les voyants Nettoyage localisé et Retour à la station sont éteints. \n En charge avec batterie faible : le voyant Nettoyage clignote lentement en orange, tandis que les voyants Nettoyage localisé et Retour à la station sont éteints. \n Fonctionnement anormal ou erreur de charge :\n les trois voyants de Nettoyage localisé, Nettoyage et Retour à la station clignotent en orange. \n Pendant la mise à niveau OTA : les trois voyants Nettoyage localisé, Nettoyage et Retour à la station clignotent en blanc. \n Mode veille (activé après 10 minutes d'inactivité) : les trois voyants Nettoyage localisé, Nettoyage et Retour à la station s'éteignent.", "en": ""},
{"m": ["E40 Ultra"], "c": "Fonctions & réglages", "q": "Comment créer des cartes multi-étages ?", "a": "Si votre cartographie initiale est incomplète, il n'est pas nécessaire de la réaliser à nouveau. Lors de la tâche suivante, le robot mettra automatiquement à jour et complétera la cartographie pendant son fonctionnement. Aucune inquiétude !", "en": ""},
{"m": ["E40 Ultra"], "c": "Fonctions & réglages", "q": "Comment gérer correctement le problème du robot qui ne nettoie pas les zones à faible hauteur ?", "a": "Lorsque le robot effectue le nettoyage sur les tapis et que sa trajectoire de nettoyage en S est irrégulière, les raisons suivantes peuvent en être la cause : 1. Vérifiez si votre tapis est très fin ou très souple. Le robot peut glisser lorsqu’il se déplace sur le tapis, ce qui peut expliquer la trajectoire de nettoyage irrégulière. Il est recommandé de fixer légèrement le tapis en plaçant des objets un peu plus lourds sur ses quatre coins pendant le nettoyage. 2. Vérifiez les roues motrices : Vérifiez si les roues motrices sont très usées ou couvertes de poussière. Ce problème peut affecter la traction du robot sur le tapis, ce qui pourrait entraîner des trajectoires de nettoyage irrégulières. Il est recommandé de nettoyer les roues motrices dès que possible.", "en": ""},
{"m": ["E40 Ultra"], "c": "Fonctions & réglages", "q": "Comment résoudre le problème lié au manquement d'une zone par le robot ?", "a": "1. Vérifiez que la prise est bien débranchée et que la station de charge est sous tension. \n 2. Placez le robot à 1 ou 2 mètres de la station de charge et appuyez brièvement sur le bouton de la station. S'il ne parvient pas à retourner à la station de charge, vous devrez peut-être l'envoyer en réparation. S'il retourne à la station de charge, vérifiez les points suivants : \n ① La station de charge doit être placée contre un mur, avec un espace libre d'au moins 5 cm de chaque côté et d'au moins 1 mètre devant. \n ② Éloignez-la des sources d'interférences, telles que les routeurs ou les téléviseurs. \n ③ Assurez-vous qu'aucune surface réfléchissante, comme un miroir ou une fenêtre, ne se trouve directement devant la station de charge. \n 3. Assurez-vous que le robot commence à nettoyer depuis la station de charge et que le capteur laser LDS situé sur le dessus du robot fonctionne correctement. \n 4. Vérifiez si les roues du robot patinent ou se bloquent pendant le fonctionnement. \n 5. Si aucun des problèmes ci-dessus ne se produit, essayez de redémarrer le robot et de relancer le nettoyage. \n 6. Si vous avez déplacé la station, placez le robot dessus, puis démarrez le nettoyage. \n 7. Si le problème persiste après le redémarrage, veuillez réinitialiser le robot, déplacer la station vers un espace dégagé et réessayer de démarrer le nettoyage.", "en": ""},
{"m": ["E40 Ultra"], "c": "Fonctions & réglages", "q": "Comment résoudre le problème lorsque l'application indique que l'appareil est hors ligne ?", "a": "Notre robot utilise la lumière structurée pour éviter les obstacles. Nous vous recommandons de vérifier les points suivants : \n 1. Notre robot peut détecter les obstacles et ralentir avant la collision. Cependant, il est susceptible de ne pas détecter certains pieds de table et de chaises de couleur foncée, réfléchissants ou petits, ainsi que les obstacles de faible hauteur. \n 2. Essuyez régulièrement le capteur laser avant et la caméra avec un chiffon doux et sec afin d'éliminer les traces de doigts et la poussière. \n 3. Le robot ralentira et touchera délicatement les obstacles souples tels que les rideaux ou les portes entrouvertes, ce qui est normal. \n 4. Notre robot prend en charge les mises à jour OTA en ligne et MOVA optimise en permanence son évitement d'obstacles. Nous vous recommandons de vérifier régulièrement la version du micrologiciel et de la mettre à jour rapidement.", "en": ""},
{"m": ["E40 Ultra"], "c": "Fonctions & réglages", "q": "Connexion Wi-Fi interrompue.", "a": "Les débris ménagers courants peuvent être éliminés par vidage automatique. Si le bac à poussière est obstrué par de nombreux déchets solides, essayez d’effectuer plusieurs cycles de vidage. Si cela ne fonctionne pas, nettoyez le bac à poussière manuellement.", "en": ""},
{"m": ["E40 Ultra"], "c": "Fonctions & réglages", "q": "Entrée forcée dans des zones à faible hauteur, ce qui cause des rayures ou un blocage.", "a": "1. Assurez-vous que la station d’accueil est connectée à l’alimentation. Observez le voyant lumineux sur la station d’accueil. S’il s’allume, l’alimentation est correctement connectée. \n2. Poussez le robot dans la station d’accueil pour vous assurer qu’il est correctement connecté. Après 10 minutes, vérifiez si le robot s’allume. \nSi le problème persiste, veuillez contacter le service après-vente MOVA pour obtenir de l’aide.", "en": ""},
{"m": ["E40 Ultra"], "c": "Fonctions & réglages", "q": "Impossible de revenir à la charge/impossible de trouver la station de charge (applicable aux aspirateurs robots LDS).", "a": "Notre robot est équipé de capteurs de proximité, ce qui lui permet de maintenir une certaine distance avec le mur lors du nettoyage des bords, ce qui est normal.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Fonctions & réglages", "q": "Je veux mettre à jour le micrologiciel.", "a": "1. Assurez-vous que le robot est chargé et allumé.\n2. Assurez-vous que votre réseau Wi-Fi domestique est stable.\n3. Mettez à jour le micrologiciel via Paramètres > Mise à jour du micrologiciel.\n4. Pendant la mise à jour, les lumières du robot clignotent.\n5. Le micrologiciel ne sera mis à jour que si le niveau de la batterie est supérieur à 15 %.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Fonctions & réglages", "q": "Je veux réinitialiser le système ou tous les paramètres.", "a": "1. Lorsque le bouton fonctionne mal ou que vous ne pouvez pas éteindre votre robot, ouvrez le couvercle supérieur de votre robot, appuyez sur le bouton de réinitialisation, et votre robot redémarrera automatiquement.\n2. Note : la réinitialisation du système efface toutes les tâches de nettoyage programmées et les modes de nettoyage, et supprime les connexions au réseau Wi-Fi.", "en": ""},
{"m": ["E40 Ultra"], "c": "Fonctions & réglages", "q": "L'écran de la base indique que le robot est déconnecté.", "a": "1. Le robot n'est PAS allumé et la base ne peut pas se connecter au robot. Appuyez sur le bouton d'alimentation pour mettre le robot sous tension.\n2. Lors du nettoyage, le robot est trop éloigné pour se connecter. Mais le robot fonctionne toujours normalement. Veuillez patienter avant de reconnecter le robot.\n3. Erreur système. Redémarrez votre robot\n4. Si le problème n'est toujours pas résolu, reconnectez votre base sur le robot. Débranchez le câble d'alimentation de la base, rebranchez le câble d'alimentation une fois l'écran éteint. Votre robot se connectera à nouveau à la base.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Fonctions & réglages", "q": "La carte de la maison est incomplète ou certaines zones sont manquantes lors de la cartographie.", "a": "Causes des cartes incomplètes :\n1. Il y a des objets à la porte de la pièce, ou la porte de la pièce n'est pas complètement ouverte. Lorsque votre robot scanne l'entrée, il se trompe en estimant qu'il ne peut pas passer et évite cette zone.\n2. Lorsque le robot effectue un scan et une cartographie, les personnes ou les animaux domestiques qui marchent autour du robot vont induire en erreur le scan et entraîner une création de carte incomplète.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Fonctions & réglages", "q": "Le robot est hors ligne après s'être connecté au réseau.", "a": "1. Vérifiez votre connexion réseau.\n2. Pendant le nettoyage, le robot sera déconnecté lorsqu'il se trouve dans une mauvaise couverture Wi-Fi.\n3. Le robot est déconnecté lorsqu'il ne se trouve pas sur la base et que sa batterie est épuisée.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Fonctions & réglages", "q": "Le robot manque une zone", "a": "1. Le robot ne peut pas entrer dans l'espace étroit à moins qu'il ne soit 2 cm plus large que les deux côtés du robot.\n2. Le robot équipé du capteur à ultrasons est capable de reconnaître le tapis à la porte et n'entrera pas dans cette pièce pendant le nettoyage. Veuillez retirer le tapis.\n3. Si certaines zones se chevauchent sur la carte, le robot risque de ne pas réussir à s'autopositionner et manquer certaines zones pendant le nettoyage. Si c'est le cas, refaites la carte des zones à nettoyer ou restaurez la carte.\n4. Si un tapis à poils hauts ou des câbles se trouvent à l'entrée de la zone à nettoyer, le robot doté de la fonction d'évitement des obstacles évitera cette zone. Veuillez ranger les objets sur le sol avant d'utiliser le robot.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Fonctions & réglages", "q": "Le robot ne peut pas mettre à jour le micrologiciel.", "a": "Causes de l'échec de la mise à jour du micrologiciel\n1. Batterie faible. Le micrologiciel ne peut pas être mis à jour si le niveau de la batterie est inférieur à 15%.\n2. Signal Wi-Fi faible ou hors de portée du Wi-Fi. Si votre robot se trouve dans une zone où le signal Wi-Fi est faible ou hors de portée, la mise à jour peut échouer. Assurez-vous que votre robot et la station d'accueil/base se trouvent dans une bonne portée Wi-Fi.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Fonctions & réglages", "q": "Le robot nettoie une zone à plusieurs reprises.", "a": "1. Si la durée du nettoyage est inférieure à 10 minutes, le robot effectue à nouveau la tâche de nettoyage. (sauf pour le nettoyage d'une pièce sélectionnée)\n2. Si certaines zones se chevauchent sur la carte, le robot risque de ne pas réussir à s'autopositionner et manquer certaines zones pendant le nettoyage. Si c'est le cas, refaites la carte des zones à nettoyer ou restaurez la carte.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Fonctions & réglages", "q": "Les cartes ne sont pas enregistrées/mises à jour.", "a": "1. Pendant la cartographie, le robot apprend et cartographie votre environnement domestique, puis retourne à la station d'accueil/base. La carte ne sera pas enregistrée à moins que la voix vous indique que la cartographie est terminée.\n2. Si le robot est ramené à la station d'accueil/base pendant la cartographie , ou si la cartographie est interrompue, les cartes ne seront pas enregistrées ou mises à jour.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Fonctions & réglages", "q": "Les cartes sont perdues ou se chevauchent.", "a": "1. Si le robot commence à nettoyer après avoir été déplacé, il effectue un auto-positionnement. Si l'autopositionnement échoue, le robot recrée le plan et le plan actuel sera recouvert.\n2. Si le robot est coincé ou glisse, certaines zones de la carte peuvent se chevaucher. Veuillez refaire la carte des zones à nettoyer ou restaurer la carte.", "en": ""},
{"m": ["E40 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi la carte est-elle incomplète après une cartographie rapide ?", "a": "Veuillez nous excuser pour la gêne occasionnée. Veuillez suivre ces étapes de dépannage : \n 1. Vérifiez si les roues motrices sont encombrées de débris. \n 2. Assurez-vous que le capteur LDS tourne normalement. Appuyez doucement sur le couvercle du capteur LDS pour vérifier qu'il remonte correctement. \n 3. Vérifiez si des débris ou des cheveux sont coincés dans le LDS, ce qui pourrait entraîner une mauvaise rotation ou un arrêt de la rotation. Si vous en trouvez, essayez de les retirer. \n 4. Assurez-vous qu'aucun autocollant irrégulier ou déformé, ni aucun objet volumineux ne se trouve sur la surface du robot. \n 5. Appuyez sur le pare-chocs pour vérifier qu'il rebondit correctement. \n 6. Essuyez le capteur laser linéaire et le capteur de reconnaissance IA pour vous assurer qu'ils ne présentent aucune trace de doigts ni de poussière. \n 7. Redémarrez le robot et réessayez. Si le problème persiste, vous devrez peut-être renvoyer le robot pour inspection.", "en": ""},
{"m": ["E40 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi la zone interdite/le mur virtuel ne fonctionne-t-il pas ?", "a": "Nous vous recommandons de vérifier d'abord si la station est bien sous tension. Assurez-vous que les deux extrémités du cordon d'alimentation de la station sont correctement branchées. Ensuite, vérifiez si les contacts de rechargement de la station et du robot sont poussiéreux, car la poussière peut entraîner des anomalies de charge. Veuillez les nettoyer avant l'utilisation. Vous pouvez également vérifier que le robot est correctement aligné avec la station. Vous pouvez placer manuellement le robot devant la station afin de déclencher le retour automatique pour la recharge. Si le problème persiste, vous devrez peut-être renvoyer le robot pour une inspection plus approfondie.", "en": ""},
{"m": ["E40 Ultra"], "c": "Fonctions & réglages", "q": "Puis-je utiliser l'application Mi Home au lieu de l'application MOVAhome ?", "a": "1. Avant que l'aspirateur robot ne commence à réaliser la cartographie, ouvrez toutes les portes de votre maison et rangez vos objets pour garantir un déplacement fluide. \n 2. Les seuils de porte hauts (> 2,2 cm), les sols sombres et une forte lumière directe peuvent entraîner une cartographie incomplète. \n Pour les seuils de porte hauts (> 2,2 cm) : nous vous recommandons de créer des murs virtuels ou d'utiliser des tapis de sol pour simplifier la tâche. \n Pour les sols sombres : nous vous recommandons de les recouvrir de tapis de sol. \n En cas de forte lumière directe : nous vous recommandons de fermer les rideaux ou de choisir un autre moment pour la cartographie. \n 3. Pendant la cartographie, évitez de laisser des personnes ou des animaux suivre le robot de trop près ou d'obstruer le composant LiDAR LDS.", "en": ""},
{"m": ["E40 Ultra"], "c": "Fonctions & réglages", "q": "Que faire en cas d'échec de la configuration réseau ?", "a": "Ce son est normal. Il est émis lorsque le robot déverse rapidement de l’eau pour mouiller la serpillière.", "en": ""},
{"m": ["E40 Ultra"], "c": "Fonctions & réglages", "q": "Échec de la mise à niveau du micrologiciel (applicable à tous les aspirateurs robots).", "a": "Procédez comme suit pour résoudre le problème : \n 1. Si le bac à poussière est plein ou si le filtre est obstrué, nettoyez le bac à poussière et le filtre rapidement. Activez le vidage automatique de la poussière. \n 2. Si la brosse principale est encombrée de débris, retirez-les et nettoyez-la immédiatement. \n 3. Vérifiez si l'évent de vidage automatique du robot est obstrué par des corps étrangers et nettoyez-le si nécessaire.", "en": ""},
{"m": ["L10 Pro"], "c": "Fonctions & réglages", "q": "*Et si le bot ne peut pas créer de cartes / Et si la carte est perdue ?", "a": "R : Le L10 Pro dispose de capacités de reconnaissance environnementale, apprenant automatiquement de nouvelles cartes ou restaurant les anciennes en fonction des informations environnementales environnantes. Après le nettoyage terminé et le retour à la station de charge, la carte sera sauvegardée. Il est recommandé de ne pas déplacer la machine pendant le nettoyage pour assurer une cartographie fluide.", "en": ""},
{"m": ["L10 Pro"], "c": "Fonctions & réglages", "q": "*Invite vocale : Le capteur laser du L DS est-il anormal ?", "a": "R : Veuillez vérifier si la version du firmware de la machine a été mise à jour vers la dernière version. Sinon, veuillez passer à la dernière version et observer. Si vous utilisez déjà la dernière version, veuillez essayer les étapes suivantes : J'ai doucement secoué l'ensemble du capteur laser L DS Après avoir déplacé l'unité principale à la station de recharge, réessayez Si cela ne fonctionne toujours pas, veuillez contacter le service après-vente de Dreame.", "en": ""},
{"m": ["L10 Pro"], "c": "Fonctions & réglages", "q": "Pourquoi la carte du robot est-elle différente d'avant ? Et s'il y a de la confusion, un biais ou des cartes qui se chevauchent ?", "a": "R : 1. Chaos cartographique (biaisé/chevauchement, etc.) 1. Confirmer que la carte a été sauvegardée avec succès (la page de zone affiche une icône de partition et la fonction de zone fonctionne normalement). 2. Éteindre l'interrupteur d'alimentation, redémarrer la machine, puis placer manuellement la machine pour la charger et essayer de restaurer la carte. La récupération a échoué, donc la position du quai de charge a été modifiée et la carte recréée Recommandations d'utilisation : 1. Placez correctement la base de charge contre le mur (assurez-vous de laisser 0,5 m à gauche et à droite de la base de charge et 1 m devant la base sans obstacles). 2. Pendant le fonctionnement du robot aspirateur, ne pas bouger et ne pas assister manuellement le robot aspirateur 3. Si l'environnement domestique présente une lumière directe forte ou des reflets miroirs, cela peut perturber le dessin Lumière directe forte : Il est recommandé de tirer les rideaux ou de reporter le dessin à un autre moment Reflet du miroir : Il est recommandé de couvrir les 15 cm inférieurs 4. Vous pouvez la réinitialiser dans la fonction carte ; la carte sera recréée lors du prochain nettoyage. 5. Vérifier régulièrement les côtés du composant de navigation pour détecter de la saleté et essuyer avec un chiffon ou un mouchoir propre.", "en": ""},
{"m": ["L10 Pro"], "c": "Fonctions & réglages", "q": "Quelles pourraient être les raisons de l'échec de la mise à jour du firmware dans un PP ?", "a": "Lors de la mise à jour du firmware, la batterie de la station de charge de l'unité principale doit être au moins à 15 % en même temps avant que la mise à niveau puisse être effectuée. Vérifiez votre réseau domestique. 7. Problèmes logiciels courants", "en": ""},
{"m": ["L10s Ultra"], "c": "Fonctions & réglages", "q": "Comment mettre à jour le micrologiciel du robot ?", "a": "Via l'application Mi Home ou Dreamehome (robot sur la base, batterie > 15 %). Les boutons du robot clignotent rapidement pendant toute la procédure.", "en": "How should I upgrade the firmware of the robot?"},
{"m": ["L10s Ultra"], "c": "Fonctions & réglages", "q": "Comment restaurer les réglages d'usine ?", "a": "Si le robot ne fonctionne toujours pas normalement après un redémarrage, maintenez le bouton de réinitialisation avec un outil jusqu'à l'annonce « début de restauration des réglages d'usine ».", "en": "How to restore to factory settings?"},
{"m": ["L10s Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi le robot commence-t-il une nouvelle zone avant de finir la précédente ?", "a": "Après la première cartographie, le robot nettoie pièce par pièce. Si ce problème survient, vérifiez le découpage des zones dans l'application et corrigez les éventuelles erreurs.", "en": "Why does the robot start to clean the next zone before finishing the current one?"},
{"m": ["L10s Ultra"], "c": "Fonctions & réglages", "q": "À quoi faut-il faire attention avant un nettoyage ?", "a": "Assurez-vous que le robot est complètement chargé. Rangez l'espace, mettez de côté les objets fragiles et les objets au sol avant le nettoyage.", "en": "What should I pay attention to before cleaning?"},
{"m": ["L10s Ultra"], "c": "Fonctions & réglages", "q": "À quoi sert le laser linéaire et comment l'utiliser ?", "a": "Le laser linéaire aide le robot à reconnaître son environnement et les obstacles, ce qui lui permet d'éviter précisément les chocs et de réduire les risques d'emmêlement, de blocage et de montée accidentelle sur de petits objets. L'évitement d'obstacles est activé par défaut ; vous pouvez le modifier manuellement dans les réglages de l'application.", "en": "What's the function of the line laser?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Avec la reconnaissance de tapis activée, le tapis reste quand même humide", "a": "Le robot reconnaît les tapis (activé par défaut) : dessus, il n'aspire que et relève la serpillière, mais la hauteur de relevage étant limitée (environ 5 mm après un relevage de 7 mm), un tapis épais peut être légèrement effleuré par la serpillière. Pour éviter que le robot n'y monte avec la serpillière, choisissez « éviter les tapis » dans l'application, ou activez le démontage de la serpillière avant les tapis (laisser d'abord laver les zones hors tapis, puis revenir à la base retirer la serpillière), ou définissez une zone interdite.", "en": "When the carpet recognition function is turned on, the carpet will still be wet"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Comment activer le nettoyage stratégique autour de la zone de l'animal ?", "a": "Dans l'édition de la carte, ajoutez les accessoires de l'animal (litière, panier). Après avoir défini l'emplacement, cliquez sur « … » en haut à droite pour accéder aux réglages avancés, puis « Reconnaissance IA » pour activer le nettoyage stratégique autour de l'animal.", "en": "How to use strategic cleaning of pet's surrounding area?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Comment faire si je ne veux pas de séchage ?", "a": "Le robot sèche automatiquement la serpillière en fin de tâche. Pour l'éviter, désactivez le séchage automatique de la serpillière dans l'application ou appuyez sur le bouton de séchage de la base pour l'arrêter ; retirez le tampon pour le laver et le sécher à l'air. S'il ne détecte pas de serpillière, le robot ne lance pas le séchage.", "en": "How to operate if I don't want to dry?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Comment gérer des cartes multi-étages ?", "a": "Le robot n'a pas besoin de déplacer la base plusieurs fois pour la fonction multicartes : pour créer une carte autre que la première, inutile de déplacer la base ; le robot enregistre la 2e/3e/4e carte en revenant à son point d'origine. Dans l'application : icône Carte → Carte multi-étages → Créer une carte.", "en": "How to carry out multi-floor Maps?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Comment mettre en place l'alimentation et l'évacuation d'eau automatiques ?", "a": "Le robot accepte en option un module d'alimentation et d'évacuation d'eau. Un technicien vient l'installer à domicile (vérifiez d'abord que votre logement est adapté à ce module).", "en": "When will the water supply and drainage be implemented?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "S20 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Comment régler la fréquence d'aspiration des poussières ?", "a": "Réglable dans l'application, ou désactivable. Trois modes : 1. Quotidien : le robot vide sa poussière à la base après chaque nettoyage (entretien quotidien). 2. Intelligent : il anticipe l'état du bac pendant le nettoyage et retourne vider intelligemment (idéal avec animaux ou plusieurs tapis). 3. Confort : il vide après 3 tâches de nettoyage (environnements propres ou petits logements).", "en": "How to set dust collection frequency?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Comment utiliser l'assistant vocal ?", "a": "Assistant vocal « OK, Dreame » : 1. Réveil : la fonction est activée par défaut ; dites « OK, Dreame » au robot pour le réveiller. 2. Commandes : dans Assistant vocal → « voir ce que vous pouvez dire » pour lister toutes les commandes ; après réveil, énoncez une commande prise en charge. 3. Exécution : lorsque la commande est bien reconnue, le robot agit et l'annonce vocalement. NB : a) les commandes évoluent, référez-vous à celles listées dans l'application ; b) hors réseau, seules des commandes fixes (consultables dans le tableau) sont reconnues ; connecté, vous pouvez utiliser des formulations similaires.", "en": "How to use the voice assistant?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Comment utiliser la caméra en temps réel ?", "a": "Pour la fonction vidéo, téléchargez l'application Dreame associée au robot. Un QR code se trouve sous le capot du robot : scannez-le pour télécharger.", "en": "How to use real-time camera?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Comment éteindre le robot ou la base ?", "a": "1. En temps normal, la base ne s'éteint pas d'elle-même : elle éteint l'écran et passe en mode basse consommation. 2. Pour l'éteindre complètement, débranchez son cordon d'alimentation. 3. Sans alimentation, le robot ne peut plus se charger et la batterie se videra progressivement. 4. Avant utilisation, branchez d'abord la base et chargez correctement le robot. Il est déconseillé de couper l'alimentation au quotidien.", "en": "How to turn off a robot or base station?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "En mode CleanGenius, les modes quotidien et ultime relavent-ils la serpillière ? (réglages par défaut)", "a": "En mode quotidien, la serpillière n'est pas relavée après détection de salissure, mais un second passage ciblé est effectué sur la zone sale après la tâche en cours. En mode ultime, la serpillière est relavée après détection de salissure, et un second passage ciblé est effectué après la tâche en cours.", "en": "Will both daily and ultimate mode wash and mop again in CleanGenius?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "L'assistant vocal ne se réveille pas", "a": "1. Vérifiez que l'assistant vocal est activé (Application → Robot → Réglages → Assistant vocal). 2. Prononcez « OK, Dreame » de façon claire et régulière. 3. Un bruit ambiant important ou une trop grande distance empêchent le réveil. 4. Le réveil vocal n'est pas pris en charge pendant le lavage de la serpillière et l'aspiration des poussières : évitez de réveiller le robot durant ces tâches. 5. Ne collez pas d'autocollant sur le capot du LDS : il masquerait le microphone. 6. Vérifiez enfin que le micrologiciel est à jour.", "en": "Voice Assistant cannot wake up"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "L'eau chaude ne semble pas atteindre 70 °C / pas d'eau chaude pour laver la serpillière", "a": "Le X40 Ultra lave la serpillière à 70 °C. Le chauffage de l'eau froide prend un certain temps, et le lavage/séchage entraîne des pertes de chaleur. Par sécurité, l'appareil ne chauffe pas si le réservoir manque d'eau.", "en": "user feels hot water does not reach 70 degrees / not hot"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "L'eau de lavage de la serpillière n'est pas chaude", "a": "Le chauffage de l'eau froide prend un certain temps ; au lavage, un peu d'eau froide sort avant l'eau chaude. Il est donc normal que l'eau ne soit pas chaude juste au début du lavage. La température de 70 °C a été mesurée en laboratoire ; la température de sortie réelle dépend aussi de la température ambiante de votre logement. Vous pouvez la régler dans l'application : « … » en haut à droite → Réglages → Réglages de la base → Température de l'eau.", "en": "The water for washing mop is not hot"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "La brosse latérale ne descend pas ou ne tourne pas", "a": "Par défaut, la brosse latérale est relevée et ne descend que lorsqu'elle doit travailler. Elle se relève aussi lors du positionnement, de la recharge, du nettoyage de tapis, de la navigation entre zones, des appels vocaux, etc.", "en": "The edge brush does not descend or rotate"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "La cartographie rapide est incomplète", "a": "Lors de la cartographie rapide, ouvrez complètement toutes les portes (ni fermées ni entrouvertes) et ne restez pas trop près du robot. Si la carte est incomplète, supprimez-la dans la liste et refaites-la. Sans refaire la carte, vous pouvez aussi lancer un nettoyage global sur la carte existante : elle se met à jour automatiquement pour compléter les zones manquantes.", "en": "Quick mapping is incomplete"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "La détection de tapis par ultrasons ne fonctionne pas / le robot monte sur le tapis sans le reconnaître", "a": "L'échec de détection par ultrasons dépend de la matière et de la couleur du tapis (tapis noir, tapis d'éveil…), qui influent sur les ultrasons. Définissez une zone interdite ou ajoutez une zone de tapis (Édition de la carte → Édition tapis → Ajouter un tapis) pour appliquer une stratégie adaptée au sol.", "en": "Ultrasonic carpet recognition is invalid"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "La première cartographie n'est pas terminée : dois-je la refaire ? Comment la compléter ?", "a": "Inutile de refaire la carte : le robot la met automatiquement à jour lors de la prochaine tâche.", "en": "The first mapping was not completed. Do I need to rebuild it?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "La vidéo ne s'ouvre pas : que faire ?", "a": "Basculez le réseau du téléphone du Wi-Fi vers la 4G puis rouvrez la vidéo ; essayez aussi de vous déconnecter et reconnecter à votre compte. Si cela ne suffit pas, désinstallez et réinstallez l'application. En dernier recours, communiquez l'identifiant de votre compte au SAV pour un traitement par le bureau d'études.", "en": "The video can't be opened, how to solve it?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Le contrôle vocal reste peu réactif après la mise à jour du micrologiciel", "a": "Après une mise à jour, un temps d'optimisation est nécessaire. Réessayez plusieurs fois dans un environnement à bon réseau et calme pour une meilleure captation sonore.", "en": "Language control is still insensitive after upgrading the firmware"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Le mode personnalisé relave-t-il et repasse-t-il la serpillière ?", "a": "Non : le mode personnalisé ne prend en charge ni la détection des salissures, ni le relavage/second passage.", "en": "Will it wash and mop again in custom mode?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Le robot identifie à tort un tapis", "a": "Une faible probabilité de mauvaise identification existe au niveau des rails de porte coulissante ou des marches : supprimez manuellement la zone de tapis identifiée par erreur.", "en": "the robot misidentify the carpet"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Le robot parle tout seul alors que personne ne l'a réveillé / des propos non prononcés figurent dans l'historique", "a": "Si le robot parle sans être réveillé : 1. Vérifiez que le micrologiciel est à jour. 2. Désactivez l'assistant vocal, puis redémarrez et observez. 3. Vérifiez l'absence de sources sonores proches ressemblant à « OK, Dreame », qui peuvent le réveiller par erreur. 4. Si le cas se reproduit, signalez le problème via l'application.", "en": "Nobody wake up the robot but it spoke for itself"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Le type de sol est mal identifié (parquet pris pour carrelage et inversement)", "a": "Le robot reconnaît le type de sol pour préserver l'efficacité de nettoyage, mais l'intensité lumineuse peut fausser cette reconnaissance. En cas d'erreur, corrigez manuellement : Édition de la carte → Édition de zone → Type de sol.", "en": "The floor material is automatically identified incorrectly"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Nettoyage des interstices de meubles suspendus (essuyage du rebord extérieur)", "a": "Si la fonction d'essuyage des interstices ne se déclenche pas : 1. Dans l'application, « … » en haut à droite → Réglages → « Réglage des bords bioniques », activez-le, puis « Réglage du lavage des bords bionique » et « Essuyer l'interstice ». 2. Des conditions de dimensions doivent être réunies : hauteur du meuble suspendu > 1,5 cm et profondeur du creux > 2,5 cm. 3. Les bords en verre miroir, noir ou transparent ne déclenchent pas la détection d'interstice et peuvent être essuyés à la main.", "en": "Hanging cabinet with gaps, reaching out to wipe the outer hem"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Peut-on revenir à une version antérieure du micrologiciel ?", "a": "Non : la dernière version du micrologiciel est désormais déployée pour tous et l'option de rétrogradation est désactivée. Cette dernière version améliore l'expérience globale ; nous vous invitons à l'utiliser sur une plus longue période.", "en": "Is it possible to downgrade firmware?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi l'application affiche-t-elle plus de tapis qu'en réalité / la zone ajoutée n'est pas nettoyée tout près ?", "a": "C'est normal. Pour faciliter l'édition et rendre l'affichage plus esthétique, l'application inclut la zone adjacente au tapis, qui apparaît donc plus grande que le tapis réel. Le robot bascule entre aspiration et lavage selon l'état réel du sol et ne manque jamais de laver le sol : utilisez la fonction en toute confiance.", "en": "Why are there more carpets displayed on the app than the actual ones?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi la brosse latérale ne travaille-t-elle pas sur le tapis / comment la faire nettoyer le tapis ?", "a": "Pour éviter de salir de nouveau le tapis, le robot relève automatiquement la brosse latérale sur le tapis et n'y effectue pas de balayage. Si le client demande que la brosse latérale travaille sur le tapis : cette demande a été remontée ; la solution arrivera dans une future mise à jour, merci de patienter.", "en": "Why doesn't the carpet brush work while sweeping?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi la carte ne se charge pas ou affiche du contenu manquant (trajectoires, réglages personnalisés, icônes IA) ?", "a": "Causes liées au réseau et aux serveurs : 1. Placez le robot dans une zone à bon signal Wi-Fi. 2. Un signal faible ou instable ralentit le chargement de la carte. Essayez : quittez l'application Dreamehome et rouvrez-la (fermeture complète en arrière-plan) ; videz son cache. Si cela ne suffit pas, désinstallez et réinstallez l'application, puis autorisez le stockage dans les réglages. iOS : videz le cache dans les réglages généraux de l'application. Android : videz le cache de l'application.", "en": "Why does the map always fail to load or content is missing?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi la durée de déploiement de la brosse latérale est-elle si courte ?", "a": "La brosse latérale ne se déploie que dans certains cas : 1. En fonctionnement, à la détection d'un angle droit dans le logement ; elle se rétracte dès que le robot quitte cet angle. 2. Lors du nettoyage des bords, sous les meubles bas (concavité sous le meuble), à conditions remplies : profondeur de la concavité > 2,5 cm et hauteur > 1,5 cm.", "en": "Why is the duration of external expansion of side brush so short?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi la reconnaissance IA des salissures est-elle imprécise ?", "a": "1. Activez le mode intelligent piloté et l'option « Reconnaissance des salissures » (Application → « … » → Réglages → Nettoyage du sol). 2. Une fois le robot connecté, mettez le micrologiciel à jour. 3. La reconnaissance IA détecte les salissures brun foncé (sauce soja, cola, vin rouge, ketchup…) ; les salissures claires ou peu contrastées peuvent ne pas être détectées.", "en": "Why is the machine AI's ability to recognize stains inaccurate?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi la reconnaissance des particules échoue / l'aspiration maximale ne se déclenche pas sur de grosses particules ?", "a": "Pour une faible quantité de particules (ex. un peu de litière), la reconnaissance IA est plus difficile. Activez manuellement l'aspiration maximale pour un nettoyage en profondeur du sol.", "en": "Why does particle recognition fail?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi la vraie photo de l'obstacle ne se charge-t-elle pas ?", "a": "Pour préserver votre vie privée, le robot n'envoie les photos au serveur que lorsque vous cliquez pour les voir : chaque photo suit le processus application → serveur → robot → serveur → application, d'où un chargement parfois lent. Une fois la première image chargée, les suivantes s'affichent bien plus vite.", "en": "Why is there an obstacle, but it can't load the real photo?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi la zone interdite / le mur virtuel ne fonctionne pas ?", "a": "Cinq causes possibles : 1. Carte mal enregistrée ou zone mal définie : vérifiez dans l'application que la carte existe et que vous avez validé la zone par « √ » après l'avoir tracée. 2. Grand logement à réseau instable : si le robot n'était pas connecté au Wi-Fi lors de la définition, la zone n'a pas été enregistrée. 3. En phase de positionnement, le robot peut entrer dans la zone interdite ; une fois positionné, il n'y entre plus. 4. Vérifiez que la carte n'est pas déformée ou superposée ; le cas échéant, restaurez-la.", "en": "Why is the set No-Go zone/virtual wall invalid?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "S20 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi le bras robotisé se déploie-t-il en permanence ?", "a": "Vérifiez si le « mode haute fréquence » est sélectionné dans « Réglages de lavage intelligent → Bord bionique » : dans ce mode, le robot déploie le bras à chaque tâche. Passez en « mode intelligent » ou « mode quotidien » pour réduire la fréquence de déploiement. Par ailleurs, lors d'une tâche « globale », le robot commence par le nettoyage des bords, durant lequel le bras se déploie constamment.", "en": "Why does the robotic arm keep swinging out?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi le bras se déploie-t-il en continu lors d'un appel ou d'un nettoyage de zone ?", "a": "En mode haute fréquence, le robot se déploie toujours vers l'extérieur. En modes intelligent et quotidien, il se déploie en continu lors des boutons de nettoyage local / appels, sans modifier l'intervalle de déploiement. Le nettoyage des zones désignées/sélectionnées reste inchangé dans ces deux modes.", "en": "Why does the summon/local cleaning keep swinging out?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi le découpage en zones est-il inexact ?", "a": "Si le mobilier, sa disposition ou les encadrements de porte sont trop similaires, le découpage peut être anormal. Renommez la zone concernée, ou fusionnez puis redécoupez à nouveau les zones de votre logement.", "en": "Why is the robot zoning inaccurate?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi le mode Extrême semble-t-il long avec une efficacité faible ?", "a": "En mode « ultime », le robot effectue des passages plus denses et plus lents dans toute la maison, avec un nettoyage renforcé des zones facilement sales (tables, chaises). Adapté au nettoyage en profondeur des grandes surfaces. Si votre logement est peu sale et que ce mode vous paraît long, passez au mode quotidien ou au nettoyage personnalisé, plus adaptés à un entretien rapide au quotidien.", "en": "Extreme Mode feels time is too long and cleaning efficiency is low"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi le nettoyage des angles est-il médiocre ?", "a": "Dans l'application (page de l'appareil → « … » → Réglages → « Réglage des bords bioniques »), activez « Balayage bionique dans les coins », « Lavage bionique jusqu'au bord » et « Insérer et essuyer », et réglez la fréquence sur « Élevée » pour améliorer le nettoyage des bords. Si un angle est sale ou taché, délimitez manuellement une zone sale (sélection/zonage), passez en mode personnalisé et réglez des paramètres d'aspiration/lavage adaptés à cette zone.", "en": "Why is the cleaning effect of the machine's corners not good?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi le robot garde-t-il une distance avec le mur lors du nettoyage des bords ?", "a": "1. Le robot est équipé de capteurs de bord qui maintiennent une certaine distance avec le mur — c'est normal. 2. Il gère un longement dynamique intelligent : une fois activé, le capteur de bord droit détecte la limite, réduit la distance et accentue le mouvement de torsion du corps pour couvrir les zones manquées le long des bords et réduire les espaces non nettoyés près du mur.", "en": "reason for the distance from the wall when cleaning along the edge"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi le robot lave-t-il la serpillière si souvent ?", "a": "En mode CleanGenius, le robot retourne s'auto-nettoyer par pièce ; pour de petites surfaces, il lave aussi la serpillière afin d'éviter de salir la pièce suivante. Pour réduire la fréquence, ajustez la fréquence de retour au lavage dans les réglages d'auto-nettoyage du mode personnalisé (Appareil → Nettoyage personnalisé → Fréquence de retour au lavage).", "en": "Why has the robot been washing mop pad so often?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi le robot manque-t-il l'aspiration/le lavage autour des pieds de table et de canapé ?", "a": "Le robot utilise un bras robotisé bionique et une stratégie d'essuyage des bords et angles ; les robots existants ne nettoient pas les pieds de meuble jusqu'au bord. Passez au mode de nettoyage ultime dans l'application, qui nettoie de façon ciblée les pieds de table et de chaise.", "en": "Why do robots miss vacuuming and mopping table legs, sofa legs?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi le robot n'atteint pas la pièce indiquée par la commande vocale (ex. nettoyer le salon) ?", "a": "1. Le nom de pièce dans la commande (« salon ») renvoie au nom donné sur la carte de l'application, qui peut ne pas correspondre à la pièce réelle. 2. Si le robot ne va pas dans la bonne pièce, vérifiez son nom dans Application → Gestion de la carte → Édition. 3. Seuls les noms de pièces existants sont reconnus vocalement ; consultez-les dans Application → Gestion de la carte → Édition → Renommer.", "en": "Why can't I reach the designated room for cleaning when voice control is used?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi le robot n'atteint-il pas le meuble indiqué par ma commande vocale ?", "a": "1. Le meuble nommé dans la commande (« sous le lit ») renvoie aux informations ajoutées dans la carte 3D, qui peuvent ne pas correspondre à l'emplacement réel. 2. Si le robot n'atteint pas le bon endroit, vérifiez l'emplacement du meuble dans la carte 3D. 3. Seuls les noms de meubles existants sont reconnus vocalement ; consultez-les dans Carte 3D → Décoration → Type de meuble.", "en": "Why doesn't the robot reach the furniture location per my voice commands?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi le robot se déploie-t-il alors qu'il n'y a pas de mur ?", "a": "En mode quotidien, le robot ne se déploie pas systématiquement face aux angles droits, pieds de meuble ou murs virtuels. Après avoir défini un mur virtuel, un temps d'adaptation est nécessaire et le robot peut encore effectuer le mouvement de déploiement quelque temps.", "en": "Why is there no wall, but the machine is still swinging out?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi le robot évite les tapis en nettoyage mais pas au relavage/retour à la base ?", "a": "L'évitement des tapis fonctionne pendant le travail, mais pas pendant le relavage ni le retour à la base. Définissez une « zone de lavage interdite » dans l'application pour empêcher le robot d'utiliser le tapis en mode lavage.", "en": "Why can robots avoid carpets during cleaning, but not during backwashing/recharging?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi le réveil vocal n'est-il pas pris en charge pendant le lavage de la serpillière ?", "a": "Pendant le lavage, le robot et la base enchaînent l'arrivée d'eau, le lavage puis le pompage, ce qui génère du bruit et réduit le taux de reconnaissance des commandes vocales. Attendez la fin du lavage avant de réveiller le robot pour lui donner des commandes.", "en": "Why don't the robot support wake-up when washing mop?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi le trajet devient-il chaotique sur les tapis et paillassons fins ?", "a": "Un tapis/paillasson fin et à surface lisse peut être reconnu de façon instable. Définissez manuellement une zone de tapis (Gestion de la carte → Édition tapis → Ajouter un tapis) ou une zone interdite (Gestion de la carte → Zone interdite / mur virtuel → zone interdite d'aspiration et de lavage) pour améliorer l'efficacité du robot.", "en": "Why is the cleaning path chaotic when the robot encounters thin carpets and floor mats?"},
