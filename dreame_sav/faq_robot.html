{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi mes commandes vocales ne sont-elles pas exécutées correctement ?", "a": "1. Vérifiez que votre commande figure dans la liste des compétences vocales prises en charge (« … » en haut à droite → Assistant vocal → « voir ce que vous pouvez dire »). 2. Parlez de façon claire, régulière et pas trop vite. 3. Un bruit ambiant fort ou une trop grande distance empêchent la reconnaissance ; vérifiez l'historique des échanges vocaux dans l'application et, au besoin, montez le volume et réessayez.", "en": "Why can't the instructions I gave to the robot be executed correctly?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi n'ai-je pas reçu la dernière mise à jour ?", "a": "1. Pour garantir la stabilité, une nouvelle version est d'abord déployée sur une petite zone, puis progressivement étendue. Quand elle arrive dans votre région, l'application vous le signale. Activez la mise à jour automatique. 2. Si le client souhaite malgré tout mettre à jour par anticipation, guidez-le pour partager la machine et se connecter au réseau interne de mise à jour.", "en": "Why haven't I received the latest version/version update?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi n'y a-t-il pas d'affichage d'état pendant la stérilisation UV ?", "a": "En usage normal, le voyant de la base est blanc. S'il est bleu fixe, la lampe de stérilisation UV fonctionne. Après le lavage et le séchage de la serpillière, la lampe UV s'allume automatiquement (option activée par défaut dans l'application), et le voyant de la base passe au bleu fixe.", "en": "Why is there no status display during UV sterilization process?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi ne peut-on pas écouter de la musique pendant le nettoyage ?", "a": "Le robot ne prend pas en charge la lecture de musique : la rotation de la serpillière et l'aspiration génèrent du bruit, rendant l'expérience musicale médiocre.", "en": "Why can't you clean the floor while listening to music?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi ne puis-je pas utiliser une fonction annoncée (ex. nettoyer la table) ?", "a": "1. Certaines fonctions ne sont pas disponibles au lancement du produit et arrivent par mise à jour OTA. 2. Vérifiez la version et mettez à jour le micrologiciel : Application → Réglages du robot → Réglages → Mise à jour du micrologiciel.", "en": "Why can't I use the function you advertised?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi un petit halo de lumière verte apparaît-il lors de l'usage de la vidéo ?", "a": "Il s'agit du reflet de l'objectif IA du robot, comparable au reflet d'un objet posé dans une voiture qui se projette sur le pare-brise. Cela n'affecte en rien le fonctionnement normal du robot.", "en": "small aperture with green light when using the video function"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi, avec le déploiement de la serpillière, l'écart entre les deux serpillières est-il grand ?", "a": "Le robot utilise un bras robotisé bionique qui déploie la serpillière pour nettoyer bords et angles. Une petite bande entre les deux serpillières peut ne pas être lavée immédiatement — c'est normal. Le robot longe d'abord les bords puis nettoie en zigzag, ce qui repasse ensuite sur ces zones.", "en": "Why use the mop swing-out function, the gap between the mops is large?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi, en mode CleanGenius, le second passage ne démarre-t-il qu'après le nettoyage global plutôt que pièce par pièce ?", "a": "CleanGenius vise d'abord à terminer en une fois la tâche globale (ou de la zone sélectionnée), puis à effectuer un second passage ciblé. Si le robot lavait la serpillière dès qu'une pièce est détectée sale, la tâche en cours risquerait de ne pas s'achever complètement.", "en": "Why does secondary cleaning only start after global cleaning in CleanGenius?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi, en mode CleanGenius, le sol paraît sale sans déclencher de second passage ?", "a": "Le robot évalue d'abord si la serpillière est propre, puis si la zone correspondante l'est. Si une zone paraît sale sans second passage, c'est que la serpillière est jugée propre. Pour préserver le réservoir d'eau propre, le nombre de seconds passages est limité à un par tâche (jamais trois). Vous pouvez lancer un nettoyage de zone sélectionnée.", "en": "home looks dirty in CleanGenius mode but no secondary cleaning"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Présentation de la carte Wi-Fi", "a": "Le robot mesure en temps réel la force du signal Wi-Fi pendant le travail et affiche cette force ainsi que l'emplacement du routeur sur la carte. Consultez-la via Gestion de la carte → Carte Wi-Fi.", "en": "Introduction about WIFI map"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Présentation de la gestion Wi-Fi", "a": "Si votre logement compte plusieurs routeurs, ajoutez-les dans la gestion Wi-Fi : le robot bascule automatiquement sur le signal le plus fort pour fonctionner correctement.", "en": "Introduction about WIFI management"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Quand le voyant de la base s'éteint-il ?", "a": "Dix minutes après la charge complète du robot sur la base, le voyant s'éteint automatiquement (sauf pendant une tâche). En mode « Ne pas déranger », le voyant du robot s'éteint après 30 secondes et celui de la base également.", "en": "When does the base station light go out?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Que faire si l'IA identifie mal les obstacles / si leur nombre ne correspond pas ?", "a": "Deux cas : 1. Le nombre affiché diffère de la réalité : pour garder la carte lisible, le système regroupe les obstacles de même type trop proches et n'affiche qu'une icône, bien que tous soient reconnus. Le robot les évite tous. 2. Le type affiché diffère : (a) l'intensité lumineuse influe sur la précision — assurez un éclairage suffisant et le type sera mis à jour au passage suivant ; (b) la variété des obstacles domestiques peut causer des erreurs, mais le robot s'améliore par apprentissage — mettez le micrologiciel à jour régulièrement.", "en": "What if AI mistakenly identifies it? / obstacles inconsistent"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Que faire si l'appel du robot par la voix (« viens nettoyer », « OK Dreame, viens laver ») échoue ?", "a": "1. Assurez-vous que le robot est dans la même pièce que vous et visible. 2. Restez à moins de 5 m pour le contrôle vocal. NB : a) sous un canapé ou un lit, la caméra IA peut ne pas vous reconnaître, réduisant le taux de réussite de l'appel ; b) de nombreux obstacles entre vous et le robot réduisent également ce taux.", "en": "can't be found by summoning the robot to clean"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Que faire si la carte est superposée ou déformée ?", "a": "Replacez le robot sur la base et redémarrez-le pour voir si la carte d'origine se restaure ; sinon, cliquez sur « Gestion de la carte » → Restaurer la carte. Pour éviter le problème, vérifiez : 1. des pièces ou un mobilier trop similaires ; 2. un blocage pendant le nettoyage (roues motrices entourées de corps étrangers) ; 3. un débit d'eau ou un dosage de nettoyant excessif faisant patiner/tourner le robot sur place ; 4. que le LDS tourne normalement (touchez légèrement son capot pour vérifier le rebond).", "en": "What if the map is overlapped or distorted?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Que faire si le robot monte sur le tapis pendant le lavage ?", "a": "1. Par défaut, la reconnaissance de tapis est activée : le robot identifie le tapis, relève la serpillière et augmente l'aspiration — c'est normal. 2. Pour qu'il n'y monte pas, choisissez « éviter les tapis » dans l'application. 3. Le robot peut aussi démonter la serpillière avant les tapis : laissez-le d'abord laver les zones hors tapis, puis revenir à la base retirer la serpillière. 4. Si la reconnaissance est imprécise, désactivez-la et définissez manuellement des zones de lavage interdites sur la carte.", "en": "What if the robot go up the floor carpet when mopping?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Que faire si un tapis fin et léger est mal identifié et se retrousse ?", "a": "Ce type de tapis adhère mal au sol ; sur carrelage, une forte aspiration peut le retrousser. Définissez manuellement une zone de tapis (Gestion de la carte → Édition tapis → Ajouter un tapis) ou une zone interdite (Gestion de la carte → Zone interdite / mur virtuel). Vous pouvez aussi fixer le tapis pour éviter qu'il ne se coince dans le robot.", "en": "light and thin floor mat cannot be easily identified and may curl up"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Quelle différence entre le mode quotidien et le mode ultime de CleanGenius ?", "a": "Mode quotidien pour peu de salissures, mode ultime pour beaucoup. Le quotidien économise l'eau, l'ultime nettoie davantage. Quotidien : détection des salissures et second passage sur les zones très sales après le nettoyage global ; idéal pour l'entretien courant. Ultime : détection des salissures avec relavage de la serpillière dès qu'une salissure est détectée, second passage ciblé sur les zones sales, passages plus denses dans toute la maison et vitesse plus lente ; nettoyage renforcé des zones facilement sales (tables, chaises) ; adapté au nettoyage en profondeur. Activez d'abord la reprise du nettoyage avant d'utiliser ce mode.", "en": "difference between daily mode and ultimate mode in CleanGenius"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "S20 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Suggestions d'amélioration", "a": "Merci pour vos suggestions, que nous transmettrons à notre équipe produit. Dans l'assistant vocal, cliquez sur « voir ce que vous pouvez dire » pour découvrir toutes ses fonctions ; nous continuons à les enrichir.", "en": "Suggests"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Un appareil partagé peut-il utiliser la fonction vidéo ?", "a": "Oui, à condition que le compte principal ait activé l'autorisation de la fonction (activable lors du partage de l'appareil).", "en": "Can the shared device use the video function?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "À quoi sert la fonction « seuil » ?", "a": "Elle aide le robot à franchir efficacement un seuil ou un rail de porte coulissante de votre logement. Créez un seuil virtuel dans l'application (Édition de la carte → Seuil → Ajouter un seuil). À ne pas placer près des escaliers ou d'autres zones à risque de chute.", "en": "What is the function of threshold?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Fonctions & réglages", "q": "Échec de la mise à jour du micrologiciel", "a": "La mise à jour exige que le robot soit en charge avec une batterie ≥ 15 %. 1. Retirez le robot de la base, éteignez puis rallumez, attendez l'annonce « début de charge » et réessayez. 2. Si la batterie est faible ou vide, chargez environ 2 heures avant de mettre à jour. 3. Placez le robot et la base dans une zone à bon réseau (près du routeur) ou passez le téléphone en 4G, puis réessayez, pour éviter un dépassement de délai de téléchargement.", "en": "Firmware upgrade failed"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Après la mise à jour du micrologiciel, le contrôle vocal reste peu réactif et les réponses peu claires", "a": "Après une mise à jour, un temps d'optimisation est nécessaire. Réessayez plusieurs fois la captation sonore dans un endroit à bon réseau et calme.", "en": "After upgrading firmware, voice control is still insensitive"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Comment activer le nettoyage stratégique autour de l'animal ?", "a": "Dans l'édition de la carte, ajoutez les accessoires de l'animal (litière, panier). Après avoir défini l'emplacement, cliquez sur « … » en haut à droite pour accéder aux réglages avancés, puis « Reconnaissance IA » pour activer le nettoyage stratégique autour de l'animal.", "en": "How to use strategic cleaning around pets"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Comment expliquer une mauvaise identification des tapis ?", "a": "Une faible probabilité de mauvaise identification existe au niveau des rails de porte coulissante : supprimez manuellement la zone de tapis identifiée par erreur.", "en": "How to explain the misidentification of carpets"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Comment faire si je ne veux pas de séchage ?", "a": "Le robot sèche automatiquement la serpillière en fin de tâche. Pour l'éviter, arrêtez le séchage depuis l'application ou appuyez sur le bouton de séchage de la base ; retirez le tampon pour le laver et le sécher.", "en": "How to operate if you don't want to dry it"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Comment gérer une cartographie multi-étages ?", "a": "Le robot n'a pas besoin de déplacer la base plusieurs fois : pour créer une carte autre que la première, inutile de déplacer la base ; le robot enregistre la 2e/3e carte en revenant à son point d'origine. Dans l'application : icône Carte → Carte multi-étages → Créer une carte.", "en": "How to perform multi-layer mapping"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Comment mettre en place l'alimentation et l'évacuation d'eau automatiques ?", "a": "Le robot accepte en option un module d'alimentation et d'évacuation d'eau. Un technicien vient l'installer à domicile (vérifiez d'abord que votre logement est adapté à ce module).", "en": "When will water supply and drainage be implemented?"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Comment savoir s'il y a de l'eau chaude ?", "a": "Activez d'abord la fonction lavage à l'eau chaude, puis lancez l'auto-nettoyage de la base : elle utilise de l'eau à 58 °C durant ce cycle. Vous pouvez le vérifier avec une brosse (ne touchez pas avec les mains pour éviter les brûlures).", "en": "How does the user know if there is hot water?"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Comment utiliser l'assistant vocal « OK, Dreame » ?", "a": "1. Réveil : la fonction est activée par défaut ; dites « OK, Dreame » au robot. 2. Commandes : dans Assistant vocal → « voir ce que vous pouvez dire » pour lister toutes les commandes ; après réveil, énoncez une commande prise en charge. 3. Exécution : lorsque la commande est bien reconnue, le robot agit et l'annonce. NB : les commandes évoluent (voir l'application) ; hors réseau, seules des commandes fixes sont reconnues.", "en": "How to use the voice assistant?"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Comment utiliser la vidéo ?", "a": "Pour la fonction vidéo, téléchargez l'application Dreame et associez-la au robot. Un QR code se trouve sous le capot du robot : scannez-le pour télécharger.", "en": "How to use video?"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Comment éteindre le robot ou la base ?", "a": "1. En temps normal, la base ne s'éteint pas d'elle-même : elle éteint l'écran et passe en basse consommation. 2. Pour l'éteindre complètement, débranchez son cordon (déconseillé au quotidien). 3. Sans alimentation, le robot ne peut plus se charger et la batterie se videra. 4. Avant utilisation, branchez d'abord la base et chargez le robot.", "en": "How to turn off the robot or base station?"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "En mode intelligent piloté, quelle différence entre le mode quotidien et le mode extrême ?", "a": "Quotidien pour peu de salissures, extrême pour beaucoup. Le quotidien économise l'eau, l'extrême nettoie davantage. Quotidien : détection des salissures et second passage sur les zones très sales après le nettoyage global ; idéal pour l'entretien courant. Extrême : détection des salissures avec relavage de la serpillière, second passage ciblé sur les zones sales après la tâche, passages plus denses et plus lents, nettoyage renforcé des zones facilement sales (tables, chaises) ; adapté au nettoyage en profondeur.", "en": "difference between daily mode and extreme mode in smart roboting"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "L'application affiche plus de tapis qu'en réalité / la zone autour du tapis n'est pas nettoyée", "a": "C'est normal. Pour faciliter l'édition et rendre l'affichage plus esthétique, l'application inclut la zone adjacente au tapis, qui apparaît plus grande que le tapis réel. Le robot bascule entre aspiration et lavage selon l'état réel du sol et ne manque jamais de laver le sol.", "en": "carpet displayed on the APP is larger than actual"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "L'eau chaude ne semble pas atteindre 60 °C / pas d'eau chaude pour laver la serpillière", "a": "Le robot lave la serpillière à 60 °C. Le chauffage de l'eau froide prend un certain temps, et le lavage/séchage entraîne des pertes de chaleur. Par sécurité, l'appareil ne chauffe pas si le réservoir manque d'eau : ajoutez de l'eau propre jusqu'au flotteur puis testez.", "en": "hot water does not reach 60 degrees"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "La carte est superposée ou désordonnée", "a": "Replacez le robot sur la base et redémarrez pour voir si la carte d'origine se restaure ; sinon, cliquez sur « Gestion de la carte » → Restaurer la carte. Pour éviter le problème : 1. vérifiez que les pièces ou le mobilier ne sont pas trop similaires ; 2. vérifiez l'absence de blocage pendant le nettoyage (roues motrices entourées de corps étrangers) ; 3. un débit d'eau ou un dosage de nettoyant excessif fait patiner/tourner le robot sur place.", "en": "Maps are overlaid or messed up"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "La cartographie rapide est incomplète", "a": "Ouvrez complètement toutes les portes (ni fermées ni entrouvertes) et ne restez pas trop près du robot. Si la carte est incomplète, supprimez-la dans la liste et refaites-la. Sans refaire la carte, vous pouvez aussi lancer un nettoyage global sur la carte existante : elle se complète automatiquement.", "en": "Quick mapping map is incomplete?"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "La détection de tapis par ultrasons échoue / le robot monte sur le tapis sans le reconnaître", "a": "L'échec de détection par ultrasons dépend de la matière et de la couleur du tapis (tapis noir, tapis d'éveil…). Définissez une zone interdite ou ajoutez une zone de tapis (Carte → Édition tapis → Ajouter un tapis) pour appliquer une stratégie adaptée au sol.", "en": "Ultrasonic carpet recognition fails"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "La fonction vidéo peut-elle être utilisée sur un appareil partagé ?", "a": "Oui, il suffit d'activer l'autorisation de la fonction depuis le compte principal.", "en": "Can video functionality be used on a shared device?"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "La première cartographie n'est pas terminée : dois-je la refaire ?", "a": "Inutile de refaire la carte : le robot la met automatiquement à jour lors de la prochaine tâche.", "en": "first map creation was not complete, do I need to re-create?"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "La vidéo ne s'ouvre pas : que faire ?", "a": "Assurez-vous d'abord que l'application est à jour. Basculez le réseau du téléphone du Wi-Fi vers la 4G puis rouvrez la vidéo ; essayez aussi de vous déconnecter et reconnecter à votre compte. Si cela ne suffit pas, désinstallez et réinstallez l'application. En dernier recours, communiquez l'identifiant de votre compte et le journal au SAV (Mon compte → Centre d'aide → Retour → Journal de l'application).", "en": "The video cannot be opened"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "La zone interdite : paroles de réassurance", "a": "Si le mobilier, sa disposition ou les encadrements de porte sont trop similaires, le découpage peut être anormal. Renommez la zone concernée, ou fusionnez puis redécoupez à nouveau les zones de votre logement.", "en": "The district prohibits explanations of comforting words"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Le longement des bords semble inefficace : paroles de réassurance", "a": "Le robot atteint déjà une faible distance au lavage des bords ; plus près, il y aurait risque de collision. La brosse latérale dépasse du corps et nettoie le long des bords, à droite, pour ramener la poussière — ce qui répond aux besoins normaux d'un foyer.", "en": "The mop welt is ineffective, soothing words"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Le mode extrême semble long avec une efficacité faible : comment l'expliquer ?", "a": "En mode ultime, le robot effectue des passages plus denses et plus lents dans toute la maison, avec un nettoyage renforcé des zones facilement sales (tables, chaises) ; adapté au nettoyage en profondeur. Si votre logement est peu sale et que ce mode vous paraît long, passez au mode quotidien ou au nettoyage personnalisé, plus adaptés à un entretien rapide.", "en": "extreme mode takes too long and efficiency is low"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Le robot parle tout seul alors que personne ne l'a réveillé", "a": "1. Vérifiez que le micrologiciel est à jour. 2. Désactivez l'assistant vocal, puis redémarrez et observez. 3. Vérifiez l'absence de sources sonores proches ressemblant à « OK, Dreame », qui peuvent le réveiller par erreur. 4. Si le cas se reproduit, signalez le problème via l'application.", "en": "robot speaks on its own, nobody wakes it up"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Le robot évite les tapis en nettoyage mais pas au relavage/retour à la charge", "a": "L'évitement des tapis fonctionne pendant le travail, mais pas pendant le relavage ni le retour à la base. Définissez une « zone de lavage interdite » dans l'application pour empêcher le robot de monter sur le tapis en mode lavage.", "en": "Can avoid carpets when cleaning, but does not avoid carpets when backwashing/recharging"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Le type de sol est mal identifié (parquet pris pour carrelage et inversement)", "a": "Le robot reconnaît le type de sol pour préserver l'efficacité de nettoyage, mais l'intensité lumineuse peut fausser cette reconnaissance. En cas d'erreur, corrigez manuellement : Édition de la carte → Édition de zone → Type de sol.", "en": "automatic recognition of floor material is wrong"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Les tapis fins et légers sont difficiles à identifier et peuvent se retrousser", "a": "Ce type de tapis adhère mal au sol ; sur carrelage, une forte aspiration peut le retrousser. Définissez manuellement une zone de tapis (Gestion de la carte → Édition tapis → Ajouter un tapis) ou une zone interdite (Gestion de la carte → Zone interdite / mur virtuel). Vous pouvez aussi fixer le tapis pour éviter qu'il ne se coince dans le robot.", "en": "Thin and light floor mats are difficult to identify and may be rolled up"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Les tapis/paillassons fins rendent le trajet de nettoyage chaotique", "a": "Un tapis/paillasson fin et à surface lisse peut être reconnu de façon instable. Définissez manuellement une zone de tapis (Gestion de la carte → Édition tapis → Ajouter un tapis) ou une zone interdite (Gestion de la carte → Zone interdite / mur virtuel → zone interdite d'aspiration et de lavage) pour améliorer l'efficacité du robot.", "en": "Thin carpets/floor mats create messy cleaning paths"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Peut-on revenir à une version antérieure du micrologiciel ?", "a": "Non : la dernière version est déployée pour tous et l'option de rétrogradation est désactivée. Cette version améliore l'expérience globale ; utilisez-la sur une plus longue période.", "en": "Is it possible to downgrade firmware?"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi l'assistant vocal « OK, Dreame » ne se réveille-t-il pas ?", "a": "1. Vérifiez que l'assistant vocal est activé (Application → page de l'appareil → « … » → Réglages → Assistant vocal) et que le micrologiciel est à jour. 2. Après vérification, redémarrez le robot. 3. Prononcez « OK, Dreame » de façon claire et régulière, sans dialecte. 4. Un bruit ambiant important ou une trop grande distance empêchent le réveil.", "en": "Why can't the voice assistant be awakened?"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi la carte ne se charge pas ou affiche du contenu manquant (trajectoires, réglages, icônes IA) ?", "a": "Causes liées au réseau et aux serveurs : 1. Placez le robot dans une zone à bon signal Wi-Fi. 2. Un signal faible ou instable ralentit le chargement. Essayez : quittez l'application Dreamehome et rouvrez-la (fermeture complète) ; videz son cache. Si cela ne suffit pas, désinstallez et réinstallez l'application, puis autorisez le stockage dans les réglages.", "en": "Why the map never loads or content is missing"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi la reconnaissance des particules échoue / l'aspiration maximale ne se déclenche pas sur de grosses particules ?", "a": "Pour une faible quantité de particules (ex. un peu de litière), la reconnaissance IA est plus difficile. Activez manuellement l'aspiration maximale pour un nettoyage en profondeur du sol.", "en": "Why does particulate matter recognition fail?"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi la vraie photo de l'obstacle ne se charge-t-elle pas ?", "a": "Pour préserver votre vie privée, le robot n'envoie les photos au serveur que lorsque vous cliquez pour les voir : chaque photo suit le processus application → serveur → robot → serveur → application, d'où un chargement parfois lent. Une fois la première image chargée, les suivantes s'affichent bien plus vite.", "en": "Why can't real-life photos be loaded?"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi la zone interdite / le mur virtuel ne fonctionne pas ?", "a": "Cinq causes : 1. Carte mal enregistrée ou zone mal définie : vérifiez que la carte existe et que vous avez validé la zone par « √ ». 2. Grand logement à réseau instable : si le robot n'était pas connecté au Wi-Fi lors de la définition, la zone n'a pas été enregistrée. 3. En phase de positionnement, le robot peut entrer dans la zone ; une fois positionné, il n'y entre plus. 4. Vérifiez que la carte n'est pas déformée ou superposée ; le cas échéant, restaurez-la.", "en": "Why do the restricted areas/virtual walls set up fail?"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi le bras se déploie-t-il en continu lors d'un appel ou d'un nettoyage de zone ?", "a": "En mode haute fréquence, le robot se déploie toujours vers l'extérieur. En modes intelligent et quotidien, il se déploie en continu lors des boutons de nettoyage local / appels, sans modifier l'intervalle. Le nettoyage des zones désignées/sélectionnées reste inchangé dans ces deux modes.", "en": "Why do summons/partials keep swinging out?"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi le nettoyage vocal d'un meuble n'atteint-il pas le bon meuble ?", "a": "1. Le meuble nommé dans la commande renvoie aux informations ajoutées dans la carte 3D, qui peuvent ne pas correspondre à l'emplacement réel. 2. Si le robot n'atteint pas le bon endroit, vérifiez l'emplacement du meuble dans la carte 3D. 3. Seuls les noms de meubles existants sont reconnus ; consultez-les dans Carte 3D → Décoration → Type de meuble.", "en": "Why doesn't Voice Furniture Cleaning reach the furniture?"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi le nettoyage vocal d'une pièce n'atteint-il pas la bonne pièce ?", "a": "1. Le nom de pièce dans la commande renvoie au nom donné sur la carte de l'application, qui peut ne pas correspondre à la pièce réelle. 2. Si le robot ne va pas dans la bonne pièce, vérifiez son nom dans Application → Gestion de la carte → Édition. 3. Seuls les noms de pièces existants sont reconnus vocalement ; consultez-les dans Application → Gestion de la carte → Édition → Renommer.", "en": "Why can't room cleaning reach the corresponding room?"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi le robot garde-t-il une distance avec le mur lors du nettoyage des bords ?", "a": "1. Le robot est équipé de capteurs de bord qui maintiennent une certaine distance avec le mur — c'est normal. 2. Il gère un longement dynamique intelligent : une fois activé, le capteur de bord droit détecte la limite, réduit la distance et accentue le mouvement de torsion du corps pour couvrir les zones manquées le long des bords et réduire les espaces non nettoyés près du mur.", "en": "Why is there a distance between the robot and the wall when cleaning along the edge?"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi le robot lave-t-il la serpillière si souvent ?", "a": "En mode intelligent piloté, le robot relave par pièce ; pour de petites surfaces, il lave aussi la serpillière afin d'éviter de salir la pièce suivante. Pour réduire la fréquence, ajustez la fréquence de retour au lavage dans les réglages d'auto-nettoyage du mode personnalisé, ou désactivez le relavage automatique dans l'application.", "en": "Why does he keep washing rags so often?"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi le robot se déploie-t-il alors qu'il n'y a pas de mur ?", "a": "En mode quotidien, le robot ne se déploie pas systématiquement face aux angles droits, pieds de meuble ou murs virtuels. Après avoir défini un mur virtuel, un temps d'adaptation est nécessaire et le robot peut encore effectuer le mouvement de déploiement quelque temps.", "en": "Why is there no wall and the robot is still swinging out?"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi le réveil vocal n'est-il pas pris en charge pendant le lavage de la serpillière ?", "a": "Pendant le lavage, le robot et la base enchaînent l'arrivée d'eau, le lavage puis le pompage, ce qui génère du bruit et réduit le taux de reconnaissance des commandes vocales. Attendez la fin du lavage avant de réveiller le robot.", "en": "Why is wake-up not supported when washing the mop?"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi le tapis reste-t-il humide malgré la reconnaissance de tapis activée ?", "a": "Le robot reconnaît les tapis (activé par défaut) : dessus, il n'aspire que et relève la serpillière, mais la hauteur de relevage étant limitée, un tapis épais peut être légèrement effleuré. Pour éviter que le robot n'y monte avec la serpillière, choisissez « éviter les tapis » dans l'application, ou activez le démontage de la serpillière avant les tapis, ou définissez une zone interdite.", "en": "Why does turning on carpet recognition still wet the carpet?"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi mes commandes vocales ne sont-elles pas reconnues ?", "a": "1. Vérifiez que votre commande figure dans la liste des compétences vocales prises en charge (Assistant vocal → « voir ce que vous pouvez dire »). 2. Parlez de façon claire, régulière et pas trop vite. 3. Un bruit ambiant fort ou une trop grande distance empêchent la reconnaissance ; vérifiez l'historique des échanges vocaux dans l'application et, au besoin, montez le volume et réessayez.", "en": "Why aren't my voice commands recognized?"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi ne peut-on pas écouter de la musique pendant le nettoyage ?", "a": "Le robot ne prend pas en charge la lecture de musique : la rotation de la serpillière et l'aspiration génèrent du bruit, rendant l'expérience musicale médiocre.", "en": "Why can't you listen to music and sweep the floor at the same time?"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi ne puis-je pas utiliser une fonction annoncée (ex. nettoyer sous la table) ?", "a": "1. Certaines fonctions ne sont pas disponibles au lancement du produit et arrivent par mise à jour OTA. 2. Vérifiez la version et mettez à jour le micrologiciel : Application → Réglages du robot → Réglages généraux → Mise à jour du micrologiciel.", "en": "Why can't I use the functions you promote?"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Pourquoi un petit halo apparaît-il lors de l'usage de la vidéo ?", "a": "Il s'agit du reflet de l'objectif IA du robot, comparable au reflet d'un objet posé dans une voiture sur le pare-brise. Cela n'affecte en rien le fonctionnement normal du robot.", "en": "small aperture when using the video function"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Quand le voyant de la base s'éteint-il ?", "a": "Dix minutes après la charge complète du robot sur la base, le voyant s'éteint automatiquement (sauf pendant une tâche). En mode « Ne pas déranger », le voyant du robot s'éteint après 30 secondes et celui de la base également.", "en": "When does the base station light go off?"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Que faire en cas d'échec de configuration réseau ?", "a": "Le robot ne prend en charge que le Wi-Fi 2,4 GHz, pas le 5 GHz. 1. Placez-le dans une zone à bon signal lors de la configuration. 2. Activez la localisation du téléphone et autorisez l'application (ne choisissez pas une région hors de votre pays pour la localisation). 3. En vous connectant au point d'accès du robot, attendez l'annonce vocale puis revenez dans l'application. 4. Utilisez un nom et un mot de passe Wi-Fi en lettres/chiffres, sans caractères spéciaux.", "en": "What should I do if the network distribution fails?"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Que faire si l'IA identifie mal les obstacles / si leur nombre ne correspond pas ?", "a": "Deux cas : 1. Le nombre affiché diffère de la réalité : pour garder la carte lisible, le système regroupe les obstacles de même type trop proches et n'affiche qu'une icône, bien que tous soient reconnus. Le robot les évite tous. 2. Le type affiché diffère : (a) l'intensité lumineuse influe sur la précision — assurez un éclairage suffisant et le type sera mis à jour au passage suivant ; (b) la variété des obstacles domestiques peut causer des erreurs, mais le robot s'améliore par apprentissage — mettez le micrologiciel à jour régulièrement.", "en": "What should I do if AI misrecognizes it?"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Que faire si l'appel du robot par la voix échoue ?", "a": "1. Assurez-vous que le robot est dans la même pièce que vous et visible. 2. Restez à moins de 5 m pour l'appel. NB : a) sous un canapé ou un lit, la caméra IA peut ne pas vous reconnaître, réduisant le taux de réussite ; b) de nombreux obstacles entre vous et le robot réduisent aussi ce taux.", "en": "can't be found when calling for cleaning"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Que faire si le robot lave sur le tapis ?", "a": "1. Par défaut, la reconnaissance de tapis est activée : le robot identifie le tapis, relève la serpillière et augmente l'aspiration — c'est normal. 2. Pour qu'il n'y monte pas, choisissez « éviter les tapis » dans l'application. 3. Le robot peut aussi démonter la serpillière avant les tapis : laissez-le d'abord laver les zones hors tapis, puis revenir à la base retirer la serpillière. 4. Si la reconnaissance est imprécise, désactivez-la et définissez manuellement des zones de lavage interdites sur la carte.", "en": "What should I do if the robot mops the carpet?"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "À quoi sert la carte Wi-Fi ?", "a": "Le robot mesure en temps réel la force du signal Wi-Fi pendant le travail et affiche cette force ainsi que l'emplacement du routeur sur la carte. Consultez-la via Gestion de la carte → Carte Wi-Fi.", "en": "What does wifi map do?"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "À quoi sert la fonction « seuil » ?", "a": "Elle aide le robot à franchir efficacement les seuils de votre logement. Créez un seuil dans l'application (Édition de la carte → Seuil → Ajouter un seuil). À ne pas placer près des escaliers ou d'autres zones à risque de chute.", "en": "What is the role of threshold?"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "À quoi sert la gestion Wi-Fi ?", "a": "Si votre logement compte plusieurs routeurs, ajoutez-les dans la gestion Wi-Fi : le robot bascule automatiquement sur le signal le plus fort pour fonctionner correctement.", "en": "What does wifi management do?"},
{"m": ["S20 Ultra"], "c": "Fonctions & réglages", "q": "Échec de la mise à jour du micrologiciel", "a": "La mise à jour exige que le robot soit en charge avec une batterie ≥ 15 %. 1. Retirez le robot de la base, éteignez puis rallumez, attendez l'annonce « début de charge » et réessayez. 2. Si la batterie est faible ou vide, chargez environ 2 heures avant de mettre à jour. 3. Placez le robot et la base dans une zone à bon réseau (près du routeur) ou passez le téléphone en 4G, puis réessayez, pour éviter un dépassement de délai de téléchargement.", "en": "Firmware upgrade failed (common to robots)"},
{"m": ["X50 Ultra"], "c": "Fonctions & réglages", "q": "Impossible d'ajouter en même temps une zone basse et une zone de rideaux", "a": "Les zones basses et les zones de rideaux ne peuvent pas être ajoutées simultanément : leurs stratégies diffèrent, et les cumuler sur une même zone perturberait le fonctionnement.", "en": "Low rise areas and curtain areas cannot be added simultaneously"},
{"m": ["X50 Ultra"], "c": "Fonctions & réglages", "q": "La reconnaissance IA est imprécise", "a": "Deux cas de fausse identification IA : 1. Le nombre d'obstacles affichés sur la carte ne correspond pas à la réalité : pour garder la carte lisible, le système regroupe par défaut les obstacles de même type trop proches et n'affiche qu'une icône, bien que tous soient reconnus. Le robot les évite tous. 2. Le type d'obstacle affiché diffère de la réalité : (a) l'intensité lumineuse influe sur la précision — assurez un éclairage suffisant et le robot mettra le type à jour au passage suivant ; si une zone très réfléchissante est prise pour un obstacle, cliquez plusieurs fois sur « Ignorer l'obstacle », l'IA s'optimisera après apprentissage ; (b) la variété des obstacles peut causer des erreurs, mais le robot s'améliore par apprentissage continu — pensez à mettre le micrologiciel à jour régulièrement. 3. La confusion sur les seuils au sol ou les baguettes de bureau est également liée à l'éclairage.", "en": "AI recognition is inaccurate"},
{"m": ["X50 Ultra"], "c": "Fonctions & réglages", "q": "Les tapis fins et légers sont mal identifiés et peuvent se retrousser (bords enroulés)", "a": "Ce type de tapis adhère mal au sol. Sur carrelage, il glisse, et une forte aspiration peut le retrousser. Définissez manuellement une zone de tapis (Gestion de la carte → Édition tapis → Ajouter un tapis), ou une zone interdite (Gestion de la carte → Zone interdite / mur virtuel). Vous pouvez aussi fixer le tapis pour éviter qu'il ne se coince dans le robot.", "en": "Thin and light floor mats cannot be easily identified and may roll up"},
{"m": ["X60 Ultra"], "c": "Fonctions & réglages", "q": "Il y a de la place, mais le robot ne passe pas sous les meubles bas", "a": "Réglez la montée/descente automatique du radar supérieur sur « Couverture maximale » dans « Réglages – Réglages de nettoyage du sol », et ajoutez manuellement des « zones basses » dans l'édition de la carte.", "en": "There's enough space, but the machine can't fit under the low furniture"},
{"m": ["X60 Ultra"], "c": "Fonctions & réglages", "q": "La lumière bleue crée une pollution lumineuse : comment l'éteindre ?", "a": "Vous pouvez désactiver l'option « Reconnaissance par lumière active » dans l'application. Attention : sa désactivation réduit la capacité de détection des différentes salissures. Réglez selon vos besoins réels.", "en": "Blue light causes light pollution; how to turn it off?"},
{"m": ["X60 Ultra"], "c": "Fonctions & réglages", "q": "La serpillière n'atteint pas 40 °C", "a": "1. Vérifiez que le mode de lavage est réglé sur : Trempage haute température (lavage à l'eau chaude). Chemin : Réglages – Réglages de la base – Mode de lavage de la serpillière – Température de lavage – Trempage haute température (eau chaude). 2. Selon la température ambiante et celle de l'eau, la température réelle de la serpillière peut être plus basse si l'environnement est froid.", "en": "The mop temperature does not reach 40℃"},
{"m": ["X60 Ultra"], "c": "Fonctions & réglages", "q": "Le robot a simplement contourné des amas de poils d'animaux sans les nettoyer", "a": "Activez les options « Renfort grosses particules » et « Reconnaissance par lumière active » dans l'application : le robot les détectera alors et appliquera une stratégie de nettoyage renforcée.", "en": "walked around the clumps of pet hair that hadn't been cleaned up"},
{"m": ["X60 Ultra"], "c": "Fonctions & réglages", "q": "Les bords ne sont pas bien nettoyés", "a": "Toutes nos excuses. Utilisez le mode « aspiration puis lavage » pour un nettoyage plus minutieux, ou allez dans Application → Réglages → Nettoyage du sol → Couverture des bords bionique → Fréquence, et sélectionnez « Élevée » pour améliorer la couverture des bords et des angles.", "en": "The edges were not cleaned properly"},
{"m": ["X60 Ultra"], "c": "Fonctions & réglages", "q": "Les poils d'animaux au sol ne sont pas reconnus comme tels", "a": "Les poils clairsemés et peu épais sont correctement nettoyés en mode d'aspiration standard. Les amas denses et épais sont détectés et déclenchent une stratégie de nettoyage renforcée. Vérifiez que « Renfort grosses particules » et « Reconnaissance par lumière active » sont tous deux activés dans l'application.", "en": "Ground pet hair was not identified as pet hair"},
{"m": ["X60 Ultra"], "c": "Fonctions & réglages", "q": "Même avec la « Reconnaissance par lumière active » activée, certaines salissures ne sont pas détectées", "a": "1. Mettez le micrologiciel à jour vers la dernière version. 2. Vérifiez que l'option « Reconnaissance des salissures » ou « Renfort grosses particules » est activée. 3. La lumière active ne détecte que les grosses particules, les salissures liquides et les amas de poils d'animaux : vérifiez que la salissure fait partie des cas pris en charge.", "en": "unrecognized stains still occurs after turning on Active Light Enhancement Recognition"},
{"m": ["X60 Ultra"], "c": "Fonctions & réglages", "q": "Même avec la « Reconnaissance par lumière active » activée, des salissures sont détectées à tort", "a": "1. Mettez le micrologiciel à jour vers la dernière version. 2. En raison de l'éclairage et des variations de niveau du sol, de fausses détections restent possibles (faible probabilité). Cliquez sur « Signaler une erreur » : le logiciel améliorera continuellement le modèle de reconnaissance.", "en": "misidentifying stains still occurs after turning on Active Light Enhancement Recognition"},
{"m": ["X60 Ultra"], "c": "Fonctions & réglages", "q": "Un reflet au sol est pris pour une salissure", "a": "Activez « Reconnaissance par lumière active » dans l'application, sous « Réglages – Fonctions expérimentales (Lab) ». Cette fonction réduit fortement les fausses détections.", "en": "Ground reflection misidentified as stain"},
{"m": ["Z10 Pro"], "c": "Fonctions & réglages", "q": "Découvrez-vous que de nouvelles versions de firmware doivent être mises à jour ?", "a": "R : Chaque nouvelle version du firmware inclut des optimisations. Veuillez essayer de mettre à jour rapidement après avoir découvert le nouveau firmware pour garantir la meilleure expérience de nettoyage.", "en": ""},
{"m": ["Z10 Pro"], "c": "Fonctions & réglages", "q": "Quand l'unité principale nettoie, pourquoi nettoie-t-elle la zone à plusieurs reprises après le déménagement ?", "a": "R : Après le déplacement de l'unité principale, elle effectue le repositionnement. Si le repositionnement réussit, le nettoyage continue ; si le repositionnement échoue, le nettoyage reprend.", "en": ""},
{"m": ["Z10 Pro"], "c": "Fonctions & réglages", "q": "Quelles pourraient être les raisons d'une mise à jour du firmware ratée ?", "a": "Lors de la mise à niveau du micrologiciel, la charge de l'unité principale dans la poubelle doit dépasser 15 % pour pouvoir la mettre à niveau. Vérifiez votre réseau domestique.", "en": ""},
{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra"], "c": "Consommables & entretien", "q": "Comment effectuer l'entretien courant du robot ?", "a": "Essuyez les pièces avec un chiffon doux et sec : 1. les quatre capteurs de vide au sol (dessous) ; 2. le capteur infrarouge de décélération à l'avant ; 3. les électrodes de charge (dessous) ; 4. le capteur de suivi de mouvement (dessous). Remplacement du sac à poussière : quand une notification apparaît dans l'application, jetez le sac (tirer sur la poignée le scelle pour éviter que la poussière ne s'échappe), essuyez le filtre avec un chiffon sec, installez un sac neuf et refermez le couvercle.", "en": "How to do the routine maintenance for the robot vacuum?"},
{"m": ["D10 Plus"], "c": "Consommables & entretien", "q": "Comment entretenir la base à vidage automatique ?", "a": "Nettoyer le conduit d'air (s'il est bouché) : 1. Dévissez les vis du couvercle du conduit et retirez-le. 2. Vérifiez l'absence de corps étranger et nettoyez. 3. Réinstallez le couvercle. Remplacer le sac à poussière : selon le voyant (orange clignotant) et l'application, remplacez-le quand il est plein, en général toutes les 4 à 6 semaines (fermez la poignée du sac avant de le retirer).", "en": "How to do the routine maintenance for the Auto-Empty Base?"},
{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra"], "c": "Consommables & entretien", "q": "Comment nettoyer la brosse latérale ?", "a": "1. Retournez le robot, retirez la brosse latérale et nettoyez-la. 2. Réinstallez-la. NB : nettoyez la brosse latérale une fois par mois et remplacez-la tous les 3 à 6 mois.", "en": "How to clean the side brush?"},
{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra"], "c": "Consommables & entretien", "q": "Comment nettoyer la brosse principale ?", "a": "1. Robot retourné, appuyez sur le clip pour retirer le capot de la brosse principale. 2. Sortez la brosse en tirant vers le haut et nettoyez le palier ; retirez les embouts latéraux pour ôter les cheveux emmêlés. 3. Coupez les cheveux enroulés avec l'outil de nettoyage fourni. 4. Réinstallez la brosse et clipsez le capot. NB : nettoyez la brosse chaque semaine et remplacez-la tous les 6 à 12 mois.", "en": "How to clean the main brush?"},
{"m": ["D10 Plus", "D10s", "D10s Pro"], "c": "Consommables & entretien", "q": "Comment nettoyer la serpillière ?", "a": "1. Appuyez sur les deux clips latéraux du réservoir, retirez le module de lavage et détachez le tampon. 2. Videz l'eau du réservoir, lavez à l'eau seule et laissez sécher à l'air avant de réinstaller (pas d'exposition directe au soleil). 3. Lavez le tampon à l'eau seule et laissez-le sécher (retirez-le du module avant lavage et évitez que l'eau sale ne reflue dans la sortie d'eau ; remplacez le tampon tous les 3 à 6 mois). 4. En cas de débit lent ou irrégulier, nettoyez la sortie d'eau.", "en": "How to clean the mop?"},
{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra"], "c": "Consommables & entretien", "q": "Comment nettoyer le bac à poussière et le filtre ?", "a": "1. Ouvrez le capot du robot, appuyez sur le clip pour retirer le bac. 2. Ouvrez le couvercle repéré par la flèche et videz les débris. 3. Remplissez le bac d'eau, refermez, secouez de gauche à droite, videz, et répétez plusieurs fois (à l'eau seule, sans détergent ni brossage du filtre). 4. Retirez le filtre, essorez l'eau et séchez-le avant de le remettre (au moins 24 heures de séchage).", "en": "How to clean the dust and filter?"},
{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra"], "c": "Consommables & entretien", "q": "Comment nettoyer les roues multidirectionnelles ?", "a": "1. Retournez le robot et tirez les roues vers le haut. 2. Nettoyez cheveux et saletés sur les roues et les axes. 3. Réinstallez les roues en appuyant fermement. NB : les roues peuvent être rincées à l'eau courante ; séchez-les avant usage.", "en": "How to clean the omnidirectional wheels?"},
{"m": ["D10 Plus", "D10s"], "c": "Consommables & entretien", "q": "Comment nettoyer les taches tenaces au sol ?", "a": "Le robot peut ne pas éliminer certaines taches tenaces pendant le lavage : nettoyez-les manuellement.", "en": "How to mop those stubborn stains on the floor?"},
{"m": ["D10 Plus", "D10s", "D10s Pro"], "c": "Consommables & entretien", "q": "Comment retirer le réservoir d'eau ?", "a": "Appuyez vers l'intérieur sur les deux clips latéraux et faites glisser le réservoir vers l'arrière pour le séparer du robot.", "en": "How to remove the water tank?"},
{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra", "P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Consommables & entretien", "q": "Les performances de nettoyage baissent ou il y a des fuites de poussière", "a": "1. Bac à poussière plein ou filtre colmaté : nettoyez le bac et le filtre à temps, et activez l'aspiration automatique. 2. Brosse principale entourée de corps étrangers : nettoyez-la. 3. Orifice d'aspiration obstrué : dégagez-le.", "en": "The cleaning ability of the robot has decreased or there is ash leakage"},
{"m": ["D10 Plus", "D10s", "D10s Pro"], "c": "Consommables & entretien", "q": "Pourquoi le robot ne projette pas d'eau ou fonctionne avec peu d'eau au lavage ?", "a": "Vérifiez le niveau d'eau du réservoir, installez correctement la serpillière selon la notice et nettoyez-la à temps. Avant le lavage, humidifiez d'abord le tampon pour un bon résultat en attendant l'arrivée d'eau.", "en": "Why does it fail to squirt water or operate with little water during mopping?"},
{"m": ["D10 Plus", "D10s"], "c": "Consommables & entretien", "q": "Pourquoi le sol est-il encore sale après le lavage ?", "a": "Lavez le tampon de serpillière à temps lorsque vous nettoyez un sol sale.", "en": "Why is the floor still dirty after mopping?"},
{"m": ["D10 Plus", "D10s", "D10s Pro"], "c": "Consommables & entretien", "q": "Pourquoi n'arrive-t-on pas à installer correctement la serpillière ?", "a": "Alignez le tampon de serpillière avec le module avant de l'installer.", "en": "Why do I fail to install the mop pad properly?"},
{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra"], "c": "Consommables & entretien", "q": "Pourquoi n'arrive-t-on pas à ouvrir le bac à poussière ?", "a": "Suivez le repère du couvercle pour ouvrir correctement le bac. N'essayez pas de l'ouvrir en retirant le filtre.", "en": "Why couldn't I open the dust bin?"},
{"m": ["D10 Plus", "D10s", "D10s Pro"], "c": "Consommables & entretien", "q": "Pourquoi une odeur émane-t-elle de la serpillière et du bac à poussière ?", "a": "L'odeur vient d'une serpillière sale non lavée à temps après le nettoyage : lavez-la rapidement après chaque lavage de sol. Le bac à poussière peut aussi sentir si du liquide y pénètre : nettoyez-le à temps après le nettoyage.", "en": "Why do I smell the odor from the mop and dust compartment?"},
{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra"], "c": "Consommables & entretien", "q": "Que faire si la brosse latérale ou principale s'emmêle pendant le nettoyage ?", "a": "La brosse latérale et la brosse principale peuvent s'emmêler dans des câbles au sol. Après avoir rangé les câbles, replacez le robot dans la zone nettoyée à proximité pour poursuivre. Dégagez le sol pour éviter les emmêlements.", "en": "What if the side brush or main brush is entangled during cleaning?"},
{"m": ["D10s Plus", "D10s Pro", "D9 Plus"], "c": "Consommables & entretien", "q": "L'aspiration semble plus faible ou le nettoyage moins bon récemment", "a": "1. Bac à poussière plein : videz-le (les bases à vidage automatique le font seules). 2. Filtre colmaté : nettoyez-le. 3. Brosse principale emmêlée : nettoyez-la. 4. Aspiration réglée trop bas : passez à un niveau supérieur.", "en": "The suction power sounds weaker or cleaning performance degrades"},
{"m": ["D10s Plus", "D10s Pro", "D9 Plus"], "c": "Consommables & entretien", "q": "La brosse est emmêlée", "a": "1. Retirez le capot de la brosse, sortez la brosse et ôtez les corps étrangers. 2. Après nettoyage, réinstallez la brosse et vérifiez à la main qu'elle tourne librement. 3. Assurez-vous que le capot se clipse bien en place.", "en": "The brush is entangled"},
{"m": ["D10s Plus", "D10s Pro", "D9 Plus"], "c": "Consommables & entretien", "q": "La serpillière dégage une odeur désagréable", "a": "Causes : environnement humide, ou serpillière non séchée ayant moisi. Usage quotidien : lavez la serpillière avec un nettoyant de sol pour réduire les moisissures. Stockage : retirez la serpillière et faites-la sécher dans un endroit bien ventilé.", "en": "An unpleasant odor occurs to the mop pad"},
{"m": ["D10s Plus", "D10s Pro", "D9 Plus"], "c": "Consommables & entretien", "q": "Le filtre est-il lavable ?", "a": "1. Le filtre se lave à la main à l'eau et doit être parfaitement sec avant réinstallation. 2. Laissez-le sécher au moins 24 heures après lavage.", "en": "Is the filter washable?"},
{"m": ["D10s Pro"], "c": "Consommables & entretien", "q": "Quels consommables nécessitent un entretien régulier ?", "a": "Brosse principale : nettoyer chaque semaine, remplacer tous les 6 à 12 mois. Filtre : nettoyer chaque semaine, remplacer tous les 3 à 6 mois. Brosse latérale : nettoyer chaque semaine, remplacer tous les 3 à 6 mois. Serpillière : laver après chaque nettoyage, remplacer tous les 3 à 6 mois.", "en": "Does it have any consumables that require regular maintenance?"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Consommables & entretien", "q": "La serpillière du robot dégage une odeur désagréable", "a": "Causes possibles : environnement humide, ou serpillière non séchée et longtemps inutilisée ayant moisi. 1. Usage quotidien : après un lavage, nettoyez la serpillière et laissez-la sécher dans un endroit sec et ventilé. 2. Non-usage prolongé : retirez la serpillière et faites-la sécher dans un endroit sec et ventilé.", "en": "The robot mop has an unpleasant smell"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Consommables & entretien", "q": "Le capot de la brosse principale est difficile à installer", "a": "Assurez-vous d'abord que la brosse principale est bien en place, puis que tous les clips en haut du capot sont correctement insérés dans les logements. Procédez ensuite à l'installation : un « clic » confirme la réussite. Vous pouvez aussi suivre l'étiquette du capot ou le manuel.", "en": "The installation of the main brush cover is difficult"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Consommables & entretien", "q": "Le filtre du bac à poussière peut-il être lavé à l'eau ?", "a": "Oui, mais il doit être parfaitement sec avant d'être remis dans le bac. Laissez-le sécher au moins 24 heures après lavage pour garantir le bon fonctionnement.", "en": "Can the filter screen of the robot dust box be washed with water?"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Consommables & entretien", "q": "Le robot indique qu'un corps étranger entoure la brosse rouleau", "a": "1. Retirez d'abord le capot de la brosse rouleau, puis sortez la brosse et ôtez tout ce qui l'entoure. 2. Après nettoyage, réinstallez la brosse et vérifiez à la main qu'elle tourne librement. 3. En remontant, assurez-vous que le capot est bien clipsé sur tout le pourtour.", "en": "The robot indicates that foreign objects are entangling the roller brush"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Consommables & entretien", "q": "Pourquoi le robot lave-t-il d'abord sans eau, ou de plus en plus sec ?", "a": "Humidifiez manuellement la serpillière au début de chaque tâche. Sans humidification manuelle, le robot puise progressivement l'eau du réservoir pendant environ la première minute ; durant ce laps, la serpillière peut sembler non humidifiée.", "en": "Why doesn't water come out when the machine starts mopping"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Consommables & entretien", "q": "Qu'est-ce qui provoque une baisse de nettoyage ou une fuite de poussière ?", "a": "Bac à poussière plein : videz-le. Filtre colmaté : nettoyez-le. Brosse principale entourée de corps étrangers : nettoyez-la.", "en": "What causes a decline in cleaning capacity or dust leakage?"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Consommables & entretien", "q": "Que faire si le réservoir ne délivre pas d'eau ou peu d'eau au lavage ?", "a": "Vérifiez qu'il y a de l'eau dans le réservoir. Installez correctement la serpillière selon la notice et nettoyez-la à temps. Avant le lavage, humidifiez d'abord la serpillière pour un bon résultat en attendant l'arrivée d'eau du réservoir.", "en": "What should I do if the water tank doesn't come out or has little water when mopping?"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Consommables & entretien", "q": "Quelles peuvent être les causes d'une serpillière mal installée (de travers) ?", "a": "Respectez la méthode d'installation correcte de la serpillière et assurez-vous qu'elle est bien posée.", "en": "What could be the reasons for the uneven installation of the rag?"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Consommables & entretien", "q": "Un corps étranger est enroulé dans la brosse rouleau", "a": "La brosse principale a une structure conique qui tourne et aspire poussières et débris. De gros objets durs (gros déchets, câbles…) peuvent la bloquer. Contrôlez et nettoyez régulièrement la brosse rouleau, surtout en présence de nombreux cheveux : l'embout d'extrémité peut être retiré pour ôter les cheveux emmêlés.", "en": "Roll the card swiping foreign object"},
{"m": ["E20", "E20 Plus"], "c": "Consommables & entretien", "q": "Anomalie de lavage du robot", "a": "1. Vérifiez que le plateau de serpillière et la serpillière sont bien installés. 2. Vérifiez le fonctionnement après avoir retiré le réservoir d'eau et la serpillière. 3. Vérifiez les seuils, tapis et paillassons lors du lavage : séparez-les avec des meubles amovibles. 4. Essayez sur un autre type de sol. 5. Si rien n'y fait, contactez le SAV.", "en": "Robot mopping abnormality"},
{"m": ["E20", "E20 Plus"], "c": "Consommables & entretien", "q": "De la poussière collante s'accumule autour de l'appareil pendant le nettoyage", "a": "Nettoyez régulièrement avec un chiffon humide le pourtour du robot, la brosse latérale, la brosse principale, les roulettes et les autres zones sujettes à l'accumulation.", "en": "There is sticky dust around the equipment during cleaning"},
{"m": ["E20", "E20 Plus"], "c": "Consommables & entretien", "q": "La brosse latérale ne tourne pas ou l'alerte se fige", "a": "1. Vérifiez l'absence de corps étranger coincé dans la brosse latérale et nettoyez-la. 2. Redémarrez le robot pour voir s'il redevient normal. 3. Si rien n'y fait, contactez le SAV.", "en": "Robot's side brush does not rotate or alarm freezes"},
{"m": ["E20", "E20 Plus"], "c": "Consommables & entretien", "q": "La brosse principale ne tourne pas ou l'alerte se fige", "a": "1. Vérifiez l'absence de cheveux ou débris coincés sur la brosse rouleau ou ses paliers d'extrémité. 2. Vérifiez l'absence de corps étranger dans le logement de la brosse et nettoyez-le. 3. Si rien n'y fait, contactez le SAV.", "en": "Robot's main brush does not rotate or alarm freezes"},
{"m": ["E40 Ultra"], "c": "Consommables & entretien", "q": "Alerte de niveau bas de solution de nettoyage dans le module de distribution automatique.", "a": "Vérifiez la présence d'eau au fond de la station d'accueil. Si c'est le cas, effectuez les étapes suivantes :\nAprès le nettoyage, accédez à Station d’accueil > Paramètres de la station d’accueil > Nettoyage automatique de la base de la planche de nettoyage et appuyez sur Démarrer le nettoyage pour vidanger l’eau.\nAprès le nettoyage, accédez à Station d’accueil > Tâche de la station d’accueil et appuyez sur Laver pour vidanger l’eau.\nSi le problème persiste, veuillez contacter le service client.", "en": ""},
{"m": ["E40 Ultra"], "c": "Consommables & entretien", "q": "Bruit important lors du vidage de la poussière, du lavage du sol ou du lavage de la serpillière.", "a": "Veuillez nous excuser pour la gêne occasionnée. Veuillez suivre ces étapes de dépannage : \n  1. Définissez un niveau d'humidité de la serpillière plus sec dans l'application afin de réduire la teneur en eau de la serpillière. \n  2. Vérifiez que les pièces adjacentes avec des seuils sont correctement cloisonnées sur la carte. Si elles sont identifiées comme étant la même zone, cloisonnez manuellement la carte et ajoutez un seuil à l'emplacement correspondant. La serpillière se soulèvera automatiquement lors du franchissement des obstacles, améliorant ainsi la fluidité et réduisant les frottements. \n  3. La hauteur maximale de franchissement d'obstacles par le robot est de 2,2 cm. Si l'obstacle dépasse cette hauteur, le robot peut s'incliner excessivement, ce qui fait que la serpillière évacue une faible quantité d'eau.", "en": ""},
{"m": ["E40 Ultra"], "c": "Consommables & entretien", "q": "Bruit important à l'ouverture ou à la fermeture du réservoir d'eau.", "a": "Notre station adopte une conception innovante à trois réservoirs, inspirée d'un vaisseau spatial, alliant technologie et finition haut de gamme. Les réservoirs d'eau propre et usagée sont dotés d'une fixation segmentée spécialement conçue pour une expérience d'utilisation optimale. Un clic indique clairement si la fixation du réservoir d'eau est bien fermée.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Consommables & entretien", "q": "Comment définir un nettoyage personnalisé ?", "a": "1. Ouvrez la page d'accueil du plug-in, entrez dans la section Nettoyage personnalisé via Mode de nettoyage > Nettoyage personnalisé > Paramètres.\n2. Réglage manuel : Dans la section Réglage personnalisé, vous pouvez sélectionner différentes zones pour avoir des réglages personnalisés, notamment l'aspiration, l'humidité de la serpillière, les temps de nettoyage, etc.\n3. Recommandation intelligente : Appuyez sur le bouton \"Recommandation intelligente\"dans la section des réglages personnalisés, les modèles de nettoyage personnalisés seront générés en fonction des types de pièces.\n4. Enregistrer les paramètres : Appuyez sur \"√\"dans le coin supérieur droit pour enregistrer vos paramètres.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Consommables & entretien", "q": "Comment nettoyer une maison à plusieurs étages ?", "a": "Déplacez le robot vers l'étage à nettoyer et sélectionnez la carte correspondante pour commencer le nettoyage. Si cet étage est nettoyé pour la première fois, vous devez d'abord créer un plan en appuyant sur Gestion des cartes > Créer > Enregistrer sur la page d'accueil du plug-in. \n\nRemarque : pour le robot doté de la fonction d'auto-nettoyage, si vous souhaitez que le robot effectue l'auto-nettoyage, vous pouvez déplacer la base d'auto-nettoyage ou la station de base au même étage que le robot. Sinon, veuillez désactiver la fonction d'auto-nettoyage.", "en": ""},
{"m": ["E40 Ultra"], "c": "Consommables & entretien", "q": "Comment utiliser la fonction d'auto-nettoyage de la station de base ?", "a": "1. Ajoutez de l'eau dans le réservoir d'eau propre. Appuyez sur le bouton Nettoyer de la base ou sur le bouton Démarrer de l'application pour reprendre le nettoyage de la serpillière.\n2. Si l'eau du réservoir d'eau propre est suffisante, débranchez la base d'auto-lavage, allumez la base dans 30 secondes et appuyez sur le bouton Nettoyer de la base. Si le problème persiste, veuillez contacter le service clientèle.", "en": ""},
{"m": ["E40 Ultra"], "c": "Consommables & entretien", "q": "Condensation dans le réservoir à poussière.", "a": "Placez la planche de nettoyage dans la station pour l'installer. En cas d'obstruction, soulevez-la légèrement en l'inclinant et poussez-la, puis appuyez doucement pour assurer une installation correcte.", "en": ""},
{"m": ["E40 Ultra"], "c": "Consommables & entretien", "q": "De l'eau fuit lorsque vous soulevez le réservoir d'eau propre.", "a": "Si la roue omnidirectionnelle est emmêlée avec des cheveux, utilisez un outil approprié pour la retirer, éliminez les cheveux et réinstallez-la en appuyant fermement pour vous assurer qu'elle est bien fixée.", "en": ""},
{"m": ["E40 Ultra"], "c": "Consommables & entretien", "q": "De l'eau suinte de la serpillière lorsque le robot franchit un seuil.", "a": "Avant de quitter l'usine, le robot est soumis à des tests fonctionnels complets, qui peuvent laisser de légères taches d'eau. Cela n'affecte pas le fonctionnement normal du robot.", "en": ""},
{"m": ["E40 Ultra"], "c": "Consommables & entretien", "q": "Difficulté à ouvrir/fermer le réservoir d'eau.", "a": "Veuillez nous excuser pour la gêne occasionnée. \n  1. La station est dotée d'un conduit d'air ultra-fluide innovant. Lors du vidage de la poussière, le moteur haute vitesse aspire efficacement les particules de poussière dans le sac en 10 secondes, offrant une puissance d'aspiration accrue. \n  Vous pouvez également régler la fréquence de dépoussiérage dans l'application et la configurer en mode Confort. \n  2. L'aspirateur robot dispose de quatre niveaux de puissance d'aspiration : Silencieuse, Standard, Puissante et Max. Plus la puissance d'aspiration augmente, plus le bruit de fonctionnement augmente.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Consommables & entretien", "q": "Dois-je ranger les tapis lorsque je passe la serpillière ?", "a": "1. Reconnaissance intelligente : Pour le robot doté de la fonction de reconnaissance des tapis, il peut reconnaître la moquette et soulever la serpillière pendant le nettoyage pour éviter que la moquette ne soit humidifiée. Si nécessaire, vous pouvez passer d'un mode de nettoyage de moquette à l'autre dans l'APP pour désactiver la fonction de reconnaissance du tapis ou permettre au robot d'éviter la moquette.\n2. Zones interdites : Avant de passer la serpillière, vous pouvez définir la zone où se trouve la moquette comme zone interdite dans la section Gestion des cartes, et le robot évitera la moquette pendant le nettoyage.", "en": ""},
{"m": ["E40 Ultra"], "c": "Consommables & entretien", "q": "Débris résiduels dans la rainure de la brosse à rouleau.", "a": "1. Si des flaques d'eau au sol pénètrent dans le bac à poussière, arrêtez immédiatement le robot, nettoyez le bac à poussière et laissez-le sécher complètement avant de le réutiliser. Dans le cas contraire, de l'eau risque d'être aspirée dans le réservoir à poussière pendant le vidage de la poussière. \n 2. Lors de l'aspiration et du lavage du sol quotidiens, une faible quantité d'eau peut pénétrer dans le bac à poussière. Veuillez nettoyer le bac à poussière rapidement en fonction de son niveau de saleté. Vous pouvez également utiliser le mode « Lavage du sol après aspiration » pour éviter ce problème.", "en": ""},
{"m": ["E40 Ultra"], "c": "Consommables & entretien", "q": "Est-il normal que de l’eau s’écoule du point de connexion lorsque l’on soulève le réservoir d’eau propre de la station d’accueil ?", "a": "Les raisons suivantes peuvent être la cause de ce problème. Veuillez vérifier les points suivants : \n1. Utilisez un chiffon doux et sec pour nettoyer la poussière sur le LDS (capteur de distance laser) dès que possible. Consultez le Manuel d’utilisation pour obtenir des instructions spécifiques. \n2. Utilisez un chiffon doux et sec pour nettoyer la poussière sur les détecteurs de dénivelé et les capteurs de bord sous le robot dès que possible. Consultez le Manuel d’utilisation pour obtenir des instructions spécifiques. \n3. Accédez à la page des paramètres de l’application, touchez « Mise à jour du micrologiciel » et activez l’option « Mise à jour automatique » pour vous assurer que vous utilisez la dernière version du logiciel. \n4. Vérifiez si un chevauchement des cartes se produit. Essayez d’éteindre puis de rallumer le robot. Ensuite, restaurez ou reconstruisez la carte, et observez si l’anomalie disparaît. \nSi le problème persiste, veuillez contacter le service après-vente local pour obtenir de l’aide.", "en": ""},
{"m": ["E40 Ultra"], "c": "Consommables & entretien", "q": "Fuite de poussière au niveau de l'orifice de la brosse à rouleau lors du vidage de la poussière.", "a": "Veuillez nous excuser pour la gêne occasionnée. Vous pouvez d'abord replacer le robot sur sa station d'accueil et le redémarrer pour vérifier si la carte d'origine peut être restaurée. Si ce n'est pas le cas, cliquez sur l'icône « Gestion des cartes » et sélectionnez « Restaurer la carte » pour revenir à une carte normale. \n  Pour éviter de tels problèmes à l'avenir, veuillez vérifier les points suivants : \n  1. Assurez-vous que la disposition des pièces et du mobilier reste constante. \n  2. Vérifiez si le robot s'est bloqué pendant le nettoyage ou si les roues motrices sont encombrées de débris, car l'évitement des obstacles peut provoquer une superposition ou un mauvais alignement de la carte.\n 3. Si le débit d'eau défini est trop élevé ou si une quantité excessive de produit de nettoyage est utilisée, le robot peut glisser ou tourner sur place, ce qui entraîne des anomalies de carte. \n  4. Assurez-vous que le capteur LDS tourne normalement. Appuyez doucement sur le couvercle du capteur LDS pour vérifier qu'il remonte correctement.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Consommables & entretien", "q": "Je veux programmer un nettoyage.", "a": "1. Entrez dans la page d'accueil du plug-in, appuyez tour à tour sur Paramètres (en haut à droite) > Nettoyage programmé > Ajouter (en bas à droite).\n 2. Vous pouvez définir les paramètres à l'avance, notamment la plage de nettoyage, l'heure de début et la répétition.\n 3. Appuyez sur \"√\" dans le coin supérieur droit pour enregistrer vos paramètres, et le nettoyage est programmé.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Consommables & entretien", "q": "La brosse est emmêlée.", "a": "1. Retirez le couvercle de la brosse, sortez la brosse et nettoyez les corps étrangers sur la brosse.\n2. Réinstallez la brosse après le nettoyage, faites-la tourner à la main pour vérifier si elle fonctionne correctement.\n3. Assurez-vous que le couvercle de la brosse s'enclenche en place lors de la réinstallation.", "en": ""},
{"m": ["E40 Ultra"], "c": "Consommables & entretien", "q": "La planche de nettoyage se salit facilement.", "a": "De légers chocs ou oscillations peuvent survenir en raison d'irrégularités ou du matériau des tapis ou moquettes, mais le robot aspirateur ne manquera aucune zone lors du nettoyage.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Consommables & entretien", "q": "La puissance d'aspiration semble plus faible ou les performances de nettoyage semblent se dégrader récemment.", "a": "1. Le collecteur à poussière est plein et doit être nettoyé. La base de vidange videra le collecteur automatiquement, vous n'avez aucun souci.\n2. Le filtre est bouché et doit être nettoyé.\n3. La brosse principale est emmêlée et doit être nettoyée. \n4. Le niveau d'aspiration est faible et doit être commuté sur un niveau d'aspiration plus élevé.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Consommables & entretien", "q": "La reprise du nettoyage n'est pas effectuée.", "a": "1. Vérifiez que la fonction de reprise du nettoyage est activée.\n2. La fonction de reprise du nettoyage ne peut pas être activée en mode DND (Do Not Disturb). \n3. Vérifiez si un message d'erreur est déclenché sur l'App lorsque le robot se charge. S'il y a un défaut, la fonction de reprise du nettoyage ne sera pas activée.\n4. Vérifiez si votre robot est redémarré ou réinitialisé après avoir activé la fonction de reprise du nettoyage.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Consommables & entretien", "q": "La serpillière est trop humide ou il y a trop d'eau dans le réservoir d'eau propre.", "a": "La serpillière est trop humide : \nSi le climat local est relativement humide, ou si les taches d'eau ne sont pas faciles à sécher sur les sols intérieurs, vous pouvez sélectionner une serpillière légèrement sèche avant de l'utiliser via Paramètres de nettoyage > Humidité de la serpillière > Légèrement sèche.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Consommables & entretien", "q": "La serpillière n'est plus propre.", "a": "Serpillière non propre :\n1. Ajouter le nettoyant : Il est recommandé d'ajouter le nettoyant pour sols à surfaces multiples afin d'avoir une meilleure performance de nettoyage.\n2. Fonction d'auto-nettoyage : Appuyez sur le bouton Auto-nettoyage du plug-in pour que vos serpillières soient lavées à nouveau.\n3. Saleté accumulée sur la planche à laver : Retirez et nettoyez la planche à laver. Si nécessaire, rincez la planche à laver avec de l'eau.", "en": ""},
{"m": ["E40 Ultra"], "c": "Consommables & entretien", "q": "La solution de nettoyage n’est pas distribuée.", "a": "La station d’accueil ne distribue pas d’eau pour laver la serpillière. Cela peut être dû aux raisons suivantes. Veuillez vérifier les points suivants : \n1. Vérifiez si le réservoir d’eau propre est vide. \n2. Soulevez le réservoir d’eau propre, assurez-vous qu’il est rempli d’eau, puis replacez-le et appuyez fermement dessus. Relancez un lavage de la serpillière et observez l’état de celle-ci. \n3. Vérifiez si l’entrée d’eau du robot est obstruée par des corps étrangers. Si c’est le cas, retirez les débris dès que possible pour vous assurer que l’eau circule librement. \n4. Retirez la serpillière à rouleau et vérifiez si les trous de sortie d’eau à l’intérieur du compartiment du rouleau sont obstrués par des corps étrangers. Si c’est le cas, nettoyez rapidement les trous de sortie pour vous assurer que l’eau circule librement. \nSi le problème persiste, veuillez contacter le service après-vente local MOVA pour obtenir de l’aide.", "en": ""},
{"m": ["E40 Ultra"], "c": "Consommables & entretien", "q": "La station d’accueil ne distribue pas d’eau pour laver la serpillière.", "a": "Lorsque vous utilisez le robot pour la première fois, le niveau de poussière domestique peut être élevé. C’est pourquoi le robot est conçu pour retourner automatiquement à la station d’accueil pour vider la poussière et laver la serpillière tous les 20 mètres carrés nettoyés. Cela évite que le bac à poussière ne se remplisse pendant le nettoyage et que les performances de nettoyage soient affectées. Lors de la première utilisation, il est recommandé d’utiliser le mode Nettoyage en profondeur pour le nettoyage initial.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Consommables & entretien", "q": "La tâche de nettoyage en cours est interrompue de manière inattendue.", "a": "1. Le robot passe en mode veille après avoir été piégé pendant un certain temps.\n2. La batterie est épuisée et le robot s'éteint automatiquement s'il ne parvient pas à la recharger. Les causes peuvent être que la base n'est PAS sous tension, ou que le robot et la base ne sont PAS connectés. \n3. Une exception peut se produire dans le système, veuillez contacter le service clientèle.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Consommables & entretien", "q": "Le filtre est-il lavable ?", "a": "1. Le filtre peut être lavé à l'eau manuellement et doit être soigneusement séché avant d'être réinstallé.\n2. Veuillew sécher le filtre pendant au moins 24 heures après l'avoir lavé.", "en": ""},
{"m": ["E40 Ultra"], "c": "Consommables & entretien", "q": "Le motif de nettoyage en forme de S sur le tapis est irrégulier.", "a": "Le phénomène de gouttes d’eau lors du lavage du sol peut être causé par les raisons suivantes. Veuillez vérifier les points suivants : \n1. Vérifiez si la boîte d’eau usagée du robot est correctement installée. Insérez la boîte d’eau usagée dans le robot. Lorsque vous entendez « Boîte d’eau usagée installée », cela signifie que la boîte est correctement installée. Si la boîte d’eau usagée n’est pas correctement installée, la fonction de lavage du sol peut causer un écoulement d’eau goutte à goutte. \n2. Vérifiez que vous utilisez bien la solution de nettoyage officielle MOVA. L’utilisation de solutions de nettoyage d’autres marques ou de solutions d’entretien pour parquet peut entraîner une mousse excessive pendant le lavage du sol. La mousse pourrait alors s’échapper par l’orifice d’évacuation situé au bas du robot, ce qui provoque un écoulement d’eau goutte à goutte pendant le lavage du sol. Il est recommandé de nettoyer d’abord la serpillière et la mousse dans le réservoir d’eau usagée, puis d’utiliser la solution de nettoyage officielle MOVA pour une nouvelle tentative. \n3. Vérifiez si la serpillière a été achetée via les canaux officiels MOVA. Évitez d’utiliser des serpillières tierces, car elles peuvent avoir une perméabilité inégale de l’eau, ce qui peut causer un écoulement d’eau goutte à goutte. \n4. Retirez la serpillère à rouleau et vérifiez si l’entrée d’aspiration du robot est obstruée (située au centre du compartiment du rouleau, près du filtre en maille d’acier inoxydable). Si le filtre est bouché, nettoyez rapidement les débris du filtre, puis testez à nouveau le robot pour voir si l’écoulement d’eau persiste pendant le lavage du sol. \n5. En raison des variations climatiques, le niveau d’humidité des sols peut varier d’une région à l’autre, ce qui peut entraîner un écoulement excessif d’eau pendant le lavage du sol et provoquer des gouttes d’eau. Il est recommandé de régler le débit d’eau à un niveau approprié via l’application MOVA afin d’éviter ce problème pendant le lavage du sol. \nSi le problème persiste, veuillez contacter le service après-vente MOVA et demander l’aide d’un technicien professionnel pour régler le problème.", "en": ""},
{"m": ["E40 Ultra"], "c": "Consommables & entretien", "q": "Le parcours de nettoyage du robot est chaotique.\n Comment résoudre le problème si le robot tourne sans cesse sur place ?", "a": "Le robot prend en charge la reconnaissance des tapis, qui est activée par défaut. Lorsqu'il passe sur des tapis, il aspire uniquement et soulève la serpillière. Cependant, la hauteur de levage est limitée à 7 mm, de sorte que les tapis plus épais risquent d'être légèrement touchés par la serpillière. Pour empêcher le robot de se déplacer sur les tapis avec la serpillière installée, sélectionnez « Éviter les tapis » dans l'application ou définissez une zone interdite pour empêcher le robot d'y entrer. \n Remarque : les tapis à poils longs d'une épaisseur supérieure à 2 cm peuvent être détectés comme des obstacles et évités.", "en": ""},
