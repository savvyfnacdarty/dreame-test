<style>
  :root{
    --rouge:#D4151B; --orange:#EEA31E;
    --dreame:#2669C2; --dreame-2:#1B4E97; --dreame-bg:#EAF1FB; --dreame-bd:#C4D9F4;
    --bg:#F1F3F6; --surface:#FFFFFF; --border:#DDE1E8;
    --text:#1A1E2A; --text-2:#4A5068; --muted:#8891A8;
    --r-md:8px; --r-lg:14px; --tr:.16s cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

  .hubbar{background:var(--rouge);padding:11px 22px;display:flex;align-items:center;gap:16px;
    position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.15);}
  .hubbar .home{display:flex;align-items:center;gap:14px;text-decoration:none;flex-shrink:0;}
  .hubbar img{height:36px;background:#fff;padding:5px 9px;border-radius:6px;transition:transform .15s;}
  .hubbar:hover img{transform:scale(1.05);}
  .hubbar .txt{color:#fff;font-weight:700;font-size:14px;letter-spacing:.3px;}

  .hero{background:linear-gradient(120deg,#1B4E97 0%,var(--dreame) 60%,#4A8AD4 100%);
    padding:34px 22px 26px;text-align:center;color:#fff;}
  .hero-logo{height:46px;background:#fff;padding:7px 14px;border-radius:10px;margin-bottom:14px;
    box-shadow:0 4px 16px rgba(0,0,0,.2);}
  .hero .eyebrow{font-size:.9rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;}
  .hero h1{font-size:1.5rem;font-weight:800;margin-bottom:6px;}
  .hero p{color:rgba(255,255,255,.9);font-size:.9rem;}
  .hero nav{display:flex;gap:8px;justify-content:center;margin-top:20px;flex-wrap:wrap;}
  .hero nav a{color:#fff;text-decoration:none;font-size:.86rem;font-weight:600;padding:8px 16px;
    border-radius:var(--r-md);background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.45);transition:var(--tr);}
  .hero nav a:hover{background:rgba(255,255,255,.28);}
  .hero nav a.active{background:#fff;color:var(--dreame-2);border-color:#fff;}

  main{max-width:1060px;margin:0 auto;padding:24px 20px 60px;}

  .toolbar{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-lg);
    padding:16px 18px;box-shadow:0 2px 6px rgba(0,0,0,.05);margin-bottom:20px;
    position:sticky;top:58px;z-index:10;}
  .search{position:relative;margin-bottom:14px;}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);}
  .search input{width:100%;padding:11px 38px 11px 40px;font-size:.95rem;font-family:inherit;
    border:1.5px solid var(--border);border-radius:var(--r-md);background:#FAFBFC;color:var(--text);outline:none;transition:var(--tr);}
  .search input:focus{border-color:var(--dreame);background:#fff;box-shadow:0 0 0 3px rgba(38,105,194,.12);}
  .search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:none;
    color:var(--muted);cursor:pointer;font-size:1.2rem;line-height:1;padding:4px 8px;display:none;}

  .filters{display:flex;flex-direction:column;gap:10px;}
  .frow{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .flabel{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
    padding-top:7px;min-width:64px;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;flex:1;}
  .chip{font-family:inherit;font-size:.8rem;font-weight:600;padding:6px 13px;border-radius:100px;cursor:pointer;
    background:#F4F6F9;border:1.5px solid var(--border);color:var(--text-2);transition:var(--tr);white-space:nowrap;}
  .chip:hover{border-color:var(--dreame);color:var(--dreame);}
  .chip.on{background:var(--dreame);border-color:var(--dreame);color:#fff;}

  .count{font-size:.82rem;color:var(--text-2);margin:0 4px 12px;}
  .count b{color:var(--dreame);}

  .group{margin-bottom:22px;}
  .gtitle{display:flex;align-items:center;gap:9px;font-size:.78rem;font-weight:800;text-transform:uppercase;
    letter-spacing:1px;color:var(--dreame-2);margin:0 4px 10px;}
  .gtitle::after{content:"";flex:1;height:1.5px;background:var(--dreame-bd);}

  .qa{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-lg);
    margin-bottom:9px;overflow:hidden;transition:var(--tr);}
  .qa:hover{border-color:var(--dreame-bd);}
  .qa[open]{border-color:var(--dreame);box-shadow:0 4px 16px rgba(38,105,194,.12);}
  .qa summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;align-items:flex-start;gap:12px;
    font-size:.95rem;font-weight:600;line-height:1.45;}
  .qa summary::-webkit-details-marker{display:none;}
  .qa summary::after{content:"";flex-shrink:0;width:8px;height:8px;margin:6px 0 0 auto;
    border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:var(--tr);}
  .qa[open] summary::after{transform:rotate(-135deg);border-color:var(--dreame);}
  .qa summary .badge{flex-shrink:0;font-size:.66rem;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
    background:var(--dreame-bg);color:var(--dreame-2);border:1px solid var(--dreame-bd);
    padding:3px 8px;border-radius:5px;margin-top:2px;}
  .body{padding:0 18px 16px 18px;}
  .body .ans{font-size:.9rem;line-height:1.65;color:var(--text-2);white-space:pre-wrap;
    border-left:3px solid var(--dreame-bd);padding-left:14px;}
  .body .ans a{color:var(--dreame);}
  .models{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px;padding-left:17px;}
  .models span{font-size:.7rem;font-weight:700;background:#F4F6F9;border:1px solid var(--border);
    color:var(--text-2);padding:3px 8px;border-radius:100px;}
  mark{background:#FFF1A8;color:inherit;border-radius:2px;padding:0 1px;}

  .empty{text-align:center;padding:50px 20px;color:var(--muted);}
  .empty svg{margin-bottom:12px;opacity:.5;}
  .empty b{display:block;color:var(--text-2);font-size:1rem;margin-bottom:4px;}

  footer{background:#000;color:#fff;text-align:center;padding:14px;font-size:.8rem;}
  footer span{color:var(--orange);font-weight:600;}

  @media(max-width:640px){
    .toolbar{position:static;} .flabel{min-width:auto;padding-top:0;}
    .frow{flex-direction:column;gap:6px;} .hero h1{font-size:1.2rem;}
  }
  @media print{
    .hubbar,.hero,.toolbar,footer{display:none;} .qa{break-inside:avoid;} .body{display:block!important;}
  }
</style>

<script>
const FAQ = [
{"m": ["D10 Plus", "D10s"], "c": "Dépannage", "q": "Comment réduire le bruit pendant le nettoyage ?", "a": "Vérifiez qu'aucun objet n'est coincé dans la brosse et nettoyez-la à temps pour éviter tout dommage. Pour réduire le bruit, choisissez un mode plus silencieux.", "en": "How to reduce the noise during the cleaning?"},
{"m": ["D10 Plus", "D10s", "D10s Pro"], "c": "Dépannage", "q": "Comment traiter les erreurs de l'appareil ?", "a": "Maintenez le bouton Marche/Nettoyage 6 secondes pour redémarrer.", "en": "How to deal with device errors?"},
{"m": ["D10 Plus", "D10s", "L10s Ultra", "P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Le robot est bruyant ou émet un bruit anormal", "a": "Bruit élevé : 1. Vérifiez si l'aspiration est réglée sur puissance forte dans l'application (plus l'aspiration est forte, plus le bruit augmente). 2. Si le renfort moquette est activé, le robot augmente l'aspiration sur les tapis, d'où plus de bruit. Bruit anormal : retirez la brosse latérale, le capot de brosse, la brosse principale et le support de serpillière, puis démarrez et observez. Si le bruit redevient normal : a) installez d'abord la brosse latérale ; en cas de bruit, vérifiez qu'elle n'est ni déformée ni entourée de cheveux ; b) si la brosse latérale est OK une fois installée, la lamelle en caoutchouc du capot frotte au sol : continuez à l'utiliser quelques fois pour observer.", "en": "The robot has loud working sound and abnormal sound"},
{"m": ["D10 Plus", "L10s Ultra"], "c": "Dépannage", "q": "Pourquoi l'application indique-t-elle le robot hors ligne ?", "a": "1. Robot éteint : l'application ne peut pas s'y connecter. 2. Le passage en ligne/hors ligne dépend de la force du signal à l'endroit du robot ; un signal faible ou instable le met hors ligne. 3. Wi-Fi sans connexion Internet. Solutions : vérifiez que le robot n'est pas éteint (le cas échéant, rallumez et reconfigurez le réseau) ; une mise hors ligne en cours de travail n'empêche pas le robot d'achever sa tâche.", "en": "Why does Mi Home/Dreamehome App indicate that the robot is offline?"},
{"m": ["D10 Plus", "D10s"], "c": "Dépannage", "q": "Pourquoi le robot fait-il un bruit étrange ?", "a": "La brosse principale, la brosse latérale ou les roues motrices peuvent être entourées de cheveux ou de débris. Éteignez le robot et nettoyez-les.", "en": "Why does the robot make a strange noise?"},
{"m": ["D10 Plus", "D10s"], "c": "Dépannage", "q": "Pourquoi le robot n'évite-t-il pas certains obstacles ?", "a": "Pour améliorer le nettoyage, il est conseillé de retirer au préalable les objets au sol (fils, chiffons, chaussons).", "en": "Why does it fail to avoid some obstacles?"},
{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra", "P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Pourquoi le robot ne parvient-il pas à retourner se charger ?", "a": "1. Vérifiez que la prise n'est pas desserrée et que la base est alimentée. 2. Placez le robot à 1–2 m devant la base et appuyez brièvement sur « recharge » ; s'il ne se recharge pas, contactez le SAV. S'il se recharge, vérifiez : a) base contre un mur, ~5 cm de dégagement de chaque côté et 1,5 m sans obstacle devant ; b) éloignée des interférences (routeur, TV…) ; c) pas de reflets en face (miroirs, fenêtres). 3. Vérifiez que le robot part bien de la base et que le capteur laser LDS sur le dessus tourne normalement. 4. Vérifiez que les roues motrices ne patinent pas et que le robot n'est pas coincé.", "en": "Why does the robot fail to return for charging?"},
{"m": ["D10 Plus", "D10s"], "c": "Dépannage", "q": "Pourquoi le robot ne ralentit-il pas devant les obstacles ?", "a": "Grâce au capteur LDS, le robot détecte les obstacles et ralentit. Toutefois, il peut ne pas détecter ni ralentir devant des pieds de meuble foncés ou des obstacles bas.", "en": "Why does it fail to decelerate when meeting the obstacles?"},
{"m": ["D10 Plus", "D10s"], "c": "Dépannage", "q": "Pourquoi le robot ne réagit-il pas quand on le commande depuis la base ?", "a": "Trop loin de la base, le robot perd la connexion. Il se reconnecte automatiquement quand le signal redevient stable.", "en": "Why does the robot fail to react when operating from the base?"},
{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra"], "c": "Dépannage", "q": "Pourquoi le robot ne s'allume-t-il pas ?", "a": "Le robot ne s'allume pas si la batterie est faible. Placez-le sur la base et vérifiez que la température de fonctionnement est comprise entre 0 et 50 °C.", "en": "Why does it fail to power on?"},
{"m": ["D10 Plus", "D10s", "D10s Pro"], "c": "Dépannage", "q": "Que faire si le couvercle du réservoir d'eau fuit ?", "a": "Le couvercle comporte un évent pour équilibrer la pression de l'air. Après remplissage, maintenez le réservoir de niveau lors de l'installation. Une légère fuite est normale si le réservoir est incliné pendant le retrait ou la pose.", "en": "What should I do if the top cover of the water tank leaks?"},
{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra"], "c": "Dépannage", "q": "Que faire si le robot est coincé pendant le nettoyage ?", "a": "Le robot peut se coincer sur des chaussons, sacs plastiques ou autres objets. Retirez-les et replacez le robot sur la zone nettoyée, près du point d'interruption. Dégagez le sol pour éviter que le robot ne se coince pendant le nettoyage.", "en": "What should I do if the robot is trapped during cleaning?"},
{"m": ["D10 Plus", "D10s", "D10s Pro"], "c": "Dépannage", "q": "Que faire si le robot n'évite pas les obstacles pendant le nettoyage ?", "a": "1. Essuyez le capteur LDS avec un chiffon doux et sec et redémarrez l'appareil : il peut être encrassé. 2. Si le robot est connecté et en ligne, ouvrez l'application, cliquez sur « … » en haut à droite et vérifiez que l'évitement d'obstacles n'est pas désactivé ; activez-le et redémarrez. 3. Vérifiez que l'application est à jour.", "en": "What should I do if the robot fails to avoid obstacles?"},
{"m": ["D10 Plus", "D10s", "D10s Pro", "L10s Ultra"], "c": "Dépannage", "q": "Que faire si le robot s'emmêle dans le cordon d'alimentation de la base ?", "a": "Attachez l'excédent de cordon de la base avec une sangle avant le nettoyage. Ne le laissez pas traîner au sol.", "en": "What should I do if entangled with the power cable of the Base?"},
{"m": ["D10 Plus", "D10s", "L10s Ultra"], "c": "Dépannage", "q": "Que faire si le robot se coince en tentant de passer dans un espace étroit ?", "a": "Le robot peut se coincer dans un espace étroit (ex. dessous de placard à sa hauteur). Utilisez les bandes magnétiques fournies pour créer un mur virtuel, ou bloquez l'espace étroit avec un obstacle pour l'empêcher d'y entrer.", "en": "What should I do if it gets stuck when passing through a narrow space?"},
{"m": ["D10 Plus", "D10s", "L10s Ultra"], "c": "Dépannage", "q": "Que faire si le robot se coince en tentant de passer sous un meuble ?", "a": "Si le robot rencontre un dessous de meuble d'une hauteur proche de la sienne, il peut se coincer. Installez des bandes magnétiques pour éviter qu'il n'y entre, ou placez des obstacles sous le meuble pour l'en empêcher.", "en": "What should I do if the robot gets stuck when passing through furnishings?"},
{"m": ["D10s"], "c": "Dépannage", "q": "Pourquoi l'application indique-t-elle le robot hors ligne ?", "a": "Assurez-vous que le robot est allumé et que la connexion Wi-Fi est stable. En cours de nettoyage, le robot peut passer hors ligne dans les zones à Wi-Fi faible ; il se reconnecte automatiquement quand le signal redevient fort.", "en": "Why does App indicate that the robot is offline?"},
{"m": ["D10s Plus", "D10s Pro", "D9 Plus"], "c": "Dépannage", "q": "La tâche de nettoyage en cours est interrompue de manière inattendue", "a": "1. Le robot passe en veille après être resté coincé un certain temps. 2. S'il ne parvient pas à se charger, il se décharge et s'éteint : la base n'est peut-être pas alimentée, ou le robot et la base ne sont pas en contact. 3. Une anomalie système peut survenir : contactez le SAV.", "en": "The current cleaning task is paused unexpectedly"},
{"m": ["D10s Plus"], "c": "Dépannage", "q": "Le robot avec fonction IA ne reconnaît pas les objets", "a": "1. Vérifiez que la reconnaissance IA est activée. 2. Objets reconnus : dans cette version, seuls chaussures/chaussons, chaussettes, chiffons, câbles, pèse-personnes et bases sont reconnus. 3. Normal : le robot ralentit et touche légèrement l'obstacle ou l'évite selon l'algorithme ; une légère collision est normale. 4. Un éclairage faible dégrade la reconnaissance IA : utilisez-la dans un environnement bien éclairé. 5. Un environnement complexe ou un obstacle de forme particulière peut aussi gêner la reconnaissance.", "en": "The robot with AI function cannot recognize objects"},
{"m": ["D10s Plus", "D10s Pro", "D9 Plus"], "c": "Dépannage", "q": "Le robot dysfonctionne", "a": "Essayez : 1. Redémarrez le robot. 2. Si le problème persiste, réinitialisez le système.", "en": "The robot is malfunctioning"},
{"m": ["D10s Plus", "D10s Pro", "D9 Plus"], "c": "Dépannage", "q": "Le robot est hors ligne après connexion au réseau", "a": "1. Vérifiez votre connexion réseau. 2. En cours de nettoyage, le robot passe hors ligne dans une zone à mauvaise couverture Wi-Fi. 3. Il passe hors ligne s'il n'est pas sur la base et se décharge.", "en": "The robot is offline after connecting to the network"},
{"m": ["D10s Plus", "D10s Pro", "D9 Plus"], "c": "Dépannage", "q": "Le robot fait un bruit étrange pendant le nettoyage", "a": "1. Un bruit survient si la brosse est emmêlée : retirez-la, ôtez les corps étrangers et réinstallez-la. 2. Redémarrez le robot après réinstallation pour vérifier si le bruit disparaît. 3. Si le bruit persiste, recontrôlez la brosse ou contactez le SAV.", "en": "The robot makes a strange noise while cleaning"},
{"m": ["D10s Plus", "D10s Pro", "D9 Plus"], "c": "Dépannage", "q": "Le robot ne parvient pas à accoster", "a": "Causes : 1. Dock/base éteint ou déplacé : rallumez-le et remettez-le en place. 2. Obstacles autour du dock/base : dégagez-les. 3. Robot coincé pendant le nettoyage : placez-le sur le dock/base. 4. Dock/base sur surface non plane : posez-le à plat. 5. Erreur système : placez le robot à 1 m devant le dock/base et appuyez sur « Rappel ». S'il ne revient pas, contactez le SAV.", "en": "The robot cannot dock"},
{"m": ["D10s Plus", "D10s Pro", "D9 Plus"], "c": "Dépannage", "q": "Le robot ne s'allume pas", "a": "Causes : 1. Erreur système rendant le bouton inopérant. 2. Batterie faible : placez le robot sur la base/dock, chargez-le un moment, puis allumez-le. 3. Si l'allumage échoue toujours après charge, réinitialisez tous les réglages ; si le problème persiste, contactez le SAV.", "en": "The robot cannot turn on"},
{"m": ["D10s Plus", "D10s Pro", "D9 Plus"], "c": "Dépannage", "q": "Le robot oublie une zone", "a": "1. Le robot n'entre pas dans un espace trop étroit (il faut 2 cm de dégagement de chaque côté). 2. Pour les robots à capteur ultrason, un tapis détecté à l'entrée en mode lavage l'empêche d'entrer : retirez le tapis. 3. La superposition de zones peut fausser le positionnement : refaites ou restaurez la carte. 4. Une moquette à poils longs ou des câbles à l'entrée sont évités : dégagez le sol au préalable.", "en": "The robot misses an area"},
{"m": ["D10s Plus"], "c": "Dépannage", "q": "Une collision se produit avec la fonction IA activée", "a": "1. La reconnaissance IA garde le logement propre et évite emmêlements et blocages. Pour nettoyer davantage, le robot s'approche au plus près de l'obstacle en l'évitant : une légère collision est donc normale. 2. Dans un environnement complexe ou face à un obstacle de forme particulière, la reconnaissance IA prend plus de temps, d'où une collision. 3. Un éclairage faible dégrade la reconnaissance IA : utilisez cette fonction dans un environnement bien éclairé.", "en": "A collision occurs after AI function is ON"},
{"m": ["D10s Pro"], "c": "Dépannage", "q": "Le robot tourne sur place après être sorti de la base", "a": "Après être sorti de la base, le robot effectue d'abord un auto-positionnement et un autotest. Il est donc normal qu'il tourne sur place.", "en": "The robot moves around after setting out from the base"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Dépannage", "q": "Après avoir quitté la base, le robot tourne sur place sans commencer à travailler", "a": "Après avoir quitté la base, le robot effectue d'abord un positionnement et un autotest. Il est donc normal qu'il tourne sur place au départ.", "en": "After the machine leaves the base station, it circles in place"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Dépannage", "q": "Bruit anormal pendant le nettoyage", "a": "1. Le bruit peut venir d'un corps étranger dans le logement de la brosse rouleau : retirez la brosse, ôtez le corps étranger, puis remontez-la. 2. Redémarrez le robot pour vérifier si le bruit a disparu. 3. Sinon, contrôlez de nouveau la brosse rouleau ou contactez directement le SAV.", "en": "There is an abnormal noise during the machine cleaning process"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Dépannage", "q": "En cours de fonctionnement, la tâche est interrompue de manière inattendue", "a": "1. Le robot est passé en veille après être resté coincé. 2. S'il n'a pas réussi à se charger sur la base, il s'est déchargé puis éteint : la base n'est peut-être pas alimentée ou le contact avec la base est mauvais. 3. Il peut s'agir d'une panne interne : contactez le SAV.", "en": "the current task was unexpectedly interrupted"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Dépannage", "q": "Fuite de poussière au niveau de l'ouverture de la brosse rouleau pendant l'aspiration", "a": "Ce phénomène ne se produit qu'avec des peluches de coton présentes chez vous, et il est normal. En cas de fuite de poussière persistante, contactez le SAV.", "en": "There is dust leakage at the roller brush opening during dust collection"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Dépannage", "q": "L'aspiration automatique des poussières a échoué", "a": "Cela peut venir d'un sac plein ou d'un conduit obstrué. 1. Nettoyez d'abord le sac à poussière. 2. Si l'anomalie persiste, nettoyez le conduit d'air au fond de la station d'aspiration.", "en": "The automatic dust collection was unsuccessful"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Dépannage", "q": "L'orifice d'aspiration est bouché par des cheveux et le conduit est obstrué", "a": "Le robot aspire par une double circulation d'air (soufflage + aspiration). En présence de beaucoup de poussière mélangée, l'orifice ou le conduit peuvent retenir électrostatiquement une très petite quantité de résidus, sans incidence sur le fonctionnement. Nettoyez régulièrement l'orifice d'aspiration selon l'usage.", "en": "The dust collection port is clogged with hair and the pipe is blocked"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Dépannage", "q": "Le robot a oublié de scanner une zone", "a": "1. Le robot n'entre pas dans les espaces trop étroits (il faut 2 cm de dégagement de chaque côté du corps). 2. Pour les robots à capteur ultrason, un tapis détecté à l'entrée en mode lavage l'empêche d'entrer : retirez le tapis. 3. La superposition de cartes peut fausser le positionnement : refaites ou restaurez la carte. 4. Une moquette à poils longs ou des câbles à l'entrée sont évités : dégagez le sol au préalable.", "en": "The robot missed scanning a certain area"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Dépannage", "q": "Le robot a un comportement anormal", "a": "Essayez : 1. Redémarrez le robot. 2. Si le comportement ne redevient pas normal, réinitialisez le système.", "en": "The robot shows abnormal behavior"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Dépannage", "q": "Le robot est très bruyant en fonctionnement", "a": "1. Filtre colmaté : vérifiez, nettoyez ou remplacez-le. 2. Objet dur coincé dans la brosse principale ou le bac : vérifiez et retirez-le. 3. Brosse latérale ou principale entourée de corps étrangers : nettoyez-les. 4. Vous pouvez réduire l'aspiration au niveau standard ou silencieux.", "en": "It makes a loud running noise when in operation"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Dépannage", "q": "Le robot franchit mal les obstacles / quelle est sa capacité de franchissement ?", "a": "Capacité de franchissement : 2 cm. Elle est légèrement réduite avec un réservoir d'eau. Un seuil vertical ou un rail de porte coulissante suspendu peut coincer les roues : construisez une rampe ou définissez un mur virtuel. Si le sol déclenche la vue vers le bas et met le robot en état d'évitement, ajoutez un seuil virtuel. De la graisse (cuisine) ou de l'eau (salle de bain) sur les roues peut faire patiner le robot et gêner le franchissement.", "en": "The robot is not good at obstacle crossing"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Dépannage", "q": "Le robot ne s'allume pas", "a": "1. Erreur interne du système rendant les boutons inopérants. 2. Batterie insuffisante : placez d'abord le robot sur la base ou le dock, chargez-le un moment, puis réessayez de l'allumer. 3. Si l'allumage échoue toujours après charge, restaurez les réglages d'usine ; si le problème persiste, contactez le SAV.", "en": "The robot cannot be turned on"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Dépannage", "q": "Le robot ne trouve pas le dock ou la base", "a": "Cas fréquents : 1. Dock/base débranché ou déplacé : rebranchez-le et remettez-le à sa place d'origine. 2. Obstacles sur le plateau du dock/base ou au sol alentour : dégagez-les. 3. Robot coincé ou en alerte pendant le nettoyage : replacez-le manuellement sur le dock/base. 4. Sol non plan sous le dock/base : reposez-le sur une surface horizontale.", "en": "The robot couldn't find the charging dock or the base station"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Dépannage", "q": "Le robot nettoie mal ou ses performances baissent", "a": "1. Bac à poussière plein : videz-le (les modèles à station d'aspiration se vident automatiquement). 2. Filtre colmaté : nettoyez-le. 3. Brosse principale entourée de corps étrangers : nettoyez-la. 4. Aspiration réglée trop bas : augmentez le niveau.", "en": "The robot fails to clean thoroughly or performance declines"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Dépannage", "q": "Le robot oscille et heurte le mur sur le tapis", "a": "La matière et les irrégularités du tapis provoquent de légères secousses — c'est normal. Le robot n'oublie aucune zone pendant le nettoyage.", "en": "swaying left and right and banging against the wall on the carpet"},
{"m": ["D20", "D20 Plus", "D20 Pro", "D20 Pro Plus"], "c": "Dépannage", "q": "Le robot était connecté au réseau puis est passé hors ligne", "a": "1. Vérifiez la qualité du réseau. 2. En cours de nettoyage, un signal réseau faible à l'endroit du robot peut le mettre hors ligne. 3. Un robot éteint avec batterie faible hors du dock passe hors ligne.", "en": "The robot was connected to the network and then went offline"},
{"m": ["E20", "E20 Plus"], "c": "Dépannage", "q": "Anomalie du bac à poussière / réservoir d'eau", "a": "1. Essuyez les contacts du bac/réservoir et réenclenchez le bac. 2. Si rien n'y fait, contactez le SAV.", "en": "Robot dust box/water tank abnormality"},
{"m": ["E20", "E20 Plus"], "c": "Dépannage", "q": "Anomalie du pare-chocs avant du robot", "a": "1. Vérifiez l'absence de corps étranger coincé dans le pare-chocs avant. 2. Tapotez-le à la main et vérifiez qu'il rebondit bien. 3. Si rien n'y fait, contactez le SAV.", "en": "Robot front gear abnormality"},
{"m": ["E20", "E20 Plus"], "c": "Dépannage", "q": "Anomalie du ventilateur du robot", "a": "1. Redémarrez le robot pour voir s'il redevient normal. 2. Si rien n'y fait, contactez le SAV.", "en": "Robot fan abnormality"},
{"m": ["E20", "E20 Plus"], "c": "Dépannage", "q": "Bruit anormal pendant les tâches du robot", "a": "1. Nettoyez les corps étrangers sur la brosse rouleau. 2. Vérifiez que le capot est bien fixé. 3. Vérifiez l'absence de débris emmêlés générant du bruit. 4. Vérifiez l'absence de corps étranger dans le logement de la brosse et nettoyez-le. 5. Si rien n'y fait, contactez le SAV.", "en": "There is abnormal noise during robot tasks"},
{"m": ["E20", "E20 Plus"], "c": "Dépannage", "q": "Le robot est bruyant en nettoyage", "a": "1. Adaptez le mode de nettoyage à votre logement dans l'application. 2. Vérifiez l'absence de corps étranger dans la brosse rouleau, la brosse latérale, la roue multidirectionnelle, etc., et nettoyez-les à temps.", "en": "Robot cleaning noise is loud"},
{"m": ["E20", "E20 Plus"], "c": "Dépannage", "q": "Le robot ne parvient pas à ressortir de sous le canapé", "a": "1. Vérifiez l'absence de débris bloquant le nettoyage sous le canapé. 2. Vérifiez si le dessous du canapé s'affaisse : le robot avance mais reste coincé dans la partie affaissée ; utilisez un mur virtuel dans l'application. 3. Vérifiez l'absence de confusion de cartographie : réinitialisez la carte puis relancez un nettoyage global. 4. Surélevez le canapé pour que le robot entre et sorte normalement.", "en": "Robot sofa bottom escape failed"},
{"m": ["E20", "E20 Plus"], "c": "Dépannage", "q": "Le robot ne s'allume pas", "a": "1. S'il est resté inutilisé trop longtemps et déchargé, chargez-le avec la base. 2. Si l'allumage échoue toujours après 1 à 2 heures de charge, contactez le SAV pour contrôle.", "en": "robot cannot power on"},
{"m": ["E20", "E20 Plus"], "c": "Dépannage", "q": "Le robot s'arrête brusquement pendant une tâche", "a": "1. Vérifiez s'il s'est déchargé et éteint (recharge manuelle nécessaire). 2. En mode point fixe ou bord, le robot s'arrête automatiquement une fois le travail terminé. 3. Vérifiez qu'il ne s'est pas arrêté sur une alerte. 4. Redémarrez-le pour voir s'il redevient normal. 5. Si rien n'y fait, contactez le SAV.", "en": "robot suddenly stops working during task"},
{"m": ["E20", "E20 Plus"], "c": "Dépannage", "q": "Panne du radar du robot", "a": "1. Vérifiez l'absence de débris coincé au niveau du LDS. 2. Gardez propre le pourtour du capot de protection du LDS. 3. Redémarrez le robot pour voir s'il redevient normal. 4. Si rien n'y fait, contactez le SAV.", "en": "Robot radar malfunction"},
{"m": ["E20", "E20 Plus"], "c": "Dépannage", "q": "Une roue gauche/droite ne tourne pas, l'alerte de roue se fige", "a": "1. Vérifiez l'absence de corps étranger sur les roues motrices et nettoyez-les. 2. Faites tourner les roues à la main : normalement, elles tournent librement sans bruit anormal ; si elles se bloquent, c'est anormal. 3. Si rien n'y fait, contactez le SAV.", "en": "The left/right wheels do not rotate, side wheel alarm is stuck"},
{"m": ["E40 Ultra"], "c": "Dépannage", "q": "Affichage du voyant lumineux.", "a": "Pour mettre à niveau le micrologiciel, l'aspirateur robot doit être en charge avec un niveau de batterie ≥ 15 %. Nous vous recommandons de suivre ces étapes : \n 1. Retirez l'aspirateur robot de la station de charge, éteignez-le et redémarrez-le. Assurez-vous d'entendre le message « Démarrage de la charge » avant de tenter à nouveau la mise à niveau. \n 2. Si la batterie est faible ou déchargée, les mises à niveau du micrologiciel ne pourront pas être effectuées. Chargez l'appareil pendant environ 2 heures avant la mise à niveau. \n 3. Placez l'aspirateur robot et sa station de charge dans une zone avec un signal Wi-Fi puissant (à proximité du routeur) ou activez la 4G sur votre téléphone portable pour relancer la mise à niveau. De mauvaises conditions réseau à l'emplacement du robot peuvent entraîner des interruptions de téléchargement et des échecs de mise à niveau.", "en": ""},
{"m": ["E40 Ultra"], "c": "Dépannage", "q": "Bruits forts ou anormaux pendant le fonctionnement.", "a": "Veuillez nous excuser pour la gêne occasionnée. Si le robot manque une zone, veuillez tenir compte des points suivants : \n 1. Le robot ne peut pas entrer dans les espaces étroits d'une largeur inférieure à 40 cm. Pour les pièces contenant des espaces inférieurs à 40 cm de large, les performances de nettoyage dépendront de l'environnement domestique. \n 2. Pour les robots équipés d'une détection de tapis par ultrasons, si le mode d'évitement de tapis est activé pendant le nettoyage, le robot n'entrera pas dans la pièce s'il détecte un tapis à l'entrée. Retirez le tapis et réessayez. --Commutateur de reconnaissance des tapis. \n 3. Un chevauchement de la carte peut entraîner des problèmes de positionnement et des zones manquées. Dans ce cas, cartographiez à nouveau la zone. --Outre la nouvelle cartographie, une fonction de restauration de carte est également disponible. \n 4. Si des obstacles tels que des pantoufles ou des fils électriques se trouvent à l'entrée, le robot les évitera. Dégagez le sol avant le nettoyage. \n 5. Notre robot ne peut franchir que des obstacles d'une hauteur maximale de 2,2 cm. Si un seuil est supérieur à 2,2 cm, le robot ne pourra pas passer. \n 6. Lorsqu'un obstacle est détecté, le robot nettoie autour, ce qui peut entraîner des zones manquées à proximité. Ceci est normal. \n 7. Nettoyez régulièrement la lentille du capteur laser, car la saleté peut entraîner une mauvaise évaluation des obstacles par le robot et des zones manquées.", "en": ""},
{"m": ["E40 Ultra"], "c": "Dépannage", "q": "Cheveux emmêlés dans la roue omnidirectionnelle.", "a": "La station utilise un système d'aspiration-soufflage pour aspirer rapidement la poussière du bac à poussière. Un excès de poussière ou de peluches peut se fixer électrostatiquement au bac à poussière et laisser des résidus. Vous pouvez nettoyer le bac à poussière régulièrement, en fonction de votre utilisation. Le bac à poussière et le filtre sont lavables, mais nécessitent un séchage de 24 heures. Veuillez les nettoyer manuellement régulièrement.", "en": ""},
{"m": ["E40 Ultra"], "c": "Dépannage", "q": "Comment gérer correctement la mousse ou l’eau qui dégoutte pendant le lavage du sol ?", "a": "Veuillez vérifier les points suivants : \n1. Videz le bac à poussière rapidement lorsqu’il est plein. Il est recommandé d’activer la fonction de vidage automatique et de choisir une fréquence appropriée en fonction des besoins de votre foyer. Cela évite que le bac à poussière ne soit trop plein et que l’efficacité de l’aspiration soit réduite. \n2. Vérifiez si la brosse principale est emmêlée avec des débris. Si c’est le cas, nettoyez la brosse principale dès que possible. \n3. Inspectez l’évent de vidage automatique du robot pour vérifier qu’il n’est pas obstrué. Retirez tout obstacle de l’évent si nécessaire. \n4. Vérifiez si la brosse principale est très usée. Il est recommandé de la remplacer régulièrement. \n5. Vérifiez si le filtre du bac à poussière est sale ou obstrué. Si c’est le cas, nettoyez-le ou remplacez-le. Après le nettoyage, assurez-vous que toutes les pièces sont complètement sèches avant de les remonter. \n6. Essayez d’augmenter la puissance d’aspiration pour améliorer les performances de nettoyage. \n7. Sur la page de nettoyage personnalisé, essayez d’utiliser le nettoyage de pièces sélectionnées et augmentez le nombre de passages pour améliorer les performances de nettoyage. \n8. Accédez aux paramètres de nettoyage du sol et activez l’option « Boost pour grosses particules ». Après l’activation, le robot se concentrera sur le nettoyage de cette zone spécifique lorsqu’il en détecte, améliorant ainsi les résultats de nettoyage.", "en": ""},
{"m": ["E40 Ultra"], "c": "Dépannage", "q": "Comment résoudre un problème de positionnement ?", "a": "Cinq raisons possibles d'un échec de la zone interdite : 1. Votre carte n'a pas été enregistrée correctement ou la zone interdite n'a pas été correctement définie. Veuillez vérifier dans l'application si la carte existe et si vous avez cliqué sur « √ » pour enregistrer la zone interdite après l'avoir définie.\n 2. Votre maison est peut-être grande et le réseau est instable ou ne couvre pas toute la zone. Le robot n'était pas connecté de manière stable au Wi-Fi domestique lors de la configuration de la zone interdite/du mur virtuel, ce qui a empêché l'enregistrement de la zone interdite.\n 3. Le robot est peut-être en mode de positionnement, ce qui l'amène à entrer dans la zone interdite. Une fois le positionnement terminé, il n'entrera plus dans la zone interdite.\n 4. Vérifiez si votre carte est mal alignée ou déformée. En cas de chevauchement, vous pouvez restaurer la carte à un format carré normal. Nos mises à jour logicielles incluront des optimisations pour résoudre ce problème.\n 5. Si vous avez enregistré plusieurs cartes, lorsque le robot utilise une carte spécifique, l'application doit basculer vers la carte correspondante ; sinon, la zone interdite risque de ne pas fonctionner.", "en": ""},
{"m": ["E40 Ultra"], "c": "Dépannage", "q": "Dysfonctionnement des fonctionnalités de partage, comme l’impossibilité de partager le robot ou l’absence de notifications pour les utilisateurs partagés.", "a": "Un niveau d'eau anormal dans la planche à laver est étroitement lié à la performance d’étanchéité du réservoir d'eau usagée. Pour garantir une bonne étanchéité lors de la vidange de l’eau usagée, nous vous recommandons les opérations suivantes : \n1. Vérifiez si la sortie d’évacuation de l’eau usagée et l’assemblage de filtre sont bouchés, et nettoyez-les rapidement si nécessaire. \n2. Ouvrez le capot du réservoir d’eau usagée et vérifiez si la bague d’étanchéité du capot est desserrée ou déformée. Si c’est le cas, repositionnez-la manuellement et essuyez-la avec une serpillière. \n3. Après avoir vidé l’eau usagée, assurez-vous que le clip du réservoir d'eau usagée est bien fixé. \n4. Après avoir placé le réservoir d’eau usagée dans la station d’accueil, appuyez doucement dessus pour vous assurer qu’il est correctement installé. \n5. Si le problème persiste, essuyez le capteur de niveau d’eau (contact métallique) dans la planche à laver avec un chiffon sec.", "en": ""},
{"m": ["E40 Ultra"], "c": "Dépannage", "q": "Débris résiduels dans le bac à poussière.", "a": "Le niveau de saleté dans le compartiment de la brosse à rouleau varie en fonction de l'état du sol de votre maison et de la fréquence d'utilisation. Nettoyez-le si nécessaire.", "en": ""},
{"m": ["E40 Ultra"], "c": "Dépannage", "q": "Dépoussiérez l'évent de vidage automatique.", "a": "Le niveau d'accumulation de saleté sur la planche de nettoyage dépend de la propreté du sol de votre maison et de la fréquence d'utilisation. Vous pouvez la nettoyer selon les besoins. Le bac peut être retiré et lavé sous le robinet. Après le nettoyage, réinstallez-le correctement.", "en": ""},
{"m": ["E40 Ultra"], "c": "Dépannage", "q": "Eau dans le bac à poussière.", "a": "1. Lors de l'aspiration et du lavage du sol quotidiens, une faible quantité d'eau peut pénétrer dans le bac à poussière. Cette eau peut être aspirée dans le bac à poussière lors du vidage de la poussière, provoquant de la condensation. En cas de condensation, essuyez-la rapidement avec un chiffon ou un mouchoir en papier. Vous pouvez également utiliser le mode « Lavage du sol après aspiration » pour atténuer ce problème. \n 2. Si des flaques d'eau sont présentes sur le sol, de l'eau peut pénétrer dans le bac à poussière et être aspirée dans le réservoir de la station pendant le vidage de la poussière. Veuillez nettoyer rapidement l'eau du réservoir à poussière afin de ne pas perturber le fonctionnement normal.", "en": ""},
{"m": ["E40 Ultra"], "c": "Dépannage", "q": "Il reste des taches d’eau sur le sol.", "a": "Du produit de nettoyage est ajouté lors du lavage de la serpillière. Des résidus restent après le séchage de solution, ce qui est normal. Ils seront éliminés au prochain lavage de la serpillière. Vous pouvez également les nettoyer manuellement avec une brosse si nécessaire.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Dépannage", "q": "Je veux partager mon robot avec d'autres personnes.", "a": "1. Votre robot s'est connecté au réseau Wi-Fi.\n2. Veuillez confirmer que l'utilisateur avec lequel vous souhaitez partager votre maison s'est inscrit dans l'application Dreamehome. \n3. Ouvrez la page Mes appareils , cliquez sur \"---\" et sélectionnez \"Partage de l'appareil\" pour partager l'appareil avec d'autres utilisateurs de Dreamehome. \n4. Saisissez l'ID Dreame/Numéro de téléphone/Email de l'utilisateur partagé utilisé pour l'enregistrement. Une fois qu'ils ont accepté le robot, ils peuvent également le contrôler.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Dépannage", "q": "Je veux éteindre le robot ou la base.", "a": "1. dans des conditions normales, la base ne s'éteint pas automatiquement mais éteint l'écran pour passer en mode de faible consommation.\n2. Si vous souhaitez mettre la base hors tension, débranchez le câble d'alimentation.\nNote : Si vous utilisez le robot quotidiennement, évitez de de mettre la base hors tension.\n3. Une fois la base éteinte, votre robot ne peut pas se charger et sa batterie s'épuise progressivement.\n4. Si votre base est hors tension, remettez-la sous tension avant de l'utiliser.", "en": ""},
{"m": ["E40 Ultra"], "c": "Dépannage", "q": "La litière pour chat ou la nourriture pour animaux de compagnie ne peut pas être complètement vidée après le vidage automatique.", "a": "Pour maintenir la machine sèche et stérile, le V60 MOBIUS effectue un cycle de séchage complet de la serpillière, du bac à poussière et du sac à poussière, ce qui peut prendre du temps.\nVous pouvez régler la durée de séchage de la trappe dans « Paramètres de la station d’accueil » et configurer le séchage du bac à poussière et du sac à poussière dans les Paramètres.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Dépannage", "q": "Le robot ne nettoie pas automatiquement à l'heure prévue.", "a": "La batterie de votre robot est faible. Le nettoyage programmé ne commencera pas si le niveau de la batterie est supérieur à 15 %.", "en": ""},
{"m": ["E40 Ultra"], "c": "Dépannage", "q": "Le robot ne peut pas reconnaître les obstacles", "a": "1. Activez la fonction : Assurez-vous que la fonction de « Reconnaissance intelligente des obstacles » du robot est activée.\n2. Plage de reconnaissance : Actuellement, le robot peut reconnaître : les chaussures (pantoufles), les chaussettes (chiffons), les fils, les balances, les socles.\n3. Partie normale : Votre robot va ralentir et entrer en collision avec l'obstacle, ou éviter l'obstacle grâce à l'algorithme d'évitement des obstacles. Une légère collision de votre robot avec l'obstacle est normale.\n4. Éclairage anormal : un éclairage insuffisant dans l'environnement de travail affecte la reconnaissance visuelle du robot. Il est recommandé d'utiliser cette fonction dans un environnement bien éclairé.\n5. Environnement complexe : si l'environnement domestique est trop complexe ou si la forme de la cible est particulière, le robot mettra plus de temps à la reconnaître, ce qui peut entraîner des collisions.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Dépannage", "q": "Le robot ne peut pas s'allumer.", "a": "Causes pour lesquelles le robot ne s'allume pas :\n1. Erreur système, et le bouton fonctionne mal.\n2. Le robot ne peut pas être allumé si sa batterie est faible. Placez votre robot sur la base/la station et chargez-le pendant un moment, puis allumez-le.\n3. Si le robot ne peut toujours pas être allumé après la charge, réinitialisez tous les paramètres. Si le problème n'est toujours pas résolu, veuillez contacter le service clientèle.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Dépannage", "q": "Le robot ne peut pas trouver la base ou la station de charge.", "a": "Causes d'échec de l'amarrage :\n1. Le dock/base est éteint ou déplacé. Mettez-la sous tension et remettez-la en place.\n2. Il y a des obstacles autour de la station d'accueil/base. Supprimez les obstacles.\n3. Votre robot est coincé pendant le nettoyage. Placez-le sur la station d'accueil/base.\n4. La station d'accueil/base n'est PAS sur une surface plane. Placez-le sur une surface plane.\n5. Erreur système. Placez le robot à 1 mètre devant la station d'accueil/base et appuyez sur le bouton \"Rappel\". Si le robot ne peut pas retourner à la station d'accueil/base, veuillez contacter le service clientèle.", "en": ""},
{"m": ["E40 Ultra"], "c": "Dépannage", "q": "Le robot oscille ou heurte les murs sur les tapis et moquettes.", "a": "Une légère fuite de poussière ou de peluches peut se produire, ce qui est normal. Si la fuite persiste, veuillez contacter le service clientèle.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Dépannage", "q": "Le robot présente un dysfonctionnement.", "a": "Essayez les solutions suivantes :\n1. Redémarrez votre robot.\n2. Si le problème n'est toujours pas résolu, réinitialisez le système.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Dépannage", "q": "Le robot se déplace après être sorti de sa base.", "a": "Une fois que votre robot est sorti de la base, il effectue premièrement une auto-localisation et une auto-vérification. Votre robot peut donc faire demi-tour sur place.", "en": ""},
{"m": ["E40 Ultra"], "c": "Dépannage", "q": "Le robot touche encore des obstacles lorsque la fonction de « Reconnaissance intelligente des obstacles » est activée.", "a": "1. Fonction : la fonction de « Reconnaissance intelligente des obstacles » aide le robot à naviguer en douceur dans votre maison, évitant ainsi les perturbations et minimisant le risque de rester bloqué. Pour nettoyer davantage de zones, le robot s'approchera des obstacles tout en les évitant. En fonction de la situation, le robot peut ralentir pour heurter légèrement ou éviter complètement les obstacles. Ce comportement est normal.\n2. Environnement complexe : si l'environnement domestique est trop complexe ou si la forme de la cible est particulière, le robot mettra plus de temps à la reconnaître, ce qui peut entraîner des collisions.\n3. Éclairage anormal : un éclairage insuffisant dans l'environnement de travail affecte la reconnaissance visuelle du robot. Il est recommandé d'utiliser cette fonction dans un environnement bien éclairé.", "en": ""},
{"m": ["E40 Ultra"], "c": "Dépannage", "q": "Pourquoi le robot s'éteint-il automatiquement ?", "a": "Suivez ces étapes : \n 1. Assurez-vous que la station est sous tension, que le capot supérieur est fermé et que le sac à poussière est correctement installé pendant le processus de vidage de la poussière. \n 2. Vérifiez si le sac à poussière est plein. S'il est plein, remplacez-le et réessayez. \n 3. Inspectez l'évent de vidage automatique du robot et de la station, ainsi que la sortie du bac à poussière, à la recherche de toute obstruction. Nettoyez-les avant de réessayer. \n 4. Vérifiez si le commutateur de vidage de la poussière de l'application est désactivé. Si c'est le cas, activez-le et réessayez. \n 5. Vérifiez que le contact de rechargement n'est pas sale, car cela risquerait d'empêcher la transmission du signal. Nettoyez-les avec un chiffon sec et réessayez.\n 6. Si votre maison comporte une quantité importante de poussière ou de saletés, réglez la fréquence de vidage de la poussière sur « À chaque fois ».\n 7. Vérifiez si le mode « Ne pas déranger » est activé dans l'application. Le robot ne videra pas la poussière lorsque ce mode est activé. Ajustez les horaires du mode « Ne pas déranger » ou désactivez-le dans les paramètres de l'application.", "en": ""},
{"m": ["E40 Ultra"], "c": "Dépannage", "q": "Pourquoi le tapis reste-t-il mouillé même lorsque la reconnaissance des tapis est activée ?", "a": "1. La reconnaissance des tapis du robot est activée par défaut. Il détecte automatiquement les matériaux des tapis, soulève la serpillière et augmente l'aspiration lorsqu'il passe sur un tapis, ce qui est normal. \n 2. Si vous souhaitez que le robot évite les tapis, sélectionnez « Éviter les tapis » dans l'application. \n 3. Si la reconnaissance des tapis est imprécise, désactivez-la et définissez manuellement une zone interdite dans les paramètres de la carte. Le robot évitera la zone interdite et ne se déplacera pas sur le tapis lors du passage de la serpillière.", "en": ""},
{"m": ["E40 Ultra"], "c": "Dépannage", "q": "Que faire en cas d'échec du vidage de la poussière ?", "a": "Pendant la cartographie rapide, assurez-vous que toutes les portes sont bien ouvertes (ni entrouvertes ni à moitié ouvertes). Ne vous approchez pas trop du robot et ne le suivez pas. Si la carte est incomplète, vous pouvez la supprimer de la liste des cartes et re-cartographier la zone. Vous pouvez également effectuer un nettoyage global en utilisant la carte existante. La carte se mettra alors à jour automatiquement, en remplissant les zones manquantes et en ajustant les cloisons.", "en": ""},
{"m": ["E40 Ultra"], "c": "Dépannage", "q": "Que faire en cas d’échec du vidage automatique ?", "a": "L’application affiche « Solution de nettoyage non installée ». Veuillez vérifier les points suivants : \n1. Ouvrez le capot de la station d’accueil. \n2. Retirez le réservoir de solution de nettoyage et utilisez un chiffon sec pour essuyer les contacts des électrodes à l’arrière du récipient de solution. \n3. Réinstallez le réservoir de solution de nettoyage dans son compartiment et appuyez fermement dessus. \n4. Remettez le capot en place sur la station d’accueil en appuyant sur ses deux côtés pour vous assurer qu’il est bien installé. \n5. Continuez à utiliser l’appareil pendant un certain temps et observez si la solution de nettoyage se consomme dans les deux compartiments. \nSi le problème persiste, veuillez contacter le service après-vente local pour obtenir de l’aide.", "en": ""},
{"m": ["E40 Ultra"], "c": "Dépannage", "q": "Que faire si le bac à poussière est bloqué par des débris et ne peut pas être retiré du robot ?", "a": "Accédez à la page des paramètres de l’application → « Paramètres de nettoyage du sol » → « Levage automatique du LDS » → « Couverture de sécurité ».", "en": ""},
{"m": ["E40 Ultra"], "c": "Dépannage", "q": "Que faire si le robot se bloque fréquemment sur les seuils de porte ?", "a": "Il est normal qu’il reste un peu d’eau sur le sol après le nettoyage à la serpillière. Vous pouvez ajuster le niveau d’eau de nettoyage à la serpillière via l’application. Le sol sèche généralement en 30 secondes environ.", "en": ""},
{"m": ["E40 Ultra", "L10 Ultra"], "c": "Dépannage", "q": "Que faire si le vidage automatique fonctionne mal ?", "a": "Il est possible que le sac à poussière soit plein ou que le conduit d'air soit bloqué. \n1. Vérifiez si le sac à poussière est plein. Si c'est le cas, remplacez le sac. \n2. Vérifiez si le sac à poussière et les évents à vidange automatique sont obstrués. Si c'est le cas, nettoyez-les.", "en": ""},
{"m": ["E40 Ultra"], "c": "Dépannage", "q": "Si la cartographie initiale est incomplète, dois-je la réaliser à nouveau ? Comment compléter la cartographie ?", "a": "Non, nos produits fonctionnent uniquement avec l'application MOVAhome.", "en": ""},
{"m": ["E40 Ultra"], "c": "Dépannage", "q": "Taches tenaces détectées.", "a": "Le niveau de saleté de l'évent de vidage automatique dépend de l'état de saleté du sol de votre maison et de la fréquence d'utilisation. Vous pouvez le nettoyer avec un chiffon doux si nécessaire.", "en": ""},
{"m": ["E40 Ultra"], "c": "Dépannage", "q": "Tâches d'eau constatées sur le robot au déballage.", "a": "L'aspirateur robot offre 32 niveaux d'eau réglables. Si vous remarquez des taches d'eau excessives lors du nettoyage de routine, ajustez manuellement le niveau d'eau dans l'application pour l'adapter aux différents types de sol.", "en": ""},
{"m": ["E40 Ultra"], "c": "Dépannage", "q": "Tâches d'eau excessives sur le sol.", "a": "Les taches tenaces sur le sol peuvent nécessiter plusieurs passages. Vous pouvez sélectionner une zone spécifique pour un nettoyage ciblé afin d'améliorer l'efficacité du nettoyage. De plus, le robot dispose d'une fonction de reconnaissance des taches. Activez la fonction de reconnaissance des taches tenaces dans l'application pour effectuer un nettoyage ciblé sur les taches foncées et un nettoyage en profondeur.", "en": ""},
{"m": ["E40 Ultra"], "c": "Dépannage", "q": "Voyants lumineux de la station.", "a": "Le voyant de la station à vidage automatique reste allumé pendant la charge. Le robot passe en mode veille une fois complètement chargé et le voyant de la station s'éteindra après environ 10 secondes. Pendant la charge, le voyant de l'aspirateur robot clignote lentement. Une fois la charge terminée, le robot passe en mode veille et le voyant s'éteint.", "en": ""},
{"m": ["E40 Ultra"], "c": "Dépannage", "q": "Voyants lumineux du robot (général)", "a": "État du voyant de la station à vidage automatique : \n Blanc fixe : la station est correctement connectée à l'alimentation et le voyant s'allume brièvement lorsque le robot est complètement chargé. \n Blanc clignotant lentement : le robot est en charge (hors plage horaire « Ne pas déranger »). \n Voyant éteint : le voyant s'éteint après 10 secondes une fois la charge complète et s'éteint également lorsque le robot entre dans la plage horaire « Ne pas déranger ». \n Bleu fixe : la station est en cours de stérilisation par UV. \n Orange clignotant : indique une panne.", "en": ""},
{"m": ["Kit raccordement d'eau"], "c": "Dépannage", "q": "Après avoir cliqué sur « Laver la serpillière » dans l'application, aucune eau n'arrive au réservoir d'eau propre", "a": "1. Vérifiez que les deux bouchons en caoutchouc à l'intérieur de la base sont retirés. 2. Assurez-vous que le robinet d'eau et la vanne 3 voies sont ouverts. 3. Rebranchez le cordon d'alimentation et vérifiez le bon branchement. 4. Vérifiez que la vis du kit de raccordement d'eau est serrée à fond dans le sens horaire. 5. Vérifiez que l'adaptateur du tuyau d'eau propre à l'arrière de la base est bien installé. 6. Vérifiez que le boîtier de commande est raccordé dans le bon sens aux tuyaux blanc et bleu. 7. Si le problème persiste, retirez l'adaptateur du tuyau d'eau propre, rebranchez le cordon, ouvrez la vanne 3 voies et relancez « Laver la serpillière ».", "en": "After clicking Clean Mop Pad, no water input to the clean water tank"},
{"m": ["Kit raccordement d'eau"], "c": "Dépannage", "q": "Après avoir cliqué sur « Laver la serpillière », le robot indique « Réservoir d'eau propre non installé »", "a": "1. Vérifiez que les vis à l'arrière du kit de raccordement d'eau sont serrées et non extractibles. 2. Débranchez le cordon de la base 10 secondes puis rebranchez après installation. 3. Redémarrez l'application et testez « Laver la serpillière ». 4. Si cela ne suffit pas, retirez le kit, rebranchez le connecteur Type-C et réinstallez. 5. Si le problème persiste, le kit de raccordement d'eau est défaillant.", "en": "robot reported Clean Water Tank is not installed"},
{"m": ["Kit raccordement d'eau"], "c": "Dépannage", "q": "Le bouton « Laver la serpillière » de l'application est grisé ou inactif", "a": "1. Vérifiez que la base est alimentée. 2. Vérifiez que le robot est sur la base et en charge. 3. Vérifiez que le plateau de lavage est installé : a) s'il l'est, la détection d'installation est peut-être anormale ; b) s'il ne l'est pas, le bouton reste grisé et inactif.", "en": "The button for Clean Mop Pad in the app is gray or cannot be triggered"},
{"m": ["Kit raccordement d'eau"], "c": "Dépannage", "q": "Le flacon de nettoyant est installé mais l'application indique qu'il ne l'est pas", "a": "Cela vient d'une détection anormale du flacon : 1. Vérifiez qu'il est correctement installé et appuyez-le à fond. 2. Si aucune annonce « flacon de détergent installé » n'est émise et que le dosage automatique ne s'active pas dans l'application, c'est une panne du micro-interrupteur : remplacez le kit de raccordement d'eau. 3. Si l'annonce est émise mais que le dosage automatique ne s'active pas, réappuyez sur le flacon et maintenez-le immobile : si la panne disparaît, c'est le micro-interrupteur, remplacez le kit.", "en": "Cleaner bottle installed but App prompts not installed"},
{"m": ["Kit raccordement d'eau"], "c": "Dépannage", "q": "Niveau d'eau anormal dans le bac de lavage / l'eau usée n'est pas pompée vers le réservoir", "a": "1. Vérifiez que la vis du kit est serrée dans le sens horaire. 2. Retirez le bac de lavage, vérifiez l'absence de débris et nettoyez. 3. N'ouvrez pas le couvercle d'étanchéité pendant le pompage ; vérifiez qu'il est bien posé, à plat. 4. Appuyez sur le kit pour assurer l'étanchéité avec la base. 5. Réinstallez correctement l'adaptateur du tuyau d'eau usée à l'arrière de la base et vérifiez que l'anomalie disparaît ; sinon, retirez l'adaptateur, appuyez avec le doigt sur l'orifice d'évacuation arrière et préparez un récipient pour recueillir l'eau.", "en": "Washboard water level abnormal, sewage not pumped to used water tank"},
{"m": ["L10 Pro"], "c": "Dépannage", "q": "*Et si le zonage cartographique de la machine ne correspond pas à la disposition réelle de la maison ?", "a": "R : Dans les paramètres de carte de l'application, le robot aspirateur peut diviser et fusionner les cartes, et si les partitions sont déraisonnables, des ajustements manuels peuvent être effectués manuellement. Il est recommandé d'ouvrir toutes les zones de votre maison lors de la première création de la carte pour compléter la carte complète.", "en": ""},
{"m": ["L10 Pro"], "c": "Dépannage", "q": "*Les robots ne sont pas doués pour surmonter les obstacles / Quelle est leur capacité à contourner les obstacles ?", "a": "R : La capacité de franchissement d'obstacles est de 2 cm Balayer et passer la serpillière avec un réservoir d'eau réduira légèrement la possibilité de franchir des obstacles. Si les marches sont verticales ou si la porte coulissante est suspendue au centre, les roues de l'aspirateur peuvent se coincer et ne pas pouvoir se croiser. Il est recommandé de construire une rampe ou d'installer un mur virtuel pour le nettoyage. Lorsque le balayeur fonctionne, la graisse de cuisine ou l'eau de la salle de bain peuvent coller aux roues, provoquant des glissades et des passages d'obstacles. Il est recommandé de nettoyer les roues avant de tenter de franchir les obstacles. Les chaises à tuyaux en acier ont un fond proche de 2 cm, ce qui peut coincer la machine après des montées fréquentes, car l'inclinaison fait qu'un côté de la roue reste suspendu dans les airs. Il est recommandé de mettre en place une zone restreinte ou un mur virtuel avant de nettoyer.", "en": ""},
{"m": ["L10 Pro"], "c": "Dépannage", "q": "*Pourquoi l'aspirateur L DS affiche-t-il une collision anormale avec les plaques ?", "a": "R : Vous pouvez taper manuellement sur le couvercle LDS, replacer l'appareil dans la station de charge, puis réessayer. Veuillez vérifier s'il y a des objets étrangers fins entre la plaque de couvercle lidar et le couvercle supérieur sur le dessus de l'aspirateur. Si vous en trouvez, nettoyez-les rapidement.", "en": ""},
{"m": ["L10 Pro"], "c": "Dépannage", "q": "*Pourquoi la machine a-t-elle soudainement démarré toute seule ?", "a": "A： Veuillez vérifier si vous avez activé vous-même le nettoyage chronométré ; la machine effectuera la tâche de nettoyage programmée. Si c'est le matin, veuillez confirmer que le scan a été terminé la veille au soir. Si la machine est en mode Ne pas déranger, la reprise du point d'arrêt sera terminée après la fin de la période Ne pas déranger Veuillez vérifier si l'appareil a touché l'appareil, car cela pourrait provoquer la déconnexion des pièces de l'électrode de charge et pousser la station de charge vers l'extérieur et la reconnecter. Veuillez confirmer si la machine partagée est utilisée par d'autres, et confirmer que l'autre partie l'utilise réellement.", "en": ""},
{"m": ["L10 Pro"], "c": "Dépannage", "q": "*Pourquoi les aspirateurs ont-ils encore des peluches ?", "a": "R : L'aspirateur robot possède une rangée de peignes dans la chambre de la brosse à rouleau, ce qui peut réduire les emmêlements et la fréquence de l'entretien. Cependant, dans les cas avec beaucoup de poils, des emmêlements peuvent toujours survenir et un nettoyage manuel est nécessaire. La brosse principale a un design amovible à double tête et est livrée avec un petit couteau à oiseaux, ce qui facilite le nettoyage. Il est également recommandé de nettoyer et inspecter régulièrement la brosse principale pour l'entretien quotidien.", "en": ""},
{"m": ["L10 Pro"], "c": "Dépannage", "q": "*Que faire si le robot fait du bruit ?", "a": "R :  En tant qu'aspirateur, le bruit est inévitable pour garantir l'efficacité du nettoyage. Pour garantir la performance du nettoyage, nous avons mis en place de nombreuses optimisations pour réduire le bruit. Si vous êtes sensible au bruit, nous proposons plusieurs façons de l'utiliser : vous pouvez passer en mode silencieux via une application mobile, ou contrôler le nettoyage à distance lorsque personne n'est à la maison. Fixez des heures de nettoyage programmées quand personne n'est là, afin de ne pas avoir à vous soucier du bruit.", "en": ""},
{"m": ["L10 Pro"], "c": "Dépannage", "q": "*Que faut-il faire si le robot ne nettoie pas correctement les coins ?", "a": "R : Le robot est équipé d'un capteur d'extension de bord et effectue un nettoyage des côtés des bords, principalement à l'aide d'une brosse latérale pour le nettoyage des coins, qui répond essentiellement aux besoins quotidiens de nettoyage. Les taches sur les murs et les coins nécessitent une assistance manuelle.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Dépannage", "q": "4. Quels sont les avantages de la navigation laser LDS comparée au VSLAM/navigation visuelle ?", "a": "R : Le robot intégré de balayage et de serpillière utilise une technologie de navigation laser et des capteurs laser, avec une hauteur corporelle de 968 cm, avec une précision de positionnement plus précise, et la cartographie est plus rapide que la navigation vSLAM/visuelle. Les fonctions cartographiques sont plus riches et plus stables à utiliser. 2. Introduction et utilisation du produit", "en": ""},
{"m": ["L10 Pro"], "c": "Dépannage", "q": "Comment utilisez-vous la station de charge ?", "a": "R : Placez la base de charge contre un mur sur un sol plat, en vous assurant qu'il y a au moins 0,5 mètre de place de chaque côté de la base de charge, puis connectez la prise à la prise électrique. Pour une meilleure expérience utilisateur sur votre application mobile, placez la station de recharge dans la couverture Wi-Fi. Remarque : Ne placez pas la station de recharge en plein soleil ni ne bloquez la zone d'identification de la station avec un quelconque objet, car cela pourrait empêcher l'unité principale de revenir automatiquement à la station de charge.", "en": ""},
{"m": ["L10 Pro"], "c": "Dépannage", "q": "La station de charge consomme-t-elle constamment de l'énergie ?", "a": "R : Lorsque l'unité principale est constamment dans la station de charge, la station de charge alimente l'unité principale. En mode veille, la consommation d'énergie est extrêmement faible, et à ce moment-là, la batterie passe en veille pour maintenir des performances optimales.", "en": ""},
{"m": ["L10 Pro"], "c": "Dépannage", "q": "Pourquoi ça plante encore avec l'évitement des obstacles en 3D ?", "a": "R : L'hôte est équipé d'un capteur laser LDS qui détecte les obstacles et ralentit à l'avance. Cependant, les collisions peuvent passer inaperçues pour des pieds de table et de chaise plus sombres et plus petits, ainsi que pour certains obstacles plus courts Objets noirs : Le laser linéaire des aspirateurs robots est infrarouge. Les objets noirs absorbent la lumière, et certains objets noirs peuvent être impactés. Objets hautement réfléchissants : Le laser linéaire des aspirateurs robots est infrarouge ; lorsque la lumière frappe un objet, elle peut être réfléchie, et certains objets très réfléchissants peuvent être impactés.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Dépannage", "q": "Que dois-je faire si c'est difficile d'ouvrir la poubelle ?", "a": "R :  Faites attention aux marques sur le point d'ouverture de la boîte à poussière. Ouvrez correctement la boîte à poussière ; ne l'ouvrez pas en retirant l'élément filtrant.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Dépannage", "q": "Que dois-je faire si je ne peux pas allumer l'ordinateur ?", "a": "R : Si la batterie est faible, veuillez vous appuyer contre la station de charge pour charger avant utilisation. Si la température ambiante est trop basse (en dessous de 0°C) ou trop élevée (au-dessus de 50°C), veuillez l'utiliser dans un environnement compris entre 0 et 40°C.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Dépannage", "q": "Que dois-je faire si l'hôte se comporte de manière anormale ?", "a": "R :  Appuyez et maintenez le bouton aspirateur pendant 6 secondes pour l'éteindre, puis redémarrez la machine.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Dépannage", "q": "Que faire s'il y a une fuite au sommet du couvercle du radiateur ?", "a": "R : Il y a un trou d'aération sur le couvercle supérieur du réservoir d'eau pour équilibrer la pression de l'air à l'intérieur et à l'extérieur du réservoir. Après avoir ajouté de l'eau dans le réservoir, veuillez le placer horizontalement. De légères fuites peuvent survenir lors du chargement et du placement en biais, ce qui est normal.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Dépannage", "q": "Que faut-il faire si l'unité principale rencontre des problèmes de charge ?", "a": "R : Veuillez vérifier si le bac de collecte de poussière et le pad de recharge de l'unité principale sont tachés de poussière. Si la poussière en a, la charge peut se produire de manière anormale. Veuillez essuyer avant utilisation.", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Dépannage", "q": "Quelle pourrait être la raison de l'installation inégale d'un tissu ?", "a": "R : Il y a un motif de fente à l'avant du tissu. Veuillez prêter attention à la méthode d'installation correcte afin de vous assurer que le tissu est bien installé. 6. Problèmes courants de l'APP", "en": ""},
{"m": ["L10 Pro"], "c": "Dépannage", "q": "Quelles fonctions le laser en ligne a-t-il ? Comment l'utiliser ?", "a": "R : Le laser linéaire du robot aspirateur peut reconnaître les scènes et obstacles domestiques, permettant une évitement précis des obstacles et réduisant considérablement des problèmes tels que les emmêlements, les coincements et les poussées. Vous pouvez profiter de cette fonctionnalité en activant l'interrupteur d'évitement d'obstacles dans les paramètres de l'application. 2. Introduction et utilisation du produit", "en": ""},
{"m": ["L10 Pro", "Z10 Pro"], "c": "Dépannage", "q": "Quelles pourraient être les raisons des odeurs dans les chiffons et les poubelles ?", "a": "R :  Si l'unité principale ne nettoie pas le chiffon rapidement après la serpillière, il peut développer des odeurs avec le temps. Veuillez nettoyer le chiffon rapidement après avoir passé la serpillière. L'unité principale peut absorber les liquides pendant le nettoyage. Si la poubelle n'est pas nettoyée à temps, elle peut produire des odeurs. Veuillez nettoyer la poubelle rapidement après la fin des travaux.", "en": ""},
{"m": ["L10s Ultra", "S20 Ultra"], "c": "Dépannage", "q": "Au lavage de la serpillière, le robot indique que le réservoir d'eau propre n'est pas installé ou manque d'eau : que faire ?", "a": "Vérifiez d'abord que le réservoir d'eau propre est bien installé et suffisamment rempli. Si tout est normal : 1. Retirez le réservoir et vérifiez que le flotteur et son aimant, ainsi que l'aimant de détection, sont en place ; s'ils manquent, un réservoir neuf doit vous être fourni. 2. Si l'eau est insuffisante pour finir la tâche, une alerte apparaît : ajoutez de l'eau propre puis appuyez sur le bouton de la base ou lancez via l'application. 3. Repositionnez le réservoir et appuyez pour l'enclencher.", "en": "When cleaning the mop, it says clean water tank not installed or insufficient water"},
{"m": ["L10s Ultra", "P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Le robot annonce que le réservoir d'eau usée n'est pas installé ou est plein lors de l'auto-nettoyage", "a": "Vérifiez d'abord que le réservoir d'eau usée est correctement installé. Si c'est le cas : 1. S'il est plein, videz-le. 2. Vérifiez que le flotteur du réservoir flotte normalement et que son aimant est présent ; en cas d'anomalie, contactez le SAV. 3. Relancez la tâche via le bouton de l'application. Si le problème persiste, contactez le SAV.", "en": "broadcast used water tank not installed or full during self-cleaning"},
{"m": ["L10s Ultra", "P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Pourquoi l'évitement d'obstacles du robot est-il médiocre ?", "a": "Le robot utilise un triple évitement d'obstacles. Vérifiez dans l'ordre : 1. Il détecte l'obstacle et ralentit avant la collision ; mais certains objets foncés, réfléchissants, fins (pieds de table/chaise) ou bas peuvent ne pas être détectés — c'est normal. 2. Vérifiez que « Reconnaissance IA » et « mode anti-collision » sont activés dans l'application, et essuyez régulièrement l'objectif IA avec un chiffon doux et sec (ni traces ni poussière). 3. Face à des obstacles souples (rideaux) ou une porte entrouverte, le robot ralentit et touche légèrement — c'est normal. 4. Un éclairage insuffisant réduit la reconnaissance visuelle IA : activez l'éclairage d'appoint dans l'application (Gestion du robot → Éclairage d'appoint).", "en": "Why is the obstacle avoidance performance of the robot not good?"},
{"m": ["L10s Ultra"], "c": "Dépannage", "q": "Que faire si l'aspiration des poussières échoue ?", "a": "1. Base sous tension : le couvercle du compartiment à poussière doit être fermé et le sac installé. 2. Vérifiez si le sac est plein : remplacez-le. 3. Vérifiez que les orifices d'aspiration du robot, de la base et du bac ne sont pas obstrués : nettoyez-les. 4. Vérifiez que l'aspiration n'est pas désactivée dans l'application ; le cas échéant, activez-la et réessayez. 5. Vérifiez que la fenêtre transparente des électrodes de charge n'est pas sale.", "en": "What should I do if the dust collection is failed?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "S20 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Après avoir quitté la base, pourquoi le robot tourne-t-il en rond avant de travailler ?", "a": "Après avoir quitté la base, le robot effectue d'abord un positionnement et un autotest pour mieux nettoyer votre sol. Il est donc normal qu'il tourne en rond au départ.", "en": "After the robot leaves the base station, why does it rotate in circles before working?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Cartographie rapide lente / collisions désordonnées / recul brusque / alerte sol plat, robot incliné ou coincé", "a": "Terminez manuellement la tâche et renvoyez le robot à la base pour assurer une charge correcte, attendez 10 minutes, puis relancez le travail (cartographie rapide ou nettoyage) en laissant le robot partir de lui-même de la base (ne le déplacez pas manuellement et gardez le sol dégagé devant la base). Si cela échoue, réessayez. Il est recommandé de toujours faire démarrer le robot depuis la base : il se repositionne en sortant, ce qui évite les trajets anormaux.", "en": "Slow rapid mapping / chaotic collision / sudden retreat / flat ground alarm, tilting, trapped"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Comment éviter les rayures au sol ?", "a": "Utilisez le mode « aspiration puis lavage » pour retirer d'abord les saletés. En présence d'objets pointus, retirez-les au préalable pour qu'aucun élément coupant sous le robot ne raye le sol pendant le nettoyage.", "en": "How to avoid ground scratches?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Des débris ressemblant à des cheveux au déballage", "a": "La plupart des pièces sont en plastique injecté, emballées dans un sachet PE placé dans un carton. Poussières ou fibres du carton peuvent se déposer sur le sachet PE ou sur la machine. Toutes nos excuses pour la gêne.", "en": "When I opened the box, I found debris like hair"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Déformation par frottement / bruit de nettoyage", "a": "En cas de bruit anormal, retirez la brosse latérale, le capot de brosse, la brosse rouleau ou le plateau de serpillière, puis démarrez et observez. Si le bruit redevient normal : 1. installez d'abord la brosse latérale ; en cas de bruit, vérifiez qu'elle n'est pas déformée ; 2. si le bruit vient de la brosse rouleau, retirez-la, vérifiez et nettoyez l'embout latéral, et remontez le capot en clipsant bien les quatre côtés ; si vous utilisez une brosse coupe-cheveux, remplacez-la par une brosse caoutchouc et testez. Si rien n'y fait, contactez le SAV pour un nouveau capot de brosse rouleau.", "en": "Scratching deformation / Cleaning noise"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "En surveillance vidéo/appel vocal, l'application se ferme ou indique « voix occupée » : que faire ?", "a": "Cela survient généralement lors d'un appel vocal parce que la commande précédente ne s'est pas terminée. 1. Robot hors de la base (pas en charge), maintenez le bouton d'alimentation central 3 s pour éteindre puis rallumer. 2. Après une brève déconnexion, une fois le réseau rétabli, rouvrez l'application et réessayez l'appel vocal.", "en": "app flashes or prompts Voice occupied during video/voice call"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Est-il normal d'entendre un « bang » après le pompage de l'eau ?", "a": "Le pompage de l'eau usée comprime l'air du réservoir ; l'eau est aspirée par différence de pression, et le « bang » final correspond au relâchement de cette pression. C'est normal, sans inquiétude.", "en": "Is it normal to have a bang after the water is pumped?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "S20 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Explication : les électrodes de charge présentent des traces d'usure", "a": "Pour garantir le bon fonctionnement de la charge, chaque robot subit un test de mise sous tension en production, ce qui laisse de légères traces d'usage sur les électrodes. Nous vous prions de nous excuser pour la gêne.", "en": "charging pole piece showing signs of wear and use"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "S20 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Il n'y avait pas d'eau au dernier relavage : pourquoi pas d'alerte de manque d'eau ?", "a": "Pour garantir l'achèvement de la tâche en cours, lorsqu'il n'y a plus d'eau propre, le robot termine en effectuant un dernier relavage de la serpillière ; l'alerte de manque d'eau apparaît une fois la tâche terminée. S'il n'y a pas d'eau propre dès le premier lavage, l'alerte apparaît aussi. NB : ajoutez de l'eau et lancez un lavage manuel depuis l'application.", "en": "no water in the last backwash, why no water shortage prompt?"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "L'auto-nettoyage de la base délivre l'eau par intermittence ou en faible quantité", "a": "Vérifiez que le réservoir d'eau propre contient assez d'eau : un niveau insuffisant provoque une arrivée d'eau intermittente pendant l'auto-nettoyage.", "en": "self-cleaning intermittently out of the water / water output is small"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "La base pompe l'eau trop bruyamment", "a": "Lorsque l'eau usée est aspirée à fond, l'air entre dans le conduit et comprime l'eau, créant un gargouillis, comme lorsqu'on aspire la dernière gorgée d'une boisson à la paille. Si le sol est peu sale, réduisez la fréquence de relavage et placez la base dans une pièce peu fréquentée.", "en": "The base station pumps water too loudly"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "La serpillière est installée mais le robot indique qu'elle est détachée (la base signale qu'elle n'est pas en place)", "a": "Si la serpillière est correctement installée mais que le robot ou la base la signale absente, mettez le micrologiciel à jour vers la dernière version ; si cela ne suffit pas, redémarrez le robot.", "en": "mop pad installed but robot prompts it fell off"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Le bruit de séchage est fort", "a": "Le séchage produit environ 44 décibels, comparable au bruit feutré d'une climatisation, ce qui est déjà faible. S'il gêne votre repos, placez le robot hors de la chambre.", "en": "Drying sound is loud"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Le nettoyage des angles est insuffisant", "a": "Le robot atteint une distance de bord parmi les meilleures du marché et utilise l'extension de la serpillière pour nettoyer les bords ; trop près du mur, il y aurait risque de collision. La brosse latérale dépasse du corps et nettoie le long des bords, à droite, pour ramener la poussière — ce qui répond aux besoins normaux d'un foyer.", "en": "The corner cleaning effect is not good"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Le plateau de serpillière tourne en continu : que faire ?", "a": "Redémarrez le robot et observez. Si la rotation anormale persiste, contactez le SAV Dreame.", "en": "The mop pad tray keeps rotating"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Le robot a oublié de nettoyer une zone", "a": "En cas de zone oubliée : 1. Le robot n'entre pas dans les espaces trop étroits (moins de 40 cm) ; en deçà, cela dépend de l'environnement. 2. Pour les robots à capteur ultrason, un tapis détecté à l'entrée en mode lavage l'empêche d'entrer : retirez le tapis. 3. La superposition de zones sur la carte peut fausser le positionnement : refaites la cartographie ou restaurez la carte. 4. Une moquette épaisse ou des câbles à l'entrée sont évités : rangez le sol avant. 5. Seuil trop haut : au-delà de la capacité de franchissement, le robot ne passe pas.", "en": "The robot missed cleaning an area"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Le robot annonce que le plateau de lavage de la serpillière n'est pas installé", "a": "1. Vérifiez la présence de l'aimant du plateau de lavage : absent, le robot annonce le plateau non installé. 2. Si l'aimant est présent, coupez l'alimentation de la base 5 s, redémarrez-la et réessayez. 3. Si le problème persiste, renvoyez l'appareil.", "en": "The robot broadcast Mop pad washboard not installed"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Le robot ne franchit pas un obstacle de 22 mm / ne monte pas la pente", "a": "La hauteur de franchissement est de 22 mm, ce qui est élevé par rapport au marché. La réussite dépend de la longueur et de la pente de la rampe ; une pente forte déclenche facilement l'évitement par laser linéaire. Mesurez la hauteur du seuil : si elle est ≤ 22 mm, créez un passage virtuel dans l'application (Édition de la carte → Passage virtuel → Ajouter) pour aider au franchissement ; vous pouvez aussi glisser un tapis fin au niveau du seuil.", "en": "The robot can't climb over obstacles within 22mm"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Le robot se coince devant la base ou patine au retour à la charge", "a": "1. Vérifiez le dégagement autour de la base (5 cm de chaque côté, 1,5 m devant). 2. La base doit être à l'horizontale ; sinon, repositionnez-la et installez correctement la rampe d'extension. 3. Essuyez les traces d'eau à l'avant des roues motrices et de la base pour éviter le patinage. 4. Nettoyez toute saleté ou corps étranger sur les roues motrices, la roue multidirectionnelle et la rampe de la base.", "en": "The robot gets stuck in front of the base station or slips during return to charging"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Le robot tourne en rond au même endroit", "a": "1. Vérifiez qu'aucun corps étranger n'est enroulé autour des roues motrices. 2. Vérifiez que le LDS tourne normalement (touchez légèrement son capot pour vérifier le rebond). 3. Vérifiez l'absence de corps étranger ou de cheveux dans la partie rotative du LDS. 4. Vérifiez l'absence d'autocollant mal posé ou de gros objet sur le dessus du robot. 5. Tapotez le pare-chocs pour confirmer qu'il rebondit bien. 6. Essuyez le capteur laser linéaire et le capteur IA (ni traces ni poussière). 7. Redémarrez le robot ; si cela ne suffit pas, contactez le SAV.", "en": "The robot keeps turning in the same place"},
{"m": ["P10 Pro Ultra", "P10 Ultra", "X40 Ultra"], "c": "Dépannage", "q": "Le réservoir d'eau est sale au déballage", "a": "Pour garantir l'étanchéité, nous testons le réservoir avec de l'eau en production, ce qui peut laisser des traces. Nous vous prions de nous excuser pour la gêne.", "en": "The water tank is found dirty when unpacking"},
